{% comment %}任务状态单选组（登录用户）；progress.js 接管交互。输入：task_groups。{% endcomment %}
{% for group in task_groups %}
<fieldset data-task-id="{{ group.task_id }}" class="learning-task" {% if not group.applicable %}data-not-applicable="true"{% endif %}>
    <legend>{{ group.label }}</legend>
    {% if not group.applicable %}
    <p class="learning-task-na">本日类型不要求</p>
    {% else %}
    <div class="learning-task-options" role="radiogroup" aria-label="{{ group.label }}状态">
        {% for option in group.options %}
        <label class="learning-option learning-option-{{ option.value }}">
            <input type="radio" name="task-{{ group.task_id }}" value="{{ option.value }}"
                   data-task="{{ group.task_id }}" {% if option.checked %}checked{% endif %}>
            <span>{{ option.label }}</span>
        </label>
        {% endfor %}
    </div>
    {% endif %}
</fieldset>
{% endfor %}
