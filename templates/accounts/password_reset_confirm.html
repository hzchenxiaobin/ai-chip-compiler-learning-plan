{% extends "base.html" %}
{% block title %}设置新密码{% endblock %}
{% block content %}
<div class="vp-auth-wrap" id="main-content">
    <div class="vp-auth-card">
        <h1>设置新密码</h1>
        {% if form.errors %}
        <div class="vp-auth-error" role="alert">
            <ul>
            {% for field, errors in form.errors.items %}
            {% for error in errors %}<li>{{ error }}</li>{% endfor %}
            {% endfor %}
            </ul>
        </div>
        {% endif %}
        <form method="post" class="vp-auth-form">
            {% csrf_token %}
            <label for="id_new_password1">新密码（至少 8 位）</label>
            <input id="id_new_password1" type="password" name="new_password1" autocomplete="new-password" required>
            <label for="id_new_password2">确认新密码</label>
            <input id="id_new_password2" type="password" name="new_password2" autocomplete="new-password" required>
            <button type="submit" class="vp-auth-submit">重置密码</button>
        </form>
    </div>
</div>
{% endblock %}
