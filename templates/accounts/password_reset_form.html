{% extends "base.html" %}
{% block title %}找回密码 · AI 芯片编译器学习计划{% endblock %}
{% block page_type %}password_reset{% endblock %}
{% block content %}
<div class="vp-auth-wrap" id="main-content">
    <div class="vp-auth-card">
        <h1>找回密码</h1>
        <p class="vp-auth-hint">输入注册邮箱，我们将发送重置链接。链接有效期与一次性使用由系统保证。</p>
        <form method="post" class="vp-auth-form">
            {% csrf_token %}
            <label for="id_email">注册邮箱</label>
            <input id="id_email" type="email" name="email" autocomplete="email" required>
            <button type="submit" class="vp-auth-submit">发送重置邮件</button>
        </form>
        <p class="vp-auth-alt"><a href="/login/">返回登录</a></p>
    </div>
</div>
{% endblock %}
