<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390"><rect x="4" y="4" width="1072" height="382" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">最差用例解剖：64×160×32 为什么只有 1.7×？</text><path d="M 59.5,59.9 Q 539.3,58.3 1019.5,59.2 Q 1020.8,170.6 1021.1,280.6 Q 540.4,278.5 61.0,280.8 Q 58.7,170.4 59.5,59.9  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.2"/><text x="540.0" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">三个因素的叠加</text><path d="M 90.8,108.7 Q 539.0,111.9 989.6,111.4 Q 987.9,136.3 989.9,159.7 Q 538.7,161.5 90.6,159.9 Q 91.5,133.9 90.8,108.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.3"/><text x="180" y="130" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">K=32 太小</text><text x="180" y="148" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">k 循环只有 32 圈——展开省的循环控制少</text><path d="M 90.3,166.5 Q 540.5,167.0 989.1,165.8 Q 989.7,193.3 989.0,217.2 Q 541.3,216.2 89.7,215.9 Q 92.2,189.7 90.3,166.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.3"/><text x="180" y="186" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">N=160 的 j 循环长</text><text x="180" y="204" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">外层 j 循环 160 次每次进 k——O2 对外层</text><path d="M 89.6,223.5 Q 541.7,221.0 990.0,222.6 Q 989.6,245.7 989.5,271.6 Q 541.7,273.6 91.6,273.4 Q 89.7,249.8 89.6,223.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.3"/><text x="180" y="242" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">M=64 中等</text><text x="180" y="260" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">整体计算量 0.65 MFLOP 小——固定开销占比高</text><path d="M 61.2,299.0 Q 539.6,298.7 1018.4,298.8 Q 1018.9,336.0 1021.5,370.5 Q 540.4,372.4 58.6,370.6 Q 59.8,334.3 61.2,299.0  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.85"/><text x="540.0" y="326" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">教训：优化的收益不是常数——它依赖 shape 的结构（K 的大小决定展开空间）</text><text x="540.0" y="350" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">「平均 9.4×」掩盖了 1.7×~14.1× 的 8 倍离散——适用范围的申报（D153）因此必要</text></svg>
