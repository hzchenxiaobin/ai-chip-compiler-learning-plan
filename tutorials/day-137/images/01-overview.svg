<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="590" viewBox="0 0 1080 590"><rect x="4" y="4" width="1072" height="582" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">最小失败用例：19 节点 → 4 节点（79% 缩减）</text><path d="M 58.6,59.7 Q 272.1,60.9 481.6,59.1 Q 480.7,198.5 479.5,341.0 Q 270.1,340.6 61.3,340.0 Q 57.8,197.8 58.6,59.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.25"/><text x="270" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">复杂失败用例（起点）</text><text x="90" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">19 个节点 / 29 行</text><text x="90" y="134" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">shape 最大 64×128</text><text x="90" y="156" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="start">5 个 matmul / 3 个 transpose</text><text x="90" y="178" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">sigmoid/reshape/scale 混杂</text><text x="90" y="222" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#C97B7B" text-anchor="start">失败藏在第 8 行的深层链：</text><text x="90" y="244" font-family="'Courier New',monospace" font-size="10.5" fill="#C97B7B" text-anchor="start">matmul %t4, %w2 内维 64≠128</text><text x="90" y="266" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">→ 读者要追 6 层依赖才看到</text><path d="M 487.3,199.0 Q 541.9,198.6 594.0,200.0 M 580.5,202.1 L 594.0,200.0 L 580.5,197.9" stroke="#3B3B3B" stroke-width="2.6" stroke-linecap="round" fill="none"/><text x="540.0" y="192.0" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">Reduce</text><path d="M 600.9,61.2 Q 810.6,61.1 1021.5,61.0 Q 1019.1,200.1 1019.4,338.4 Q 811.5,338.7 599.7,338.6 Q 600.5,200.8 600.9,61.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.3"/><text x="810" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">最小失败用例（终点）</text><text x="630" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">4 个节点 / 7 行</text><text x="630" y="134" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">shape 2×3（肉眼可验算）</text><text x="630" y="156" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="start">1 个 matmul / 1 个 transpose</text><text x="630" y="200" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#4a7c59" text-anchor="start">失败一眼可见：</text><text x="630" y="222" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="start">transpose 输出 3×2 @ const 4×2</text><text x="630" y="244" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#4a7c59" text-anchor="start">→ 内维 3≠4，闸0 直接拒收</text><text x="630" y="288" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">同一问题、79% 缩减、可读性 10×</text><text x="540.0" y="372" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">Reduce 三板斧（每步保持失败）</text><path d="M 78.5,392.9 Q 222.5,394.3 368.7,392.1 Q 371.8,439.6 371.0,490.4 Q 226.9,493.2 80.7,493.1 Q 78.4,444.2 78.5,392.9  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.35"/><text x="225" y="416" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">R1 删节点</text><text x="225" y="438" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">与失败无关的下游剥掉</text><text x="225" y="456" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">（sigmoid 链/reshape/尾巴）</text><path d="M 399.3,392.5 Q 544.1,393.5 689.9,390.9 Q 690.5,443.7 691.0,492.7 Q 544.3,491.2 400.7,493.2 Q 400.7,441.3 399.3,392.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.35"/><text x="545" y="416" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">R2 缩 shape</text><text x="545" y="438" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">64×128→2×3</text><text x="545" y="456" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">（shape 与失败无关）</text><path d="M 720.9,392.5 Q 866.4,391.5 1010.3,393.2 Q 1010.1,444.5 1009.4,493.1 Q 865.0,493.3 721.5,491.1 Q 720.7,440.8 720.9,392.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.35"/><text x="865" y="416" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">R3 简化类型</text><text x="865" y="438" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">f32 保留（问题在 shape）</text><text x="865" y="456" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">多余结构剥到触发路径</text><path d="M 61.6,511.6 Q 539.3,511.3 1020.6,512.7 Q 1021.6,544.0 1018.5,572.9 Q 537.6,574.1 60.9,573.3 Q 60.4,540.3 61.6,511.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.8"/><text x="540.0" y="536" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">Reduce 的铁律：每一步缩减后必须确认「仍触发同一失败」——</text><text x="540.0" y="558" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">缩减到失败消失就回退一步（删多了）；最终的最小用例是「删无可删」的核</text></svg>
