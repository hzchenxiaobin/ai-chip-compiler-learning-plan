<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 790" width="1240" height="790"><rect x="3" y="3" width="1234" height="784" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="30" y="44" text-anchor="start" font-size="25" fill="#3b3b3b">实测结果：BT1~BT7 全 PASS——循环四要素钉死，Day 89 可以放心填肉</text><text x="30" y="70" text-anchor="start" font-size="14.5" fill="#6b6459">环境：Linux aarch64 · Python 3.11.4 · numpy 1.26.4 · 无 MLIR（仿真＋解释执行）——全部真实运行，无估算</text><path d="M 30.1,82.1 Q 621.0,81.7 1210.5,80.9" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><text x="40" y="112" text-anchor="start" font-size="14.5" fill="#6b6459">今天的 IR（loop-ir.txt，A(4,6)@B(6,3)→C(4,3)）：13 op，头部带规格表</text><path d="M 40.6,125.1 Q 319.4,125.5 600.4,126.3 M 600.6,126.5 Q 600.6,276.9 601.2,426.7 M 600.5,427.1 Q 319.5,426.1 40.4,425.6 M 38.7,425.6 Q 41.0,276.8 41.1,125.1 Z" fill="white" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="150.0" text-anchor="start" font-size="11.6" fill="#3b3b3b">// 循环规格表（LoopSpec）：</text><text x="54" y="168.5" text-anchor="start" font-size="11.6" fill="#3b3b3b">//   iv   lb  ub  step  trip   ub 来源</text><text x="54" y="187.0" text-anchor="start" font-size="11.6" fill="#3b3b3b">//   %i    0   4    1    4     M = A.shape[0]</text><text x="54" y="205.5" text-anchor="start" font-size="11.6" fill="#3b3b3b">//   %j    0   3    1    3     N = B.shape[1]</text><text x="54" y="224.0" text-anchor="start" font-size="11.6" fill="#3b3b3b">//   %k    0   6    1    6     K = 内维契约</text><text x="54" y="242.5" text-anchor="start" font-size="11.6" fill="#3b3b3b">func @main(%a: memref&lt;4x6…&gt;, %b: memref&lt;6x3…&gt;)</text><text x="54" y="261.0" text-anchor="start" font-size="11.6" fill="#3b3b3b">  %c    = memref.alloc() : 4x3        ← D86</text><text x="54" y="279.5" text-anchor="start" font-size="11.6" fill="#3b3b3b">  %zero = arith.constant 0.0 : f32    ← D87</text><text x="54" y="298.0" text-anchor="start" font-size="11.6" fill="#3b3b3b">  %c0/%c1/%c4/%c3/%c6 = arith.constant ← 四要素素材</text><text x="54" y="316.5" text-anchor="start" font-size="11.6" fill="#3b3b3b">  scf.for %i = %c0 to %c4 step %c1 {  ← lb 含·ub 不含</text><text x="54" y="335.0" text-anchor="start" font-size="11.6" fill="#3b3b3b">    scf.for %j = %c0 to %c3 step %c1 {</text><text x="54" y="353.5" text-anchor="start" font-size="11.6" fill="#3b3b3b">      %acc = scf.for %k = %c0 to %c6 step %c1</text><text x="54" y="372.0" text-anchor="start" font-size="11.6" fill="#3b3b3b">              iter_args(%acc = %zero) -&gt; (f32) {</text><text x="54" y="390.5" text-anchor="start" font-size="11.6" fill="#3b3b3b">        scf.yield %zero : f32          ← 占位回传</text><text x="54" y="409.0" text-anchor="start" font-size="11.6" fill="#3b3b3b">  …                                     ← 每条循环带四要素注释</text><path d="M 53.3,436.4 Q 183.0,436.4 314.6,436.3 M 313.9,436.4 Q 312.9,467.6 313.5,497.6 M 314.7,497.0 Q 184.6,497.5 53.2,498.4 M 55.1,496.8 Q 53.4,467.2 54.4,436.2 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="456" text-anchor="start" font-size="12.5" fill="#79b26a">今天钉死：四要素＋规格表</text><text x="66" y="474" text-anchor="start" font-size="10.3" fill="#3b3b3b">13 op 不变（骨架 10＋D87 初始化 2 = 11 目标 op）</text><text x="66" y="488" text-anchor="start" font-size="10.3" fill="#3b3b3b">LoopSpec 单一事实来源＋BT1~BT7 验收</text><path d="M 326.4,435.9 Q 454.7,435.1 586.3,435.6 M 586.5,436.1 Q 585.7,467.6 585.5,498.0 M 587.2,498.6 Q 456.4,497.8 325.4,497.7 M 327.1,499.1 Q 326.2,466.2 325.3,436.9 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="338" y="456" text-anchor="start" font-size="12.5" fill="#e8973f">Day 89 待填：访存＋累加（5 op）</text><text x="338" y="474" text-anchor="start" font-size="10.3" fill="#3b3b3b">load×2 ＋ mulf ＋ addf ＋ store</text><text x="338" y="488" text-anchor="start" font-size="10.3" fill="#3b3b3b">11 ＋ 5 = 16 目标 op 收官</text><text x="54" y="528.0" text-anchor="start" font-size="11.8" fill="#6b6459">BT2 实测：%acc 终值 0.0；C 零访问——中间态安全，填空接口已就位。</text><text x="640" y="112" text-anchor="start" font-size="14.5" fill="#6b6459">检查测试 BT1~BT7（真实执行，全部 PASS）</text><path d="M 641.1,131.6 Q 920.2,132.6 1199.5,132.5 M 1199.2,131.1 Q 1199.5,154.0 1199.4,176.3 M 1201.1,176.8 Q 919.0,174.7 639.7,176.7 M 639.1,176.4 Q 640.0,153.3 638.7,133.2 Z" fill="white" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="150" text-anchor="start" font-size="12.5" fill="#79b26a">PASS</text><text x="706" y="150" text-anchor="start" font-size="13" fill="#3b3b3b">BT1 四要素与配对</text><text x="706" y="167" text-anchor="start" font-size="10.8" fill="#6b6459">13 op；(lb,ub,step)=(0,M/N/K,1)；LoopSpec 出生证明；回滚回归</text><path d="M 640.8,184.7 Q 919.9,184.2 1200.4,183.6 M 1201.0,184.4 Q 1200.1,206.5 1199.2,227.3 M 1199.8,228.3 Q 919.1,228.2 640.4,229.3 M 640.4,226.7 Q 639.2,205.0 640.6,184.5 Z" fill="white" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="202" text-anchor="start" font-size="12.5" fill="#79b26a">PASS</text><text x="706" y="202" text-anchor="start" font-size="13" fill="#3b3b3b">BT2 半开区间与 IV 轨迹</text><text x="706" y="219" text-anchor="start" font-size="10.8" fill="#6b6459">trip 4/3/6；总迭代 72；max(iv)=ub−step；%acc 终值 0.0</text><path d="M 639.8,236.0 Q 920.9,236.1 1200.2,236.0 M 1201.1,235.6 Q 1200.8,257.4 1200.0,280.7 M 1200.0,279.5 Q 919.3,280.2 641.2,280.0 M 639.5,280.3 Q 639.7,257.8 640.6,236.1 Z" fill="white" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="254" text-anchor="start" font-size="12.5" fill="#79b26a">PASS</text><text x="706" y="254" text-anchor="start" font-size="13" fill="#3b3b3b">BT3 iv 身份与作用域</text><text x="706" y="271" text-anchor="start" font-size="10.8" fill="#6b6459">index 类型；不是常量；体外无引用；终止器显隐规则</text><path d="M 640.1,288.3 Q 919.8,289.1 1200.8,288.5 M 1200.6,288.6 Q 1200.8,310.0 1199.3,332.5 M 1201.1,332.4 Q 920.0,331.9 640.6,331.2 M 640.1,333.0 Q 640.5,310.0 640.6,288.4 Z" fill="white" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="306" text-anchor="start" font-size="12.5" fill="#79b26a">PASS</text><text x="706" y="306" text-anchor="start" font-size="13" fill="#3b3b3b">BT4 嵌套结构</text><text x="706" y="323" text-anchor="start" font-size="10.8" fill="#6b6459">深度 3、i→j→k；归约最内（%acc 挂 k）；iv 互不重用</text><path d="M 639.0,339.9 Q 921.2,340.7 1200.7,340.7 M 1198.8,339.0 Q 1201.0,361.3 1199.4,384.5 M 1200.4,385.0 Q 920.6,383.3 640.9,383.8 M 640.5,385.2 Q 640.7,363.1 641.3,340.8 Z" fill="white" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="358" text-anchor="start" font-size="12.5" fill="#79b26a">PASS</text><text x="706" y="358" text-anchor="start" font-size="13" fill="#3b3b3b">BT5 边界 shape 全家福</text><text x="706" y="375" text-anchor="start" font-size="10.8" fill="#6b6459">7 组 shape 全 PASS；K=0 零趟：%acc=0.0=空和（numpy 佐证）</text><path d="M 640.2,391.9 Q 919.2,390.8 1199.6,392.4 M 1199.6,390.8 Q 1200.0,413.8 1199.9,436.4 M 1201.2,435.5 Q 921.2,435.9 641.0,435.8 M 639.2,435.4 Q 639.6,413.2 639.4,392.6 Z" fill="white" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="410" text-anchor="start" font-size="12.5" fill="#79b26a">PASS</text><text x="706" y="410" text-anchor="start" font-size="13" fill="#3b3b3b">BT6 静态前提</text><text x="706" y="427" text-anchor="start" font-size="10.8" fill="#6b6459">A(?x6)：四要素无法物化 → 宁拒不猜；partial 显式残留</text><path d="M 639.0,442.7 Q 921.2,443.3 1199.7,445.0 M 1198.8,442.7 Q 1199.4,467.1 1199.3,488.2 M 1200.3,486.7 Q 919.8,488.4 641.0,488.2 M 639.4,487.3 Q 640.3,466.1 639.4,444.9 Z" fill="white" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="462" text-anchor="start" font-size="12.5" fill="#79b26a">PASS</text><text x="706" y="462" text-anchor="start" font-size="13" fill="#3b3b3b">BT7 反面控制组</text><text x="706" y="479" text-anchor="start" font-size="10.8" fill="#6b6459">P1/P3 按维越界被拦；P2 静默错被数值探针拦——3/3 全红</text><path d="M 640.0,502.6 Q 921.0,502.8 1201.0,503.0 M 1200.6,501.8 Q 1200.4,548.8 1199.0,595.3 M 1200.2,594.4 Q 921.1,595.2 640.2,592.7 M 641.0,593.0 Q 640.3,548.5 639.9,503.3 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="526" text-anchor="start" font-size="13" fill="#79b26a">关键数字（全部实测）</text><text x="654" y="548" text-anchor="start" font-size="11.3" fill="#3b3b3b">trip = 4/3/6 · 总迭代 72 = 4×3×6 · IV 值域不含 ub（max = ub−step）</text><text x="654" y="567" text-anchor="start" font-size="11.3" fill="#3b3b3b">K=0 零趟：12 次 store 写 0.0、0 次 load · 探针拦截 3/3 · P2 静默误差 1.939e+00</text><path d="M 39.9,636.3 Q 619.0,636.0 1201.2,636.9 M 1200.9,635.1 Q 1199.6,686.6 1198.7,736.2 M 1199.3,735.9 Q 620.0,734.7 40.0,736.2 M 39.4,735.3 Q 38.8,687.1 40.0,635.2 Z" fill="white" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="664" text-anchor="start" font-size="14.5" fill="#79b26a">验收口径（诚实声明）</text><text x="58" y="688" text-anchor="start" font-size="12" fill="#3b3b3b">今天的验收 = 结构（BT1/BT4）＋执行轨迹（BT2/BT3）＋边界 shape（BT5，循环体仍为空）＋静态前提（BT6）＋反面控制（BT7）。</text><text x="58" y="707" text-anchor="start" font-size="12" fill="#3b3b3b">scf.for 语义依据官方文档（2026-11 核对）；仿真差异：env 平铺不做运行期支配检查（BT3 用结构断言）；按维越界检测是今天新增的仿真探针。</text><text x="58" y="726" text-anchor="start" font-size="12" fill="#3b3b3b">端到端数值对照（≥8 组 shape）是 Day 90 的验收；垃圾值是确定性公式，真实语义为未定义行为。</text></g></svg>