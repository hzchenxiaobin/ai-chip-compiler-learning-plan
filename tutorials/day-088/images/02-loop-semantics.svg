<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 830" width="1240" height="830"><rect x="3" y="3" width="1234" height="824" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="30" y="44" text-anchor="start" font-size="25" fill="#3b3b3b">scf.for 的四要素：半开区间、步长为正、归纳变量是区域参数</text><text x="30" y="70" text-anchor="start" font-size="14.5" fill="#6b6459">语义依据官方文档（mlir.llvm.org，SCF dialect，2026-11 核对）——图中数字全部来自 BT1/BT2 实测</text><path d="M 30.8,81.4 Q 621.0,82.4 1210.7,82.4" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M 39.4,104.5 Q 324.7,103.8 609.8,104.4 M 611.0,104.5 Q 610.0,217.4 610.2,329.3 M 608.7,331.1 Q 324.3,329.5 40.9,330.9 M 39.1,331.1 Q 39.7,216.1 39.0,104.1 Z" fill="white" stroke="#5f8fcb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="130" text-anchor="start" font-size="14.5" fill="#3b3b3b">语法解剖：一行 scf.for 的四个位置</text><text x="66" y="166" text-anchor="start" font-size="17" fill="#3b3b3b">scf.for %i = %c0 to %c4 step %c1 {</text><path d="M 119.9,182.1 Q 119.7,198.5 119.6,214.8" fill="none" stroke="#e8973f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 120.3,213.6 Q 117.2,208.1 113.6,201.7" fill="none" stroke="#e8973f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 120.2,214.6 Q 122.4,207.8 126.1,202.1" fill="none" stroke="#e8973f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="86" y="234" text-anchor="start" font-size="10.5" fill="#e8973f">归纳变量</text><text x="86" y="248" text-anchor="start" font-size="10.5" fill="#e8973f">（区域参数）</text><path d="M 216.0,181.7 Q 215.1,199.2 214.8,214.6" fill="none" stroke="#79b26a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 214.9,214.6 Q 212.5,208.0 208.7,202.6" fill="none" stroke="#79b26a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 215.1,214.4 Q 218.6,208.6 221.4,202.8" fill="none" stroke="#79b26a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="181" y="234" text-anchor="start" font-size="10.5" fill="#79b26a">下界</text><text x="181" y="248" text-anchor="start" font-size="10.5" fill="#79b26a">（含端点）</text><path d="M 329.6,183.1 Q 329.8,198.6 330.6,213.1" fill="none" stroke="#d96c5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 329.4,213.6 Q 326.8,208.2 324.5,201.8" fill="none" stroke="#d96c5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 330.3,213.9 Q 333.3,208.0 335.9,202.5" fill="none" stroke="#d96c5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="296" y="234" text-anchor="start" font-size="10.5" fill="#d96c5c">上界</text><text x="296" y="248" text-anchor="start" font-size="10.5" fill="#d96c5c">（不含！）</text><path d="M 451.0,181.1 Q 451.2,197.8 452.8,214.5" fill="none" stroke="#5f8fcb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 451.5,214.3 Q 449.6,208.0 446.5,202.8" fill="none" stroke="#5f8fcb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 452.5,213.6 Q 455.2,208.4 458.0,202.2" fill="none" stroke="#5f8fcb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="418" y="234" text-anchor="start" font-size="10.5" fill="#5f8fcb">步长</text><text x="418" y="248" text-anchor="start" font-size="10.5" fill="#5f8fcb">（必须 &gt; 0）</text><text x="56" y="288" text-anchor="start" font-size="11.3" fill="#6b6459">体：单个 block，以 scf.yield 结尾（无结果时可隐式插入终止器）</text><text x="56" y="305" text-anchor="start" font-size="11.3" fill="#6b6459">——今天 k 循环带 iter_args → 显式 yield %zero；i/j 循环无结果 → 隐式</text><path d="M 628.8,104.7 Q 914.9,102.7 1199.3,104.5 M 1199.7,104.7 Q 1200.5,217.6 1200.3,330.4 M 1198.9,331.0 Q 914.8,329.0 631.3,329.7 M 630.7,331.1 Q 630.5,217.4 630.7,103.9 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="646" y="130" text-anchor="start" font-size="14.5" fill="#5f8fcb">官方语义（scf.for，逐条核对）</text><text x="646" y="156" text-anchor="start" font-size="12.3" fill="#3b3b3b">· 半开区间 [lb, ub)：含下界、不含上界</text><text x="646" y="181" text-anchor="start" font-size="12.3" fill="#3b3b3b">· trip = max(0, ceil((ub − lb) / step))</text><text x="646" y="206" text-anchor="start" font-size="12.3" fill="#3b3b3b">· iv 取 lb + j·step，j = 0 … trip−1（升序）</text><text x="646" y="231" text-anchor="start" font-size="12.3" fill="#3b3b3b">· step 必须严格为正（st ≤ 0 直接拒绝）</text><text x="646" y="256" text-anchor="start" font-size="12.3" fill="#3b3b3b">· iv 是区域第一个参数；iter_args 跟随其后</text><text x="646" y="281" text-anchor="start" font-size="12.3" fill="#3b3b3b">· lb/ub/step：index 或整数类型的 SSA 值</text><text x="646" y="312" text-anchor="start" font-size="11.5" fill="#5f8fcb">→ BT2 实测：trip 4/3/6，iv 最大值 = ub−step</text><path d="M 39.9,350.9 Q 619.1,351.0 1200.4,350.2 M 1201.3,349.6 Q 1199.6,434.2 1201.2,517.7 M 1199.0,519.3 Q 619.5,517.8 39.5,516.9 M 39.5,517.4 Q 39.0,432.9 40.3,349.3 Z" fill="white" stroke="#e8973f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="378" text-anchor="start" font-size="14.5" fill="#e8973f">半开区间数轴：i 的取值（M = 4，trip = 4）</text><path d="M 120.5,435.9 Q 586.2,436.9 1049.5,436.3" fill="none" stroke="#3b3b3b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178.8,428.8 Q 179.6,436.0 179.7,443.9" fill="none" stroke="#3b3b3b" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 169,435.52118122330535 C 169,425 191,425 191,436 C 191,447 169,447 169,435.52118122330535" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="470" text-anchor="middle" font-size="14" fill="#3b3b3b">0</text><path d="M 350.9,428.4 Q 349.0,435.1 351.0,444.7" fill="none" stroke="#3b3b3b" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 339,436.4415988229687 C 339,425 361,425 361,436 C 361,447 339,447 339,436.4415988229687" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="350" y="470" text-anchor="middle" font-size="14" fill="#3b3b3b">1</text><path d="M 519.3,427.3 Q 519.5,437.2 521.2,443.7" fill="none" stroke="#3b3b3b" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 509,436.3338274440766 C 509,425 531,425 531,436 C 531,447 509,447 509,436.3338274440766" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="520" y="470" text-anchor="middle" font-size="14" fill="#3b3b3b">2</text><path d="M 689.0,427.8 Q 689.0,436.1 689.4,443.5" fill="none" stroke="#3b3b3b" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 679,435.8882016339893 C 679,425 701,425 701,436 C 701,447 679,447 679,435.8882016339893" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="690" y="470" text-anchor="middle" font-size="14" fill="#3b3b3b">3</text><path d="M 859.1,428.8 Q 859.2,435.8 859.4,444.0" fill="none" stroke="#3b3b3b" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 849,435.2132968797979 C 849,425 871,425 871,436 C 871,447 849,447 849,435.2132968797979" fill="white" stroke="#d96c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="860" y="470" text-anchor="middle" font-size="13" fill="#d96c5c">4 = ub</text><text x="180" y="410" text-anchor="middle" font-size="12.5" fill="#79b26a">取值 {0,1,2,3}</text><text x="860" y="410" text-anchor="middle" font-size="12.5" fill="#d96c5c">不含！（空心）</text><text x="58" y="498" text-anchor="start" font-size="11.8" fill="#3b3b3b">长度 4 的轴 ⇔ 合法下标恰是 [0,4)：半开区间与 0-based 下标天作之合（下界取 0 的理由）。</text><text x="58" y="515" text-anchor="start" font-size="11.8" fill="#3b3b3b">off-by-one 一格之差：把 to %c4 写成 to %c5 → trip=5，i=4 时 A[4,k] 越界（探针 P1 实测拦截）。</text><path d="M 40.6,540.2 Q 325.3,540.8 610.1,540.9 M 610.8,541.2 Q 609.2,664.6 609.9,790.5 M 610.5,790.0 Q 325.9,791.3 39.3,788.7 M 39.5,791.1 Q 39.0,665.1 40.3,540.1 Z" fill="white" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="566" text-anchor="start" font-size="14.5" fill="#79b26a">三条循环的配对表（LoopSpec 规格）</text><text x="70" y="592" text-anchor="start" font-size="11.8" fill="#6b6459">iv</text><text x="128" y="592" text-anchor="start" font-size="11.8" fill="#6b6459">lb</text><text x="188" y="592" text-anchor="start" font-size="11.8" fill="#6b6459">ub</text><text x="268" y="592" text-anchor="start" font-size="11.8" fill="#6b6459">step</text><text x="360" y="592" text-anchor="start" font-size="11.8" fill="#6b6459">trip</text><text x="452" y="592" text-anchor="start" font-size="11.8" fill="#6b6459">ub 来源</text><path d="M 56.5,601.3 Q 327.1,599.6 597.1,599.3" fill="none" stroke="#6b6459" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="70" y="622" text-anchor="start" font-size="12.5" fill="#79b26a">%i</text><text x="128" y="622" text-anchor="start" font-size="12.5" fill="#3b3b3b">0</text><text x="188" y="622" text-anchor="start" font-size="12.5" fill="#3b3b3b">M=4</text><text x="268" y="622" text-anchor="start" font-size="12.5" fill="#3b3b3b">1</text><text x="360" y="622" text-anchor="start" font-size="12.5" fill="#3b3b3b">4</text><text x="452" y="622" text-anchor="start" font-size="10.8" fill="#3b3b3b">A.shape[0]（行数）</text><text x="70" y="656" text-anchor="start" font-size="12.5" fill="#5f8fcb">%j</text><text x="128" y="656" text-anchor="start" font-size="12.5" fill="#3b3b3b">0</text><text x="188" y="656" text-anchor="start" font-size="12.5" fill="#3b3b3b">N=3</text><text x="268" y="656" text-anchor="start" font-size="12.5" fill="#3b3b3b">1</text><text x="360" y="656" text-anchor="start" font-size="12.5" fill="#3b3b3b">3</text><text x="452" y="656" text-anchor="start" font-size="10.8" fill="#3b3b3b">B.shape[1]（列数）</text><text x="70" y="690" text-anchor="start" font-size="12.5" fill="#e8973f">%k</text><text x="128" y="690" text-anchor="start" font-size="12.5" fill="#3b3b3b">0</text><text x="188" y="690" text-anchor="start" font-size="12.5" fill="#3b3b3b">K=6</text><text x="268" y="690" text-anchor="start" font-size="12.5" fill="#3b3b3b">1</text><text x="360" y="690" text-anchor="start" font-size="12.5" fill="#3b3b3b">6</text><text x="452" y="690" text-anchor="start" font-size="10.8" fill="#3b3b3b">内维契约 A.shape[1]==B.shape[0]</text><text x="56" y="736" text-anchor="start" font-size="11.3" fill="#6b6459">配错行的后果 → 图 3 探针 P3：迭代总数不变（3×4×6=72），</text><text x="56" y="752" text-anchor="start" font-size="11.3" fill="#6b6459">地址空间全错——方阵测试抓不住，非方形才爆。</text><path d="M 629.3,541.2 Q 913.9,539.8 1201.2,541.2 M 1199.0,539.7 Q 1199.2,664.9 1200.4,789.8 M 1201.1,790.2 Q 914.2,789.8 630.5,790.8 M 630.4,789.5 Q 630.7,665.8 630.4,541.1 Z" fill="white" stroke="#e8973f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="646" y="566" text-anchor="start" font-size="14.5" fill="#e8973f">iv 的身份：区域参数，不是常量</text><path d="M 646.4,580.9 Q 776.2,583.0 906.7,581.5 M 909.2,582.3 Q 907.9,619.0 907.2,658.3 M 909.0,656.8 Q 776.1,657.2 645.8,657.6 M 645.2,658.8 Q 646.8,619.5 645.0,582.4 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="658" y="604" text-anchor="start" font-size="10.8" fill="#3b3b3b">%c4 = arith.constant 4 : index</text><text x="658" y="619" text-anchor="start" font-size="10.8" fill="#3b3b3b">SSA 常量：全程一个值，</text><text x="658" y="634" text-anchor="start" font-size="10.8" fill="#3b3b3b">哪里都能用（只要支配）</text><path d="M 920.9,581.7 Q 1053.6,580.9 1185.1,581.1 M 1184.9,581.8 Q 1184.0,621.2 1184.9,658.8 M 1184.8,657.1 Q 1053.9,658.6 921.5,656.9 M 920.9,658.2 Q 921.2,620.6 922.4,581.4 Z" fill="#fdead3" stroke="#e8973f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="934" y="604" text-anchor="start" font-size="10.8" fill="#3b3b3b">%i：循环的区域参数</text><text x="934" y="619" text-anchor="start" font-size="10.8" fill="#3b3b3b">i=0 → 1 → 2 → 3</text><text x="934" y="634" text-anchor="start" font-size="10.8" fill="#3b3b3b">每次迭代重新绑定</text><text x="646" y="692" text-anchor="start" font-size="11.3" fill="#3b3b3b">· 体外不可见：出了循环 region，%i 就不存在（支配性；</text><text x="646" y="711" text-anchor="start" font-size="11.3" fill="#3b3b3b">   真实 MLIR 由 verifier 强制，BT3 用结构断言）</text><text x="646" y="730" text-anchor="start" font-size="11.3" fill="#3b3b3b">· index 类型：Day 89 地址公式 6·i＋k、3·k＋j 乘的就是它</text><text x="646" y="749" text-anchor="start" font-size="11.3" fill="#3b3b3b">· 与 Day 87 的 %acc 同机制：iv 是第一个区域参数，</text><text x="646" y="768" text-anchor="start" font-size="11.3" fill="#3b3b3b">   iter_args(%acc=…) 跟在后面——同一个通道</text></g></svg>