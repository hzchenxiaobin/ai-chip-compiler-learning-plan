<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 830" width="1240" height="830"><rect x="3" y="3" width="1234" height="824" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="30" y="44" text-anchor="start" font-size="25" fill="#3b3b3b">边界测试：7 组 shape 的实测 ＋ 三个注入探针，全部按预期变红</text><text x="30" y="70" text-anchor="start" font-size="14.5" fill="#6b6459">数据来自 boundary-table.txt 与 BT7（真实运行）——探针是故意注入的 bug，用来验证测试咬得住人</text><path d="M 29.6,80.8 Q 621.2,82.8 1209.8,81.9" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M 40.6,105.1 Q 359.0,103.1 680.5,104.4 M 680.0,103.9 Q 679.6,355.3 680.8,603.1 M 680.1,605.2 Q 359.6,603.3 39.7,602.9 M 39.8,603.8 Q 41.1,353.5 40.0,104.1 Z" fill="white" stroke="#79b26a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="130" text-anchor="start" font-size="14.5" fill="#79b26a">7 组 shape 的 trip / IV 轨迹（BT5 实测）</text><text x="64" y="156" text-anchor="start" font-size="11.3" fill="#6b6459">shape</text><text x="214" y="156" text-anchor="start" font-size="11.3" fill="#6b6459">trips(i,j,k)</text><text x="360" y="156" text-anchor="middle" font-size="11.3" fill="#6b6459">总迭代</text><text x="452" y="156" text-anchor="start" font-size="11.3" fill="#6b6459">IV 值域（i / j / k）</text><path d="M 56.5,164.3 Q 359.4,163.0 665.2,163.9" fill="none" stroke="#6b6459" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="64" y="186" text-anchor="start" font-size="12" fill="#3b3b3b">A(1,1)@B(1,1)</text><text x="214" y="186" text-anchor="start" font-size="12" fill="#3b3b3b">(1, 1, 1)</text><text x="360" y="186" text-anchor="middle" font-size="12" fill="#3b3b3b">1</text><text x="452" y="186" text-anchor="start" font-size="11.5" fill="#3b3b3b">{0} / {0} / {0}</text><text x="64" y="216" text-anchor="start" font-size="12" fill="#3b3b3b">A(1,5)@B(5,3)</text><text x="214" y="216" text-anchor="start" font-size="12" fill="#3b3b3b">(1, 3, 5)</text><text x="360" y="216" text-anchor="middle" font-size="12" fill="#3b3b3b">15</text><text x="452" y="216" text-anchor="start" font-size="11.5" fill="#3b3b3b">{0} / {0,1,2} / {0..4}</text><text x="64" y="246" text-anchor="start" font-size="12" fill="#3b3b3b">A(5,1)@B(1,3)</text><text x="214" y="246" text-anchor="start" font-size="12" fill="#3b3b3b">(5, 3, 1)</text><text x="360" y="246" text-anchor="middle" font-size="12" fill="#3b3b3b">15</text><text x="452" y="246" text-anchor="start" font-size="11.5" fill="#3b3b3b">{0..4} / {0,1,2} / {0}</text><text x="64" y="276" text-anchor="start" font-size="12" fill="#3b3b3b">A(2,3)@B(3,2)</text><text x="214" y="276" text-anchor="start" font-size="12" fill="#3b3b3b">(2, 2, 3)</text><text x="360" y="276" text-anchor="middle" font-size="12" fill="#3b3b3b">12</text><text x="452" y="276" text-anchor="start" font-size="11.5" fill="#3b3b3b">{0,1} / {0,1} / {0,1,2}</text><text x="64" y="306" text-anchor="start" font-size="12" fill="#3b3b3b">A(3,2)@B(2,7)</text><text x="214" y="306" text-anchor="start" font-size="12" fill="#3b3b3b">(3, 7, 2)</text><text x="360" y="306" text-anchor="middle" font-size="12" fill="#3b3b3b">42</text><text x="452" y="306" text-anchor="start" font-size="11.5" fill="#3b3b3b">{0,1,2} / {0..6} / {0,1}</text><text x="64" y="336" text-anchor="start" font-size="12" fill="#3b3b3b">A(4,6)@B(6,3)</text><text x="214" y="336" text-anchor="start" font-size="12" fill="#3b3b3b">(4, 3, 6)</text><text x="360" y="336" text-anchor="middle" font-size="12" fill="#3b3b3b">72</text><text x="452" y="336" text-anchor="start" font-size="11.5" fill="#3b3b3b">{0..3} / {0,1,2} / {0..5}</text><text x="64" y="366" text-anchor="start" font-size="12" fill="#d96c5c">A(4,0)@B(0,3)</text><text x="214" y="366" text-anchor="start" font-size="12" fill="#d96c5c">(4, 3, 0)</text><text x="360" y="366" text-anchor="start" font-size="12" fill="#d96c5c">0  ← 零趟</text><text x="452" y="366" text-anchor="start" font-size="11.5" fill="#d96c5c">{0..3} / {0,1,2} / ∅</text><text x="64" y="392" text-anchor="start" font-size="11.3" fill="#79b26a">全部 PASS：trips = (M,N,K)；k 体总执行 = M×N×K；值域不含 ub</text><path d="M 55.6,404.8 Q 359.3,404.7 663.5,403.4 M 664.5,404.2 Q 663.5,457.1 663.9,511.5 M 662.9,510.9 Q 360.8,512.3 55.5,511.1 M 55.0,511.7 Q 55.3,456.9 54.7,404.8 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="428" text-anchor="start" font-size="13" fill="#d96c5c">零趟特写 K=0（A(4,0) @ B(0,3)）</text><text x="70" y="450" text-anchor="start" font-size="10.8" fill="#3b3b3b">k 循环 trip = max(0, ceil(0/1)) = 0 → 体一次不执行；%acc 终值 = 初值 0.0</text><text x="70" y="466" text-anchor="start" font-size="10.8" fill="#3b3b3b">预演完整 IR：store 12 次（每个 (i,j) 写 0.0）· load 0 次 · 未初始化读 0 次</text><text x="70" y="482" text-anchor="start" font-size="10.8" fill="#3b3b3b">数学佐证：空和 = 0（np.matmul((4,0),(0,3)) = 4×3 零矩阵，逐位相同）</text><text x="70" y="498" text-anchor="start" font-size="10.8" fill="#3b3b3b">—— Day 87 的「零次迭代 = 初值」今天拿到数学身份：%zero 正是归约的单位元</text><path d="M 699.1,104.5 Q 949.2,103.5 1200.5,105.1 M 1201.1,104.2 Q 1201.0,354.0 1199.8,603.4 M 1198.8,605.3 Q 949.7,603.3 700.7,603.8 M 700.1,605.0 Q 701.0,354.6 700.4,104.6 Z" fill="white" stroke="#d96c5c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="716" y="130" text-anchor="start" font-size="14.5" fill="#d96c5c">反面控制组：三个注入探针（BT7）</text><path d="M 716.0,147.5 Q 950.8,149.1 1184.7,147.9 M 1183.2,147.4 Q 1185.2,216.4 1183.2,285.6 M 1185.1,285.7 Q 950.5,286.2 716.7,285.4 M 716.7,287.0 Q 716.3,216.7 717.1,148.7 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="730" y="172" text-anchor="start" font-size="12.5" fill="#d96c5c">P1 off-by-one：i 上界 = M+1 = 5</text><text x="730" y="196" text-anchor="start" font-size="11" fill="#3b3b3b">结构探针红：trip = 5 ≠ M = 4</text><text x="730" y="215" text-anchor="start" font-size="11" fill="#3b3b3b">执行探针红：i=4 时 load %a[4,k]</text><text x="730" y="234" text-anchor="start" font-size="11" fill="#3b3b3b">真实报错：第 0 维下标 4 ∉ [0, 4)</text><text x="730" y="253" text-anchor="start" font-size="11" fill="#3b3b3b">（shape (4,6)）——线性地址 24 也越界</text><path d="M 716.0,300.1 Q 950.1,299.6 1184.2,299.9 M 1183.6,300.8 Q 1184.7,369.6 1183.0,437.9 M 1183.5,437.2 Q 950.5,437.5 717.0,438.4 M 715.0,438.8 Q 715.1,370.1 717.0,299.7 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="730" y="324" text-anchor="start" font-size="12.5" fill="#e8973f">P2 step=2：k 步长 = 2</text><text x="730" y="348" text-anchor="start" font-size="11" fill="#3b3b3b">k 取值 {0,2,4}，每趟 3 次（ceil(6/2)）</text><text x="730" y="367" text-anchor="start" font-size="11" fill="#3b3b3b">load A/B 共 72 次 = 正确 144 的一半</text><text x="730" y="386" text-anchor="start" font-size="11" fill="#3b3b3b">不越界、安静地错：max|C−ref| = 1.939e+00</text><text x="730" y="405" text-anchor="start" font-size="11" fill="#3b3b3b">—— step 不是「精度」参数，漏加全部奇数 k</text><path d="M 715.3,452.0 Q 948.9,452.2 1182.8,451.0 M 1183.6,450.7 Q 1185.0,521.4 1184.5,589.4 M 1184.4,589.3 Q 950.5,589.5 714.8,589.9 M 715.9,589.8 Q 715.1,519.9 715.1,453.2 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="730" y="476" text-anchor="start" font-size="12.5" fill="#d96c5c">P3 配对错误：i 界=N、j 界=M</text><text x="730" y="500" text-anchor="start" font-size="11" fill="#3b3b3b">迭代总数不变：3×4×6 = 72 = M×N×K</text><text x="730" y="519" text-anchor="start" font-size="11" fill="#3b3b3b">j 跑到 3（B 的列界外）被按维检查拦下</text><text x="730" y="538" text-anchor="start" font-size="11" fill="#3b3b3b">真实报错：第 1 维下标 3 ∉ [0, 3)</text><text x="730" y="557" text-anchor="start" font-size="11" fill="#3b3b3b">线性地址 3 仍在 18 格缓冲区内——只查线性抓不住！</text><text x="716" y="606" text-anchor="start" font-size="11.8" fill="#d96c5c">三个探针全红：边界测试咬得住人，才配当 Day 89 填空时的护栏</text><path d="M 39.6,625.1 Q 621.0,625.1 1199.6,625.1 M 1201.2,623.4 Q 1198.8,683.3 1200.9,744.7 M 1201.1,742.8 Q 621.2,744.7 39.9,743.8 M 39.8,744.3 Q 41.2,685.0 40.9,624.4 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="652" text-anchor="start" font-size="14" fill="#5f8fcb">IV 轨迹证据（BT2，主图 A(4,6)@B(6,3) 解释执行）</text><text x="58" y="678" text-anchor="start" font-size="12" fill="#3b3b3b">%i：进入 1 次 · 每趟 4 次迭代 · 取值 {0,1,2,3}        %j：进入 4 次（=M）· 每趟 3 次 · 取值 {0,1,2}</text><text x="58" y="699" text-anchor="start" font-size="12" fill="#3b3b3b">%k：进入 12 次（=M×N）· 每趟 6 次 · 取值 {0..5}        max(iv) = ub − step：3=4−1 · 2=3−1 · 5=6−1</text><text x="58" y="730" text-anchor="start" font-size="11.3" fill="#6b6459">每趟迭代数 = trip 公式；k 体总执行 72 = M×N×K——半开区间的执行级证据</text></g></svg>