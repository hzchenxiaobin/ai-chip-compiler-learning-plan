<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 454" width="960" height="454"><rect x="3" y="3" width="954" height="448" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="55" y="48" text-anchor="start" font-size="25" fill="#3b3b3b">INT8 MatMul 预览：整数版的「低精度输入 + 高精度累加」</text><text x="55" y="76" text-anchor="start" font-size="14" fill="#6b6459">对称量化（zp=0）让反量化只需乘 sa·sb；全部真实运行（2×3 @ 3×2，Day 79 的贯穿例子）</text><path d="M 54.5,99.3 Q 152.0,99.4 251.2,99.8 M 250.0,99.4 Q 249.8,175.0 250.3,249.6 M 250.8,250.4 Q 152.6,249.1 55.7,250.8 M 54.1,250.3 Q 55.0,174.5 54.7,99.8 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="152" y="124" text-anchor="middle" font-size="14.5" fill="#5f8fcb">① 对称量化</text><text x="152" y="146" text-anchor="middle" font-size="12.5" fill="#3b3b3b">sa = sb = 3.0/127</text><text x="152" y="164" text-anchor="middle" font-size="12.5" fill="#3b3b3b">= 0.023622</text><text x="152" y="188" text-anchor="middle" font-size="12" fill="#3b3b3b">Qa = [ 4  8 13]</text><text x="152" y="206" text-anchor="middle" font-size="12" fill="#3b3b3b">     [42 85 127]</text><text x="152" y="228" text-anchor="middle" font-size="12" fill="#3b3b3b">Qb = [17 42; 21 85;</text><text x="152" y="246" text-anchor="middle" font-size="12" fill="#3b3b3b">      25 127]</text><path d="M 255.6,174.6 Q 269.9,175.9 286.0,175.5" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 284.7,174.9 Q 278.6,178.5 273.5,180.7" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 284.7,175.1 Q 278.6,172.3 272.9,169.1" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 289.4,100.6 Q 390.1,98.9 488.6,98.7 M 489.2,100.1 Q 490.2,175.0 489.2,250.2 M 489.1,250.1 Q 388.8,251.2 289.6,250.6 M 290.2,251.2 Q 288.3,174.1 288.6,99.8 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="389" y="124" text-anchor="middle" font-size="14.5" fill="#79b26a">② INT32 累加</text><text x="389" y="148" text-anchor="middle" font-size="12.5" fill="#3b3b3b">Qa@Qb =</text><text x="389" y="172" text-anchor="middle" font-size="13" fill="#3b3b3b">[  561   2499]</text><text x="389" y="194" text-anchor="middle" font-size="13" fill="#3b3b3b">[5674  25118]</text><text x="389" y="224" text-anchor="middle" font-size="12" fill="#6b6459">int8 输入进 int32 桶</text><text x="389" y="242" text-anchor="middle" font-size="12" fill="#6b6459">（乘法、加法都精确）</text><path d="M 494.7,176.2 Q 509.7,173.8 523.4,174.8" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 524.4,174.7 Q 518.4,178.0 512.0,180.2" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 524.4,175.3 Q 517.5,171.8 512.7,169.5" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 528.2,101.2 Q 620.4,101.3 712.2,99.0 M 712.6,99.7 Q 714.1,174.9 712.6,250.6 M 712.5,248.8 Q 619.5,250.5 529.3,250.3 M 529.0,250.4 Q 527.8,175.1 529.0,100.5 Z" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="620" y="124" text-anchor="middle" font-size="14.5" fill="#3b3b3b">③ 反量化</text><text x="620" y="148" text-anchor="middle" font-size="12.5" fill="#3b3b3b">C = sa·sb·(Qa@Qb)</text><text x="620" y="172" text-anchor="middle" font-size="13" fill="#3b3b3b">≈ [0.313  1.394]</text><text x="620" y="194" text-anchor="middle" font-size="13" fill="#3b3b3b">  [3.166 14.016]</text><text x="620" y="224" text-anchor="middle" font-size="12" fill="#6b6459">只乘一个标量</text><text x="620" y="242" text-anchor="middle" font-size="12" fill="#6b6459">（zp = 0 的红利）</text><path d="M 719.0,173.8 Q 732.1,173.9 749.1,174.3" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 747.8,174.3 Q 741.5,178.4 736.9,181.3" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 747.3,175.2 Q 742.5,172.6 736.7,169.7" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 752.9,99.6 Q 841.3,100.5 931.2,99.4 M 929.1,98.9 Q 931.1,174.6 930.7,251.2 M 930.0,249.1 Q 841.9,250.2 752.8,251.2 M 752.2,250.8 Q 753.1,173.8 753.3,99.0 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="841" y="124" text-anchor="middle" font-size="14.5" fill="#e8973f">④ 对账</text><text x="841" y="148" text-anchor="middle" font-size="12" fill="#3b3b3b">golden(FP64) =</text><text x="841" y="170" text-anchor="middle" font-size="12.5" fill="#3b3b3b">[0.32  1.4]</text><text x="841" y="188" text-anchor="middle" font-size="12.5" fill="#3b3b3b">[3.2   14.0]</text><text x="841" y="214" text-anchor="middle" font-size="12.5" fill="#d96c5c">max_abs = 0.0339</text><text x="841" y="234" text-anchor="middle" font-size="13" fill="#d96c5c">rel_F = 0.0027</text><path d="M 55.0,285.8 Q 269.0,286.9 485.1,286.4 M 484.1,287.3 Q 485.6,361.0 485.6,436.0 M 485.5,435.7 Q 269.6,437.2 54.8,435.4 M 54.4,435.5 Q 55.8,360.5 54.1,285.7 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="312" text-anchor="start" font-size="13.5" fill="#3b3b3b">累加器位宽实测：[[127,127]] @ [[127],[127]]</text><text x="71" y="336" text-anchor="start" font-size="13.5" fill="#3b3b3b">真值 = 127×127×2 = 32258</text><text x="71" y="360" text-anchor="start" font-size="13.5" fill="#d96c5c">int8 累加（numpy int8@int8）→ 2</text><text x="160" y="378" text-anchor="start" font-size="11.5" fill="#d96c5c">↑ 溢出回绕：32258 mod 256 = 2</text><text x="71" y="400" text-anchor="start" font-size="13.5" fill="#79b26a">int32 累加（显式 cast）→ 32258 ✓</text><text x="71" y="424" text-anchor="start" font-size="11.5" fill="#6b6459">容量：单项最大 16129；int16 在 K=3 就爆，int32 可撑 K≈13.3 万</text><path d="M 511.3,285.0 Q 725.9,285.2 939.7,286.3 M 939.7,284.9 Q 940.8,360.4 939.0,436.6 M 938.8,434.9 Q 725.8,434.8 509.3,435.0 M 509.1,434.7 Q 508.9,360.1 509.2,286.3 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="526" y="312" text-anchor="start" font-size="13.5" fill="#3b3b3b">这套配方在哪？</text><text x="526" y="336" text-anchor="start" font-size="13" fill="#3b3b3b">昇腾 Cube / GPU Tensor Core 的 INT8 模式：</text><text x="526" y="358" text-anchor="start" font-size="13" fill="#5f8fcb">INT8 输入 + INT32 累加（Day 80 浮点配方的整数版）</text><text x="526" y="384" text-anchor="start" font-size="12.5" fill="#3b3b3b">字节账（nbytes 实测，单个 512×512 矩阵）：</text><text x="526" y="406" text-anchor="start" font-size="13" fill="#79b26a">fp32 1.00 MiB → fp16 0.50 MiB → int8 0.25 MiB</text><text x="526" y="428" text-anchor="start" font-size="11.5" fill="#6b6459">误差全来自输入量化档位；累加与反量化本身不添税</text></g></svg>