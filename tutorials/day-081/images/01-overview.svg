<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 614" width="960" height="614"><rect x="3" y="3" width="954" height="608" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="55" y="54" text-anchor="start" font-size="27" fill="#3b3b3b">第 81 天：INT8 量化基础</text><text x="55" y="82" text-anchor="start" font-size="16" fill="#6b6459" transform="rotate(-0.4 55 82)">—— 把连续刻度装进 256 个格子：Scale 定格宽、Zero Point 定原点、饱和守边界</text><text x="55" y="120" text-anchor="start" font-size="13" fill="#6b6459">本周：数值精度与量化周（第 12 周）</text><path d="M 50.0,129.9 Q 136.2,129.7 222.9,129.1 M 221.9,130.7 Q 222.3,168.1 221.5,203.6 M 221.5,203.0 Q 134.9,204.0 49.5,204.2 M 51.2,205.3 Q 50.7,166.6 49.7,131.0 Z" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="152" text-anchor="middle" font-size="14" fill="#6b6459">Day 78</text><text x="136" y="172" text-anchor="middle" font-size="13.5" fill="#3b3b3b">浮点格式 + 累加误差</text><text x="136" y="194" text-anchor="middle" font-size="12" fill="#6b6459">误差为什么来</text><path d="M 231.3,130.8 Q 317.3,129.9 404.1,131.2 M 404.6,130.9 Q 403.6,166.6 405.0,204.2 M 404.6,203.0 Q 316.9,203.8 231.5,203.4 M 232.8,205.1 Q 231.3,166.0 231.2,129.2 Z" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="318" y="152" text-anchor="middle" font-size="14" fill="#6b6459">Day 79</text><text x="318" y="172" text-anchor="middle" font-size="13.5" fill="#3b3b3b">参考实现 + 误差指标</text><text x="318" y="194" text-anchor="middle" font-size="12" fill="#6b6459">造出判 PASS/FAIL 的尺子</text><path d="M 414.6,129.7 Q 501.2,128.7 586.1,129.0 M 586.9,129.7 Q 585.3,167.2 587.0,202.7 M 585.3,205.0 Q 499.8,203.0 415.1,205.2 M 413.8,203.2 Q 412.8,167.6 414.7,130.6 Z" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="500" y="152" text-anchor="middle" font-size="14" fil