und" stroke-linejoin="round"/><path d="M 421.5,165.2 Q 414.7,162.8 409.2,158.7" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 593.2,165.7 Q 597.4,165.1 603.0,165.0" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 602.4,165.2 Q 597.0,167.4 591.2,170.6" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 602.4,164.7 Q 596.9,161.6 591.2,158.6" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 774.0,164.6 Q 779.0,165.4 785.4,164.0" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 784.5,165.2 Q 779.0,167.4 773.0,170.5" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 784.6,164.3 Q 779.0,162.6 772.7,158.6" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="250" text-anchor="start" font-size="13" fill="#6b6459">今天的流水线（per-tensor：一个 scale + 一个 zp 管整个张量）</text><path d="M 49.1,262.1 Q 124.6,262.6 200.6,262.4 M 200.0,262.9 Q 201.3,293.0 199.7,327.0 M 200.4,325.7 Q 125.6,325.4 50.9,324.9 M 49.0,326.7 Q 49.8,294.7 51.1,262.7 Z" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="125.0" y="286" text-anchor="middle" font-size="15" fill="#3b3b3b">① 校准</text><text x="125.0" y="310" text-anchor="middle" font-size="12.5" fill="#6b6459">min/max 或分位数</text><path d="M 215.4,261.4 Q 285.0,261.3 355.8,263.3 M 353.8,262.1 Q 355.9,295.2 354.7,325.9 M 354.5,324.8 Q 284.3,327.2 215.7,327.3 M 215.3,324.8 Q 214.8,295.0 215.1,262.9 Z" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="285.0" y="286" text-anchor="middle" font-size="15" fill="#3b3b3b">② 选方案</text><text x="285.0" y="310" text-anchor="middle" font-size="12.5" fill="#6b6459">对称 / 非对称</text><path d="M 368.7,261.6 Q 454.8,261.9 539.4,262.6 M 540.7,262.9 Q 539.8,292.9 540.1,326.9 M 539.5,324.9 Q 454.6,325.4 368.7,326.4 M 368.8,326.8 Q 371.1,294.8 370.7,262.5 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="455.0" y="286" text-anchor="middle" font-size="15" fill="#3b3b3b">③ 算参数</text><text x="455.0" y="310" text-anchor="middle" font-size="12.5" fill="#6b6459">scale, zero_point</text><path d="M 555.8,262.1 Q 650.2,260.8 744.9,263.2 M 743.8,261.7 Q 746.1,294.1 746.0,326.2 M 744.6,327.2 Q 649.7,326.9 555.5,327.2 M 555.2,326.6 Q 553.9,294.5 553.8,261.3 Z" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="650.0" y="286" text-anchor="middle" font-size="15" fill="#3b3b3b">④ 量化</text><text x="650.0" y="310" text-anchor="middle" font-size="12.5" fill="#6b6459">round + 平移 + 饱和</text><path d="M 760.7,261.4 Q 839.4,262.4 921.3,260.9 M 919.1,262.3 Q 920.6,293.2 920.4,324.7 M 919.1,325.1 Q 839.7,326.3 761.2,326.1 M 760.0,326.0 Q 759.1,294.4 760.5,262.4 Z" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="840.0" y="286" text-anchor="middle" font-size="15" fill="#3b3b3b">⑤ 反量化 + 验证</text><text x="840.0" y="310" text-anchor="middle" font-size="12.5" fill="#6b6459">范围内误差 ≤ 1 格</text><path d="M 202.7,294.7 Q 205.9,293.0 210.9,293.8" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 210.8,294.7 Q 205.5,296.8 199.5,299.5" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 211.3,294.4 Q 204.9,291.3 199.4,288.4" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 356.7,293.7 Q 360.8,294.2 365.7,294.2" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 365.3,293.7 Q 360.0,297.0 354.5,299.4" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 366.6,293.3 Q 360.5,291.5 354.9,287.6" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 543.0,293.5 Q 545.9,294.1 552.1,294.0" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 551.6,293.4 Q 545.6,296.7 539.1,299.1" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 551.7,294.4 Q 545.2,291.0 539.9,288.9" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 749.2,292.9 Q 751.4,293.6 755.5,294.2" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 755.6,293.3 Q 750.6,296.4 744.8,299.7" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 756.1,294.6 Q 750.7,290.6 743.8,288.3" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="368" text-anchor="start" font-size="14.5" fill="#3b3b3b">今天要拧的三个旋钮（例子：ReLU 后的激活 x = [0, 0.5, 1.0, 2.0, 3.5]）：</text><path d="M 50.3,382.9 Q 194.6,383.0 340.2,382.7 M 339.2,381.5 Q 339.7,432.1 339.6,482.6 M 340.8,481.4 Q 194.6,482.4 50.7,482.0 M 49.5,481.5 Q 51.3,430.8 50.8,380.9 Z" fill="none" stroke="#5f8fcb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="408" text-anchor="start" font-size="16" fill="#5f8fcb">Scale（刻度）</text><text x="66" y="432" text-anchor="start" font-size="13" fill="#3b3b3b">一格代表多少 float</text><text x="66" y="456" text-anchor="start" font-size="12.5" fill="#6b6459">例：范围 [0, 3.5] → 3.5/255 = 0.0137</text><text x="66" y="476" text-anchor="start" font-size="12.5" fill="#6b6459">范围越小格越细 —— 校准的使命</text><path d="M 355.8,381.6 Q 501.1,381.2 644.7,381.2 M 645.5,382.4 Q 646.1,431.4 644.3,481.6 M 645.2,480.9 Q 498.9,482.5 355.3,482.4 M 356.1,482.5 Q 355.8,433.1 355.8,382.1 Z" fill="none" stroke="#79b26a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="371" y="408" text-anchor="start" font-size="16" fill="#79b26a">Zero Point（零点）</text><text x="371" y="432" text-anchor="start" font-size="13" fill="#3b3b3b">float 0 对齐哪一档</text><text x="371" y="456" text-anchor="start" font-size="12.5" fill="#6b6459">例：zp = −128，x = 0 精确还原</text><text x="371" y="476" text-anchor="start" font-size="12.5" fill="#6b6459">对称方案 zp = 0（255 档）</text><path d="M 659.8,382.5 Q 804.1,380.8 949.0,380.9 M 950.7,381.6 Q 949.5,432.8 949.6,481.0 M 949.5,481.7 Q 805.3,482.1 660.2,481.2 M 659.8,482.6 Q 659.6,431.8 659.9,382.3 Z" fill="none" stroke="#d96c5c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="676" y="408" text-anchor="start" font-size="16" fill="#d96c5c">饱和（Saturation）</text><text x="676" y="432" text-anchor="start" font-size="13" fill="#3b3b3b">范围外的值夹到边界档</text><text x="676" y="456" text-anchor="start" font-size="12.5" fill="#6b6459">例：5.0 → 3.5（不夹则回绕成 1.48）</text><text x="676" y="476" text-anchor="start" font-size="12.5" fill="#6b6459">离群点被牺牲 → 分位数校准</text><path d="M 51.0,509.8 Q 490.5,509.8 929.1,510.6 M 929.5,510.5 Q 928.7,552.3 930.0,594.2 M 931.2,593.3 Q 489.1,593.8 49.6,595.3 M 50.5,595.0 Q 50.2,551.6 50.6,509.1 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="538" text-anchor="start" font-size="15.5" fill="#3b3b3b">贯穿问题：把 [0, 0.5, 1.0, 2.0, 3.5] 存进 int8（每元素 1 字节）再还原，误差能压到多少、</text><text x="66" y="562" text-anchor="start" font-size="15.5" fill="#3b3b3b">靠哪三个旋钮？—— 昨天说过：FP16 的输入税 4.9e-4 是格式给定、听天由命；</text><text x="66" y="584" text-anchor="start" font-size="12.5" fill="#6b6459">INT8 只有 256 档，税必须自己设计 —— 今天手算 + 12 个边界测试 + 5 个实验，全部真实运行。</text></g></svg>