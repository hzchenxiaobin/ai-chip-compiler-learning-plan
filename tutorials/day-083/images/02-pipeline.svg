art" font-size="13" fill="#3b3b3b">结构保证：折叠复用执行器同一套数值内核；</text><text x="48" y="466" text-anchor="start" font-size="13" fill="#3b3b3b">融合算子严格按 fp32 的 matmul→add→relu 复刻</text><text x="48" y="494" text-anchor="start" font-size="13" fill="#8a3a2c">实测：固定输入 True｜3×10⁴ 随机 True｜50 张随机图 50/50</text><path d="M 590.6,335.1 Q 840.0,336.7 1089.8,336.0 M 1090.7,335.8 Q 1090.9,424.7 1089.5,514.3 M 1089.2,514.1 Q 840.4,514.5 589.3,515.0 M 589.4,513.1 Q 590.0,424.6 590.6,335.2 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" rx="6"/><text x="608" y="364" text-anchor="start" font-size="15.5" fill="#3b3b3b">终验第二层：FP64 golden（误差账本）</text><path d="M 605.9,374.4 Q 840.3,373.5 1073.8,374.5" fill="none" stroke="#5f8fcb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="608" y="398" text-anchor="start" font-size="13" fill="#3b3b3b">问题：实现本身的误差有没有出账？</text><text x="608" y="422" text-anchor="start" font-size="13" fill="#3b3b3b">口径：|a−g| ≤ atol + rtol·|g|，rtol=1e-5</text><text x="608" y="446" text-anchor="start" font-size="13" fill="#3b3b3b">atol 按图记账（D78）：(2K+2)·eps32·max Σ|a·b|</text><text x="608" y="470" text-anchor="start" font-size="12" fill="#6b6459">（MatMul 有消去，不能用 D79 逐元素固定表）</text><text x="608" y="494" text-anchor="start" font-size="13" fill="#2a4d7a">实测：固定输入 |diff|=0｜随机最坏 4.54e-07，占用比 0.033</text><path d="M 30.7,540.4 Q 560.3,539.7 1089.4,539.5 M 1089.9,540.0 Q 1089.4,561.5 1090.9,584.3 M 1090.6,583.2 Q 559.4,583.7 29.5,583.9 M 30.1,583.9 Q 30.2,561.2 30.1,539.3 Z" fill="white" stroke="#3b3b3b" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" rx="6"/><text x="560" y="567" text-anchor="middle" font-size="14.5" fill="#3b3b3b">口径就是语义：位等价管『优化不引入变化』，golden 管『实现自身误差』—— 两个问题，两本账，不能混</text></g></svg>