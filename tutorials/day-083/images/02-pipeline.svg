<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" width="1240" height="780"><rect x="3" y="3" width="1234" height="774" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="28" y="46" text-anchor="start" font-size="23" fill="#3b3b3b">Day 83: 五道闸管道 —— 顺序是设计决定，验证是管道的一部分</text><text x="28" y="71" text-anchor="start" font-size="14.5" fill="#6b6459">先清噪声再匹配模式；清理闸在不动点里循环（上一轮的改写创造下一轮的机会，Day 69）；改写后 Shape 复推</text><path d="M 25.5,106.0 Q 68.2,105.8 109.7,105.8 M 110.6,106.6 Q 110.4,128.7 110.1,150.1 M 109.6,149.9 Q 68.5,150.2 25.2,149.6 M 26.0,149.3 Q 26.0,128.8 25.5,106.6 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" rx="6"/><text x="68.0" y="126.24000000000001" text-anchor="middle" font-size="15" fill="#3b3b3b">输入图</text><text x="68.0" y="141.2" text-anchor="middle" font-size="11.5" fill="#6b6459">11 节点</text><path d="M 112.7,127.1 Q 129.1,128.6 146.0,127.4" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 145.8,127.7 Q 139.7,131.3 134.8,134.1" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 145.5,128.3 Q 139.9,125.5 133.7,121.9" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 150.0,99.8 Q 229.2,99.1 308.6,99.8 M 308.3,99.7 Q 307.9,165.5 307.4,230.0 M 307.5,229.8 Q 229.3,230.7 151.0,230.2 M 149.6,229.5 Q 150.6,164.3 150.6,99.8 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" rx="6"/><text x="229.0" y="123" text-anchor="middle" font-size="14.5" fill="#3b3b3b">闸0 合法性检查</text><path d="M 162.5,131.6 Q 229.3,132.1 295.6,131.8" fill="none" stroke="#5f8fcb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="229.0" y="149.0" text-anchor="middle" font-size="11" fill="#3b3b3b">内维 / 元素数 / pe