』是策略决定，管道不越权（D82）</text><text x="46" y="488" text-anchor="start" font-size="12.5" fill="#3b3b3b">激活量化把输出放上 1/8 格点（真实对照）：</text><text x="60" y="512" text-anchor="start" font-size="12.5" fill="#3b3b3b">主图 0.0625</text><text x="190" y="512" text-anchor="start" font-size="12.5" fill="#8a5a17">→ 0.0000（0.5 格，banker 舍入到偶）</text><text x="60" y="536" text-anchor="start" font-size="12.5" fill="#3b3b3b">主图 1.2383</text><text x="190" y="536" text-anchor="start" font-size="12.5" fill="#8a5a17">→ 1.2500（9.9 格 → 10 格）</text><text x="60" y="560" text-anchor="start" font-size="12.5" fill="#3b3b3b">主图 3.0703</text><text x="190" y="560" text-anchor="start" font-size="12.5" fill="#8a5a17">→ 3.1250（24.6 格 → 25 格）</text><text x="46" y="592" text-anchor="start" font-size="12.5" fill="#6b6459">位等价仍 True：q→dq 原样执行，一个比特没动</text><path d="M 522.6,376.3 Q 636.5,376.2 749.9,376.7 M 749.4,376.8 Q 750.9,500.8 749.7,625.6 M 749.8,625.9 Q 635.3,625.5 521.1,625.4 M 522.6,626.3 Q 522.0,500.6 522.0,376.5 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" rx="6"/><text x="540" y="404" text-anchor="start" font-size="14.5" fill="#3b3b3b">负例：多使用者拒融</text><path d="M 537.9,414.4 Q 635.8,413.6 734.0,414.4" fill="none" stroke="#d96c5c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="540" y="438" text-anchor="start" font-size="12.5" fill="#3b3b3b">matmul 输出同时是</text><text x="540" y="458" text-anchor="start" font-size="12.5" fill="#3b3b3b">图输出 → 融合会夺走</text><text x="540" y="478" text-anchor="start" font-size="12.5" fill="#3b3b3b">别的消费者的输入</text><text x="540" y="508" text-anchor="start" font-size="12.5" fill="#8a3a2c">实测：6 → 6 节点</text><text x="540" y="532" text-anchor="start" font-size="12.5" fill="#3b3b3b">审计：『拒绝：输出被</text><text x="540" y="552" text-anchor="start" font-size="12.5" fill="#3b3b3b">2 个节点使用』</text><text x="540" y="582" text-anchor="start" font-size="12.5" fill="#6b6459">Day 52 的边界原样上岗</text><path d="M 763.2,375.0 Q 877.8,375.5 992.6,375.2 M 991.0,376.2 Q 992.3,500.5 992.1,626.3 M 992.2,625.2 Q 877.5,625.9 764.7,626.2 M 763.6,625.6 Q 763.5,501.9 763.8,376.7 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" rx="6"/><text x="782" y="404" text-anchor="start" font-size="14.5" fill="#3b3b3b">负例：requant 报警</text><path d="M 780.0,414.3 Q 878.2,413.8 976.3,413.5" fill="none" stroke="#d96c5c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="782" y="438" text-anchor="start" font-size="12.5" fill="#3b3b3b">Q(s=1/128) → DQ(s=1/64)</text><text x="782" y="458" text-anchor="start" font-size="12.5" fill="#3b3b3b">参数不一致（R07）</text><text x="782" y="488" text-anchor="start" font-size="12.5" fill="#8a3a2c">实测：3 → 3 节点，图没动</text><text x="782" y="512" text-anchor="start" font-size="12.5" fill="#3b3b3b">报警而不是抢救：</text><text x="782" y="532" text-anchor="start" font-size="12.5" fill="#3b3b3b">坏图要在上游修参数</text><text x="782" y="562" text-anchor="start" font-size="12.5" fill="#6b6459">（D82 结论：删不删都已错）</text><path d="M 27.7,655.4 Q 542.3,655.4 1057.4,655.7 M 1057.9,656.7 Q 1057.6,681.6 1058.4,707.2 M 1057.6,708.6 Q 542.5,708.1 28.1,708.3 M 27.5,708.2 Q 28.3,681.7 28.1,655.2 Z" fill="white" stroke="#3b3b3b" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" rx="6"/><path d="M 47.4,682.5 Q 49.6,686.7 53.0,690.0" fill="none" stroke="#79b26a" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.4"/><path d="M 54.0,689.4 Q 59.0,683.2 64.9,675.2" fill="none" stroke="#79b26a" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.4"/><text x="84" y="688" text-anchor="start" font-size="13.5" fill="#3b3b3b">验收口径：『删了不变』用位等价证明；『算得对不对』用 golden + 账本证明；『不该动的』用负例证明它确实没动</text></g></svg>