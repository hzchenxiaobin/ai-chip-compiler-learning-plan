<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760"><rect x="3" y="3" width="1114" height="754" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="28" y="46" text-anchor="start" font-size="23" fill="#3b3b3b">Day 83: 验证结果与三个负例 —— 数字全部来自实跑（seed=83）</text><text x="28" y="71" text-anchor="start" font-size="14.5" fill="#6b6459">两层验证各管一本账；右下三张卡是管道『拒绝也是决策』的实弹：R06 登记、多使用者拒融、requant 报警</text><path d="M 28.7,95.4 Q 262.9,95.2 498.3,96.9 M 498.9,95.1 Q 497.5,220.7 497.4,345.6 M 498.4,345.9 Q 262.3,345.1 27.1,345.7 M 28.4,346.8 Q 27.8,220.1 29.0,96.2 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" rx="6"/><text x="46" y="124" text-anchor="start" font-size="15" fill="#3b3b3b">层1 位等价：优化 vs 原图（容差 = 0）</text><path d="M 44.3,134.5 Q 262.7,134.1 482.4,134.3" fill="none" stroke="#79b26a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="160" text-anchor="start" font-size="12.5" fill="#3b3b3b">固定输入（dyadic 数据）</text><text x="300" y="160" text-anchor="start" font-size="12.5" fill="#2c5f2d">np.array_equal = True</text><text x="46" y="186" text-anchor="start" font-size="12.5" fill="#3b3b3b">随机输入 3 组 × 10000</text><text x="300" y="186" text-anchor="start" font-size="12.5" fill="#2c5f2d">True（逐位）</text><text x="46" y="212" text-anchor="start" font-size="12.5" fill="#3b3b3b">随机图 50 张（M,K,N∈[1,8]）</text><text x="300" y="212" text-anchor="start" font-size="12.5" fill="#2c5f2d">50/50</text><text x="46" y="238" text-anchor="start" font-size="12.5" fill="#3b3b3b">节点数</text><text x="300" y="238" text-anchor="start" font-size="12.5" fill="#2c5f2d">11 → 5（50 张全部）</text><text x="46" y="270" text-anchor="start" font-size="12.5" fill="#6b6459">结论：五道闸的改写没有引入任何一个比特的变化</text><path d="M 521.1,96.1 Q 756.5,97.0 992.3,95.7 M 992.1,96.4 Q 991.5,220.2 992.9,345.0 M 991.5,346.2 Q 757.9,346.0 522.6,345.8 M 521.3,3