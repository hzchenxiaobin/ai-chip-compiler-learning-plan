<text x="560.0" y="282" text-anchor="middle" font-size="14.5" fill="#6b6459">今天不写新 Pattern —— 把第三阶段的五类能力装进同一根管道，并用两层验证证明『优化没改错』</text><path d="M 28.5,327.8 Q 188.0,328.8 348.4,328.4 M 347.1,329.0 Q 348.3,448.0 347.7,567.2 M 347.6,568.0 Q 188.9,567.4 27.6,567.3 M 28.1,568.8 Q 28.5,448.6 28.0,328.0 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" rx="6"/><text x="44" y="358" text-anchor="start" font-size="15.5" fill="#3b3b3b">① 端到端图优化示例</text><path d="M 42.5,368.1 Q 187.7,368.3 334.2,368.4" fill="none" stroke="#5f8fcb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="390" text-anchor="start" font-size="12.5" fill="#3b3b3b">贯穿图（真实 IR 名字）：</text><text x="44" y="409" text-anchor="start" font-size="12.5" fill="#3b3b3b">x(2,12)→reshape(24,)→reshape(4,6)</text><text x="44" y="428" text-anchor="start" font-size="12.5" fill="#3b3b3b">W(3,6)→Q→DQ→transpose(1,0)</text><text x="44" y="447" text-anchor="start" font-size="12.5" fill="#3b3b3b">→matmul→add(bias)→relu</text><text x="44" y="466" text-anchor="start" font-size="12.5" fill="#3b3b3b">清理+融合后：11 → 5 个节点</text><text x="44" y="485" text-anchor="start" font-size="12.5" fill="#3b3b3b">运行时算子 8 → 2（其余进编译期）</text><path d="M 392.2,328.3 Q 552.7,328.6 711.2,328.0 M 711.2,328.9 Q 712.6,448.3 711.9,568.4 M 711.9,567.6 Q 551.8,567.9 391.6,568.9 M 392.9,568.7 Q 391.1,447.6 392.1,327.1 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" rx="6"/><text x="408" y="358" text-anchor="start" font-size="15.5" fill="#3b3b3b">② IR 对照 + 收益账本</text><path d="M 405.9,367.6 Q 551.9,367.6 698.3,368.3" fill="none" stroke="#79b26a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="408" y="390" text-anchor="start" font-size="12.5" fill="#3b3b3b">每个阶段一张 IR（outputs/ 可复查）</text><text x="408" y="409" text-anchor="start" font-size="12.5" fill="#3b3b3b">每步改写一行审计日志（哪条规则、</text><text x="408" y="428" text-anchor="start" font-size="12.5" fill="#3b3b3b">为什么安全）</text><text x="408" y="447" text-anchor="start" font-size="12.5" fill="#3b3b3b">ΔB = 16·M·N = 192 B（消两个中间）</text><text x="408" y="466" text-anchor="start" font-size="12.5" fill="#3b3b3b">工作集 228 B ≤ 片上 256 KiB</text><text x="408" y="485" text-anchor="start" font-size="12.5" fill="#3b3b3b">1024³：ΔB=16 MiB 但 spill → 拒绝</text><path d="M 755.2,328.7 Q 915.3,328.9 1076.9,328.1 M 1075.7,327.2 Q 1075.8,447.7 1076.9,568.6 M 1075.4,568.1 Q 915.5,567.8 755.9,567.2 M 756.5,567.4 Q 756.7,447.2 755.6,327.3 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" rx="6"/><text x="772" y="358" text-anchor="start" font-size="15.5" fill="#3b3b3b">③ 参考结果 + 全部测试</text><path d="M 770.3,367.8 Q 916.4,368.4 1061.5,367.6" fill="none" stroke="#d96c5c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="772" y="390" text-anchor="start" font-size="12.5" fill="#3b3b3b">两层口径分开记账：</text><text x="772" y="409" text-anchor="start" font-size="12.5" fill="#3b3b3b">位等价（容差=0）：优化不引入变化</text><text x="772" y="428" text-anchor="start" font-size="12.5" fill="#3b3b3b">  固定输入 / 3×10⁴ 随机 / 50 张随机图</text><text x="772" y="447" text-anchor="start" font-size="12.5" fill="#3b3b3b">  全部 True</text><text x="772" y="466" text-anchor="start" font-size="12.5" fill="#3b3b3b">FP64 golden：账本 atol 兜底</text><text x="772" y="485" text-anchor="start" font-size="12.5" fill="#3b3b3b">  最坏 |diff| 4.61e-07，占用比 0.036</text><text x="560.0" y="638" text-anchor="middle" font-size="13" fill="#6b6459">学习计划对今天的要求：回顾 Shape/Layout、图优化、Cost Model、数值验证 —— 对一张含 Transpose/Reshape/MatMul/Bias/ReLU 的图执行优化并验证结果</text></g></svg>