3(k+1)</text><text x="56" y="586" text-anchor="start" font-size="12.5" fill="#6b6459">越界的 j 把访问「折」到第 k＋1 行第 0 列——选做练习（b）问的就是这个元素</text><path d="M 679.4,99.3 Q 944.2,100.1 1208.8,100.4 M 1209.4,101.2 Q 1210.1,165.6 1210.6,232.5 M 1209.6,231.5 Q 945.0,232.0 681.3,232.9 M 678.7,232.3 Q 680.8,166.9 681.1,98.7 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="130" text-anchor="start" font-size="15" fill="#3b3b3b">检查 ①：按维越界检测（今天的探针）</text><text x="700" y="158" text-anchor="start" font-size="12.5" fill="#3b3b3b">load/store 执行前逐维验证下标 ∈ [0, dim)</text><text x="700" y="182" text-anchor="start" font-size="12.5" fill="#3b3b3b">P3：load %b[k,3] → j=3 ∉ [0,3)（B.shape[1]=3）→ 立刻拦下 ✓</text><text x="700" y="206" text-anchor="start" font-size="12.5" fill="#3b3b3b">P1：load %a[4,k] → i=4 ∉ [0,4)（A.shape[0]=4）→ 立刻拦下 ✓</text><path d="M 680.0,253.0 Q 945.0,250.7 1210.1,252.6 M 1209.2,252.6 Q 1209.5,327.8 1208.8,404.3 M 1209.7,404.3 Q 944.6,404.9 679.8,404.6 M 680.4,403.0 Q 678.8,328.7 680.2,251.6 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="282" text-anchor="start" font-size="15" fill="#3b3b3b">检查 ②：只查线性地址（0 ≤ addr &lt; 格数）</text><text x="700" y="310" text-anchor="start" font-size="12.5" fill="#3b3b3b">P3：addr = 3·k＋3，k=0…4 时为 3…15 全 &lt; 18 → 放行 ✗</text><text x="700" y="334" text-anchor="start" font-size="12.5" fill="#3b3b3b">错读 (k+1, 0) 的值混进结果——不报错、不崩溃（「安静地错」）</text><text x="700" y="358" text-anchor="start" font-size="12.5" fill="#3b3b3b">（k=5 时 addr=18 才出界，但前 5 个 k 已经读错）</text><text x="700" y="382" text-anchor="start" font-size="12.5" fill="#3b3b3b">P1：addr = 6·4＋k = 24＋k ≥ 24（A 共 24 格）→ 也能拦下 ✓</text><path d="M 679.6,423.7 Q 944.5,424.3 1208.9,424.0 M 1208.9,425.2 Q 1210.3,483.4 1211.1,541.3 M 1209.0,542.6 Q 943.8,541.6 680.7,541.2 M 680.0,542.6 Q 680.8,481.9 680.3,425.2 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="454" text-anchor="start" font-size="15" fill="#3b3b3b">什么时候必须按维检查？</text><text x="700" y="482" text-anchor="start" font-size="12.5" fill="#3b3b3b">线性地址在缓冲区内 ≠ 下标合法——stride／配对类 bug 的共性</text><text x="700" y="506" text-anchor="start" font-size="12.5" fill="#3b3b3b">Day 85 探针 P1（stride 写反：不越界、只是读错格子）是同款阴险</text><text x="700" y="530" text-anchor="start" font-size="12.5" fill="#3b3b3b">两种检查都放行 ≠ 结果对：数值对照／IV 轨迹才是终审（P2 的教训）</text><path d="M 40.3,609.1 Q 625.8,610.6 1211.2,609.3 M 1211.0,609.6 Q 1209.0,645.8 1210.9,682.3 M 1210.4,682.6 Q 623.9,681.6 38.9,681.7 M 39.2,681.7 Q 40.2,646.7 40.3,611.2 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="640" text-anchor="start" font-size="14" fill="#3b3b3b">一句话：P1 的越界「出了格」，线性检查也抓得住；P3 的越界「仍在格内」——只有按维检查抓得住。</text><text x="60" y="664" text-anchor="start" font-size="12.5" fill="#6b6459">错读的 B(k+1,0) 顶替了不存在的 B(k,3)——这正是错误二「恰好不越界但读错格子」的机制图解。</text></g></svg>