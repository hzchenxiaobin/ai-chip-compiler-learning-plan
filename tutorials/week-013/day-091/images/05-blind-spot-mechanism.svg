<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" width="1160" height="700"><rect x="3" y="3" width="1154" height="694" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="30" y="44" text-anchor="start" font-size="25" fill="#3b3b3b">为什么 i_ub_n 在复盘例 (2,3,2) 上隐身——结构对 ≠ 绑定对</text><text x="30" y="70" text-anchor="start" font-size="14.5" fill="#6b6459">同一段循环 IR 的「应然 vs 实然」对照：出生证明说 i←M，实际绑定的常量才是裁判（E3 的机制图解）</text><path d="M 28.9,81.1 Q 580.5,81.1 1131.2,82.9" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M 34.6,99.9 Q 304.9,99.3 574.3,99.7 M 574.0,101.2 Q 573.3,232.7 574.7,362.9 M 575.3,363.9 Q 304.1,363.5 34.1,365.2 M 33.6,364.6 Q 34.7,233.0 34.5,99.8 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" rx="10"/><text x="52" y="128" text-anchor="start" font-size="14.5" fill="#79b26a" font-weight="bold">正确形态：i 的上界 ← %cM（与出生证明一致）</text><text x="52" y="156" text-anchor="start" font-size="12.6" fill="#3b3b3b">%c2  = arith.constant 2 : index</text><text x="52" y="181" text-anchor="start" font-size="12.6" fill="#3b3b3b">  // M ← A.shape[0]：i 的上界（不含端点）</text><text x="52" y="206" text-anchor="start" font-size="12.6" fill="#3b3b3b">%c2' = arith.constant 2 : index</text><text x="52" y="231" text-anchor="start" font-size="12.6" fill="#3b3b3b">  // N ← B.shape[1]：j 的上界（不含端点）</text><text x="52" y="256" text-anchor="start" font-size="12.6" fill="#3b3b3b">scf.for %i = %c0 to %c2 step %c1 {</text><path d="M 315.6,217.7 Q 429.7,219.0 544.9,217.3 M 543.4,216.8 Q 545.1,233.9 543.7,251.2 M 543.2,253.1 Q 429.8,252.3 316.9,252.1 M 316.8,252.7 Q 316.3,235.2 317.0,218.5 Z" fill="white" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" rx="7"/><text x="430" y="240" text-anchor="middle" font-size="13.5" fill="#79b26a" font-weight="bold">绑定 %c2 ＝ M ✓</text><text x="52" y="300" text-anchor="start" font-size="12.2" fill="#6b6459">// 出生证明（Day 88 印进 IR）：</text><text x="52" y="320" text-anchor="start" font-size="12.2" fill="#6b6459">// ub 来源：M = A.shape[0] = 2</text><text x="52" y="340" text-anchor="start" font-size="12.2" fill="#6b6459">结论：应然＝实然，一切照旧</text><path d="M 599.6,101.0 Q 863.8,101.2 1126.4,99.9 M 1125.6,100.3 Q 1125.2,232.6 1126.5,365.0 M 1125.3,364.2 Q 863.1,364.3 599.8,362.7 M 601.1,365.1 Q 599.1,233.1 600.2,98.7 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" rx="10"/><text x="618" y="128" text-anchor="start" font-size="14.5" fill="#d96c5c" font-weight="bold">变异 M3 i_ub_n：i 的上界 ← %cN（应绑 %cM）</text><text x="618" y="156" text-anchor="start" font-size="12.6" fill="#3b3b3b">%c2  = arith.constant 2 : index</text><text x="618" y="181" text-anchor="start" font-size="12.6" fill="#3b3b3b">  // M ← A.shape[0]：i 的上界（不含端点）</text><text x="618" y="206" text-anchor="start" font-size="12.6" fill="#3b3b3b">%c2' = arith.constant 2 : index</text><text x="618" y="231" text-anchor="start" font-size="12.6" fill="#3b3b3b">  // N ← B.shape[1]：j 的上界（不含端点）</text><text x="618" y="256" text-anchor="start" font-size="12.6" fill="#3b3b3b">scf.for %i = %c0 to %c2' step %c1 {</text><path d="M 882.4,217.5 Q 995.7,217.0 1110.9,218.4 M 1109.3,218.2 Q 1109.8,236.3 1109.2,252.5 M 1110.8,253.0 Q 995.4,253.0 881.2,251.1 M 882.3,253.0 Q 881.8,234.2 881.0,217.8 Z" fill="white" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" rx="7"/><text x="996" y="240" text-anchor="middle" font-size="13.5" fill="#d96c5c" font-weight="bold">绑定 %c2' ＝ N ✗</text><text x="618" y="300" text-anchor="start" font-size="12.2" fill="#6b6459">// 出生证明仍写：ub 来源：M = A.shape[0] = 2</text><text x="618" y="320" text-anchor="start" font-size="12.2" fill="#6b6459">// 【变异 M3：i 上界绑到了 N 常量（应绑 M）】</text><text x="618" y="340" text-anchor="start" font-size="12.2" fill="#6b6459">结论：应然≠实然——但数值上看不出来</text><path d="M 579.0,152.3 Q 587.0,152.1 595.2,151.3" fill="none" stroke="#6b6459" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 595.7,152.3 Q 590.4,154.3 584.4,158.4" fill="none" stroke="#6b6459" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 595.4,151.5 Q 590.8,149.1 584.9,146.7" fill="none" stroke="#6b6459" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="402" text-anchor="start" font-size="14.5" fill="#5f8fcb" font-weight="bold">为什么「全绿」抓不住：错误读数＝正确读数的链条（M==N=2 是唯一的巧）</text><path d="M 33.9,417.3 Q 156.4,415.5 279.3,416.7 M 279.0,415.9 Q 280.7,447.6 279.5,477.1 M 280.8,478.9 Q 157.4,478.2 33.0,477.6 M 33.4,478.0 Q 33.4,447.3 33.9,417.2 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" rx="8"/><text x="157.0" y="442" text-anchor="middle" font-size="14.5" fill="#5f8fcb" font-weight="bold">M==N=2</text><text x="157.0" y="464" text-anchor="middle" font-size="12" fill="#3b3b3b">%c2 与 %c2' 值相同</text><path d="M 281.4,445.8 Q 294.1,446.2 308.5,447.1" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 308.1,447.3 Q 302.5,449.5 295.9,453.3" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 308.3,446.9 Q 302.5,444.4 295.8,441.2" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 312.7,416.9 Q 435.5,415.6 559.0,416.1 M 559.3,417.2 Q 559.0,446.2 559.2,477.4 M 557.2,478.1 Q 435.5,477.4 313.2,476.9 M 312.9,478.6 Q 312.7,446.9 313.0,415.5 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" rx="8"/><text x="435.0" y="442" text-anchor="middle" font-size="14.5" fill="#5f8fcb" font-weight="bold">trip 相同</text><text x="435.0" y="464" text-anchor="middle" font-size="12" fill="#3b3b3b">i 都跑 [0,2) 两趟</text><path d="M 560.0,447.8 Q 574.0,445.9 586.3,448.0" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 585.8,446.5 Q 580.3,450.3 574.0,453.2" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 585.5,447.7 Q 579.6,443.6 574.8,441.1" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 588.9,415.4 Q 714.0,416.9 835.5,414.8 M 836.5,415.0 Q 836.6,447.0 837.0,476.9 M 837.0,476.9 Q 713.3,477.6 590.1,477.3 M 591.2,478.0 Q 590.4,446.9 590.7,416.9 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" rx="8"/><text x="713.0" y="442" text-anchor="middle" font-size="14.5" fill="#5f8fcb" font-weight="bold">访存相同</text><text x="713.0" y="464" text-anchor="middle" font-size="12" fill="#3b3b3b">28 条逐条一致</text><path d="M 836.9,448.2 Q 850.4,447.3 863.2,446.6" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 864.5,447.5 Q 858.8,450.1 852.3,452.7" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 863.8,447.2 Q 858.0,443.6 852.6,441.0" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 868.3,416.6 Q 992.2,415.0 1114.1,417.0 M 1112.8,416.1 Q 1113.4,447.3 1114.7,478.2 M 1113.4,477.8 Q 990.3,478.9 867.7,477.3 M 869.1,478.2 Q 868.1,448.2 868.3,416.8 Z" fill="#e9e4d8" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" rx="8"/><text x="991.0" y="442" text-anchor="middle" font-size="14.5" fill="#6b6459" font-weight="bold">逐位相同</text><text x="991.0" y="464" text-anchor="middle" font-size="12" fill="#3b3b3b">SAME＝完全隐身</text><text x="34" y="508" text-anchor="start" font-size="12.5" fill="#3b3b3b">多重集 {0,1,2,2,3} 两边相同 · 18 op 结构两边相同 · 位等价 True——「结构对」掩盖了「绑定错」：</text><text x="34" y="528" text-anchor="start" font-size="12.5" fill="#3b3b3b">值的个数分不出哪个 2 归 i、哪个 2 归 j，只有值的来源（出生证明／def-use 链）能。</text><path d="M 33.6,556.0 Q 579.4,556.7 1125.4,555.5 M 1125.2,557.1 Q 1125.7,611.0 1126.1,663.2 M 1126.5,664.9 Q 579.9,665.2 34.4,664.0 M 34.8,664.5 Q 35.1,609.2 35.1,556.8 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" rx="8"/><text x="52" y="584" text-anchor="start" font-size="14.5" fill="#e8973f" font-weight="bold">补丁：正确性报告必须挂到形状矩阵整体（RT4c 的证据来源）</text><text x="52" y="610" text-anchor="start" font-size="12.2" fill="#3b3b3b">· Day 90 全矩阵 15/15 回归；猎杀统计：i_ub_n 被 11/15 组形状杀死——如 1×N (1,7,4)：M=1≠N=4，</text><text x="52" y="629" text-anchor="start" font-size="12.2" fill="#3b3b3b">  i 被错误常量顶出行维：memref.load %a(1, 0)：第 0 维下标 1 ∉ [0, 1)（shape (1, 7)）→ OOB 亮红。</text><text x="52" y="648" text-anchor="start" font-size="12.2" fill="#3b3b3b">· 单一形状（哪怕手画对账 28/28 全绿）只是必要条件；M==N 巧合对上的 SAME，靠矩阵其余成员补杀。</text></g></svg>