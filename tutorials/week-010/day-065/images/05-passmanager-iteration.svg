.0,568.0 L 879.4,557.3 L 878.9,544.7 L 878.9,534.2 L 879.0,523.4 L 880.4,510.9 L 880.0,500.0" fill="#eef3f7" stroke="#6b6357" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="896" y="520" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12" fill="#4a7fa5" text-anchor="start" opacity="1.0" font-weight="bold">读图要点</text><text x="896" y="538" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">· 每轮最多 P1、P2 各改一处，三连链靠</text><text x="896" y="554" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">  「下一轮」接力，不在 Pattern 内循环</text><path d="M 40.0,588.0 L 226.8,588.2 L 413.2,588.6 L 600.3,587.8 L 786.5,588.2 L 974.2,587.2 L 1160.0,588.0 L 1160.0,588.0 L 1159.1,598.8 L 1161.1,608.6 L 1160.1,619.1 L 1160.5,628.3 L 1158.9,640.8 L 1160.0,650.0 L 1160.0,650.0 L 973.7,649.1 L 786.1,650.3 L 598.9,650.0 L 412.9,649.2 L 226.8,649.4 L 40.0,650.0 L 40.0,650.0 L 39.6,639.5 L 39.7,630.1 L 38.9,619.7 L 40.5,608.5 L 40.1,597.6 L 40.0,588.0" fill="#ffffff" stroke="#6b6357" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="610" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="bold">为什么必然收敛：</text><text x="160" y="610" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11.5" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">两个 Pattern 都是单向改写（2→1 合并或 2→0 消除），op 数只减不增 → 迭代必然终止；max_rounds=10 只是防御上限</text><text x="60" y="634" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="bold">先合并哪一对都不影响终点：</text><text x="240" y="634" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11.5" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">排列组合满足结合律（测试 A5），长链的剩余 op 数由 L mod 阶 决定（E1：L=1..8 全对；E2：八连链 4 轮收敛）</text></svg>
