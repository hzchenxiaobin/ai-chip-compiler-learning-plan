<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect width="1200" height="675" fill="#fdfaf2"/>
<text x="40" y="40" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="20" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="bold">PassManager 不动点迭代：三连链的轮间实况</text>
<text x="40" y="64" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12" fill="#84796a" text-anchor="start" opacity="1.0" font-weight="normal">场景 D：T T T（p = (1,2,0)，阶 3）· 每个 Pattern 一次只改一处、靠下一轮接力 · IR 与轮数全部来自真实运行（outputs/transpose_elim_lab.txt）</text>
<path d="M 40.0,88.0 L 172.9,88.4 L 307.6,87.9 L 440.4,88.0 L 572.4,88.9 L 707.4,88.8 L 840.0,88.0 L 840.0,88.0 L 841.1,107.3 L 841.1,128.9 L 840.1,148.6 L 839.4,170.4 L 839.1,188.6 L 840.0,210.0 L 840.0,210.0 L 707.2,209.2 L 572.5,209.2 L 439.9,209.3 L 307.8,209.9 L 174.3,211.1 L 40.0,210.0 L 40.0,210.0 L 41.0,188.6 L 39.0,169.9 L 39.1,148.3 L 40.8,128.9 L 40.7,108.9 L 40.0,88.0" fill="#ffffff" stroke="#6b6357" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="110" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12.5" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="bold">初始（优化前）</text><text x="824" y="110" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12" fill="#a8772e" text-anchor="end" opacity="1.0" font-weight="bold">3 个 op</text><text x="56" y="132" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.5" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">%t1 = mini.transpose %in permutation = [1, 2, 0] : (2x3x4xf32) -&gt; (3x4x2xf32)</text><text x="56" y="148" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.5" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">%t2 = mini.transpose %t1 permutation = [1, 2, 0] : (3x4x2xf32) -&gt; (4x2x3xf32)</text><text x="56" y="164" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.5" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">%c = mini.transpose %t2 permutation = [1, 2, 0] : (4x2x3xf32) -&gt; (2x3x4xf32)</text><text x="56" y="180" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.5" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">func.return %c</text><text x="56" y="198" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.5" fill="#84796a" text-anchor="start" opacity="1.0" font-weight="normal">三个同款 3-循环转置首尾相接（%t1 → %t2 → %c）</text><path d="M 240.0,210.0 L 240.0,254.0" fill="none" stroke="#6b6357" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><path d="M 240.0,254.0 L 240.0,239.0" fill="none" stroke="#6b6357" stroke-width="2.4" stroke-linecap="round" opacity="1.0"/><path d="M 240.0,254.0 L 240.0,247.0" fill="none" stroke="#6b6357" stroke-width="2.4" stroke-linecap="round" opacity="1.0"/><text x="258" y="226" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.5" fill="#a8772e" text-anchor="start" opacity="1.0" font-weight="bold">第 1 轮：P1 先跑、找不到互逆对（(1,2,0) ≠ inv((1,2,0))）→ P2 合并 (%t1, %t2)</text><text x="258" y="244" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.5" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">r = compose((1,2,0),(1,2,0)) = (2,0,1)（内层先作用，恰好 = inv(p)）</text><path d="M 40.0,258.0 L 174.3,257.5 L 305.6,257.3 L 438.9,257.3 L 573.4,258.6 L 706.6,258.5 L 840.0,258.0 L 840.0,258.0 L 839.4,276.6 L 840.4,294.2 L 839.3,311.8 L 840.5,330.7 L 840.1,350.4 L 840.0,368.0 L 840.0,368.0 L 706.3,367.2 L 574.4,367.0 L 440.0,367.4 L 305.9,367.8 L 173.0,367.0 L 40.0,368.0 L 40.0,368.0 L 40.3,349.0 L 41.1,332.4 L 39.4,314.1 L 38.9,295.6 L 40.8,275.2 L 40.0,258.0" fill="#f8f0e2" stroke="#6b6357" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="280" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12.5" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="bold">第 1 轮后</text><text x="824" y="280" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12" fill="#a8772e" text-anchor="end" opacity="1.0" font-weight="bold">2 个 op</text><text x="56" y="302" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.5" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">%t2 = mini.transpose %in permutation = [2, 0, 1] : (2x3x4xf32) -&gt; (4x2x3xf32)</text><text x="56" y="318" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.5" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">%c = mini.transpose %t2 permutation = [1, 2, 0] : (4x2x3xf32) -&gt; (2x3x4xf32)</text><text x="56" y="334" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.5" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">func.return %c</text><text x="56" y="352" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.5" fill="#84796a" text-anchor="start" opacity="1.0" font-weight="normal">%t2 原地改写成 T_(2,0,1)(%in)：result id 不变、下游自动跟随；%t1 已删（它只剩这一个使用者）</text><path d="M 240.0,368.0 L 240.0,412.0" fill="none" stroke="#6b6357" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><path d="M 240.0,412.0 L 240.0,397.0" fill="none" stroke="#6b6357" stroke-width="2.4" stroke-linecap="round" opacity="1.0"/><path d="M 240.0,412.0 L 240.0,405.0" fill="none" stroke="#6b6357" stroke-width="2.4" stroke-linecap="round" opacity="1.0"/><text x="258" y="384" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.5" fill="#5a8a5a" text-anchor="start" opacity="1.0" font-weight="bold">第 2 轮：P1 互逆消除（%c 的 (1,2,0) == inv(%t2 的 (2,0,1))）</text><text x="258" y="402" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.5" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">replace_all_uses(%c, %in) → 两个旧 op 一起删</text><path d="M 40.0,416.0 L 174.3,416.3 L 306.7,415.3 L 439.0,415.4 L 574.0,416.8 L 706.4,415.2 L 840.0,416.0 L 840.0,416.0 L 839.3,428.8 L 839.3,