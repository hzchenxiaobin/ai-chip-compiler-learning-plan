<text x="40" y="61" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12" fill="#84796a" text-anchor="start" opacity="1.0" font-weight="normal">第 5.5 节：混合链只改 %c = cast %t2 的类型对（f32→f32 改成 f32→f16），其余不动 ｜ 两个终点均为本机实测</text>
