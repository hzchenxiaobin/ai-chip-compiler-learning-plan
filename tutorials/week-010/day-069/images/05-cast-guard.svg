<text x="60" y="398" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="13" fill="#4a7fa5" text-anchor="start" opacity="1.0" font-weight="bold">两个终点的共同点与差别（本机实测）</text>
<text x="60" y="424" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11.5" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">共同点：融合都发生；数值都与改写前逐位相等（3 组随机输入）——f16 截断是改写前后共有的真实语义</text>
<text x="60" y="448" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11.5" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">差别：A 的 cast 是真无操作（f32→f32），删掉不改变语义 → 4 op；B 的 cast 带精度语义（f32→f16），必须留下 → 5 op</text>
<text x="60" y="472" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11.5" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">对照结论：消除规则的守卫是语义边界——Day 67「类型完全一致才动手」的裁决在组合管道里原样兑现</text>
<text x="60" y="500" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11" fill="#84796a" text-anchor="start" opacity="1.0" font-weight="normal">同节的顺序小实验：fuse 挪到列表第一位 → 终点不变（合流）；push 挪到第一位 → 换终点（竞争）</text>
