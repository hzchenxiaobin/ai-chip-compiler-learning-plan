<text x="766" y="158" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">%2  = arg  ; (2,3)</text>
