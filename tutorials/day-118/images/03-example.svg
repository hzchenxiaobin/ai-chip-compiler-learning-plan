<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="690" viewBox="0 0 1080 690"><rect x="4" y="4" width="1072" height="682" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="36" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">调用现场解剖：一次 _mlir_ciface_gemm 调用的数据流</text><path d="M 60.6,71.2 Q 225.1,70.9 391.1,69.9 Q 390.3,218.4 389.5,368.8 Q 226.1,371.7 61.3,370.8 Q 59.9,220.4 60.6,71.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.4"/><text x="225" y="96" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">调用方（driver.c / ctypes / jit_main.ll）</text><text x="225" y="124" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">float A[24] = {0.5,-1,2,...};   // 栈/全局数据</text><text x="225" y="148" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">desc_t da = {A, A, 0, {4,6}, {6,1}};</text><text x="225" y="172" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">desc_t db = {B, B, 0, {6,3}, {3,1}};</text><text x="225" y="196" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">desc_t dc = {0,0,0, {4,3},{3,1}};  // alloc 留空</text><text x="225" y="220" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle"></text><text x="225" y="244" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">  ↓ 按 C 合同传三个指针 ↓</text><text x="225" y="268" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">_mlir_ciface_gemm(&amp;dc, &amp;da, &amp;db);</text><text x="225" y="292" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle"></text><text x="225" y="316" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">  ↑ 包装把返回描述符 store 回 dc ↑</text><text x="225" y="340" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">printf("%f", dc.alloc[1]);  // 24.50 ✓</text><path d="M 579.9,69.3 Q 801.1,67.3 1020.0,69.0 Q 1022.2,220.7 1020.6,369.4 Q 802.0,367.4 580.2,368.5 Q 581.3,217.5 579.9,69.3  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.4"/><text x="800" y="96" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">被调方（gemm-3.ll，D117 冻结）</text><text x="800" y="124" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">define @gemm(...) -&gt; {ptr,ptr,i64,[2xi64],[2xi64]} {</text><text x="800" y="148" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">  %29 = call ptr @malloc(48)      ← 债务①</text><text x="800" y="172" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">  ... 4×6×3 三重循环 fmul/fadd ...</text><text x="800" y="196" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">  store 到 %29（kernel 自己的缓冲区）</text><text x="800" y="220" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">  ret 描述符（含 %29）</text><text x="800" y="244" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">}</text><text x="800" y="268" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">define @_mlir_ciface_gemm(ptr %0, ptr %1, ptr %2) {</text><text x="800" y="292" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">  从 %1/%2 load 两个描述符 → 拆 7 字段</text><text x="800" y="316" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">  call @gemm(...) → 拿到新描述符</text><text x="800" y="340" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">  store 新描述符到 %0（sret 语义）  ← 结果出口</text><text x="800" y="364" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">}</text><path d="M 394.7,208.9 Q 483.5,211.7 575.0,210.0 M 561.5,212.1 L 575.0,210.0 L 561.5,207.9" stroke="#3B3B3B" stroke-width="2.0" stroke-linecap="round" fill="none"/><text x="485.0" y="202.0" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">三个 desc 指针（56B×3）</text><path d="M 575.4,280.0 Q 486.9,281.3 395.0,280.0 M 408.5,277.9 L 395.0,280.0 L 408.5,282.1" stroke="#3B3B3B" stroke-width="2.0" stroke-linecap="round" fill="none"/><text x="485.0" y="272.0" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">sret：把结果 desc 写回 *out</text><path d="M 60.7,398.7 Q 290.9,397.0 520.7,398.9 Q 521.5,463.5 519.6,530.2 Q 289.6,531.3 61.0,529.4 Q 58.8,463.3 60.7,398.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.35"/><text x="290" y="426" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">常见误区（TP5 实测复现）</text><text x="80" y="450" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="start">× 以为 kernel 会写调用方给的 C 数组</text><text x="80" y="472" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#6b6257" text-anchor="start">  实测：C[0..11] 全 0（kernel 从未写过）</text><text x="80" y="494" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="start">  正确：结果在 dc.alloc 指向的 malloc 缓冲区</text><text x="80" y="516" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">  （driver_wrong.c 存档：wrong-result.txt）</text><path d="M 560.6,399.0 Q 791.7,400.2 1018.6,398.7 Q 1018.8,464.6 1019.9,528.5 Q 788.7,531.1 560.8,531.2 Q 560.5,466.1 560.6,399.0  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.75"/><text x="790" y="426" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">malloc 债务（今天挂账，D131 结清）</text><text x="580" y="450" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="start">· @gemm 每次 malloc 48B，从不 free</text><text x="580" y="472" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="start">· 教学规模（12 点）无所谓；真实推理服务</text><text x="580" y="494" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="start">  每秒百万次调用＝48MB/s 泄漏——必须上分配器/池</text><text x="580" y="516" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#6b6257" text-anchor="start">· Runtime 的第一项职责由此产生（D131 内存分配与复用）</text><path d="M 59.0,560.1 Q 539.6,559.3 1021.6,560.6 Q 1020.3,611.2 1020.1,658.8 Q 539.3,660.4 61.4,660.8 Q 59.7,611.7 59.0,560.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.3"/><text x="540.0" y="586" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">验证口径（三层都在场）</text><text x="540.0" y="610" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle">契约层：desc 56B 布局与 D115 教学口径逐字段一致（alloc/aligned/off/sh/st）</text><text x="540.0" y="632" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle">数值层：12/12 点与 numpy golden bitwise 一致（四条路线都过）</text><text x="540.0" y="654" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle">交叉层：JIT 输出与 AOT 输出逐行 diff 一致（TP3）；同进程两轮调用一致（TP2）</text></svg>
