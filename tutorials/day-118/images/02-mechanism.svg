<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720"><rect x="4" y="4" width="1072" height="712" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="36" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">JIT 与 AOT：同一份 .ll，两种「编译时机」</text><path d="M 408.8,56.8 Q 537.8,55.7 670.8,57.1 Q 669.6,81.9 670.2,110.4 Q 539.5,110.9 410.6,109.4 Q 411.3,84.4 408.8,56.8  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.55"/><text x="540.0" y="80" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">gemm-3.ll（D117 冻结）</text><text x="540.0" y="100" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">LLVM IR 文本 · 2 define · sret 三指针包装</text><path d="M 441.4,110.6 Q 350.5,139.0 260.0,170.0 M 272.2,163.8 L 260.0,170.0 L 273.5,167.9" stroke="#3B3B3B" stroke-width="2.0" stroke-linecap="round" fill="none"/><text x="350.0" y="133.0" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">编译期（离线）</text><path d="M 640.5,110.5 Q 731.2,141.2 820.0,170.0 M 806.5,167.9 L 820.0,170.0 L 807.8,163.8" stroke="#3B3B3B" stroke-width="2.0" stroke-linecap="round" fill="none"/><text x="730.0" y="133.0" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">运行期（在线）</text><path d="M 70.1,178.4 Q 269.5,179.6 470.1,177.0 Q 470.0,300.6 470.1,427.2 Q 267.5,425.3 68.7,427.3 Q 71.1,301.8 70.1,178.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.35"/><text x="270" y="204" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="14" fi