<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 810" width="1240" height="810"><rect x="3" y="3" width="1234" height="804" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="30" y="44" text-anchor="start" font-size="25" fill="#3b3b3b">iter_args：循环携带值的解剖——零起点怎么进循环、部分和怎么出来</text><text x="30" y="70" text-anchor="start" font-size="14.5" fill="#6b6459">scf.for 的 iter_args(%acc = %zero) -&gt; (f32) ＋ scf.yield 的回传；体内 %acc ≠ 体外 %acc</text><path d="M 28.9,80.8 Q 618.7,83.0 1209.8,82.2" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M 41.2,105.3 Q 390.9,103.6 739.1,103.1 M 740.4,103.1 Q 738.7,305.0 739.2,504.4 M 741.2,504.1 Q 389.5,503.3 40.7,504.1 M 38.7,504.1 Q 39.1,305.0 39.4,104.1 Z" fill="white" stroke="#5f8fcb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="130" text-anchor="start" font-size="14.5" fill="#3b3b3b">数据流：%zero → 循环 → %acc（今天的占位 vs Day 88 的完整）</text><path d="M 71.2,152.0 Q 144.3,152.6 219.1,151.7 M 221.2,152.4 Q 220.4,175.1 219.4,198.3 M 218.7,198.8 Q 144.0,197.7 69.2,197.9 M 70.3,198.6 Q 70.2,175.3 71.2,151.7 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="145" y="180" text-anchor="middle" font-size="13" fill="#3b3b3b">%zero = 0.0</text><path d="M 221.0,175.3 Q 257.9,176.3 292.6,174.9" fill="none" stroke="#79b26a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 292.6,174.9 Q 285.6,177.6 280.1,180.4" fill="none" stroke="#79b26a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 292.2,175.3 Q 286.9,171.8 279.7,169.6" fill="none" stroke="#79b26a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="257" y="163" text-anchor="middle" font-size="11.5" fill="#79b26a">初值</text><path d="M 296.2,145.4 Q 416.3,146.1 535.5,145.8 M 535.1,144.8 Q 535.9,305.3 535.9,465.7 M 535.7,465.5 Q 416.0,465.0 295.6,465.5 M 295.7,465.1 Q 296.7,305.5 296.7,145.3 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="416" y="170" text-anchor="middle" font-size="12.5" fill="#3b3b3b">scf.for %k = %c0 to %c6</text><text x="416" y="190" text-anchor="middle" font-size="12.5" fill="#3b3b3b">iter_args(%acc = %zero)</text><text x="416" y="210" text-anchor="middle" font-size="12.5" fill="#3b3b3b">-&gt; (f32)</text><path d="M 313.2,226.3 Q 416.0,226.6 519.4,225.1 M 520.9,226.6 Q 519.7,258.5 518.9,292.1 M 520.3,290.7 Q 416.8,291.1 311.3,292.4 M 312.8,291.7 Q 311.0,259.8 311.0,225.9 Z" fill="white" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="322" y="248" text-anchor="start" font-size="10.8" fill="#3b3b3b">k=0：体内 %acc ← 0.0</text><text x="322" y="263" text-anchor="start" font-size="10.8" fill="#3b3b3b">  今天：yield %zero（占位）</text><text x="322" y="278" text-anchor="start" font-size="10.8" fill="#3b3b3b">  D88：yield %s=addf(%acc,%p)</text><path d="M 417.0,290.8 Q 414.9,302.7 415.1,311.0" fill="none" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 415.4,312.5 Q 409.8,313.9 403.3,316.3" fill="none" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 416.0,312.6 Q 411.3,308.3 405.0,304.7" fill="none" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 313.3,315.5 Q 415.5,317.2 520.8,315.6 M 519.5,316.2 Q 519.0,349.9 519.2,382.0 M 519.2,382.5 Q 415.5,383.3 311.3,381.9 M 312.5,380.8 Q 312.2,348.4 312.1,316.9 Z" fill="white" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="322" y="338" text-anchor="start" font-size="10.8" fill="#3b3b3b">k=1：体内 %acc ← 上次 yield</text><text x="322" y="353" text-anchor="start" font-size="10.8" fill="#3b3b3b">  今天：还是 %zero（恒等）</text><text x="322" y="368" text-anchor="start" font-size="10.8" fill="#3b3b3b">  D88：新的部分和</text><text x="416" y="400" text-anchor="middle" font-size="11" fill="#6b6459">…k=5 后循环结束…</text><text x="416" y="434" text-anchor="middle" font-size="11" fill="#5f8fcb">零次迭代（ub==lb）→ 结果 = 初值</text><path d="M 539.0,174.5 Q 574.3,174.2 608.5,174.1" fill="none" stroke="#5f8fcb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 607.6,175.1 Q 601.9,178.3 596.1,181.0" fill="none" stroke="#5f8fcb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 607.9,175.5 Q 601.5,171.8 596.6,169.3" fill="none" stroke="#5f8fcb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="573" y="163" text-anchor="middle" font-size="11.5" fill="#5f8fcb">结果</text><path d="M 612.8,153.0 Q 666.8,152.5 722.9,153.0 M 721.1,150.8 Q 722.9,174.2 723.1,198.4 M 721.2,199.2 Q 666.5,198.0 611.6,196.8 M 611.2,199.3 Q 612.9,175.8 613.2,151.1 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="667" y="180" text-anchor="middle" font-size="13" fill="#3b3b3b">%acc</text><path d="M 69.6,239.2 Q 170.2,239.7 270.2,239.1 M 268.7,241.1 Q 270.9,304.2 270.1,370.7 M 270.9,369.9 Q 169.4,370.6 68.7,369.8 M 69.0,370.0 Q 69.6,305.7 70.4,239.0 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="82" y="262" text-anchor="start" font-size="12" fill="#e8973f">两个 %acc，同名不同值！</text><text x="82" y="284" text-anchor="start" font-size="10.8" fill="#3b3b3b">体内 %acc：iter_args 的</text><text x="82" y="299" text-anchor="start" font-size="10.8" fill="#3b3b3b">区域参数——每次迭代</text><text x="82" y="314" text-anchor="start" font-size="10.8" fill="#3b3b3b">重新绑定（上次 yield）</text><text x="82" y="329" text-anchor="start" font-size="10.8" fill="#3b3b3b"></text><text x="82" y="344" text-anchor="start" font-size="10.8" fill="#3b3b3b">体外 %acc：循环结果——</text><text x="82" y="359" text-anchor="start" font-size="10.8" fill="#3b3b3b">最后一次 yield 的值</text><path d="M 270.0,370.0 Q 330.0,400.0 416.0,380.0" fill="none" stroke="#e8973f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 416.3,379.6 Q 411.5,383.6 405.4,388.6" fill="none" stroke="#e8973f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 416.1,379.7 Q 409.2,378.1 403.2,377.6" fill="none" stroke="#e8973f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="396" text-anchor="start" font-size="11.8" fill="#3b3b3b">SSA 不许「循环里改一个变量」，iter_args/yield 就是它给</text><text x="70" y="413" text-anchor="start" font-size="11.8" fill="#3b3b3b">「循环携带状态」开的显式通道：初值进门、新值回传、</text><text x="70" y="430" text-anchor="start" font-size="11.8" fill="#3b3b3b">终值出门——全程没有内存，全在值的世界里。</text><path d="M 769.6,103.4 Q 984.7,104.0 1199.5,102.9 M 1198.9,104.9 Q 1199.4,305.3 1200.7,502.9 M 1200.6,504.0 Q 985.0,503.3 769.5,502.8 M 770.6,504.6 Q 770.6,302.9 771.0,105.1 Z" fill="white" stroke="#d96c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="786" y="130" text-anchor="start" font-size="14.5" fill="#d96c5c">动态维度的保守路径（IT4 实测）</text><path d="M 785.0,148.8 Q 881.1,148.4 977.0,148.3 M 976.7,147.5 Q 975.3,198.7 975.3,247.4 M 975.1,248.1 Q 881.9,247.5 785.5,249.1 M 785.7,247.5 Q 786.9,197.0 787.2,149.2 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="798" y="170" text-anchor="start" font-size="12.5" fill="#79b26a">静态 shape（今天）</text><text x="798" y="192" text-anchor="start" font-size="11" fill="#3b3b3b">A(4,6) @ B(6,3)</text><text x="798" y="207" text-anchor="start" font-size="11" fill="#3b3b3b">边界/类型编译期全知：</text><text x="798" y="222" text-anchor="start" font-size="11" fill="#3b3b3b">%c4/%c3/%c6 常量＋</text><text x="798" y="237" text-anchor="start" font-size="11" fill="#3b3b3b">alloc 4x3 定型</text><path d="M 995.0,148.9 Q 1087.7,146.7 1184.4,147.6 M 1184.3,148.2 Q 1183.3,198.6 1183.3,247.5 M 1183.7,248.5 Q 1088.6,247.5 995.2,248.4 M 994.9,249.2 Q 993.4,198.9 992.9,148.1 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="1006" y="170" text-anchor="start" font-size="12.5" fill="#d96c5c">动态 '?'（保守拒绝）</text><text x="1006" y="192" text-anchor="start" font-size="11" fill="#3b3b3b">A(?x6) @ B(6,3)</text><text x="1006" y="207" text-anchor="start" font-size="11" fill="#3b3b3b">M 编译期未知：alloc 类型</text><text x="1006" y="222" text-anchor="start" font-size="11" fill="#3b3b3b">写不出、%cM 无从产生</text><text x="1006" y="237" text-anchor="start" font-size="11" fill="#3b3b3b">→ 宁拒不猜</text><text x="786" y="276" text-anchor="start" font-size="11" fill="#3b3b3b">签名转换不拦：tensor&lt;?x6&gt; → memref&lt;?x6, strided&lt;[6,1]&gt;&gt;</text><text x="786" y="293" text-anchor="start" font-size="11" fill="#3b3b3b">（strides 仍可知）；拦截发生在 Pattern 的 match：</text><text x="786" y="310" text-anchor="start" font-size="11" fill="#3b3b3b"></text><text x="786" y="327" text-anchor="start" font-size="11" fill="#3b3b3b">  } -&gt; FAILURE : 动态维度（A('?', 6) @ B(6, 3)）：</text><text x="786" y="344" text-anchor="start" font-size="11" fill="#3b3b3b">    alloc 类型与循环边界无法编译期确定，本 Pattern</text><text x="786" y="361" text-anchor="start" font-size="11" fill="#3b3b3b">    只接静态 shape——保守路径，宁拒不猜</text><path d="M 786.0,387.5 Q 986.1,387.7 1184.2,388.7 M 1183.4,388.3 Q 1185.1,435.7 1183.9,484.4 M 1185.0,484.2 Q 985.4,484.3 786.5,484.6 M 786.4,483.1 Q 786.4,435.2 785.6,389.2 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="798" y="410" text-anchor="start" font-size="11" fill="#3b3b3b">full：整体失败（点名 mini.matmul）；partial：显式残留，</text><text x="798" y="426" text-anchor="start" font-size="11" fill="#3b3b3b">交给后续 Pass。</text><text x="798" y="442" text-anchor="start" font-size="11" fill="#3b3b3b">真实编译器的分工：动态版 Pattern 用 memref.dim ＋</text><text x="798" y="458" text-anchor="start" font-size="11" fill="#3b3b3b">动态 alloc；静态版专走常量快路径——拒绝也是调度手段。</text><path d="M 40.6,529.8 Q 620.7,529.9 1200.3,530.6 M 1200.2,530.5 Q 1200.3,582.6 1200.7,637.2 M 1199.2,636.4 Q 621.0,635.6 38.9,637.3 M 40.5,637.0 Q 39.7,581.7 40.7,529.2 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="558" text-anchor="start" font-size="14.5" fill="#79b26a">今天 Pattern 产出的关键段（init-ir.txt）</text><text x="58" y="582" text-anchor="start" font-size="12" fill="#3b3b3b">%zero = arith.constant 0.0 : f32                        ← 任务③ 1/2：零起点是 SSA 值</text><text x="58" y="601" text-anchor="start" font-size="12" fill="#3b3b3b">%acc = scf.for %k = %c0 to %c6 step %c1</text><text x="58" y="620" text-anchor="start" font-size="12" fill="#3b3b3b">        iter_args(%acc = %zero) -&gt; (f32) {              ← 任务③ 2/2：累加器初值挂上循环</text><text x="58" y="639" text-anchor="start" font-size="12" fill="#3b3b3b">  scf.yield %zero : f32                                  ← 占位：恒等循环；D88 换成 yield %s</text></g></svg>