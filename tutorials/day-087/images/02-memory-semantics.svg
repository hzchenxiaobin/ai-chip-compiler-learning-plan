<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 830" width="1240" height="830"><rect x="3" y="3" width="1234" height="824" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="30" y="44" text-anchor="start" font-size="25" fill="#3b3b3b">内存语义：alloc 不清零，零起点必须显式——三种初始化策略的内存轨迹</text><text x="30" y="70" text-anchor="start" font-size="14.5" fill="#6b6459">tensor 世界里每个值都有定义；memref 世界里 alloc 只给地址不给值（malloc ≠ calloc）</text><path d="M 31.0,81.0 Q 619.7,82.1 1211.2,83.0" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M 38.9,105.0 Q 319.8,104.3 599.8,103.3 M 599.5,104.1 Q 600.5,209.3 599.4,314.7 M 599.5,313.9 Q 319.3,315.0 39.7,313.2 M 39.3,315.0 Q 40.8,210.3 40.8,104.8 Z" fill="white" stroke="#6b6459" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="130" text-anchor="start" font-size="15" fill="#3b3b3b">两个世界：值有定义 vs 位置有垃圾</text><path d="M 55.5,146.0 Q 186.4,146.4 316.7,146.7 M 317.6,145.1 Q 318.4,189.1 316.7,233.2 M 318.9,234.0 Q 187.6,235.1 57.1,234.5 M 56.6,234.8 Q 56.2,190.6 56.5,145.3 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="168" text-anchor="start" font-size="13" fill="#79b26a">tensor 世界（Day 83 前）</text><text x="68" y="190" text-anchor="start" font-size="11.5" fill="#3b3b3b">%mm = mini.matmul(%x, %w)</text><text x="68" y="207" text-anchor="start" font-size="11.5" fill="#3b3b3b">——每个值都有定义：</text><text x="68" y="224" text-anchor="start" font-size="11.5" fill="#3b3b3b">函数式，读了一定有语义</text><path d="M 334.9,146.6 Q 460.1,146.1 586.5,144.8 M 586.5,146.2 Q 586.0,189.9 586.0,233.6 M 586.7,235.0 Q 460.9,232.8 333.7,234.3 M 333.2,233.6 Q 334.3,190.0 335.2,145.3 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="346" y="168" text-anchor="start" font-size="13" fill="#d96c5c">memref 世界（Day 85 起）</text><text x="346" y="190" text-anchor="start" font-size="11.5" fill="#3b3b3b">%c = memref.alloc() : 4x3</text><text x="346" y="207" text-anchor="start" font-size="11.5" fill="#3b3b3b">——只给地址不给值：</text><text x="346" y="224" text-anchor="start" font-size="11.5" fill="#3b3b3b">48 B 里是「？」（垃圾）</text><text x="56" y="258" text-anchor="start" font-size="11.8" fill="#6b6459">类比：tensor 像「带出生证明的人」——名字背后必有来历；memref.alloc 像「毛坯房」——</text><text x="56" y="275" text-anchor="start" font-size="11.8" fill="#6b6459">钥匙给你了，屋里有什么没人知道。对应到技术上是：SSA 值由 op 定义；</text><text x="56" y="292" text-anchor="start" font-size="11.8" fill="#6b6459">内存位置由 alloc 分配，内容未定义（除非被 fill/store 写过）。</text><path d="M 630.8,105.3 Q 914.8,103.6 1199.8,105.2 M 1200.6,103.7 Q 1198.9,207.9 1200.5,313.5 M 1198.9,313.0 Q 916.2,314.5 629.5,314.7 M 630.4,313.2 Q 629.0,208.9 630.2,103.6 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="646" y="130" text-anchor="start" font-size="15" fill="#3b3b3b">%c 的 48 B（alloc 之后、初始化之前）</text><path d="M 645.3,147.7 Q 672.0,147.4 698.3,147.3 M 698.1,148.0 Q 698.1,167.3 697.5,188.5 M 697.5,188.7 Q 672.6,188.2 646.1,187.7 M 646.1,188.6 Q 645.2,168.4 646.4,147.6 Z" fill="white" stroke="#d96c5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="672.0" y="174" text-anchor="middle" font-size="17" fill="#d96c5c">?</text><text x="650" y="161" text-anchor="start" font-size="8.5" fill="#6b6459">777</text><path d="M 703.9,148.1 Q 730.4,147.6 755.6,147.4 M 756.5,147.5 Q 755.4,168.6 755.9,187.5 M 755.4,187.3 Q 729.7,187.7 703.2,188.5 M 703.6,187.8 Q 703.3,167.4 703.2,147.5 Z" fill="white" stroke="#d96c5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="730.0" y="174" text-anchor="middle" font-size="17" fill="#d96c5c">?</text><text x="708" y="161" text-anchor="start" font-size="8.5" fill="#6b6459">784</text><path d="M 761.4,148.4 Q 788.2,148.2 814.3,148.4 M 814.0,148.1 Q 813.4,168.3 814.0,187.4 M 813.9,187.4 Q 788.5,188.2 761.8,187.7 M 761.8,188.3 Q 762.7,168.3 762.6,148.7 Z" fill="white" stroke="#d96c5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="788.0" y="174" text-anchor="middle" font-size="17" fill="#d96c5c">?</text><text x="766" y="161" text-anchor="start" font-size="8.5" fill="#6b6459">791</text><path d="M 820.2,148.2 Q 845.4,147.2 872.8,148.1 M 871.2,148.4 Q 871.5,167.6 871.6,188.3 M 871.7,187.9 Q 846.7,187.8 819.3,188.0 M 819.6,188.7 Q 820.2,168.2 819.8,147.8 Z" fill="white" stroke="#d96c5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="846.0" y="174" text-anchor="middle" font-size="17" fill="#d96c5c">?</text><text x="824" y="161" text-anchor="start" font-size="8.5" fill="#6b6459">798</text><path d="M 646.3,193.4 Q 671.7,194.1 698.8,193.5 M 698.5,194.5 Q 698.1,213.4 698.3,234.1 M 698.7,233.2 Q 672.0,234.4 645.9,234.1 M 646.3,233.9 Q 646.6,214.0 646.0,194.7 Z" fill="white" stroke="#d96c5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="672.0" y="220" text-anchor="middle" font-size="17" fill="#d96c5c">?</text><text x="650" y="207" text-anchor="start" font-size="8.5" fill="#6b6459">805</text><path d="M 703.3,193.7 Q 730.0,194.2 755.7,193.5 M 756.5,193.5 Q 755.2,213.2 755.6,233.5 M 756.8,233.9 Q 729.5,233.9 704.3,233.7 M 703.6,234.5 Q 703.8,214.5 704.2,194.4 Z" fill="white" stroke="#d96c5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="730.0" y="220" text-anchor="middle" font-size="17" fill="#d96c5c">?</text><text x="708" y="207" text-anchor="start" font-size="8.5" fill="#6b6459">812</text><path d="M 762.3,193.3 Q 788.0,193.4 814.0,193.7 M 814.5,193.6 Q 814.4,213.6 813.5,233.7 M 813.7,233.4 Q 787.3,234.1 762.8,233.9 M 761.7,234.0 Q 762.3,214.6 762.6,194.1 Z" fill="white" stroke="#d96c5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="788.0" y="220" text-anchor="middle" font-size="17" fill="#d96c5c">?</text><text x="766" y="207" text-anchor="start" font-size="8.5" fill="#6b6459">819</text><path d="M 819.4,193.8 Q 846.6,194.1 871.2,194.7 M 871.9,193.8 Q 872.0,214.5 872.5,234.4 M 872.7,233.4 Q 845.2,233.8 820.2,234.7 M 819.3,234.5 Q 819.7,214.4 820.5,194.5 Z" fill="white" stroke="#d96c5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="846.0" y="220" text-anchor="middle" font-size="17" fill="#d96c5c">?</text><text x="824" y="207" text-anchor="start" font-size="8.5" fill="#6b6459">826</text><path d="M 645.9,240.0 Q 672.0,239.6 698.7,240.3 M 697.3,239.8 Q 697.9,260.0 698.3,280.7 M 698.2,280.2 Q 672.7,280.6 646.5,279.5 M 645.5,279.6 Q 645.9,259.3 646.5,239.9 Z" fill="white" stroke="#d96c5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="672.0" y="266" text-anchor="middle" font-size="17" fill="#d96c5c">?</text><text x="650" y="253" text-anchor="start" font-size="8.5" fill="#6b6459">833</text><path d="M 703.3,239.5 Q 730.5,240.8 756.2,240.3 M 755.5,240.4 Q 756.6,260.4 756.6,280.6 M 756.4,279.3 Q 730.1,279.9 704.3,279.5 M 703.9,280.2 Q 703.5,259.7 703.3,239.9 Z" fill="white" stroke="#d96c5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="730.0" y="266" text-anchor="middle" font-size="17" fill="#d96c5c">?</text><text x="708" y="253" text-anchor="start" font-size="8.5" fill="#6b6459">840</text><path d="M 762.6,240.2 Q 788.3,240.1 813.8,240.1 M 813.7,240.5 Q 813.5,259.8 814.0,280.7 M 814.0,280.2 Q 787.3,279.2 761.6,280.6 M 761.3,279.3 Q 761.6,260.4 762.4,239.7 Z" fill="white" stroke="#d96c5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="788.0" y="266" text-anchor="middle" font-size="17" fill="#d96c5c">?</text><text x="766" y="253" text-anchor="start" font-size="8.5" fill="#6b6459">847</text><path d="M 820.2,240.2 Q 846.7,240.7 871.6,239.8 M 871.2,240.7 Q 871.6,260.7 871.5,280.3 M 872.6,279.9 Q 845.9,280.6 819.5,280.4 M 819.7,280.6 Q 820.0,260.4 820.2,240.7 Z" fill="white" stroke="#d96c5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="846.0" y="266" text-anchor="middle" font-size="17" fill="#d96c5c">?</text><text x="824" y="253" text-anchor="start" font-size="8.5" fill="#6b6459">854</text><text x="905" y="168" text-anchor="start" font-size="11.8" fill="#3b3b3b">垃圾值（仿真，确定性）：</text><text x="905" y="187" text-anchor="start" font-size="11.8" fill="#3b3b3b">garbage(addr)</text><text x="905" y="206" text-anchor="start" font-size="11.8" fill="#3b3b3b">  = 777 + 7·addr</text><text x="905" y="225" text-anchor="start" font-size="11.8" fill="#3b3b3b">真实语义＝未定义行为</text><text x="905" y="244" text-anchor="start" font-size="11.8" fill="#3b3b3b"></text><text x="905" y="263" text-anchor="start" font-size="11.8" fill="#3b3b3b">alloc ＝ malloc ≠ calloc</text><text x="905" y="282" text-anchor="start" font-size="11.8" fill="#3b3b3b">想清零？必须显式 ↓</text><text x="40" y="344" text-anchor="start" font-size="15" fill="#6b6459">三种初始化策略的内存轨迹（IT3 实测，A(4,6)@B(6,3)）</text><path d="M 39.9,362.1 Q 389.4,361.0 739.1,362.6 M 740.7,362.8 Q 740.8,421.1 738.7,479.8 M 740.5,480.5 Q 389.7,479.1 40.5,479.4 M 39.1,479.6 Q 40.4,420.9 39.8,363.2 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="388" text-anchor="start" font-size="14.5" fill="#79b26a">方案 B（选定）</text><text x="56" y="412" text-anchor="start" font-size="12" fill="#3b3b3b">%zero = 0.0（SSA 常量）</text><text x="56" y="431" text-anchor="start" font-size="12" fill="#3b3b3b">iter_args(%acc = %zero)</text><text x="56" y="450" text-anchor="start" font-size="12" fill="#3b3b3b">C：零读 · 零 fill · 每元素只写 1 次</text><text x="56" y="468" text-anchor="start" font-size="12" fill="#79b26a">实测：未初始化读 0 次 · 位等价 · ＋0 B</text><path d="M 40.6,490.8 Q 390.4,491.4 739.4,492.6 M 739.4,493.0 Q 739.5,551.6 740.5,609.7 M 741.1,609.1 Q 390.1,610.6 40.1,609.3 M 39.7,610.6 Q 40.4,551.6 38.8,492.6 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="518" text-anchor="start" font-size="14.5" fill="#5f8fcb">方案 A（fill）</text><text x="56" y="542" text-anchor="start" font-size="12" fill="#3b3b3b">memref.fill %zero, %c（12 格写 0）</text><text x="56" y="561" text-anchor="start" font-size="12" fill="#3b3b3b">初值 = load C[i,j]（读 fill 过的 0）</text><text x="56" y="580" text-anchor="start" font-size="12" fill="#3b3b3b">C：1 fill · 1 读 · 1 写</text><text x="56" y="598" text-anchor="start" font-size="12" fill="#5f8fcb">实测：未初始化读 0 次 · 位等价 · ＋96 B</text><path d="M 39.5,622.3 Q 389.4,622.8 739.1,622.7 M 740.3,621.2 Q 739.4,681.1 741.2,738.8 M 740.4,740.5 Q 390.5,739.5 39.1,739.7 M 39.7,739.7 Q 39.2,679.8 38.8,622.1 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="648" text-anchor="start" font-size="14.5" fill="#d96c5c">什么都不做</text><text x="56" y="672" text-anchor="start" font-size="12" fill="#3b3b3b">没有 fill，也没有 %zero</text><text x="56" y="691" text-anchor="start" font-size="12" fill="#3b3b3b">初值 = load C[i,j]（读垃圾 777…）</text><text x="56" y="710" text-anchor="start" font-size="12" fill="#3b3b3b">C：未初始化读 ×12 · 结果被污染</text><text x="56" y="728" text-anchor="start" font-size="12" fill="#d96c5c">实测：未初始化读 12 次 · max|diff| = 8.5e+02</text><path d="M 769.1,361.1 Q 985.6,361.9 1198.9,363.1 M 1200.7,363.2 Q 1200.2,545.6 1201.0,731.0 M 1201.3,729.6 Q 983.8,730.2 770.2,730.4 M 769.1,730.3 Q 769.2,545.4 770.9,361.6 Z" fill="white" stroke="#e8973f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="786" y="388" text-anchor="start" font-size="13.5" fill="#3b3b3b">三策略的差别只有一个：iter_args 初值来自哪里</text><text x="786" y="416" text-anchor="start" font-size="12" fill="#3b3b3b">scf.for %k ... iter_args(%acc = ???)</text><text x="786" y="437" text-anchor="start" font-size="12" fill="#3b3b3b"></text><text x="786" y="458" text-anchor="start" font-size="12" fill="#3b3b3b">B   ：%zero        ← SSA 常量（零起点在「值」里）</text><text x="786" y="479" text-anchor="start" font-size="12" fill="#3b3b3b">A   ：load C[i,j]  ← 内存（fill 保证了 0.0）</text><text x="786" y="500" text-anchor="start" font-size="12" fill="#3b3b3b">none：load C[i,j]  ← 内存（没 fill——垃圾）</text><text x="786" y="530" text-anchor="start" font-size="11.8" fill="#6b6459">零起点放在哪里？</text><text x="786" y="548" text-anchor="start" font-size="11.8" fill="#6b6459">  · 放内存里 → 必须先写后读（fill 付 12 格写流量）</text><text x="786" y="566" text-anchor="start" font-size="11.8" fill="#6b6459">  · 放 SSA 值里 → C 只写不读，零起点白拿（方案 B 赢）</text><text x="786" y="584" text-anchor="start" font-size="11.8" fill="#6b6459"></text><text x="786" y="602" text-anchor="start" font-size="11.8" fill="#6b6459">Day 85 清单③的结论，今天在 IR 层逐位复现（IT3）。</text></g></svg>