<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="550" viewBox="0 0 1080 550"><rect x="4" y="4" width="1072" height="542" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">正反例的写作纪律：每例四要素</text><path d="M 58.8,61.5 Q 537.4,61.7 1019.9,60.5 Q 1019.0,106.2 1019.9,149.3 Q 540.1,148.9 59.9,151.5 Q 58.9,105.5 58.8,61.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.25"/><text x="100" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">① 输入</text><text x="400" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">构造最小触发条件</text><text x="100" y="116" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">例：「matmul(4x6, 2x3)」——不是「错误的图」</text><path d="M 58.6,158.9 Q 539.9,159.8 1021.4,160.6 Q 1022.1,203.1 1021.0,249.7 Q 539.0,251.6 61.0,250.4 Q 58.5,206.5 58.6,158.9  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.25"/><text x="100" y="186" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">② 期望行为</text><text x="400" y="186" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">通过什么/拒绝什么——精确到诊断码</text><text x="100" y="216" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">例：「闸0 拒绝：内维不匹配」不是「失败」</text><path d="M 60.7,260.6 Q 542.2,260.6 1019.9,258.6 Q 1019.3,305.9 1021.0,351.2 Q 541.2,350.6 61.5,348.7 Q 63.2,305.7 60.7,260.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.25"/><text x="100" y="286" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">③ 出处</text><text x="400" y="286" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">这个 case 从哪次真实踩坑来</text><text x="100" y="316" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">例：「D83 T01」——坑史可追溯</text><path d="M 59.0,358.4 Q 540.3,360.0 1019.4,359.2 Q 1018.5,404.5 1021.5,449.2 Q 541.1,451.5 61.0,449.6 Q 59.3,402.0 59.0,358.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.25"/><text x="100" y="386" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">④ 反例的边界</text><text x="400" y="386" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">拒收的理由要写成断言</text><text x="100" y="416" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">例：「K=6≠2」可 grep——不是「感觉不对」</text><path d="M 59.0,471.4 Q 539.1,469.7 1021.5,471.1 Q 1022.3,507.8 1019.0,541.0 Q 539.6,539.6 59.6,538.7 Q 60.6,504.8 59.0,471.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.8"/><text x="540.0" y="496" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">四要素齐全的测试才能「失败时告诉你答案」——缺出处的测试是孤儿（改语义时没人敢动它）</text><text x="540.0" y="518" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">明天的随机 Shape 测试（D135）会把这层基座扩大一个数量级——随机是手工正反例的放大器</text></svg>
