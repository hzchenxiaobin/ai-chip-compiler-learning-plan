<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="490" viewBox="0 0 1080 490"><rect x="4" y="4" width="1072" height="482" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">基线的口径设计：每项都有理由</text><path d="M 59.8,61.1 Q 279.8,61.1 501.4,60.4 Q 499.4,133.7 499.4,210.2 Q 280.8,212.4 61.3,211.6 Q 62.7,137.7 59.8,61.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.3"/><text x="280" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">shape 160³</text><text x="280" y="114" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">计算量 2×160³=8.2 MFLOP——</text><text x="280" y="136" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">足够慢到可测（&gt;10ms），</text><text x="280" y="158" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">又不至于每轮等太久</text><path d="M 539.7,61.0 Q 761.2,60.1 980.1,58.7 Q 979.7,133.1 981.6,209.0 Q 759.9,206.8 539.6,208.8 Q 538.8,135.5 539.7,61.0  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.3"/><text x="760" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">朴素＋O0</text><text x="760" y="114" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">保留三重循环的原始形态——</text><text x="760" y="136" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">优化空间最大化；</text><text x="760" y="158" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">O2 版已有（D125 的 3.4 GFLOPS）</text><path d="M 60.9,231.0 Q 280.3,230.9 498.5,231.0 Q 497.9,305.9 501.0,378.6 Q 279.3,380.2 59.7,379.9 Q 58.5,304.9 60.9,231.0  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.3"/><text x="280" y="258" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">7 轮×3 次</text><text x="280" y="284" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">外层中位数抗轮级噪声；</text><text x="280" y="306" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">内层均值压调用级波动——</text><text x="280" y="328" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">D138 的两层统计口径</text><path d="M 541.5,229.7 Q 758.2,228.7 979.1,230.5 Q 980.8,303.7 981.5,379.5 Q 758.9,378.4 538.7,378.8 Q 541.4,304.0 541.5,229.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.3"/><text x="760" y="258" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">GFLOPS 口径</text><text x="760" y="284" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">FLOP=2MNK（乘加各一）；</text><text x="760" y="306" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">跨 shape 可比（时间不可比</text><text x="760" y="328" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">——shape 不同计算量不同）</text><path d="M 58.6,408.6 Q 541.3,408.5 1020.9,408.9 Q 1018.9,440.7 1018.9,474.7 Q 538.8,476.0 58.9,476.7 Q 58.6,440.9 58.6,408.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.85"/><text x="540.0" y="436" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">基线的本质：不是「一个数字」而是「一个可复现的测量协议」——</text><text x="540.0" y="458" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">shape/kernel/编译配置/口径/环境五要素齐备，任何人任何时候重跑都能得到同一个数（±噪声）</text></svg>
