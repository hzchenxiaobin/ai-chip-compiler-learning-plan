2" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">瓶颈→假设→优化→验证→</text><text x="420" y="586" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle">闭环报告</text><text x="700" y="578" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">范围的完整链条</text><path d="M 60.0,649.1 Q 538.8,648.7 1021.1,648.5 Q 1020.5,676.2 1018.6,706.2 Q 540.8,706.5 59.9,707.3 Q 62.2,676.3 60.0,649.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.85"/><text x="540.0" y="674" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">归因的方法论：每一步都从上一步的结论出发——基线定义问题、分解找嫌疑、Roofline 定性质、</text><text x="540.0" y="694" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">优化验证假设、跨 Shape 界定范围、反例诚实边界——没有一步是「感觉应该」</text></svg>
