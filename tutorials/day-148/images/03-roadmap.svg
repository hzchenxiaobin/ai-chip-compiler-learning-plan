<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720"><rect x="4" y="4" width="1072" height="712" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">第 22 周的归因路线：从基线到反例</text><path d="M 60.2,60.4 Q 539.5,59.3 1020.5,61.6 Q 1020.7,96.4 1018.9,129.0 Q 540.1,129.8 61.5,130.5 Q 60.7,93.9 60.2,60.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.28"/><text x="130" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">D148 今天</text><text x="130" y="110" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">问题定义：什么算慢、怎么复现</text><text x="420" y="94" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle">基线 20.9ms/0.39GF</text><path d="M 58.8,142.1 Q 540.1,139.7 1019.0,140.5 Q 1018.9,174.3 1020.1,210.8 Q 539.7,212.6 60.3,213.5 Q 60.0,179.6 58.8,142.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.28"/><text x="130" y="168" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">D149</text><text x="130" y="192" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">编译/搜索/launch/分配/执行</text><text x="420" y="176" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle">时间分解</text><text x="700" y="168" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">各占多少——主要开销在哪</text><path d="M 59.0,225.3 Q 537.9,223.0 1020.7,224.5 Q 1021.2,259.1 1019.0,292.5 Q 539.4,294.6 59.0,295.4 Q 57.6,258.3 59.0,225.3  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.28"/><text x="130" y="250" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">D150</text><text x="130" y="274" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">算术强度 vs 屋顶——</text><text x="420" y="258" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle">Roofline</text><text x="700" y="250" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">计算瓶颈还是访存瓶颈</text><path d="M 59.6,305.8 Q 541.0,305.9 1020.5,306.4 Q 1019.9,343.7 1020.4,376.8 Q 542.1,378.4 60.9,376.5 Q 60.9,339.9 59.6,305.8  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.28"/><text x="130" y="332" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">D151</text><text x="130" y="356" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">针对 D150 确认的瓶颈——</text><text x="420" y="340" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle">有依据优化</text><text x="700" y="332" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">不是随机试</text><path d="M 60.9,387.5 Q 542.3,389.6 1020.5,388.4 Q 1021.9,424.4 1020.4,458.9 Q 541.3,458.3 60.4,457.2 Q 58.6,423.1 60.9,387.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" 