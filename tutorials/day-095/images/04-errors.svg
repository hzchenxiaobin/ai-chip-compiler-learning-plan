<text x="40" y="61" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12" fill="#84796a" text-anchor="start" font-weight="normal">全部在本机用 ./tiled_matmul 5 7 3 2 4 2 --mode xxx 重演，数字来自 outputs/err-*.txt</text>
