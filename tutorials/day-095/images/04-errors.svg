<text x="90" y="358" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12.5" fill="#a8772e" text-anchor="start" font-weight="bold">错误 2：clamp-store——钳制“索引”而不是“边界”</text>
<text x="90" y="384" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.8" fill="#3b352d" text-anchor="start" font-weight="normal">现象：correct=yes（逐位相等！）但 inner=144（多算 39 步）、48 次赋值 store、13 次重复写、单元素最多被写 4 次</text>
<text x="90" y="402" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.6" fill="#3b352d" text-anchor="start" font-weight="normal">原因：min(i, M-1) 让 i=5 的循环步“代替”i=4 又算了一遍——数值碰巧还是对的（两次写的是同一个正确值）。</text>
<text x="90" y="422" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.6" fill="#3b352d" text-anchor="start" font-weight="normal">定位：看 dup_write=13 和 max_assign_per_elem=4；单看结果你永远不会发现，这正是它危险的地方。</text>
<text x="90" y="446" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.6" fill="#3b352d" text-anchor="start" font-weight="normal">修复：把 min 从“每次访存”挪到“每 tile 一次”的循环上界上（策略 2）；边界一次定好，体内不再拉人。</text>
<text x="90" y="466" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.6" fill="#3b352d" text-anchor="start" font-weight="normal">边界：串行里它“只是浪费”；并行/多线程 tile 同时落到同一元素时，它是数据竞争 + 未定义行为。</text>
