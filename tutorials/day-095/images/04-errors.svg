<text x="590" y="792" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.2" fill="#3b352d" text-anchor="middle" font-weight="bold">三个坑各踩掉一种“想当然”：尾部必须处理（不是可选）、钳制边界不是索引（不是位置）、半开区间的上界是 M（不是 M-1）。</text>
<text x="590" y="812" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.6" fill="#84796a" text-anchor="middle" font-weight="normal">判据记三条：oob_touches 必须 0；inner_iters 应等于 M*N*K；任何元素被赋值式 store 不得超过 1 次。</text>
