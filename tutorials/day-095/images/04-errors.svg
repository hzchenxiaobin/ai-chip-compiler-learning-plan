<text x="90" y="128" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12.5" fill="#c9705d" text-anchor="start" font-weight="bold">错误 1：danger——忘加 min 也忘加 if</text>
<text x="90" y="154" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.8" fill="#3b352d" text-anchor="start" font-weight="normal">现象：correct=NO，oob_touches=242 次，max_abs_err=56.25（pad 垃圾值 7.5 直接进了乘加）</text>
<text x="90" y="172" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.2" fill="#84796a" text-anchor="start" font-weight="normal">242 的分解：A 读越界 72（i 尾 32 + k 尾 40）+ B 读越界 66（k 尾 48 + j 尾 18）+ C 读写越界 52+52</text>
<text x="90" y="196" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.6" fill="#3b352d" text-anchor="start" font-weight="normal">原因：tile 网格是 ceil-div 画的，点循环按整 tile 宽度跑，i=5、j=7、k=3 都在真实矩阵之外。</text>
<text x="90" y="216" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.6" fill="#3b352d" text-anchor="start" font-weight="normal">定位：不用猜——插桩的 ldA/ldB/ldC/stC 包装把每次越界都记了数；没有插桩时它会表现为段错误或“结果玄学差”。</text>
<text x="90" y="240" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.6" fill="#3b352d" text-anchor="start" font-weight="normal">修复：min 钳制（21 次）或掩码（192 次）任选其一；matmul_danger.mlir 本身能被 mlir-opt 解析——</text>
<text x="90" y="258" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.6" fill="#3b352d" text-anchor="start" font-weight="normal">语法合法性救不了访存安全，这条 IR 是留给 Day 97 正确性测试的反面教材。</text>
