<text x="90" y="588" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12.5" fill="#5d8fc9" text-anchor="start" font-weight="bold">错误 3：off-by-one——min 上界写成了 M-1</text>
<text x="90" y="614" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.8" fill="#3b352d" text-anchor="start" font-weight="normal">现象：correct=NO，max_abs_err=2.25，oob_touches=0（一次都没越界，安静地错）</text>
<text x="90" y="634" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.6" fill="#3b352d" text-anchor="start" font-weight="normal">原因：min(i0+TM, M-1) 让 i0=4 的 tile 变成 [4, 4)——空循环；第 5 行整行没算（N、K 同理：列 7、k=2 消失）。</text>
<text x="90" y="656" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.6" fill="#3b352d" text-anchor="start" font-weight="normal">定位：inner_iters=48（4x6x2）而合法应为 105——步数骤降就是“有 tile 被算成了空”的信号。</text>
<text x="90" y="678" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.6" fill="#3b352d" text-anchor="start" font-weight="normal">修复：半开区间 [lo, hi) 的 hi 是“第一个不要的位置”，所以是维度 M 本身；min 的第二个参数永远写“开边界”。</text>
