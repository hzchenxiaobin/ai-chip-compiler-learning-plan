<text x="575.0" y="676" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12.5" fill="#7d9b6a" text-anchor="middle" font-weight="bold" font-style="">mini-opt 和两个 Pass 一行未改，为什么它们认识 mini.mul？</text>
<text x="575.0" y="698" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.2" fill="#3b352d" text-anchor="middle" font-weight="normal" font-style="">CSE 的判据：操作数与属性相同 + 无副作用（Pure trait 提供无副作用标记）；count-ops 只是遍历 Operation 数数</text>
<text x="575.0" y="718" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.2" fill="#3b352d" text-anchor="middle" font-weight="normal" font-style="">两份真实收据：grep -c mini.mul 输出 2 → 1；-mini-count-ops 报 7 ops（mini.mul=2, mini.add=2）→ 5 ops（各=1）</text>
<text x="575.0" y="738" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.5" fill="#84796a" text-anchor="middle" font-weight="normal" font-style="">算子是注册表里的数据，Pass 靠 trait 元数据工作——新增算子对 Pass 是“免费”的</text>
</svg>