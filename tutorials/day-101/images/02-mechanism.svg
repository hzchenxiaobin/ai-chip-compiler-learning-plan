<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive">
  <style>
    text { fill: #3B3B3B; }
    .title { font-size: 22px; font-weight: bold; }
    .sub { font-size: 12.5px; fill: #6b6257; }
    .bt { font-size: 13.5px; font-weight: bold; }
    .nd { font-size: 13px; font-weight: bold; }
    .blk { font-size: 12px; font-weight: bold; }
    .det { font-size: 11px; fill: #5a554d; }
    .lab { font-size: 12px; font-weight: bold; fill: #3B3B3B; }
    .foot { font-size: 11.5px; fill: #6b6257; }
    .box { stroke: #3B3B3B; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
    .arr { stroke: #3B3B3B; stroke-width: 1.9; stroke-linecap: round; fill: none; }
  </style>

  <rect x="4" y="4" width="972" height="632" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/>
  <text x="490" y="32" text-anchor="middle" class="title">机制：一个 Tile 的家常住进 SRAM——以 64³·FP32·双缓冲为例</text>
  <path d="M 300,42 Q 490,37 680,43" class="arr" stroke="#E8A87C" stroke-width="3"/>
  <text x="490" y="58" text-anchor="middle" class="sub">左边：256 KB 的房子按真实字节比例画（用掉 82,176 B）；右边：双缓冲时间轴＋逐项账本（真实数字）</text>

  <!-- 左：SRAM 房子（262,144 B → 460 px，比例尺 ≈ 1.755 px/KB） -->
  <text x="230" y="84" text-anchor="middle" class="bt">片上 SRAM：256 KB（262,144 B）</text>

  <path class="box" fill="#F5F0E4" d="M 72,94 Q 230,90 390,95 Q 394,325 391,554 Q 231,559 74,555 Q 70,324 72,94 Z"/>

  <!-- 房间（每间 16,384 B ≈ 29 px；bias 画粗示意） -->
  <rect x="86" y="102" width="290" height="27" rx="5" fill="#7FA8D9" fill-opacity="0.55" stroke="#3B3B3B" stroke-width="2.1"/>
  <text x="231" y="120" text-anchor="middle" class="lab">A[0]　16,384 B</text>

  <rect x="88" y="131" width="288" height="27" rx="5" fill="#7FA8D9" fill-opacity="0.32" stroke="#3B3B3B" stroke-width="2.1"/>
  <text x="232" y="149" text-anchor="middle" class="lab">A[1]　16,384 B</text>

  <rect x="87" y="160" width="289" height="27" rx="5" fill="#E8A87C" fill-opacity="0.55" stroke="#3B3B3B" stroke-width="2.1"/>
  <text x="231" y="178" text-anchor="middle" class="lab">B[0]　16,384 B</text>

  <rect x="89" y="189" width="287" height="27" rx="5" fill="#E8A87C" fill-opacity="0.32" stroke="#3B3B3B" stroke-width="2.1"/>
  <text x="232" y="207" text-anchor="middle" class="lab">B[1]　16,384 B</text>

  <rect x="86" y="218" width="290" height="27" rx="5" fill="#93C6A0" fill-opacity="0.55" stroke="#3B3B3B" stroke-width="2.3"/>
  <text x="231" y="236" text-anchor="middle" class="lab">C　16,384 B（×1 常驻）</text>

  <rect x="88" y="247" width="286" height="9" rx="3" fill="#C9C2B8" fill-opacity="0.8" stroke="#3B3B3B" stroke-width="1.8"/>
  <text x="398" y="256" class="det">← bias 256 B（实际只有 1 像素高，画粗示意）</text>

  <!-- 空闲区 -->
  <path d="M 90,266 L 372,266" stroke="#8f887c" stroke-width="1.5" stroke-dasharray="6 5"/>
  <path d="M 95,278 Q 230,274 368,279 Q 371,412 369,544 Q 231,548 96,545 Q 93,411 95,278 Z" fill="#FDFBF6" stroke="#C9C2B8" stroke-width="1.7" stroke-dasharray="7 6"/>
  <text x="231" y="316" text-anchor="middle" class="det" fill="#8f887c">空闲 179,968 B（68.7%）</text>
  <text x="231" y="334" text-anchor="middle" class="det" fill="#8f887c">利用率 = 82,176 / 262,144</text>
  <text x="231" y="352" text-anchor="middle" class="nd" fill="#8f887c">= 31.3%</text>
  <text x="231" y="530" text-anchor="middle" class="det" fill="#8f887c">（想住更满？→ 非按 2 幂的 Tile，见正文 5.4）</text>

  <!-- 图内编号 -->
  <circle cx="352" cy="144" r="11" fill="#FDFBF6" stroke="#3B3B3B" stroke-width="1.7"/>
  <text x="352" y="148" text-anchor="middle" class="det" font-weight="bold">1</text>
  <circle cx="350" cy="231" r="11" fill="#FDFBF6" stroke="#3B3B3B" stroke-width="1.7"/>
  <text x="350" y="235" text-anchor="middle" class="det" font-weight="bold">2</text>
  <circle cx="352" cy="251" r="11" fill="#FDFBF6" stroke="#3B3B3B" stroke-width="1.7"/>
  <text x="352" y="255" text-anchor="middle" class="det" font-weight="bold">3</text>

  <!-- 右上：双缓冲时间轴 -->
  <path class="box" fill="#F5F0E4" d="M 430,94 Q 690,90 948,95 Q 951,195 948,294 Q 689,299 432,295 Q 428,195 430,94 Z"/>
  <text x="690" y="116" text-anchor="middle" class="bt">双缓冲时间轴（k0 块的循环）</text>

  <text x="470" y="142" class="blk">DMA 装入</text>
  <rect x="560" y="130" width="118" height="24" rx="5" fill="#7FA8D9" fill-opacity="0.5" stroke="#3B3B3B" stroke-width="1.8"/>
  <text x="619" y="146" text-anchor="middle" class="det">装 A[1]·B[1]</text>
  <rect x="690" y="130" width="118" height="24" rx="5" fill="#7FA8D9" fill-opacity="0.32" stroke="#3B3B3B" stroke-width="1.8"/>
  <text x="749" y="146" text-anchor="middle" class="det">装 A[0]·B[0]</text>
  <rect x="820" y="130" width="118" height="24" rx="5" fill="#7FA8D9" fill-opacity="0.5" stroke="#3B3B3B" stroke-width="1.8"/>
  <text x="879" y="146" text-anchor="middle" class="det">装 A[1]·B[1]</text>

  <text x="470" y="180" class="blk">计算</text>
  <rect x="560" y="168" width="118" height="24" rx="5" fill="#93C6A0" fill-opacity="0.5" stroke="#3B3B3B" stroke-width="1.8"/>
  <text x="619" y="184" text-anchor="middle" class="det">算 k 块 0 → C</text>
  <rect x="690" y="168" width="118" height="24" rx="5" fill="#93C6A0" fill-opacity="0.32" stroke="#3B3B3B" stroke-width="1.8"/>
  <text x="749" y="184" text-anchor="middle" class="det">算 k 块 1 → C</text>
  <rect x="820" y="168" width="118" height="24" rx="5" fill="#93C6A0" fill-opacity="0.5" stroke="#3B3B3B" stroke-width="1.8"/>
  <text x="879" y="184" text-anchor="middle" class="det">算 k 块 2 → C</text>

  <text x="470" y="216" class="blk">C 累加</text>
  <rect x="560" y="204" width="378" height="22" rx="5" fill="#C9C2B8" fill-opacity="0.5" stroke="#3B3B3B" stroke-width="1.8"/>
  <text x="749" y="219" text-anchor="middle" class="det">C 全程常驻累加（×1）——它不是 DMA 的目的地</text>

  <text x="470" y="252" class="det">k0 =</text>
  <text x="619" y="252" text-anchor="middle" class="det">0</text>
  <text x="749" y="252" text-anchor="middle" class="det">1</text>
  <text x="879" y="252" text-anchor="middle" class="det">2 …</text>
  <text x="690" y="280" text-anchor="middle" class="det">「算第 k 块的同时装下一块」——重叠收益是 D103 的账；</text>
  <text x="690" y="294" text-anchor="middle" class="det">今天只算「户口」：两个槽 = 空间 ×2</text>

  <!-- 右下：账本 -->
  <path class="box" fill="#F5F0E4" d="M 430,312 Q 690,308 948,313 Q 951,435 948,554 Q 689,559 432,555 Q 428,434 430,312 Z"/>
  <text x="690" y="334" text-anchor="middle" class="bt">账本（estimate() 的五项输出）</text>

  <circle cx="452" cy="358" r="10" fill="#7FA8D9" fill-opacity="0.5" stroke="#3B3B3B" stroke-width="1.7"/>
  <text x="452" y="362" text-anchor="middle" class="det" font-weight="bold">1</text>
  <text x="470" y="362" class="blk">A：16,384 B × 2 槽 = 32,768 B</text>

  <circle cx="452" cy="390" r="10" fill="#E8A87C" fill-opacity="0.5" stroke="#3B3B3B" stroke-width="1.7"/>
  <text x="452" y="394" text-anchor="middle" class="det" font-weight="bold">1</text>
  <text x="470" y="394" class="blk">B：16,384 B × 2 槽 = 32,768 B</text>

  <circle cx="452" cy="422" r="10" fill="#93C6A0" fill-opacity="0.5" stroke="#3B3B3B" stroke-width="1.7"/>
  <text x="452" y="426" text-anchor="middle" class="det" font-weight="bold">2</text>
  <text x="470" y="426" class="blk">C：16,384 B × 1 = 16,384 B</text>

  <circle cx="452" cy="454" r="10" fill="#C9C2B8" fill-opacity="0.6" stroke="#3B3B3B" stroke-width="1.7"/>
  <text x="452" y="458" text-anchor="middle" class="det" font-weight="bold">3</text>
  <text x="470" y="458" class="blk">bias：256 B × 1 = 256 B</text>

  <text x="470" y="486" class="det">staging：0 B（未开启重排/重量化）</text>

  <path d="M 448,496 Q 690,492 930,497" stroke="#E7DFCE" stroke-width="2"/>
  <text x="470" y="518" class="bt">合计：82,176 B（80.2 KB）</text>
  <text x="470" y="540" class="det">×2 只给 A、B（DMA 流入项）；C、bias 常驻不翻倍</text>

  <!-- 左下注释：三个编号解释 -->
  <text x="70" y="586" class="det"><tspan font-weight="bold">1</tspan> 流入的才双缓冲：算 A[0] 时 DMA 装下一块进 A[1]　<tspan font-weight="bold">2</tspan> C 是计算目的地，常驻整个 tile 生命周期</text>
  <text x="70" y="604" class="det"><tspan font-weight="bold">3</tspan> bias 只有 256 B，但贴着预算住时它就是最后一根稻草（见正文错误三）</text>
  <text x="490" y="626" text-anchor="middle" class="foot">房间高度近似按字节比例画（bias 放大示意）；全部数字来自 outputs/main-config.txt 的真实运行</text>
</svg>
