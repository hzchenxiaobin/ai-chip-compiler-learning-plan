0.0" y="173.0" text-anchor="middle" font-size="13.5" fill="#6b6459">0</text><path d="M 450.9,148.4 Q 469.9,148.3 489.5,148.8 M 490.6,148.3 Q 490.4,168.6 490.8,187.1 M 490.5,188.3 Q 470.8,188.0 449.7,187.8 M 449.7,187.4 Q 449.5,168.6 450.4,147.9 Z" fill="white" stroke="#3b3b3b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="470.0" y="173.0" text-anchor="middle" font-size="13.5" fill="#6b6459">1</text><path d="M 410.4,187.5 Q 430.0,188.5 450.2,187.6 M 450.2,187.2 Q 449.9,208.0 450.8,227.9 M 450.8,227.3 Q 429.6,227.9 410.7,227.9 M 410.0,227.3 Q 410.5,207.4 410.6,188.5 Z" fill="white" stroke="#3b3b3b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="430.0" y="213.0" text-anchor="middle" font-size="13.5" fill="#6b6459">2</text><path d="M 450.3,187.6 Q 470.9,188.7 489.6,188.3 M 489.3,188.4 Q 489.5,207.5 490.3,227.4 M 490.5,227.7 Q 469.6,227.6 450.0,228.1 M 450.1,228.6 Q 450.8,208.7 450.1,187.9 Z" fill="#fdead3" stroke="#e8973f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="470.0" y="213.0" text-anchor="middle" font-size="13.5" fill="#e8973f">3</text><text x="410" y="138" text-anchor="start" font-size="15" fill="#3b3b3b" font-weight="bold">C (2×2)</text><text x="410" y="246" text-anchor="start" font-size="12" fill="#6b6459">addr = 2i+j</text><text x="56" y="308" text-anchor="start" font-size="12" fill="#e8973f">橙色格＝C[1,1] 这一趟要碰的格子（下文展开）</text><text x="48" y="336" text-anchor="start" font-size="14" fill="#3b3b3b" font-weight="bold">三重循环（半开区间，手画四要素）</text><path d="M 95.2,351.3 Q 282.2,351.0 469.1,352.3 M 470.6,351.3 Q 470.5,377.5 468.8,403.2 M 468.9,402.8 Q 281.7,402.1 93.8,401.5 M 92.9,401.2 Q 95.1,378.2 93.7,350.9 Z" fill="none" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" rx="8"/><text x="108" y="383" text-anchor="start" font-size="13.5" fill="#3b3b3b">for %i = 0 to 2 step 1   (i&lt;M, M=2)</text><path d="M 82.9,409.6 Q 281.7,409.7 482.3,409.4 M 482.0,408.8 Q 481.6,435.6 482.6,459.1 M 482.5,460.2 Q 282.8,459.2 81.8,459.2 M 81.6,460.2 Q 81.1,435.0 81.5,409.8 Z" fill="none" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" rx="8"/><text x="96" y="441" text-anchor="start" font-size="13.5" fill="#3b3b3b">for %j = 0 to 2 step 1   (j&lt;N, N=2)</text><path d="M 71.1,469.3 Q 281.8,469.2 494.4,466.9 M 494.8,468.4 Q 494.6,494.2 494.1,518.1 M 494.4,518.7 Q 281.6,518.3 69.7,518.1 M 70.1,516.8 Q 69.0,492.7 69.7,467.2 Z" fill="none" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" rx="8"/><text x="84" y="499" text-anchor="start" font-size="13.5" fill="#3b3b3b">for %k = 0 to 3 step 1   (k&lt;K, K=3)</text><text x="70" y="530" text-anchor="start" font-size="13" fill="#6b6459">acc = 0.0；每趟 acc += A[i,k]·B[k,j]</text><text x="70" y="550" text-anchor="start" font-size="13" fill="#6b6459">k 循环结束 → store C[i,j]（每格恰写 1 次终值）</text><text x="48" y="578" text-anchor="start" font-size="14" fill="#3b3b3b" font-weight="bold">C[1,1] 的 K=3 项展开（真实值，种子 91）</text><path d="M 51.8,589.1 Q 294.2,588.1 538.8,587.7 M 539.1,587.8 Q 539.0,643.8 538.1,700.9 M 538.3,700.4 Q 295.2,700.0 53.2,700.1 M 52.1,699.5 Q 52.1,643.0 51.7,587.3 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" rx="8"/><text x="66" y="612" text-anchor="start" font-size="12.5" fill="#3b3b3b">k=0: A[1,0]@3 · B[0,1]@1</text><text x="248" y="612" text-anchor="start" font-size="12.5" fill="#6b6459">-0.275686 · +2.178656</text><text x="436" y="612" text-anchor="start" font-size="12.5" fill="#79b26a">→ -0.600625</text><text x="66" y="639" text-anchor="start" font-size="12.5" fill="#3b3b3b">k=1: A[1,1]@4 · B[1,1]@3</text><text x="248" y="639" text-anchor="start" font-size="12.5" fill="#6b6459">+1.222254 · +0.517257</text><text x="436" y="639" text-anchor="start" font-size="12.5" fill="#79b26a">→ +0.031594</text><text x="66" y="666" text-anchor="start" font-size="12.5" fill="#3b3b3b">k=2: A[1,2]@5 · B[2,1]@5</text><text x="248" y="666" text-anchor="start" font-size="12.5" fill="#6b6459">-0.905859 · -1.054888</text><text x="436" y="666" text-anchor="start" font-size="12.5" fill="#79b26a">→ +0.987173</text><text x="66" y="702" text-anchor="start" font-size="12.5" fill="#79b26a">终值 +0.987173 ＝ 执行器实测 C[1,1]（逐位相等 True）→ store @3</text><path d="M 581.2,101.2 Q 850.4,101.3 1118.8,99.7 M 1120.0,101.0 Q 1120.3,424.8 1120.7,749.1 M 1119.4,750.7 Q 848.8,749.7 579.0,748.8 M 579.6,749.8 Q 580.3,425.9 580.9,99.6 Z" fill="white" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 6" rx="10"/><text x="598" y="128" text-anchor="start" font-size="15.5" fill="#5f8fcb" font-weight="bold">生成 IR（真实转换输出，outputs/post-ir.txt 摘录）</text><text x="598" y="156" text-anchor="start" font-size="11.6" fill="#3b3b3b">func @main(%a: memref&lt;2x3xf32, strided&lt;[3,1]&gt;&gt;,</text><text x="598" y="180.4" text-anchor="start" font-size="11.6" fill="#3b3b3b">             %b: memref&lt;3x2xf32, strided&lt;[2,1]&gt;&gt;)</text><text x="598" y="204.8" text-anchor="start" font-size="11.6" fill="#3b3b3b">  -&gt; memref&lt;2x2xf32, strided&lt;[2,1]&gt;&gt; {</text><text x="892" y="204.8" text-anchor="start" font-size="11.5" fill="#79b26a">类型＝手画 strides ✓</text><text x="598" y="229.20000000000002" text-anchor="start" font-size="11.6" fill="#3b3b3b">  %c = memref.alloc() : memref&lt;2x2xf32,...&gt;</text><text x="892" y="229.20000000000002" text-anchor="start" font-size="11.5" fill="#79b26a">输出缓冲（S5）✓</text><text x="598" y="253.60000000000002" text-anchor="start" font-size="11.6" fill="#3b3b3b">  %zero = arith.constant 0.0 : f32</text><text x="892" y="253.60000000000002" text-anchor="start" font-size="11.5" fill="#79b26a">单位元（S4）✓</text><text x="598" y="278.0" text-anchor="start" font-size="11.6" fill="#3b3b3b">  %c0/%c1/%c2/%c2'/%c3 = ...  // {0,1,M,N,K}</text><text x="892" y="278.0" text-anchor="start" font-size="11.5" fill="#79b26a">={0,1,2,2,3} ✓</text><text x="598" y="302.4" text-anchor="start" font-size="11.6" fill="#3b3b3b">  scf.for %i = %c0 to %c2 step %c1 {</text><text x="892" y="302.4" text-anchor="start" font-size="11.5" fill="#79b26a">i∈[0,2) ← M ✓</text><text x="598" y="326.79999999999995" text-anchor="start" font-size="11.6" fill="#3b3b3b">    scf.for %j = %c0 to %c2' step %c1 {</text><text x="892" y="326.79999999999995" text-anchor="start" font-size="11.5" fill="#79b26a">j∈[0,2) ← N ✓</text><text x="598" y="351.19999999999993" text-anchor="start" font-size="11.6" fill="#3b3b3b">      %acc = scf.for %k = %c0 to %c3 step %c1</text><text x="892" y="351.19999999999993" text-anchor="start" font-size="11.5" fill="#79b26a">k∈[0,3) ← K ✓</text><text x="598" y="375.5999999999999" text-anchor="start" font-size="11.6" fill="#3b3b3b">        iter_args(%acc = %zero) -&gt; (f32) {</text><text x="892" y="375.5999999999999" text-anchor="start" font-size="11.5" fill="#79b26a">初值＝零 ✓</text><text x="598" y="399.9999999999999" text-anchor="start" font-size="11.6" fill="#3b3b3b">        %xa = memref.load %a[%i, %k]</text><text x="892" y="399.9999999999999" text-anchor="start" font-size="11.5" fill="#79b26a">A[i,k] ✓</text><text x="598" y="424.39999999999986" text-anchor="start" font-size="11.6" fill="#3b3b3b">        %xb = memref.load %b[%k, %j]</text><text x="892" y="424.39999999999986" text-anchor="start" font-size="11.5" fill="#79b26a">B[k,j] ✓</text><text x="598" y="448.79999999999984" text-anchor="start" font-size="11.6" fill="#3b3b3b">        %p  = arith.mulf %xa, %xb : f32</text><text x="892" y="448.79999999999984" text-anchor="start" font-size="11.5" fill="#79b26a">乘积项 ✓</text><text x="598" y="473.1999999999998" text-anchor="start" font-size="11.6" fill="#3b3b3b">        %s  = arith.addf %acc, %p : f32</text><text x="892" y="473.1999999999998" text-anchor="start" font-size="11.5" fill="#79b26a">累加链 ✓</text><text x="598" y="497.5999999999998" text-anchor="start" font-size="11.6" fill="#3b3b3b">        scf.yield %s : f32</text><text x="892" y="497.5999999999998" text-anchor="start" font-size="11.5" fill="#79b26a">写回通道 ✓</text><text x="598" y="521.9999999999998" text-anchor="start" font-size="11.6" fill="#3b3b3b">      }</text><text x="598" y="546.3999999999997" text-anchor="start" font-size="11.6" fill="#3b3b3b">      memref.store %acc, %c[%i, %j]</text><text x="892" y="546.3999999999997" text-anchor="start" font-size="11.5" fill="#79b26a">C[i,j] ✓</text><text x="598" y="570.7999999999997" text-anchor="start" font-size="11.6" fill="#3b3b3b">    }  }  }</text><text x="598" y="595.1999999999997" text-anchor="start" font-size="11.6" fill="#3b3b3b">  return %c : memref&lt;2x2xf32,...&gt;</text><text x="598" y="619.5999999999997" text-anchor="start" font-size="11.6" fill="#3b3b3b">}</text><path d="M 516.0,380.0 Q 566.0,380.0 596.0,392.0" fill="none" stroke="#d96c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 595.4,392.0 Q 589.5,392.5 583.6,393.3" fill="none" stroke="#d96c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 596.2,391.5 Q 591.0,386.5 587.2,382.7" fill="none" stroke="#d96c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 540.0,638.0 Q 568.0,638.0 596.0,626.0" fill="none" stroke="#d96c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 596.1,625.7 Q 591.3,631.3 587.0,635.3" fill="none" stroke="#d96c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 596.1,625.6 Q 589.7,625.6 583.2,624.7" fill="none" stroke="#d96c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 29.7,766.7 Q 574.5,768.1 1119.3,767.3 M 1120.1,767.9 Q 1119.4,790.1 1121.3,815.2 M 1120.6,812.8 Q 575.9,814.5 30.2,813.4 M 29.2,814.7 Q 30.6,790.1 28.7,768.9 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" rx="8"/><text x="575" y="796" text-anchor="middle" font-size="12.5" fill="#3b3b3b" font-weight="bold">对账结论：手画的每一行（循环/配对/地址/项数/流量/覆盖）都被 IR 与访存日志证实——28/28 条地址逐条 ＝ 3i+k / 2k+j / 2i+j（RT2 真实运行）</text></g></svg>