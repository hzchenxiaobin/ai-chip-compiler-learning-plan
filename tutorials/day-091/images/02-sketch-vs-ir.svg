<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 830" width="1150" height="830"><rect x="3" y="3" width="1144" height="824" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="30" y="44" text-anchor="start" font-size="25" fill="#3b3b3b">手画 2×3 乘 3×2 的循环与索引 × 生成 IR（RT2 逐行对账）</text><text x="30" y="70" text-anchor="start" font-size="14.5" fill="#6b6459">左边是纸上手画（预期），右边是真实转换出的 IR——中间每一行都能对上（✓ 来自 19/19 PASS 的真实运行）</text><path d="M 30.2,83.0 Q 575.9,81.9 1120.9,80.8" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M 30.9,101.2 Q 294.8,100.1 560.2,100.1 M 559.0,100.5 Q 560.1,424.2 560.6,750.9 M 559.9,748.9 Q 294.8,749.8 30.6,749.5 M 29.2,749.0 Q 30.2,424.2 29.7,100.2 Z" fill="white" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 6" rx="10"/><text x="48" y="128" text-anchor="start" font-size="15.5" fill="#5f8fcb" font-weight="bold">手画（先不看 IR，在纸上写下预期）</text><path d="M 56.1,147.4 Q 75.9,147.8 96.2,148.3 M 96.5,148.6 Q 95.3,167.3 96.6,187.8 M 95.4,188.3 Q 75.8,188.7 56.5,187.2 M 55.1,188.2 Q 56.6,168.7 56.3,147.2 Z" fill="white" stroke="#3b3b3b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="76.0" y="173.0" text-anchor="middle" font-size="13.5" fill="#6b6459">0</text><path d="M 96.2,147.2 Q 115.5,148.3 135.9,148.1 M 135.9,147.3 Q 136.4,168.2 136.3,187.3 M 135.6,187.1 Q 115.2,188.1 96.6,187.6 M 96.2,188.4 Q 96.9,168.7 96.2,147.7 Z" fill="white" stroke="#3b3b3b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="116.0" y="173.0" text-anchor="middle" font-size="13.5" fill="#6b6459">1</text><path d="M 136.5,147.7 Q 155.6,148.8 176.0,147.5 M 176.5,147.9 Q 175.3,168.4 175.8,187.4 M 175.5,187.8 Q 156.5,187.8 135.7,188.8 M 136.9,187.3 Q 136.8,168.0 135.3,148.6 Z" fill="white" stroke="#3b3b3b" stroke-width="1.6" s