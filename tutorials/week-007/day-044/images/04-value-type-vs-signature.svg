<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Bradley Hand, Comic Sans MS, Segoe Print, Kaiti SC, KaiTi, cursive">
  <defs>
    <filter id="wob" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wob2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wob3" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arr" viewBox="0 0 12 12" refX="9.5" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 2 C5 1.5, 9 4, 10 6 C9 8, 5 10.5, 2 10 C4 8, 4 4, 2 2 Z" fill="#2F2B27"/>
    </marker>
    <style>
      .bg { fill:#FBF9F3; }
      .t-title { font-size:21px; fill:#2F2B27; font-weight:bold; }
      .t-h { font-size:15px; fill:#2F2B27; font-weight:bold; }
      .t-b { font-size:12.5px; fill:#2F2B27; }
      .t-s { font-size:11px; fill:#5A544C; }
      .code { font-family:Consolas, Menlo, Courier New, monospace; fill:#1F3B57; }
      .box { fill:#FFFFFF; stroke:#2F2B27; stroke-width:2.2; stroke-linejoin:round; }
      .bbox { fill:#DAE8FC; stroke:#5B8DB8; stroke-width:2.4; stroke-linejoin:round; }
      .obox { fill:#FFE6CC; stroke:#D79B00; stroke-width:2.4; stroke-linejoin:round; }
      .gbox { fill:#D5E8D4; stroke:#82B366; stroke-width:2.4; stroke-linejoin:round; }
      .rbox { fill:#F8CECC; stroke:#B85450; stroke-width:2.4; stroke-linejoin:round; }
      .arrow { stroke:#2F2B27; stroke-width:2.2; fill:none; stroke-linecap:round; marker-end:url(#arr); }
      .chip { fill:#FFFFFF; stroke:#2F2B27; stroke-width:1.8; stroke-linejoin:round; }
      .ok { fill:#D5E8D4; stroke:#82B366; stroke-width:1.8; stroke-linejoin:round; }
      .bad { fill:#F8CECC; stroke:#B85450; stroke-width:1.8; stroke-linejoin:round; }
    </style>
  </defs>

  <rect class="bg" width="1000" height="640"/>
  <text class="t-title" x="30" y="42">细化结果 return 出函数：为什么签名不会自动更新</text>
  <text class="t-s" x="975" y="68" text-anchor="end" fill="#8A8378">探针 7 实测 · probe_return_mismatch.mlir · rc=1</text>

  <!-- ===== 左卡：Value 本身 ===== -->
  <g filter="url(#wob)">
    <rect class="bbox" x="28" y="96" width="310" height="250" rx="12" transform="rotate(-0.4 183 221)"/>
  </g>
  <text class="t-h" x="48" y="126">存放点 ①：Value 本身</text>
  <text class="t-s" x="48" y="144">（%0 这个值随身带的类型便签）</text>
  <text class="code" x="48" y="172" font-size="12.5">%0 = mini.matmul %a, %b</text>
  <g filter="url(#wob2)">
    <rect class="chip" x="48" y="184" width="132" height="26" rx="7"/>
  </g>
  <text class="code" x="114" y="202" text-anchor="middle" font-size="11.5">tensor&lt;?x?xf32&gt;</text>
  <g filter="url(#wob2)">
    <path class="arrow" d="M114 212 Q114 226 114 238"/>
  </g>
  <text class="t-s" x="130" y="230" fill="#B5651D">setType（Pass 写回）</text>
  <g filter="url(#wob2)">
    <rect class="chip" x="48" y="242" width="132" height="26" rx="7"/>
  </g>
  <text class="code" x="114" y="260" text-anchor="middle" font-size="11.5" font-weight="bold">tensor&lt;2x2xf32&gt;</text>
  <text class="t-s" x="48" y="296">所有使用者读 %0，看到的</text>
  <text class="t-s" x="48" y="312">都是这张新便签（3.2 节）</text>

  <!-- ===== 中卡：func.return ===== -->
  <g filter="url(#wob)">
    <rect class="box" x="372" y="96" width="256" height="250" rx="12" transform="rotate(0.4 500 221)"/>
  </g>
  <text class="t-h" x="392" y="126">func.return %0</text>
  <text class="t-s" x="392" y="144">操作数类型从 %0（Value）读取</text>
  <g filter="url(#wob2)">
    <rect class="ok" x="388" y="168" width="224" height="52" rx="8"/>
  </g>
  <text class="code" x="398" y="188" font-size="11" fill="#4C7A43">解析时：?x? 对 ?x?</text>
  <text class="t-s" x="398" y="208" fill="#4C7A43">完全合法，Verifier 放行</text>
  <g filter="url(#wob2)">
    <rect class="bad" x="388" y="240" width="224" height="66" rx="8"/>
  </g>
  <text class="code" x="398" y="260" font-size="11" fill="#A03B37">Pass 后：操作数已是 2x2</text>
  <text class="code" x="398" y="278" font-size="11" fill="#A03B37">签名却仍是 ?x?</text>
  <text class="t-s" x="398" y="296" fill="#A03B37">✗ 对不上，撞车</text>

  <!-- ===== 右卡：function_type 属性 ===== -->
  <g filter="url(#wob)">
    <rect class="obox" x="662" y="96" width="310" height="250" rx="12" transform="rotate(0.3 817 221)"/>
  </g>
  <text class="t-h" x="682" y="126">存放点 ②：函数签名</text>
  <text class="t-s" x="682" y="144">（FuncOp 的 function_type 属性）</text>
  <text class="code" x="682" y="172" font-size="12.5">func.func @returns_refined</text>
  <g filter="url(#wob2)">
    <rect class="chip" x="682" y="184" width="190" height="26" rx="7"/>
  </g>
  <text class="code" x="777" y="202" text-anchor="middle" font-size="11.5">(…) -&gt; tensor&lt;?x?xf32&gt;</text>
  <text class="t-s" x="682" y="240">属性贴在函数 Operation 上，</text>
  <text class="t-s" x="682" y="256">setType 改的是 Value，</text>
  <text class="t-s" x="682" y="272">碰不到这张属性卡</text>
  <text class="t-s" x="682" y="312" fill="#B5651D">签名不随 setType 自动更新</text>

  <!-- 箭头：左卡 -> 中卡 -->
  <g filter="url(#wob2)">
    <path class="arrow" d="M338 221 Q354 217 370 221"/>
    <path class="arrow" d="M860 346 Q860 368 840 384"/>
    <path class="arrow" d="M500 346 Q500 366 500 384"/>
  </g>
  <text class="t-s" x="354" y="208" text-anchor="middle">操作数</text>

  <!-- ===== 红条：verify-each ===== -->
  <g filter="url(#wob3)">
    <rect class="rbox" x="28" y="386" width="944" height="140" rx="12" transform="rotate(-0.2 500 456)"/>
  </g>
  <text class="t-h" x="48" y="414">--verify-each：Pass 之后重新验证（mlir-opt 默认开）</text>
  <text class="code" x="48" y="442" font-size="11">return 操作数 tensor&lt;2x2xf32&gt;  vs  签名结果 tensor&lt;?x?xf32&gt;  →  不匹配</text>
  <g filter="url(#wob2)">
    <rect class="chip" x="48" y="454" width="600" height="60" rx="8"/>
  </g>
  <text class="code" x="60" y="474" font-size="10.5" fill="#A03B37">probe_return_mismatch.mlir:15:3: error: type of return operand 0</text>
  <text class="code" x="60" y="490" font-size="10.5" fill="#A03B37">('tensor&lt;2x2xf32&gt;') doesn't match function result type</text>
  <text class="code" x="60" y="506" font-size="10.5" fill="#A03B37">('tensor&lt;?x?xf32&gt;') in function @returns_refined</text>
  <g filter="url(#wob2)">
    <rect class="bad" x="902" y="400" width="48" height="22" rx="7"/>
  </g>
  <text class="code" x="926" y="415" text-anchor="middle" font-size="11" fill="#A03B37">rc=1</text>

  <!-- ===== 绿条：两条出路 ===== -->
  <g filter="url(#wob3)">
    <rect class="gbox" x="28" y="548" width="944" height="68" rx="12" transform="rotate(0.2 500 582)"/>
  </g>
  <text class="t-h" x="48" y="576">两条出路</text>
  <text class="t-b" x="140" y="576">① 就地观察、不外传（其余 7 个探针的写法）→ rc=0</text>
  <text class="t-b" x="600" y="576">② Pass 同步更新签名（选做挑战）→ rc=0</text>
  <text class="t-s" x="48" y="600">正解见第 7 节：func.setFunctionType / func.setType 一族接口；参数类型是入口合同不许动，return 操作数才是对齐对象</text>
</svg>
