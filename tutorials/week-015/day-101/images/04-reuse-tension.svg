<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive">
  <style>
    text { fill: #3B3B3B; }
    .title { font-size: 21px; font-weight: bold; }
    .sub { font-size: 12.5px; fill: #6b6257; }
    .grp { font-size: 13px; font-weight: bold; fill: #5a554d; }
    .det { font-size: 11px; fill: #5a554d; }
    .val { font-size: 11.5px; font-weight: bold; fill: #444; }
    .lab { font-size: 12px; font-weight: bold; }
    .foot { font-size: 11.5px; fill: #6b6257; }
    .box { stroke: #3B3B3B; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; fill: #F5F0E4; }
    .bar { stroke: #3B3B3B; stroke-width: 1.9; }
    .mid { font-size: 12px; font-weight: bold; fill: #4d5a6b; }
  </style>

  <rect x="4" y="4" width="1192" height="667" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/>
  <text x="600" y="36" text-anchor="middle" class="title">对照三的张力：省流量要住大 Tile，SRAM 的墙在上头（512×512×512 · FP32 · 双缓冲）</text>
  <path d="M 330,46 Q 600,40 870,47" stroke="#E8A87C" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="600" y="63" text-anchor="middle" class="sub">数据来自 outputs/reuse.txt（真实运行）：上轴＝HBM 总流量（越矮越好），下轴＝片上空间 vs 256 KB 预算，两轴列顺序相同</text>

  <text x="90" y="92" class="grp">① HBM 总流量（B）——Tile 越大越省（C 写恒 1,048,576 B；A+B ∝ 1/Tm + 1/Tn）</text>

  <path class="box" d="M 74,100 Q 610,96 1146,100 Q 1150,222 1146,344 Q 610,349 76,344 Q 71,222 74,100 Z"/>

  <line x1="100" y1="312" x2="1140" y2="312" stroke="#3B3B3B" stroke-width="1.8"/>

  <rect x="210" y="142" width="120" height="170" rx="4" fill="#7FA8D9" fill-opacity="0.65" class="bar"/>
  <text x="270" y="119" text-anchor="middle" class="det">AI 7.8f</text>
  <text x="270" y="134" text-anchor="middle" class="val">34,603,008 B</text>

  <rect x="450" y="224" width="120" height="88" rx="4" fill="#7FA8D9" fill-opacity="0.65" class="bar"/>
  <text x="510" y="201" text-anchor="middle" class="det">AI 15.1f</text>
  <text x="510" y="216" text-anchor="middle" class="val">17,825,792 B</text>

  <rect x="690" y="266" width="120" height="46" rx="4" fill="#7FA8D9" fill-opacity="0.65" class="bar"/>
  <text x="750" y="243" text-anchor="middle" class="det">AI 28.4f</text>
  <text x="750" y="258" text-anchor="middle" class="val">9,437,184 B</text>

  <rect x="930" y="297" width="120" height="15" rx="4" fill="#7FA8D9" fill-opacity="0.65" class="bar"/>
  <text x="990" y="274" text-anchor="middle" class="det">AI 85.3f</text>
  <text x="990" y="289" text-anchor="middle" class="val">3,145,728 B（最低）</text>

  <text x="270" y="330" text-anchor="middle" class="lab">32³</text>
  <text x="510" y="330" text-anchor="middle" class="lab">64³</text>
  <text x="750" y="330" text-anchor="middle" class="lab">128³</text>
  <text x="990" y="330" text-anchor="middle" class="lab">不切块（整矩阵）</text>

  <text x="600" y="372" text-anchor="middle" class="mid">Tile 每翻一倍：A+B 流量减半（∝ 1/Tm + 1/Tn），片上空间 ×4（∝ t²）——上轴越走越矮、下轴越走越高</text>

  <text x="90" y="394" class="grp">② 片上空间（B，双缓冲）——Tile 越大越贵：20,608 → 82,176 → 328,192 B，撞线即出局</text>

  <path class="box" d="M 74,402 Q 610,398 1146,402 Q 1150,523 1146,644 Q 610,649 76,644 Q 71,523 74,402 Z"/>

  <line x1="100" y1="612" x2="1140" y2="612" stroke="#3B3B3B" stroke-width="1.8"/>
  <line x1="100" y1="470" x2="1140" y2="470" stroke="#C0392B" stroke-width="2.2" stroke-dasharray="8 6"/>
  <text x="104" y="463" class="det" fill="#B03A3A" font-weight="bold">预算 256 KB = 262,144 B</text>

  <rect x="210" y="601" width="120" height="11" rx="4" fill="#93C6A0" fill-opacity="0.65" class="bar"/>
  <text x="270" y="594" text-anchor="middle" class="val">20,608 B</text>

  <rect x="450" y="567" width="120" height="45" rx="4" fill="#93C6A0" fill-opacity="0.65" class="bar"/>
  <text x="510" y="560" text-anchor="middle" class="val">82,176 B</text>

  <rect x="690" y="470" width="120" height="142" rx="4" fill="#93C6A0" fill-opacity="0.65" class="bar"/>
  <rect x="690" y="434" width="120" height="36" rx="4" fill="#D98484" fill-opacity="0.8" class="bar"/>
  <text x="750" y="427" text-anchor="middle" class="val">328,192 B</text>
  <text x="682" y="452" text-anchor="end" class="val" fill="#B03A3A">✗ 超 66,048 B</text>

  <rect x="930" y="430" width="120" height="18" rx="4" fill="#C9C2B8" fill-opacity="0.55" class="bar"/>
  <rect x="930" y="462" width="120" height="150" rx="4" fill="#C9C2B8" fill-opacity="0.55" class="bar"/>
  <path d="M 942,461 L 972,449" stroke="#3B3B3B" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 990,461 L 1020,449" stroke="#3B3B3B" stroke-width="1.6" stroke-linecap="round"/>
  <text x="990" y="423" text-anchor="middle" class="val">3,145,728 B（预算×12）</text>

  <text x="270" y="630" text-anchor="middle" class="lab">32³</text>
  <text x="510" y="630" text-anchor="middle" class="lab">64³</text>
  <text x="750" y="630" text-anchor="middle" class="lab">128³（✗ 被拒）</text>
  <text x="990" y="630" text-anchor="middle" class="lab">不切块（整矩阵）</text>

  <text x="600" y="663" text-anchor="middle" class="foot">数字与 outputs/reuse.txt 逐位一致；AI＝算术强度（FLOP/B）；下轴绿色＝住得下、红色＝超预算、灰色＝不切块（A+B+C 同时在场，条形截断示意）</text>
</svg>
