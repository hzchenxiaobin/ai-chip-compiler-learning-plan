<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560"><rect x="4" y="4" width="1072" height="552" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">测试计划：正确性、边界、性能三线</text><path d="M 61.6,61.5 Q 538.4,61.0 1019.6,60.3 Q 1019.5,123.6 1021.4,190.4 Q 539.3,191.8 61.0,191.6 Q 62.4,126.3 61.6,61.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.3"/><text x="540" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">正确性线（D135 沿用）</text><text x="540" y="114" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">fuzz 200 组随机 shape×多组 tile——全部 bitwise；</text><text x="540" y="136" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">任何 tile 组合的正确性与朴素版等价</text><path d="M 60.0,198.8 Q 540.7,200.2 1018.9,198.4 Q 1021.6,262.5 1021.3,328.6 Q 539.6,331.1 61.0,330.0 Q 60.7,265.5 60.0,198.8  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.3"/><text x="540" y="226" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">边界线（三个极端）</text><text x="540" y="254" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">tile=(1,1,1)（退化＝朴素）／tile=shape（单块）／</text><text x="540" y="276" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">tile&gt;shape（钳制生效）——三种边界的产物与正确性</text><path d="M 60.8,339.4 Q 538.7,339.6 1019.8,338.4 Q 1021.3,405.4 1020.7,470.9 Q 538.2,467.7 58.7,468.7 Q 59.3,402.9 60.8,339.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.3"/><text x="540" y="366" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">性能线（D146 验收）</text><text x="540" y="394" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">kernel_timing 对照：朴素 vs tile 版——教学规模预期：</text><text x="540" y="416" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">差异小、方向不定；反例是合法结果（D153 伏笔）</text><path d="M 59.8,485.2 Q 538.9,487.6 1021.3,485.9 Q 1019.2,518.2 1020.9,547.4 Q 539.3,547.3 60.2,546.4 Q 58.0,517.1 59.8,485.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.85"/><text x="540.0" y="510" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">测试计划的早定原则：正确性线是门（不过不谈性能）、边界线是墙（</text><text x="540.0" y="530" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">极端 tile 不许崩）、性能线是窗（教学规模的诚实——差异小是预期不是失败）</text></svg>
