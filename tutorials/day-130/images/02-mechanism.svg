<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="534" viewBox="0 0 1080 534"><rect x="4" y="4" width="1072" height="526" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">E3xx：运行期诊断——D120 诊断体系的第三层</text><path d="M 60.8,61.2 Q 209.8,58.7 359.9,60.3 Q 359.5,153.6 360.6,250.0 Q 211.2,250.6 60.1,251.5 Q 60.6,157.5 60.8,61.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.35"/><text x="210" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">E1xx 用法层</text><text x="210" y="108" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">（D120）</text><text x="210" y="134" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">参数拼错、文件不存在</text><text x="210" y="152" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">退出码 2：先读 --help</text><path d="M 363.2,151.6 Q 376.0,148.8 388.0,150.0 M 374.5,152.1 L 388.0,150.0 L 374.5,147.9" stroke="#3B3B3B" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M 389.0,58.8 Q 537.6,59.9 689.1,60.4 Q 687.6,156.2 689.6,251.4 Q 538.8,251.2 390.0,249.3 Q 389.5,153.8 389.0,58.8  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.35"/><text x="540" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">E2xx 编译层</text><text x="540" y="108" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">（D122）</text><text x="540" y="134" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">Pass 失败、S2 拒收</text><text x="540" y="152" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">退出码 1：改输入或修管道</text><text x="540" y="170" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">＋现场保留（pipeline-error.txt）</text><path d="M 691.8,149.6 Q 705.8,148.2 718.0,150.0 M 704.5,152.1 L 718.0,150.0 L 704.5,147.9" stroke="#3B3B3B" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M 721.2,60.0 Q 872.1,58.5 1019.5,60.3 Q 1020.8,157.0 1019.1,250.8 Q 869.6,252.3 721.4,250.2 Q 721.7,156.1 721.2,60.0  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.35"/><text x="870" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">E3xx 运行层</text><text x="870" y="108" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">（今天）</text><text x="870" y="134" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">校验失败（E301）</text><text x="870" y="152" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">回退发生（E302/W301）</text><text x="870" y="170" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">不可恢复（E303）——运行期事件</text><text x="540.0" y="286" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">运行期诊断与编译期诊断的三个差异</text><path d="M 81.1,307.1 Q 539.1,308.7 999.2,309.1 Q 998.1,330.5 999.9,351.0 Q 540.7,351.5 81.1,351.6 Q 81.1,329.6 81.1,307.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#B8A7CE" fill-opacity="0.25"/><text x="110" y="335" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">触发时机</text><text x="300" y="335" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">编译期：编译时一次性发现｜运行期：每次调用都可能触发</text><path d="M 79.4,359.0 Q 541.5,360.5 999.4,359.0 Q 998.9,382.4 998.8,403.8 Q 539.9,406.1 78.5,404.1 Q 79.4,383.6 79.4,359.0  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#B8A7CE" fill-opacity="0.25"/><text x="110" y="387" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">处理策略</text><text x="300" y="387" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">编译期：失败退出（E2xx 现场保留）｜运行期：能降级就降级（E302）、不能才上抛（E303）</text><path d="M 78.8,412.2 Q 540.9,413.8 998.6,412.7 Q 999.6,434.4 1000.4,456.8 Q 540.9,455.3 79.2,454.8 Q 79.0,431.4 78.8,412.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#B8A7CE" fill-opacity="0.25"/><text x="110" y="439" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">观测方式</text><text x="300" y="439" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">编译期：pipeline-error.txt 落盘｜运行期：events 列表＋stats 计数（可查询的运行轨迹）</text><path d="M 79.5,470.9 Q 537.1,471.7 998.9,470.2 Q 998.0,490.6 999.8,513.2 Q 540.1,513.0 79.8,513.9 Q 81.8,492.7 79.5,470.9  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.8"/><text x="540.0" y="492" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">回退的可观测性：events 记录「谁回退了、为什么」；stats 的 fallback 计数是健康指标——</text><text x="540.0" y="510" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">fallback 比例升高＝特化层在退化（产物损坏/环境变化）——监控的 hook 从这里接</text></svg>
