<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640"><rect x="4" y="4" width="1072" height="632" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle">S6 AOT 验证的数据流：从 C driver 到 kernel 再到逐点对照</text><path d="M 39.3,59.4 Q 188.2,60.8 338.8,58.0 Q 337.9,276.2 339.7,498.1 Q 191.3,497.2 41.2,497.8 Q 38.5,279.3 39.3,59.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.3"/><text x="190" y="80" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle">① C driver（verify_driver.c）</text><text x="190" y="98" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#6b6257" text-anchor="middle">数据在编译前替换进模板</text><text x="55" y="118" font-family="'Courier New',monospace" font-size="9" fill="#3B3B3B" text-anchor="start">static A[24] / B[18] / BIAS[3]</text><text x="55" y="135" font-family="'Courier New',monospace" font-size="9" fill="#3B3B3B" text-anchor="start">static GOLDEN[12]  ← 裁判</text><text x="55" y="158" font-family="'Courier New',monospace" font-size="9" fill="#3B3B3B" text-anchor="start">desc2_t da = {A,A,0,{4,6},{6,1}};</text><text x="55" y="175" font-family="'Courier New',monospace" font-size="9" fill="#3B3B3B" text-anchor="start">desc2_t db = {B,B,0,{6,3},{3,1}};</text><text x="55" y="192" font-family="'Courier New',monospace" font-size="9" fill="#3B3B3B" text-anchor="start">desc1_t dbias = {BIAS,BIAS,0,{3},{1}};</text><text x="55" y="209" font-family="'Courier New',monospace" font-size="9" fill="#3B3B3B" text-anchor="start">desc2_t dc = {0,0,0,{4,3},{3,1}};</text><text x="190" y="226" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#E8A87C" text-anchor="middle">↑ 输出描述符先空着（alloc=NULL）</text><text x="55" y="250" font-family="'Courier New',monospace" font-size="9" fill="#E8A87C" text-anchor="start">_mlir_ciface_main_kernel(</text><text x="55" y="267" font-family="'Courier New',monospace" font-size="9" fill="#E8A87C" text-anchor="start">    &amp;dc, &amp;da, &amp;db, &amp;dbias);</text><text x="190" y="292" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#6b6257" text-anchor="middle">desc 布局：{alloc, aligned, off, sh, st}</text><text x="190" y="309" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#6b6257" text-anchor="middle">rank2＝7 字段 56B；rank1＝5 字段 40B</text><text x="190" y="336" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#4a7c59" text-anchor="middle">对照不依赖任何运行时文件</text><text x="190" y="353" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#6b6257" text-anchor="middle">（driver 编译后自带 A/B/bias/golden）</text><path d="M 391.2,58.5 Q 542.8,58.9 690.2,59.2 Q 688.6,278.2 689.7,496.8 Q 539.9,498.5 390.9,497.3 Q 390.5,278.8 391.2,58.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.3"/><text x="540" y="80" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle">② kernel 侧（stage-5.ll 两个 define）</text><text x="540" y="98" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#6b6257" text-anchor="middle">llvm.emit_c_interface 自动生成包装</text><text x="405" y="118" font-family="'Courier New',monospace" font-size="9" fill="#3B3B3B" text-anchor="start">define @_mlir_ciface_main_kernel</text><text x="405" y="135" font-family="'Courier New',monospace" font-size="9" fill="#3B3B3B" text-anchor="start">    (ptr, ptr, ptr, ptr)</text><text x="405" y="158" font-family="'Courier New',monospace" font-size="9" fill="#3B3B3B" text-anchor="start">  load 三个 desc → 拆成 19 个标量</text><text x="405" y="181" font-family="'Courier New',monospace" font-size="9" fill="#3B3B3B" text-anchor="start">define @main_kernel(19 参数)</text><text x="540" y="198" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#6b6257" text-anchor="middle">a：7 字段；b：7 字段；bias：5 字段</text><text x="405" y="222" font-family="'Courier New',monospace" font-size="9" fill="#3B3B3B" text-anchor="start">  %39 = call ptr @malloc(i64 48)</text><text x="540" y="239" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#E8A87C" text-anchor="middle">↑ kernel 自己的新缓冲区（4×3×4B）</text><text x="405" y="263" font-family="'Courier New',monospace" font-size="9" fill="#3B3B3B" text-anchor="start">  k 循环：fmul / fadd（k 序累加）</text><text x="405" y="280" font-family="'Courier New',monospace" font-size="9" fill="#C97B7B" text-anchor="start">  fcmp ogt ＋ select（relu 收尾）</text><text x="405" y="297" font-family="'Courier New',monospace" font-size="9" fill="#3B3B3B" text-anchor="start">  ret {新描述符}</text><text x="540" y="322" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">ciface：store 新描述符 → *out</text><text x="540" y="339" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#6b6257" text-anchor="middle">（dc 被整个覆盖：dc.alloc＝malloc 的 48B）</text><path d="M 739.0,56.5 Q 888.1,58.0 1038.9,58.1 Q 1041.0,278.6 1041.2,498.5 Q 891.8,498.9 740.0,496.5 Q 738.2,278.6 739.0,56.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.3"/><text x="890" y="80" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle">③ 判决（driver 的 main）</text><text x="890" y="98" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#6b6257" text-anchor="middle">本例 12 点 kernel 与 golden 全等</text><text x="755" y="118" font-family="'Courier New',monospace" font-size="9" fill="#3B3B3B" text-anchor="start">for (k=0; k&lt;12; k++)</text><text x="755" y="135" font-family="'Courier New',monospace" font-size="9" fill="#3B3B3B" text-anchor="start">  printf C[k]=%.4f (golden …)</text><text x="755" y="152" font-family="'Courier New',monospace" font-size="9" fill="#3B3B3B" text-anchor="start">  if (dc.alloc[k] != GOLDEN[k])</text><text x="755" y="169" font-family="'Courier New',monospace" font-size="9" fill="#3B3B3B" text-anchor="start">      bad++;</text><text x="890" y="193" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#4a7c59" text-anchor="middle">bad==0 →「12/12 点 bitwise 一致」</text><text x="890" y="210" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#4a7c59" text-anchor="middle">        → exit 0（执行层裁判）</text><text x="890" y="234" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#C97B7B" text-anchor="middle">否则 →「VERIFY FAIL」→ exit 1</text><text x="890" y="258" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#6b6257" text-anchor="middle">先查 dc.alloc == NULL → FAIL</text><text x="890" y="285" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">结果从 dc.alloc 读，</text><text x="890" y="302" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">不是调用方的 C 数组</text><path d="M 341.8,170.3 Q 366.4,170.4 388.0,170.0 M 374.5,172.1 L 388.0,170.0 L 374.5,167.9" stroke="#3B3B3B" stroke-width="1.8" stroke-linecap="round" fill="none"/><text x="365.5" y="162.0" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">调用</text><path d="M 693.0,170.0 Q 714.1,170.2 738.0,170.0 M 724.5,172.1 L 738.0,170.0 L 724.5,167.9" stroke="#3B3B3B" stroke-width="1.8" stroke-linecap="round" fill="none"/><text x="715.5" y="162.0" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">写回</text><path d="M 49.4,514.9 Q 537.6,516.2 1028.9,515.3 Q 1027.8,563.4 1030.9,615.5 Q 540.1,613.7 49.3,614.4 Q 49.9,564.0 49.4,514.9  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.22"/><text x="540.0" y="540" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#C97B7B" text-anchor="middle">§6 错误 3 的坑（D118 原样重踩）：错误版把输出 desc 填成 static C 的地址</text><text x="540.0" y="561" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">kernel 的结果写在自己的 malloc 缓冲区里；ciface 只把「新描述符」store 回 *out</text><text x="540.0" y="579" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">—— static C 数组从头到尾没被写过（实测全 0）；正确版从 dc.alloc 读结果</text><text x="540.0" y="598" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">定位手段：打印 dc.alloc 与 C 的地址对比（D118 TP5 的坑，一字不差重现）</text></svg>
