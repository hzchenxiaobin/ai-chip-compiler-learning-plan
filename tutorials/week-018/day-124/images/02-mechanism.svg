<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540"><rect x="4" y="4" width="1072" height="532" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">S2 点循环解剖：bias 融 k=0、relu 的 cmpf+select、k 序累加链</text><path d="M 51.2,59.6 Q 320.2,59.0 589.8,61.1 Q 590.8,252.0 589.5,440.7 Q 320.2,439.8 50.8,440.1 Q 51.5,248.2 51.2,59.6  Z" stroke="#3B3B3B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="#FDFBF6" fill-opacity="0.95"/><text x="320" y="82" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">gen_loop_ir_full 的输出（关键段）</text><text x="70" y="100" font-family="'Courier New',monospace" font-size="9.5" fill="#9CBF8E" text-anchor="start">scf.for %i = %c0 to %cM step %c1 {</text><text x="70" y="121" font-family="'Courier New',monospace" font-size="9.5" fill="#9CBF8E" text-anchor="start">  scf.for %j = %c0 to %cN step %c1 {</text><text x="70" y="142" font-family="'Courier New',monospace" font-size="9.5" fill="#E8A87C" text-anchor="start">    %bj = memref.load %bias[%j]        // ① bias 先装填</text><text x="70" y="163" font-family="'Courier New',monospace" font-size="9.5" fill="#A9C4D4" text-anchor="start">    %acc = scf.for %k = %c0 to %cK step %c1</text><text x="70" y="184" font-family="'Courier New',monospace" font-size="9.5" fill="#E8A87C" text-anchor="start">                iter_args(%acc = %bj) -&gt; (f32) {   // ② 初值=bias</text><text x="70" y="205" font-family="'Courier New',monospace" font-size="9.5" fill="#A9C4D4" text-anchor="start">      %aij = memref.load %a[%i, %k]</text><text x="70" y="226" font-family="'Courier New',monospace" font-size="9.5" fill="#A9C4D4" text-anchor="start">      %bkj = memref.load %b[%k, %j]</text><text x="70" y="247" font-family="'Courier New',monospace" font-size="9.5" fill="#A9C4D4" text-anchor="start">      %p = arith.mulf %aij, %bkj : f32</text><text x="70" y="268" font-family="'Courier New',monospace" font-size="9.5" fill="#A9C4D4" text-anchor="start">      %s = arith.addf %acc, %p : f32    // ③ k 序累加</text><text x="70" y="289" font-family="'Courier New',monospace" font-size="9.5" fill="#A9C4D4" text-anchor="start">      scf.yield %s : f32</text><text x="70" y="310" font-family="'Courier New',monospace" font-size="9.5" fill="#A9C4D4" text-anchor="start">    }</text><text x="70" y="331" font-family="'Courier New',monospace" font-size="9.5" fill="#C97B7B" text-anchor="start">    %cond = arith.cmpf ogt, %acc, %pos  // ④ relu 条件</text><text x="70" y="352" font-family="'Courier New',monospace" font-size="9.5" fill="#C97B7B" text-anchor="start">    %r = arith.select %cond, %acc, %pos // ⑤ relu 选择</text><text x="70" y="373" font-family="'Courier New',monospace" font-size="9.5" fill="#A9C4D4" text-anchor="start">    memref.store %r, %c[%i, %j]</text><text x="70" y="394" font-family="'Courier New',monospace" font-size="9.5" fill="#9CBF8E" text-anchor="start">  }</text><text x="70" y="415" font-family="'Courier New',monospace" font-size="9.5" fill="#9CBF8E" text-anchor="start">}</text><path d="M 619.1,59.0 Q 822.6,61.2 1029.7,61.0 Q 1028.3,249.0 1028.8,440.4 Q 823.0,441.4 620.8,441.4 Q 621.7,249.3 619.1,59.0  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#B8A7CE" fill-opacity="0.3"/><text x="825" y="82" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">三个语义点（对应左侧 ①②③④⑤）</text><path d="M 639.4,107.2 Q 824.9,106.3 1009.4,105.6 Q 1009.2,156.3 1008.6,207.0 Q 823.8,206.0 640.4,206.0 Q 637.8,158.5 639.4,107.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.25"/><text x="825" y="126" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">①② bias 融 k=0 圈</text><text x="825" y="144" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#3B3B3B" text-anchor="middle">iter_args 初值 = %bj（bias[j]）——k=0 圈从 bias</text><text x="825" y="160" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#3B3B3B" text-anchor="middle">开始累加，等价于「先加 bias 再乘加」</text><text x="825" y="176" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#3B3B3B" text-anchor="middle">出处：D85~D90 任务单的融合语义</text><text x="825" y="192" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#3B3B3B" text-anchor="middle">D121 图优化融的 fused 算子在这里兑现</text><path d="M 639.7,214.9 Q 822.4,214.9 1008.6,215.1 Q 1010.1,266.5 1008.5,316.4 Q 825.9,317.4 641.2,314.5 Q 640.9,265.3 639.7,214.9  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.25"/><text x="825" y="236" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">③ k 序累加链</text><text x="825" y="254" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#3B3B3B" text-anchor="middle">acc = ((bias + a0·b0) + a1·b1) + ...</text><text x="825" y="270" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#3B3B3B" text-anchor="middle">每次 addf 都是一次 IEEE 舍入——顺序即语义</text><text x="825" y="286" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#3B3B3B" text-anchor="middle">golden 必须按同序计算（k 序参考）</text><text x="825" y="302" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#3B3B3B" text-anchor="middle">D78~D80 的浮点课：换序≠换值</text><path d="M 640.9,324.4 Q 825.7,323.1 1010.0,325.4 Q 1008.7,374.3 1009.4,427.2 Q 822.9,427.2 638.8,425.3 Q 641.5,377.1 640.9,324.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.25"/><text x="825" y="346" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">④⑤ relu 的真身</text><text x="825" y="364" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#3B3B3B" text-anchor="middle">cmpf ogt（有序大于）+ select</text><text x="825" y="380" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#3B3B3B" text-anchor="middle">−0.0 走 else 分支变 +0.0（符号规整）</text><text x="825" y="396" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#3B3B3B" text-anchor="middle">D116 的 A4 模式在真实管道的重现</text><text x="825" y="412" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#3B3B3B" text-anchor="middle">「融合算子映射到循环」的具体答案</text><path d="M 49.2,459.8 Q 539.7,459.3 1028.9,458.5 Q 1031.0,487.3 1029.0,515.0 Q 538.3,515.2 49.2,515.2 Q 50.1,488.8 49.2,459.8  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.8"/><text x="540.0" y="482" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">「融合算子如何映射到实际循环」——计划第 124 天条目的原话，今天有了具体答案：</text><text x="540.0" y="502" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">fused_matmul_bias_relu = 三重 scf.for＋bias 进 iter_args 初值＋k 序乘加＋cmpf/select 收尾——融合没有魔法，只是把三个节点的语义写进一个循环体</text></svg>
