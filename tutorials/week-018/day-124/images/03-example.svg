<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="610" viewBox="0 0 1080 610"><rect x="4" y="4" width="1072" height="602" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">两个深坑：golden 的浮点口径、-O0 的连锁反应</text><path d="M 48.5,61.0 Q 289.0,62.0 528.8,60.8 Q 530.7,183.7 529.3,308.4 Q 291.9,311.1 50.9,309.9 Q 49.0,185.1 48.5,61.0  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.3"/><text x="290" y="84" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">坑 1：golden 的浮点口径</text><text x="290" y="106" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">「与 NumPy 结果比较」——计划原话，但 numpy 的 @</text><text x="290" y="124" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">用分块/向量序，kernel 用 k 序——顺序不同、舍入不同。</text><text x="290" y="148" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">解决：golden 按 k 序手写（bias 先进 acc，逐次</text><text x="290" y="166" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">addf）——与 kernel 逐位同序，bitwise 判据才成立。</text><path d="M 70.5,183.2 Q 292.2,182.6 511.4,183.7 Q 511.6,233.5 511.0,284.7 Q 290.0,285.1 69.5,284.1 Q 68.3,235.5 70.5,183.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#FDFBF6" fill-opacity="0.9"/><text x="90" y="206" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">acc = bias[j]                    # k=0 初值</text><text x="90" y="224" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">for k in range(K):</text><text x="90" y="242" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">    acc = float32(acc + a[i,k]*b[k,j])</text><text x="90" y="260" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">c[i,j] = max(acc, 0)</text><text x="290" y="298" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#4a7c59" text-anchor="middle" font-weight="bold">D78~D80 的课在 S6 落地：判据的口径就是语义</text><path d="M 549.2,58.7 Q 790.0,58.4 1031.1,59.7 Q 1029.0,183.8 1030.0,309.0 Q 789.3,310.4 548.9,310.7 Q 550.3,185.1 549.2,58.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.3"/><text x="790" y="84" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">坑 2：-O0 的连锁反应（TP6 实测）</text><text x="790" y="108" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">直觉：-O0 只是慢一点，结果应该一样？</text><text x="790" y="130" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">实测：-O0 关掉 QDQ 清理 → quantize/dequantize</text><text x="790" y="148" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">留在图里 → S2 支持集不含 quantize → E202！</text><path d="M 571.5,166.4 Q 791.8,165.0 1010.2,165.5 Q 1009.0,203.9 1011.1,242.7 Q 789.5,240.2 570.5,240.9 Q 572.5,204.1 571.5,166.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#FDFBF6" fill-opacity="0.9"/><text x="790" y="190" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">-O0 → 闸1 关 → QDQ 残留 → S2 拒收</text><text x="790" y="212" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">（E202：不支持的算子 quantize）</text><text x="790" y="264" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#C97B7B" text-anchor="middle" font-weight="bold">启示：有的优化开关不只是性能选项——</text><text x="790" y="284" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#C97B7B" text-anchor="middle">它是后续阶段能否工作的前提（清理创造机会，D121）</text><text x="540.0" y="344" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="14" fill="#3B3B3B" text-anchor="middle" font-weight="bold">S6 验证的三层口径（D116 三层法的端到端版）</text><path d="M 67.6,362.8 Q 218.1,363.0 368.4,363.4 Q 366.3,429.5 367.6,495.3 Q 220.4,493.7 69.0,493.6 Q 66.9,428.4 67.6,362.8  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.4"/><text x="218.0" y="388" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">契约层</text><text x="218.0" y="410" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">ciface 四指针签名</text><text x="218.0" y="427" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">19 参数 ABI 拆包</text><text x="218.0" y="444" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">（D115 合同第三次独立验证）</text><path d="M 389.9,362.6 Q 538.3,364.1 690.2,365.1 Q 690.2,428.0 690.3,494.8 Q 541.6,494.7 390.0,493.2 Q 388.7,426.9 389.9,362.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.4"/><text x="540.0" y="388" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">数值层</text><text x="540.0" y="410" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">12/12 点 bitwise 一致</text><text x="540.0" y="427" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">k 序 golden 口径</text><text x="540.0" y="444" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">（浮点语义逐位对齐）</text><path d="M 710.6,362.7 Q 861.0,361.3 1011.3,362.9 Q 1011.1,428.0 1011.5,493.5 Q 862.3,493.0 710.6,494.8 Q 709.7,429.0 710.6,362.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.4"/><text x="862.0" y="388" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">执行层</text><text x="862.0" y="410" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">AOT 真实机器码</text><text x="862.0" y="427" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">clang -O1 编译执行</text><text x="862.0" y="444" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">（D118 路线 1 的自动化）</text><path d="M 79.1,519.3 Q 537.2,517.3 998.8,518.6 Q 999.3,550.8 1000.0,586.0 Q 539.4,586.2 81.3,585.5 Q 79.5,552.0 79.1,519.3  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.8"/><text x="540.0" y="544" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">「打通目标项目整条链路，并与 NumPy 或 PyTorch 结果比较」——计划的验收标准今天达成，</text><text x="540.0" y="566" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">但「与 NumPy 比较」加了口径限定：k 序参考的 numpy（不是裸 @）——浮点世界里「比较」本身就需要设计</text><text x="540.0" y="582" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">明天 D125 优化开关对照实验：四组开关（无优化/仅图优化/图+Tiling/全开）× 性能数据 × 阶段收益表——今天的 12/12 是正确性基线，明天开始谈性能</text></svg>
