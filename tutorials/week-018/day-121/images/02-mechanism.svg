<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="680" viewBox="0 0 1080 680"><rect x="4" y="4" width="1072" height="672" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">为什么闸1→2→3→4 的顺序不能乱：机会是上一轮创造出来的</text><path d="M 58.5,61.3 Q 288.5,59.4 520.1,61.3 Q 520.0,154.6 519.5,251.5 Q 291.5,249.1 61.4,248.8 Q 61.7,154.7 58.5,61.3  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.3"/><text x="290" y="84" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">场景 A：闸1 创造闸2 的机会</text><text x="100" y="118" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">初始</text><text x="180" y="118" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">transpose( DQ( Q(const) ) )</text><text x="430" y="118" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#6b6257" text-anchor="start">闸2 想折叠 transpose(const)——但里面不是 const！</text><text x="100" y="164" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">闸1 后</text><text x="180" y="164" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">transpose( const' )</text><text x="430" y="164" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#6b6257" text-anchor="start">R04 折叠露出 const'（量化格点值）</text><text x="100" y="210" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">闸2 后</text><text x="180" y="210" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">const''</text><text x="430" y="210" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#6b6257" text-anchor="start">转置折叠进编译期——运行时零搬运</text><path d="M 151.2,209.8 Q 149.1,219.9 150.0,232.0 M 147.9,218.5 L 150.0,232.0 L 152.1,218.5" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" fill="none"/><path d="M 150.8,208.9 Q 151.0,215.7 150.0,222.0 M 147.9,208.5 L 150.0,222.0 L 152.1,208.5" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" fill="none"/><path d="M 560.7,58.8 Q 793.2,56.7 1021.6,58.7 Q 1020.3,153.1 1020.5,248.6 Q 787.5,249.4 558.5,251.1 Q 559.0,154.5 560.7,58.8  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.3"/><text x="790" y="84" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">场景 B：闸3 创造闸4 的机会</text><text x="600" y="118" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">初始</text><text x="680" y="118" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">matmul(reshape(reshape(x)), W)</text><text x="930" y="118" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#6b6257" text-anchor="start">融合看 matmul——输入隔两层</text><text x="600" y="164" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">闸3 后</text><text x="680" y="164" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">matmul(reshape(x), W)</text><text x="930" y="164" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#6b6257" text-anchor="start">链合并后输入更干净</text><text x="600" y="210" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">闸4 后</text><text x="680" y="210" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">fused(reshape(x), W, b)</text><text x="930" y="210" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#6b6257" text-anchor="start">结构门看得清：单使用者 ✓</text><path d="M 60.6,269.8 Q 541.5,272.1 1018.5,270.5 Q 1018.7,322.5 1019.1,377.9 Q 539.6,378.4 60.6,376.5 Q 61.5,324.9 60.6,269.8  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.3"/><text x="540.0" y="294" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">顺序错的后果（思想实验：闸4 提前）</text><text x="540.0" y="316" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">matmul+bias+relu 先融成 fused——但此时 QDQ 还没清、reshape 链还隔着两层</text><text x="540.0" y="334" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">结果：要么融合匹配失败（白跑），要么融合后 fused 挡住闸1~3 的匹配窗口（清理永远做不了）</text><text x="540.0" y="356" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#C97B7B" text-anchor="middle" font-weight="bold">破坏性最强的 Pass 必须最后做——这是一条普适的管道设计规则</text><text x="540.0" y="404" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="14" fill="#3B3B3B" text-anchor="middle" font-weight="bold">不动点循环：让「清理创造机会」自动收敛</text><path d="M 200.9,424.9 Q 542.4,422.1 880.7,423.4 Q 881.6,487.7 879.1,555.0 Q 539.9,554.4 200.3,553.5 Q 201.1,487.0 200.9,424.9  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.8"/><text x="240" y="448" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="start" font-weight="bold">第 1 轮</text><text x="330" y="448" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">闸1: R04 折叠 ✓｜闸2: 转置折叠 ✓｜闸3: reshape 合并 ✓</text><text x="820" y="448" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#4a7c59" text-anchor="start">→ 11 = 7 节点</text><text x="240" y="478" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="start" font-weight="bold">第 2 轮</text><text x="330" y="478" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">闸1: 无 ✓｜闸2: 无 ✓｜闸3: 无 ✓</text><text x="820" y="478" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#4a7c59" text-anchor="start">→ 无变化，收敛退出</text><text x="240" y="508" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="start" font-weight="bold">闸4</text><text x="330" y="508" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">（循环外）融合 matmul+add+relu</text><text x="820" y="508" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#4a7c59" text-anchor="start">→ 7 = 5 节点</text><text x="540.0" y="570" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">实测：本图 2 轮收敛（audit 日志可查）；--fixpoint-max 是保险丝——防 Pattern 互相触发抖动</text><path d="M 80.4,598.6 Q 541.2,599.4 998.9,599.3 Q 1000.1,624.6 1001.4,651.0 Q 540.3,652.3 80.7,653.1 Q 82.3,627.0 80.4,598.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.35"/><text x="540.0" y="622" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">面试口径：Pass 管道的两个经典问题——</text><text x="540.0" y="642" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">①顺序怎么定？破坏性从弱到强（等价改写→局部清理→结构融合）；②要不要循环？要——机会是上一轮创造的；但要加轮数保险丝</text></svg>
