<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="642" viewBox="0 0 1080 642">
<rect x="4" y="4" width="1072" height="634" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/>
<text x="540.0" y="32" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">零差异从哪来：四组共用同一条 S2→S5 生成路径——唯一产物分叉是组 D 的 opt -O2</text>
<path d="M 30.8,49.4 Q 151.4,49.1 270.6,49.6 Q 268.9,110.5 270.2,170.2 Q 150.7,170.5 29.3,170.0 Q 29.9,108.9 30.5,49.6 Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.42"/>
<text x="150" y="74" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">组 A 无优化（--no-fuse）</text>
<text x="150" y="93" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">S1 清理后 7 节点（分立）</text>
<text x="150" y="110" font-family="'Courier New',monospace" font-size="8.5" fill="#6b6257" text-anchor="middle">arg ─ reshape ─ matmul</text>
<text x="150" y="127" font-family="'Courier New',monospace" font-size="8.5" fill="#6b6257" text-anchor="middle">        └ add(bias) ─ relu</text>
<text x="150" y="144" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">＋2 个 const（B 与 bias）</text>
<path d="M 290.0,49.3 Q 410.7,49.5 530.9,49.6 Q 530.8,111.0 529.9,170.8 Q 408.3,170.9 289.4,169.3 Q 289.7,109.3 290.2,49.2 Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.42"/>
<text x="410" y="74" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">组 B 仅图优化（融合开）</text>
<text x="410" y="93" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">S1 终图 5 节点（融合）</text>
<text x="410" y="110" font-family="'Courier New',monospace" font-size="8.5" fill="#6b6257" text-anchor="middle">arg ─ reshape ─ fused</text>
<text x="410" y="127" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">（matmul+add+relu 融成 1 节点）</text>
<text x="410" y="144" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">＋2 个 const</text>
<path d="M 550.0,50.2 Q 670.9,50.8 790.9,49.7 Q 790.9,110.5 790.7,169.9 Q 670.7,169.4 550.3,170.5 Q 550.8,110.2 550.2,50.0 Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.42"/>
<text x="670" y="74" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">组 C 图+Tiling</text>
<text x="670" y="93" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">同 B 的 5 节点图（融合）</text>
<text x="670" y="110" font-family="'Courier New',monospace" font-size="8.5" fill="#6b6257" text-anchor="middle">tile=(2, 3, 6)</text>
<text x="670" y="127" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">只是 Variant 的配置字段</text>
<text x="670" y="144" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">gen_loop_ir_full 不读它</text>
<path d="M 810.1,50.5 Q 928.7,49.9 1049.6,49.7 Q 1048.5,109.5 1049.4,170.2 Q 929.0,170.6 809.8,170.9 Q 811.3,110.9 810.2,50.4 Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.42"/>
<text x="930" y="74" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">组 D 完整优化</text>
<text x="930" y="93" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">管道与 B/C 完全一致</text>
<text x="930" y="110" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">唯一差异在 S5 之后</text>
<text x="930" y="127" font-family="'Courier New',monospace" font-size="8.5" fill="#6b6257" text-anchor="middle">llvm_o2=True</text>
<text x="930" y="144" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">（opt -O2 后处理，见右下）</text>
<path d="M 150.0,172.0 Q 150.0,180.5 150.0,189.0 M 154.2,178.0 L 150.0,189.0 L 145.8,178.0" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" fill="none"/>
