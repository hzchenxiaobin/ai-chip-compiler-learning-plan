<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620"><rect x="4" y="4" width="1072" height="612" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">对照实验方法论：控制变量、口径声明、反例的价值</text><path d="M 51.0,58.9 Q 290.1,61.0 530.8,59.1 Q 530.1,179.9 529.2,300.8 Q 290.4,300.8 49.0,299.1 Q 50.4,179.5 51.0,58.9  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.3"/><text x="290" y="84" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">控制变量的三层设计</text><path d="M 70.0,104.6 Q 287.8,106.1 509.5,103.9 Q 509.3,130.2 508.4,160.0 Q 290.7,157.7 70.6,158.4 Q 71.6,130.7 70.0,104.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.25"/><text x="90" y="124" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="start" font-weight="bold">层 1：管道级</text><text x="90" y="140" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#3B3B3B" text-anchor="middle">四组共享 S0/S2/S4/S5/S6 同一实现——</text><text x="90" y="154" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#3B3B3B" text-anchor="middle">唯一变量是 S1 开关与 -O2（组 D）</text><path d="M 69.6,168.6 Q 290.9,166.7 509.5,169.0 Q 511.5,196.4 510.6,225.2 Q 289.3,222.2 69.1,222.5 Q 68.1,197.5 69.6,168.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.25"/><text x="90" y="188" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="start" font-weight="bold">层 2：数据级</text><text x="90" y="204" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#3B3B3B" text-anchor="middle">四组用同一份 A/B/bias（D118 手算友好数据）</text><text x="90" y="218" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#3B3B3B" text-anchor="middle">与同一份 golden（k 序参考）</text><path d="M 70.8,232.9 Q 290.5,231.8 509.2,231.0 Q 510.3,258.4 509.4,288.0 Q 291.8,285.8 71.0,287.7 Q 72.2,262.4 70.8,232.9  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.25"/><text x="90" y="252" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="start" font-weight="bold">层 3：环境级</text><text x="90" y="268" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#3B3B3B" text-anchor="middle">同机同进程族计时（fork 自同一 parent）、</text><text x="90" y="282" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#3B3B3B" text-anchor="middle">20000 次取均值、三轮复测</text><text x="290" y="308" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">对照组的合法性前提：每组都必须跑通（D124 的</text><text x="290" y="324" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">-O0 教训——「关到跑不了」的对照组没有数据）</text><path d="M 561.2,61.4 Q 793.1,59.9 1028.4,58.8 Q 1028.8,180.7 1028.7,300.8 Q 793.1,299.1 561.0,301.5 Q 562.5,180.9 561.2,61.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.3"/><text x="795" y="84" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">每个数字的口径（今天的四份声明）</text><path d="M 578.7,109.0 Q 795.0,107.4 1010.5,107.8 Q 1009.1,131.7 1010.5,151.6 Q 793.7,153.3 580.8,152.8 Q 578.0,131.3 578.7,109.0  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#FDFBF6" fill-opacity="0.9"/><text x="600" y="126" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">图节点数</text><text x="600" y="140" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#6b6257" text-anchor="start">S1 终图的节点计数（census 口径）</text><path d="M 580.6,158.6 Q 793.9,156.8 1010.8,158.7 Q 1011.7,179.8 1008.7,201.6 Q 793.6,204.1 580.9,203.0 Q 579.2,180.7 580.6,158.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#FDFBF6" fill-opacity="0.9"/><text x="600" y="176" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">.ll 行数/fmul/phi</text><text x="600" y="190" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#6b6257" text-anchor="start">stage-5.ll 的文本统计（LLVM IR）</text><path d="M 579.3,208.2 Q 793.4,208.9 1011.4,207.2 Q 1011.0,229.3 1011.3,250.6 Q 797.7,251.6 581.0,251.8 Q 581.7,230.9 579.3,208.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#FDFBF6" fill-opacity="0.9"/><text x="600" y="226" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">kernel µs/次</text><text x="600" y="240" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#6b6257" text-anchor="start">同进程 20000 次调用的均值×时钟</text><text x="600" y="253" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#6b6257" text-anchor="start">（CLOCK_MONOTONIC；非 wall-clock）</text><path d="M 580.1,259.3 Q 796.7,257.7 1010.2,258.2 Q 1010.7,279.2 1011.5,303.5 Q 796.6,303.5 579.0,303.2 Q 580.7,283.1 580.1,259.3  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#FDFBF6" fill-opacity="0.9"/><text x="600" y="276" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">正确性</text><text x="600" y="290" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#6b6257" text-anchor="start">12/12 bitwise（k 序 golden——D124 口径）</text><text x="540.0" y="330" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="14" fill="#3B3B3B" text-anchor="middle" font-weight="bold">性能反例解剖：为什么 -O2 更慢？</text><path d="M 51.3,348.6 Q 541.2,351.0 1028.6,349.9 Q 1028.8,440.4 1030.4,530.4 Q 540.4,529.0 49.9,528.9 Q 50.9,437.1 51.3,348.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.25"/><text x="90" y="374" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">事实：O2（fmul 1→6 全展开）= 0.032 µs</text><text x="90" y="392" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">      O0（循环版）       = 0.019 µs</text><text x="90" y="410" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">      展开版慢 60%，三轮复测稳定</text><text x="90" y="428" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start"></text><text x="90" y="446" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">原因 ①：kernel 太小（72 MAC）</text><text x="90" y="464" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">  循环控制开销 ~10 条指令/圈，占比本就低</text><text x="90" y="482" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">  展开省下的 &lt; 代码体积增加的 i-cache 代价</text><text x="90" y="500" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start"></text><text x="90" y="518" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">原因 ②：fmul 链串行依赖（acc 链）</text><text x="90" y="536" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">  展开不创造 ILP；向量化需要无依赖的相邻乘法</text><text x="560" y="374" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">证据：汇编 129 行（循环）→ 169 行（展开）</text><text x="560" y="392" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">      代码膨胀 +31%</text><text x="560" y="410" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start"></text><text x="560" y="428" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">教学边界（诚实声明）：</text><text x="560" y="446" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">  这不是「-O2 无用」——是「小 kernel 上展开的</text><text x="560" y="464" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">  代价 &gt; 收益」。真实规模（256³）下循环开销</text><text x="560" y="482" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">  占比高且可向量化，方向相反。</text><text x="560" y="500" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start"></text><text x="560" y="518" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">判据永远「量出来的相对差」，</text><text x="560" y="536" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">不是「级别越高越好」——D96/D153 的主题。</text><path d="M 499.7,441.5 Q 524.8,440.6 550.0,440.0 M 536.5,442.1 L 550.0,440.0 L 536.5,437.9" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" fill="none"/><path d="M 51.5,549.1 Q 540.5,549.0 1031.1,548.5 Q 1031.3,570.9 1028.8,594.9 Q 540.3,594.0 49.2,597.3 Q 51.6,575.3 51.5,549.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.8"/><text x="540.0" y="570" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">对照实验的最大收获不是「哪组快」——是反例本身：优化不是免费的，每层收益都要量出来</text><text x="540.0" y="590" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">面试口径：做过的优化里，有没有量出来是负收益的？（有——今天这例，说明你真的量过）</text></svg>
