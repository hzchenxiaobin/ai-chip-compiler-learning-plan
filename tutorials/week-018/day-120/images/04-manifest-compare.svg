对照</text><path d="M 60.8,549.5 Q 540.0,547.7 1021.5,546.5 Q 1022.9,590.0 1020.4,636.8 Q 540.9,635.9 61.4,636.2 Q 60.3,591.0 60.8,549.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.32"/><text x="540.0" y="572" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">机器合同的消费方式：json.load() 之后按字段名取值，零日志解析</text><text x="540.0" y="594" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="middle">python3 -c "import json; print(json.load(open('case-o0/manifest.json'))['opt_level'])"</text><text x="540.0" y="616" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">opt_level / tile / stages / diags / exit_code——D125 四组开关对照直接读四个 manifest 汇总收益表</text></svg>
