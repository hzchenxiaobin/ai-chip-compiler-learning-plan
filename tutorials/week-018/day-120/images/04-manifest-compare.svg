<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660"><rect x="4" y="4" width="1072" height="652" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="32" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">manifest.json 真机对照：-O0 与 -O2 拿到两份不同的机器回执</text><text x="540.0" y="52" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">冻结样本来自 outputs/（2026-11-14 真机运行）——字段名即接口，stages 条目按序摘录</text><path d="M 61.5,62.2 Q 282.3,64.2 499.0,63.5 Q 497.2,83.1 499.7,102.9 Q 278.8,100.7 58.5,100.9 Q 58.2,80.7 61.5,62.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.5"/><text x="280" y="88" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">minic gemm.mlir -O0 --tile 8,8,8 -o case-o0/</text><path d="M 578.9,61.0 Q 800.1,62.0 1021.2,61.5 Q 1022.4,79.9 1019.3,101.7 Q 799.3,102.4 578.7,103.3 Q 580.0,82.6 578.9,61.0  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.5"/><text x="800" y="88" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">minic gemm.mlir -O2 --tile 16,16,16 -o case-manifest/</text><path d="M 280.1,104.9 Q 279.8,114.5 280.0,128.0 M 277.9,114.5 L 280.0,128.0 L 282.1,114.5" stroke="#3B3B3B" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M 800.0,105.0 Q 801.8,115.8 800.0,128.0 M 797.9,114.5 L 800.0,128.0 L 802.1,114.5" stroke="#3B3B3B" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M 59.8,129.7 Q 278.4,132.4 500.8,131.2 Q 499.6,309.4 500.9,487.4 Q 280.8,486.6 59.0,486.1 Q 59.3,307.8 59.8,129.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.3"/><text x="85" y="154" font-family="'Courier New',monospace" font-size="11.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">case-o0/manifest.json</text><text x="85" y="176" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">"opt_level": 0,</text><text x="85" y="193" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">"tile": [8, 8, 8],</text><text x="85" y="210" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">"stages": [</text><text x="95" y="228" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">[S0] 读入 gemm.mlir：38 行、约 30 条 op</text><text x="95" y="243.5" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">[S1] 图优化：-O0 跳过（shape 推导＋简化＋融合）</text><text x="95" y="259.0" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">[S2] 循环生成：骨架（mini.matmul→scf.for）</text><text x="95" y="274.5" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">[S3] Tiling：-O0 跳过（tile→边界常量＋钳制）</text><text x="95" y="290.0" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">[S4] LLVM Lowering：骨架（七 pass 管道）</text><text x="95" y="305.5" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">[S5] 代码生成：骨架（translate→.ll→llc/clang）</text><text x="95" y="321.0" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">[S6] 验证：骨架（golden 逐点 bitwise）</text><text x="85" y="338.5" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">],</text><path d="M 80.3,345.0 Q 202.5,344.6 320.7,344.4 Q 318.7,352.8 319.7,361.4 Q 200.1,363.1 78.5,361.9 Q 78.8,353.9 80.3,345.0  Z" stroke="#C97B7B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="#FDFBF6" fill-opacity="0" stroke-dasharray="4,3"/><text x="85" y="356.5" font-family="'Courier New',monospace" font-size="9.5" fill="#C97B7B" text-anchor="start" font-weight="bold">"diags": ["W102"],</text><text x="85" y="374.5" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">"exit_code": 0</text><text x="85" y="400.5" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">↳ S1/S3 记「跳过」——跳过也是决策，manifest 如实记录</text><text x="85" y="418.5" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#C97B7B" text-anchor="start">↳ W102 进 diags：-O0 仍传了 tile；警告不改退出码（仍 0）</text><path d="M 578.6,131.1 Q 801.2,128.7 1019.7,128.8 Q 1017.5,305.8 1019.1,487.0 Q 798.7,487.0 581.2,485.0 Q 580.2,309.9 578.6,131.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.3"/><text x="605" y="154" font-family="'Courier New',monospace" font-size="11.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">case-manifest/manifest.json</text><text x="605" y="176" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">"opt_level": 2,</text><text x="605" y="193" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">"tile": [16, 16, 16],</text><text x="605" y="210" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">"stages": [</text><text x="615" y="228" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">[S0] 读入 gemm.mlir：38 行、约 30 条 op</text><path d="M 599.1,230.4 Q 729.3,230.3 863.1,231.4 Q 860.7,241.0 861.9,250.3 Q 729.8,248.6 598.4,248.1 Q 597.7,239.0 599.1,230.4  Z" stroke="#8a6d3b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="#FDFBF6" fill-opacity="0" stroke-dasharray="4,3"/><text x="615" y="243.5" font-family="'Courier New',monospace" font-size="9.5" fill="#8a6d3b" text-anchor="start"