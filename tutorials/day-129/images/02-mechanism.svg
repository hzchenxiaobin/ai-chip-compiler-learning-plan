<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500"><rect x="4" y="4" width="1072" height="492" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">特化收益的机器码证据：O2 为什么敢展开静态版？</text><path d="M 48.8,59.8 Q 290.4,59.5 530.2,59.8 Q 531.0,199.8 530.2,338.6 Q 290.4,340.7 48.8,339.2 Q 49.0,198.9 48.8,59.8  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.3"/><text x="290" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">静态特化版（4×6×3）</text><text x="90" y="112" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">%cK = arith.constant 6 : index      ← K 是常量</text><text x="90" y="134" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">...Lowering...</text><text x="90" y="156" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">%48 = icmp slt i64 %46, 6            ← 常量比较</text><text x="90" y="178" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">...opt -O2 展开...</text><text x="90" y="200" font-family="'Courier New',monospace" font-size="10" fill="#4a7c59" text-anchor="start">fmul × 18（K 循环展开＋部分展开）</text><text x="90" y="222" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">phi × 1（循环变量消掉）</text><text x="90" y="266" font-family="'Courier New',monospace" font-size="10" fill="#4a7c59" text-anchor="start">为什么敢展开：优化器能证明</text><text x="90" y="288" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">「循环恰好跑 6 次」——unroll 安全</text><path d="M 549.2,60.5 Q 791.2,61.6 1029.0,61.4 Q 1030.4,200.2 1031.4,340.5 Q 793.5,339.9 551.5,340.1 Q 549.1,199.6 549.2,60.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.3"/><text x="790" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">动态版（memref&lt;?x?x&gt;）</text><text x="590" y="112" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">%K = memref.dim %a, %c1              ← 运行期读</text><text x="590" y="134" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">...Lowering...</text><text x="590" y="156" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">%54 = icmp slt i64 %52, %30          ← SSA 比较</text><text x="590" y="178" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">...opt -O2 保守...</text><text x="590" y="200" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">fmul × 2（只敢部分展开）</text><text x="590" y="222" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">phi × 10（控制流反而变多）</text><text x="590" y="266" font-family="'Courier New',monospace" font-size="10" fill="#C97B7B" text-anchor="start">为什么不敢：优化器无法证明</text><text x="590" y="288" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">循环次数——unroll 不安全</text><path d="M 48.5,360.1 Q 536.5,361.6 1028.8,358.8 Q 1026.6,420.3 1028.5,479.9 Q 540.7,481.7 49.6,480.3 Q 49.4,421.0 48.5,360.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.8"/><text x="540.0" y="386" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">展开的安全性证明——优化器的视角</text><text x="540.0" y="410" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle">静态：迭代次数 = ⌈(6−0)/1⌉ = 6（编译期可算）→ 展开成 6 份乘加，正确性可证</text><text x="540.0" y="434" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle">动态：迭代次数 = ⌈(%30−0)/1⌉，%30 运行期才知道 → 展开需要「次数≥N」的前提，无法证明</text><text x="540.0" y="458" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#4a7c59" text-anchor="middle" font-weight="bold">→ 特化的本质：把「运行期才知道的事实」提前到编译期告诉优化器——确定性是优化器的燃料</text></svg>
