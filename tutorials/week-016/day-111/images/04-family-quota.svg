<text x="600" y="624" font-size="10" fill="#6b6257" text-anchor="middle">模型只砍数量、实测定名次——top-k 就是这条规矩的旋钮（预测极差 0.0~0.2% ≪ 跨进程漂移 ~8.6%）</text>
