<text x="266" y="311" font-size="9.5" fill="#6b6257" text-anchor="middle">part1 已写的 28 行一条不重写、一条不重测</text>
<text x="266" y="378" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">合计 110 行 = screen 98 + final 12</text>
<text x="266" y="430" font-size="9.5" fill="#6b6257" text-anchor="middle">每行一条自包含记录（env＋protocol 随行，过门样本全带）</text>
<text x="266" y="448" font-size="9.5" fill="#6b6257" text-anchor="middle">中途死掉，损失最多『当时正在测的那一个候选』</text>
