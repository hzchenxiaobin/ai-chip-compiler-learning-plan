<path d="M 520.7,203.5 Q 729.8,202.3 935.4,203.4 Q 933.6,250.4 934.9,300.4 Q 728.8,301.9 519.6,300.0 Q 520.9,249.9 520.7,203.5  Z" stroke="#3B3B3B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.35"/>
<text x="728" y="221" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">进程 part2：按键跳过 28，续测 82 到终点</text>
<text x="728" y="239" font-size="9.5" fill="#3B3B3B" text-anchor="middle">新测 82 条 / 跳过 28 条；编译 50 次（缓存命中 32，Σcompile 15.6 ms）</text>
<text x="728" y="256" font-size="9.5" fill="#3B3B3B" text-anchor="middle">墙钟 60.7 s（bench Σwall 60.6 s），内核调用 994 次</text>
<text x="728" y="273" font-size="9.5" fill="#6b6257" text-anchor="middle">跳过已完成的候选：0 次测量、0 次编译、0 行重写</text>
<text x="728" y="290" font-size="9.5" fill="#6b6257" text-anchor="middle">唯一重做的是『读旧文件、查键』本身——便宜到不记账</text>
<path d="M 518.9,310.1 Q 727.3,312.8 934.7,311.4 Q 933.5,358.0 935.0,407.2 Q 726.3,406.6 519.0,405.9 Q 520.0,359.9 518.9,310.1  Z" stroke="#3B3B3B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="#EDE7DA" fill-opacity="0.7"/>
<text x="728" y="329" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">续跑键 = (shape, kernel 名（含 /no-tail）, stage)</text>
<text x="728" y="347" font-size="9.5" fill="#3B3B3B" text-anchor="middle">查键只看名字、不编译——缓存账不被『查个名字』污染</text>
<text x="728" y="364" font-size="9.5" fill="#3B3B3B" text-anchor="middle">('S1','tiled-matmul/32³ ijk U=1','screen') → 已在 → 跳过</text>
<text x="728" y="381" font-size="9.5" fill="#3B3B3B" text-anchor="middle">('S2','tiled-matmul/96³ kij U=1','screen') → 不在 → 测量并追加</text>
<path d="M 519.6,418.3 Q 728.1,418.2 935.6,417.6 Q 935.7,447.8 936.6,480.0 Q 725.9,480.8 519.5,480.2 Q 519.7,447.8 519.6,418.3  Z" stroke="#3B3B3B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.32"/>
<text x="728" y="435" font-size="10.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">续跑的真实代价（账上如实记）</text>
<text x="728" y="453" font-size="9.5" fill="#3B3B3B" text-anchor="middle">编译缓存不跨进程：part2 重编它新测的 50 个候选，</text>
<text x="728" y="470" font-size="9.5" fill="#3B3B3B" text-anchor="middle">其中 24 个 part1 编过（32³/64³ 公共配置）——血统不变，账要重付</text>
