<text x="490" y="530" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">对账：28 + 82 = 110 条 ｜ 8.0 + 60.7 = 68.7 s ｜ 364 + 994 = 1,358 次内核调用（与 search-cost.txt 总账一致）</text>
<text x="490" y="552" font-size="10.5" fill="#3B3B3B" text-anchor="middle">part2 没有为 part1 已完成的任何一条记录多花一次测量；</text>
<text x="490" y="572" font-size="10.5" fill="#C97B7B" text-anchor="middle">切断点钉在 shape 边界——同一张排名表不混两个进程的读数（D107 实测跨进程漂移约 8.6%）</text>
<text x="490" y="626" font-size="9.5" fill="#6b6257" text-anchor="middle">数字全部来自 outputs/：resume-part1.txt、tune-run.txt、tune-summary.json、results.jsonl、search-cost.txt</text>
