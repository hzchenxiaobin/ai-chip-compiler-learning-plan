<text x="526" y="613" font-size="9.6" fill="#6b6257" text-anchor="start">拧回窄域读数回落——漂移是 regime 的函数，不是运气</text>
<text x="500" y="648" font-size="10" fill="#6b6257" text-anchor="middle">一句话：单价 = f(进程, regime, 窗口)——跨过 256 的行涨得最凶，domain_check 拦的就是这条边界</text>
