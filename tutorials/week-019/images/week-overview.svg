<text x="862" y="179" font-size="10.5" fill="#3b352d" text-anchor="start">不只是改常量，是一串涟漪</text>
<text x="862" y="197" font-size="10.5" fill="#3b352d" text-anchor="start">特化·回退·池化三件配套</text>
