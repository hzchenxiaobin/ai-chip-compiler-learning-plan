<text x="364" y="179" font-size="10.5" fill="#84796a" text-anchor="start">审计表是地图：11 个决策点各归谁</text>
<text x="364" y="197" font-size="10.5" fill="#84796a" text-anchor="start">D128~D132 逐格动刀，D133 对照复盘成职责迁移表</text>
