<text x="36" y="42" font-size="12" fill="#84796a" text-anchor="start">AI 芯片编译器 168 天学习计划</text>
<text x="1164" y="42" font-size="12" fill="#84796a" text-anchor="end">Week 19／24 · 第五阶段：端到端编译与 Runtime</text>
<text x="600" y="84" font-size="28" fill="#3b352d" text-anchor="middle" font-weight="bold">第 19 周：Runtime 与动态 Shape</text>
<text x="600" y="108" font-size="13" fill="#3b352d" text-anchor="middle">把一串决策从编译期搬进运行期：先审计、逐格翻转、三件配套，六天长出一个 Runtime 层</text>
