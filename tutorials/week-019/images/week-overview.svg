<text x="52" y="179" font-size="10.5" fill="#3b352d" text-anchor="start">Shape·Stride·Tile·Kernel 全在编译期固化</text>
<text x="52" y="197" font-size="10.5" fill="#3b352d" text-anchor="start">换个 shape 就要重编译，还有两格 NONE</text>
