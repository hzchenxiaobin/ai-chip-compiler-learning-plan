idth="2" stroke-linecap="round" fill="none" stroke-dasharray="6 4"/><text x="755.0" y="216.0" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">未命中 miss</text><path d="M 60.8,253.5 Q 251.1,253.0 441.3,253.6 Q 442.1,354.6 441.3,453.4 Q 248.3,452.5 59.5,454.5 Q 59.1,355.8 60.8,253.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.42"/><text x="250" y="280" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">特化层（静态 kernel＋O2）</text><text x="250" y="302" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">shape 常量编进指令</text><text x="250" y="322" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#4a7c59" text-anchor="middle" font-weight="bold">O2 敢展开：fmul 2 → 18（9 倍）</text><text x="250" y="344" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">phi 10 → 1（循环控制消掉）</text><text x="250" y="366" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">150 行 .ll（膨胀但快）</text><text x="250" y="388" font-family="'Courier New',monospace" font-size="9.5" fill="#6b6257" text-anchor="middle">产物：spec-4x6x3/libkernel.dylib</text><text x="250" y="410" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">50000 B/份（代码大小记录）</text><path d="M 640.1,252.7 Q 828.7,252.8 1020.4,252.9 Q 1020.0,353.6 1019.0,455.4 Q 828.2,453.7 639.6,453.0 Q 641.4,352.0 640.1,252.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.42"/><text x="830" y="280" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">动态层（memref&lt;?x?x&gt; 兜底）</text><text x="830" y="302" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">shape 从描述符读回</text><text x="830" y="322" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#A9C4D4" text-anchor="middle" font-weight="bold">任何 shape 都能跑</text><text x="830" y="344" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">O2 保守：fmul=2、phi=10</text><text x="830" y="366" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">141 行 .ll（紧凑但慢）</text><text x="830" y="388" font-family="'Courier New',monospace" font-size="9.5" fill="#6b6257" text-anchor="middle">产物：e2-dynamic/libdyn.dylib</text><text x="830" y="410" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">一份 .ll 吃任意 shape（D128）</text><path d="M 59.1,479.1 Q 540.7,479.2 1018.5,479.6 Q 1018.1,528.4 1020.3,580.6 Q 541.1,580.9 59.0,579.8 Q 57.4,530.1 59.1,479.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.8"/><text x="540.0" y="506" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">两层分发的本质：把「优化空间」与「灵活性」解耦——</text><text x="540.0" y="530" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">热点 shape 走特化（O2 展开的收益全额兑现）、长尾 shape 走动态（正确性兜底不拒收）</text><text x="540.0" y="552" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">真实世界对应：PyTorch 2.x 的 shape 特化缓存、TVM 的 shape-generic fallback——三件套的第一件</text><text x="540.0" y="590" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">（第二件缓存＝今天的 E3 幂等；第三件回退＝明天 D130）</text></svg>
