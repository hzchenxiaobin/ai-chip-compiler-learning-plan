<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="574" viewBox="0 0 1080 574"><rect x="4" y="4" width="1072" height="566" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">三件套进度与特化的成本账</text><path d="M 61.3,59.5 Q 211.7,59.4 359.5,60.2 Q 359.7,131.4 359.3,198.7 Q 211.0,200.3 61.3,199.4 Q 62.8,128.8 61.3,59.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.4"/><text x="210" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">特化（今天）</text><text x="210" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">按 shape 编译专用 kernel</text><text x="210" y="132" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">静态签名→O2 展开</text><text x="210" y="152" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">收益：fmul 2→18</text><path d="M 389.0,59.5 Q 539.4,58.6 689.4,58.5 Q 689.8,127.3 689.5,200.3 Q 541.8,198.5 390.4,199.0 Q 391.9,129.4 389.0,59.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.4"/><text x="540" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">缓存（E3 雏形）</text><text x="540" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">特化产物按 shape 复用</text><text x="540" y="132" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">幂等 register</text><text x="540" y="152" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">磁盘=libkernel.dylib</text><path d="M 718.5,59.7 Q 867.0,61.9 1019.5,61.3 Q 1018.1,131.0 1018.8,199.4 Q 868.1,198.3 721.0,200.8 Q 721.1,131.1 718.5,59.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.4"/><text x="870" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">回退（明天 D130）</text><text x="870" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">miss 时走动态兜底</text><text x="870" y="132" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">错误时的降级路径</text><text x="870" y="152" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">真实系统：OOM→CPU</text><text x="540.0" y="240" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="14" fill="#3B3B3B" text-anchor="middle" font-weight="bold">特化的成本账（不是免费的午餐）</text><path d="M 81.4,261.7 Q 543.3,262.1 1001.2,261.8 Q 1002.4,288.9 1000.9,314.2 Q 539.9,313.0 79.0,313.7 Q 78.9,287.8 81.4,261.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.2"/><text x="110" y="284" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">编译时间</text><text x="280" y="284" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">每个 shape 全管道一次（~1s 教学版）</text><text x="280" y="304" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="start">首次调用慢——JIT 编译延迟</text><path d="M 78.6,319.2 Q 539.2,318.7 999.9,318.5 Q 1001.6,344.5 999.9,372.3 Q 541.4,371.3 80.2,371.1 Q 81.1,346.7 78.6,319.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.2"/><text x="110" y="342" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">代码体积</text><text x="280" y="342" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">每份特化 50000 B（.dylib 含元数据）</text><text x="280" y="362" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="start">shape 种类多→体积膨胀</text><path d="M 80.2,376.8 Q 538.9,378.4 999.4,379.4 Q 998.8,403.6 999.4,428.6 Q 540.4,430.3 78.7,431.2 Q 80.5,403.1 80.2,376.8  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.2"/><text x="110" y="400" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">维护复杂度</text><text x="280" y="400" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">分发器＋两层产物＋统计</text><text x="280" y="420" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="start">调试要区分走的是哪层</text><path d="M 79.4,436.7 Q 537.9,436.9 999.9,434.9 Q 998.7,463.4 1000.6,489.2 Q 540.5,486.7 78.9,487.1 Q 79.9,462.5 79.4,436.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.2"/><text x="110" y="458" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">覆盖盲区</text><text x="280" y="458" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">只特化注册过的 shape</text><text x="280" y="478" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="start">长尾 shape 永远走慢路</text><path d="M 80.4,500.4 Q 541.8,499.5 999.6,500.1 Q 999.3,528.4 999.0,555.2 Q 541.7,554.9 80.1,554.6 Q 79.3,526.6 80.4,500.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.8"/><text x="540.0" y="524" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">特化决策的判据：shape 的分布（热点集中→特化赚；shape 均匀→特化亏）</text><text x="540.0" y="544" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">真实系统的做法：按调用频率阈值触发特化（PyTorch 2.x：同 shape 出现 N 次后 compile）——D136 的观测数据是输入</text></svg>
