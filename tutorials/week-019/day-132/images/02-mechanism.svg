<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="648" viewBox="0 0 1080 648"><rect x="4" y="4" width="1072" height="640" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">Stream/Event 的语义：队列、顺序执行、完成通知</text><path d="M 61.5,58.4 Q 289.2,61.5 519.0,60.6 Q 518.9,210.5 519.9,361.3 Q 291.5,360.0 60.5,361.4 Q 62.4,207.9 61.5,58.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.3"/><text x="290" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">Stream（命令队列）</text><text x="90" y="112" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="start">launch(kernel, args, event)</text><text x="90" y="134" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">  → 入队（0.01ms）立即返回</text><text x="90" y="156" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">  → 调用方继续跑</text><text x="90" y="200" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">工作线程（GPU 的执行单元）：</text><text x="90" y="222" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">  按提交顺序逐个执行</text><text x="90" y="244" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">  （同 stream 保序——顺序语义）</text><text x="90" y="288" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="start">kernel 完成 → event.set()</text><text x="90" y="310" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="start">  → 等这个 event 的各方被唤醒</text><path d="M 560.9,59.8 Q 790.8,57.8 1018.7,59.4 Q 1018.1,209.6 1021.3,359.7 Q 790.6,358.4 560.0,358.6 Q 561.3,207.8 560.9,59.8  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.3"/><text x="790" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">Event（完成通知）</text><path d="M 601.6,107.3 Q 689.2,106.3 780.3,105.5 Q 781.3,126.6 781.6,150.2 Q 690.6,148.2 600.9,149.4 Q 602.3,126.2 601.6,107.3  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#FDFBF6" fill-opacity="0.9"/><text x="690" y="132" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">未置位</text><path d="M 782.7,126.5 Q 810.1,127.4 836.0,128.0 M 822.5,130.1 L 836.0,128.0 L 822.5,125.9" stroke="#3B3B3B" stroke-width="2" stroke-linecap="round" fill="none"/><text x="810.0" y="120.0" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">set()</text><path d="M 841.2,105.8 Q 922.1,108.2 1000.4,106.4 Q 1002.6,129.6 1001.5,151.1 Q 921.4,150.4 840.0,151.5 Q 840.8,127.7 841.2,105.8  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.5"/><text x="920" y="132" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">已置位</text><text x="790" y="180" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">wait()：阻塞到置位（同步点）</text><text x="790" y="200" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">is_set：轮询（非阻塞查询）</text><text x="790" y="232" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">谁 set：kernel 完成时（工作线程）</text><text x="790" y="252" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">谁 wait：需要结果的调用方/下游 kernel</text><path d="M 600.7,280.2 Q 789.5,280.1 980.2,280.2 Q 978.5,309.2 979.7,338.8 Q 789.8,337.6 600.3,340.1 Q 599.2,310.6 600.7,280.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.8"/><text x="790" y="302" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">CUDA 对照：cuEventRecord/cuEventSynchronize</text><text x="790" y="322" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">cuStreamSynchronize＝等整条队列清空</text><text x="540.0" y="396" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">CPU 语义 → 异步设备 的概念映射</text><path d="M 80.4,418.7 Q 541.0,418.3 1000.1,419.4 Q 998.3,438.3 999.8,455.3 Q 541.3,455.6 78.9,452.5 Q 78.2,435.1 80.4,418.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#B8A7CE" fill-opacity="0.22"/><text x="300" y="442" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">函数调用</text><text x="700" y="442" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">Launch（提交到队列，不执行）</text><path d="M 79.3,460.3 Q 538.0,459.9 999.1,461.6 Q 1001.7,480.9 1000.0,495.9 Q 541.6,495.9 79.6,495.5 Q 78.6,477.2 79.3,460.3  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#B8A7CE" fill-opacity="0.22"/><text x="300" y="484" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">返回值</text><text x="700" y="484" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">Event（完成通知——要主动等）</text><path d="M 80.8,502.2 Q 542.4,502.7 1001.2,502.9 Q 1000.5,521.7 1000.3,539.5 Q 541.2,538.1 79.7,537.3 Q 79.6,520.4 80.8,502.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#B8A7CE" fill-opacity="0.22"/><text x="300" y="526" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">调用返回＝结果就绪</text><text x="700" y="526" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">分离：launch 返回≠结果就绪</text><path d="M 78.5,545.2 Q 537.5,543.0 1000.0,544.9 Q 999.4,562.6 1000.5,581.4 Q 541.9,583.0 80.4,581.6 Q 80.3,563.4 78.5,545.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#B8A7CE" fill-opacity="0.22"/><text x="300" y="568" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">内存池归还（D131）</text><text x="700" y="568" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">必须挂 event（等读方完成再 release）</text><path d="M 79.4,585.3 Q 538.9,586.3 1000.6,586.7 Q 999.8,605.7 998.8,621.1 Q 539.5,619.0 79.0,620.6 Q 81.4,604.4 79.4,585.3  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#B8A7CE" fill-opacity="0.22"/><text x="300" y="610" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">隐式同步（D127）</text><text x="700" y="610" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">显式化：每个需要结果的点都是同步点</text></svg>
