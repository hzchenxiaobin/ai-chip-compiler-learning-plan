<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620"><rect x="4" y="4" width="1072" height="612" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">三个场景的依赖与同步点标注（E3 分析）</text><path d="M 58.4,59.6 Q 536.4,60.5 1018.7,58.9 Q 1020.9,119.0 1018.9,179.2 Q 540.8,179.6 60.8,179.8 Q 60.7,120.6 58.4,59.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.3"/><text x="110" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">场景 A：minic 现状（融合后）</text><text x="540" y="112" font-family="'Courier New',monospace" font-size="11" fill="#3B3B3B" text-anchor="middle">fused_kernel [launch] → event → 调用方读结果</text><text x="540" y="136" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#4a7c59" text-anchor="middle">同步点：1 个——融合把三个算子打进一个 kernel，无中间依赖（D121 的收益在异步世界重现）</text><path d="M 60.3,196.1 Q 540.7,198.2 1018.4,197.3 Q 1019.5,265.2 1020.4,335.8 Q 539.3,337.2 59.2,336.6 Q 57.8,266.6 60.3,196.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.25"/><text x="110" y="222" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">场景 B：假想未融合链</text><text x="540" y="248" font-family="'Courier New',monospace" font-size="11" fill="#3B3B3B" text-anchor="middle">matmul [launch] → bias [launch] → relu [launch] → event</text><text x="540" y="272" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">同 stream：自动按序（顺序执行语义）——无需中间 event</text><text x="540" y="294" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#C97B7B" text-anchor="middle">跨 stream：必须 event——bias_stream 先 wait matmul_event</text><text x="540" y="318" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">依赖是静态的（编译期已知）→ Compiler 排拓扑序；同步是动态的 → Runtime 建 event</text><path d="M 58.8,351.9 Q 538.6,350.5 1020.4,352.4 Q 1019.9,419.0 1021.2,483.4 Q 541.7,481.2 60.7,481.3 Q 61.0,415.3 58.8,351.9  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.25"/><text x="110" y="378" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">场景 C：池化内存×异步（D131 的伏笔）</text><text x="540" y="404" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#C97B7B" text-anchor="middle" font-weight="bold">release(buf) 必须等读 buf 的最后一个 kernel 完成！</text><text x="540" y="428" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">同步世界：调用方读完后 release——顺序天然保证</text><text x="540" y="450" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">异步世界：kernel 还在跑、调用方已 release——下一个 acquire 拿到正在被写的 buf！数据竞争</text><text x="540" y="472" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#4a7c59" text-anchor="middle">解法：release 挂 event（最后一次使用完成才归还）——PyTorch CUDACachingAllocator 的 record_stream 同思路</text><path d="M 58.8,498.4 Q 538.1,497.0 1018.9,499.3 Q 1021.0,553.6 1021.2,608.0 Q 541.2,609.1 58.5,607.1 Q 56.5,553.5 58.8,498.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.8"/><text x="540.0" y="522" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">Compiler/Runtime 分工（异步版·计划条目产出）</text><text x="540.0" y="548" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">Compiler：算子依赖图（静态）→ launch 拓扑序＋内存规划（谁的生命周期跨几个 kernel）</text><text x="540.0" y="570" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">Runtime：stream 分配策略、event 创建/等待、内存生命周期管理（event 触发 release）</text><text x="540.0" y="592" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">调用方：最终同步（wait 最后的 event）＋读结果——三层各管一段，同步点显式化</text></svg>
