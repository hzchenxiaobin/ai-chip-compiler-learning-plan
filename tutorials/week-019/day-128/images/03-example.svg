<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="684" viewBox="0 0 1080 684"><rect x="4" y="4" width="1072" height="676" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">「动态 Shape 不只是把常量改成变量」——完整差异清单</text><path d="M 59.6,60.1 Q 537.7,61.4 1020.1,61.5 Q 1019.5,98.2 1020.6,135.6 Q 541.2,134.6 59.5,135.8 Q 58.1,98.2 59.6,60.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.3"/><text x="90" y="84" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="start" font-weight="bold">① 签名形态</text><text x="280" y="84" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">memref&lt;4x6, strided&lt;[6,1]&gt;&gt; → memref&lt;?x?x&gt;</text><text x="90" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">类型里的 shape 消失、描述符扛起语义</text><path d="M 60.4,142.6 Q 542.4,142.1 1021.4,142.5 Q 1021.6,180.4 1018.6,219.5 Q 538.0,221.5 60.6,219.9 Q 60.8,180.8 60.4,142.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.3"/><text x="90" y="168" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="start" font-weight="bold">② shape 读回</text><text x="280" y="168" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">arith.constant 4 → memref.dim + extractvalue</text><text x="90" y="196" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">每个用 shape 的地方都要从描述符读（+6 处）</text><path d="M 60.2,229.4 Q 538.2,229.5 1018.5,227.9 Q 1020.6,264.0 1019.9,304.3 Q 540.1,303.8 58.5,304.3 Q 57.4,267.1 60.2,229.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.3"/><text x="90" y="252" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="start" font-weight="bold">③ 输出分配</text><text x="280" y="252" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">memref.alloc() : memref&lt;4x3&gt; → memref.alloc(%M, %N)</text><text x="90" y="280" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">输出 shape 也是运行期的——alloc 带 shape 参数</text><path d="M 60.8,312.1 Q 540.5,312.5 1020.6,311.1 Q 1019.9,349.3 1019.1,388.8 Q 539.6,389.3 60.7,386.4 Q 59.7,348.2 60.8,312.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.3"/><text x="90" y="336" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="start" font-weight="bold">④ 循环边界</text><text x="280" y="336" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">icmp slt %38, 4 → icmp slt %44, %29</text><text x="90" y="364" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">比较的操作数从立即数变 SSA 值</text><path d="M 58.7,395.9 Q 541.2,397.6 1019.2,395.3 Q 1020.9,432.7 1021.1,470.8 Q 542.0,470.1 61.4,473.3 Q 58.6,435.3 58.7,395.9  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#B8A7CE" fill-opacity="0.3"/><text x="90" y="420" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="start" font-weight="bold">⑤ 验证语义</text><text x="280" y="420" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">一个 golden → 按 shape 参数化验证</text><text x="90" y="448" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">golden 生成器要吃 shape（E3 的三组）</text><path d="M 61.1,478.6 Q 539.5,478.5 1019.3,480.5 Q 1019.0,516.7 1018.6,556.0 Q 538.7,556.6 60.7,555.3 Q 59.3,516.0 61.1,478.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.3"/><text x="90" y="504" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="start" font-weight="bold">⑥ 性能语义</text><text x="280" y="504" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">编译器优化空间缩小（边界未知→不敢展开/向量化）</text><text x="90" y="532" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">D125 的 -O2 展开在动态版会消失！</text><path d="M 59.0,572.4 Q 539.7,573.5 1019.5,575.0 Q 1021.0,617.9 1021.4,664.2 Q 542.8,663.2 60.5,663.1 Q 59.6,615.9 59.0,572.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.8"/><text x="540.0" y="598" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">静态 vs 动态的权衡（今天有了实测数字）</text><text x="540.0" y="622" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">静态：每 shape 编一次（编译成本×N）＋优化空间大（-O2 敢展开）｜动态：一份 .ll 走天下（+9% 头部）＋优化保守</text><text x="540.0" y="644" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#4a7c59" text-anchor="middle">两全其美的路：动态签名兜底＋按热点 shape 特化（D129）＋缓存特化产物——PyTorch 2.x 的三件套明天开始搭</text></svg>
