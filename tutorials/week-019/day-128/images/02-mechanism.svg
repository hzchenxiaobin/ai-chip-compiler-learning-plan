<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630"><rect x="4" y="4" width="1072" height="622" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">运行期 shape 的数据流：从调用方数组到循环边界的三跳</text><path d="M 61.4,60.8 Q 210.5,60.3 361.0,60.1 Q 361.3,119.0 361.6,179.9 Q 210.2,178.8 59.5,179.3 Q 60.2,120.6 61.4,60.8  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.35"/><text x="210" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">跳① 调用方</text><text x="210" y="108" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">numpy 数组 A.shape=(4,6)</text><text x="210" y="128" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="middle">make_desc: sh[0]=4, sh[1]=6</text><path d="M 363.0,120.7 Q 374.3,119.0 388.0,120.0 M 374.5,122.1 L 388.0,120.0 L 374.5,117.9" stroke="#3B3B3B" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M 388.9,59.6 Q 540.3,60.2 689.6,58.9 Q 691.1,120.9 689.0,179.9 Q 540.0,181.7 391.5,180.6 Q 390.7,120.8 388.9,59.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.35"/><text x="540" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">跳② 描述符</text><text x="540" y="108" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">56B 结构体经 ABI 传给 kernel</text><text x="540" y="128" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="middle">ciface 拆包→14 个裸参数</text><path d="M 693.5,121.5 Q 705.6,119.3 718.0,120.0 M 704.5,122.1 L 718.0,120.0 L 704.5,117.9" stroke="#3B3B3B" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M 718.7,59.4 Q 869.1,59.5 1019.4,59.9 Q 1021.2,122.7 1020.6,181.4 Q 869.7,179.7 721.6,179.8 Q 721.5,121.7 718.7,59.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.35"/><text x="870" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">跳③ kernel</text><text x="870" y="108" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">memref.dim → extractvalue sizes[0]</text><text x="870" y="128" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="middle">%29 = extractvalue ...3, 0</text><path d="M 60.9,201.3 Q 540.7,199.7 1020.7,200.6 Q 1020.0,255.7 1020.1,311.4 Q 538.8,311.9 60.3,310.7 Q 59.2,256.4 60.9,201.3  Z" stroke="#3B3B3B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="#FDFBF6" fill-opacity="0.95"/><text x="540.0" y="224" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">循环边界的最终形态（.ll 原文对照）</text><text x="120" y="250" font-family="'Courier New',monospace" font-size="10.5" fill="#C97B7B" text-anchor="start">静态：%39 = icmp slt i64 %38, 4          ← 4 是编译期吃进的常量</text><text x="120" y="274" font-family="'Courier New',monospace" font-size="10.5" fill="#9CBF8E" text-anchor="start">动态：%45 = icmp slt i64 %44, %29        ← %29 是跳①②③传来的 sizes[0]</text><text x="120" y="298" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">同一条 icmp 指令、两种操作数来源——这就是「Shape=COMPILE」与「Shape=RUNTIME」在机器码层的全部差别</text><text x="540.0" y="344" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="14" fill="#3B3B3B" text-anchor="middle" font-weight="bold">D114「暂不支持清单」第 1 条的正面突破</text><path d="M 60.1,365.3 Q 537.7,363.8 1019.0,363.1 Q 1018.8,430.5 1020.6,495.0 Q 540.6,494.3 58.9,493.1 Q 58.4,428.1 60.1,365.3  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#B8A7CE" fill-opacity="0.3"/><text x="100" y="390" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">D114 写下：动态 shape／动态 strides／动态 offset——『运行时才知道 sizes/strides，</text><text x="100" y="412" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">描述符填充必须搬到运行期；本周所有 shape 静态已知』——当时的判断完全正确。</text><text x="100" y="434" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start"></text><text x="100" y="456" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">今天补上三件事：①签名 memref&lt;?x?x&gt;（? 占位）；②memref.dim 读描述符（跳③）；</text><text x="100" y="478" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">③memref.alloc(%M, %N) 动态分配输出——清单第 1 条从「暂不支持」变「已支持」。</text><text x="540.0" y="522" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="14" fill="#3B3B3B" text-anchor="middle" font-weight="bold">E3 三组 shape 执行验证（一份 .ll 吃三种 shape）</text><path d="M 101.2,543.1 Q 240.0,543.5 380.0,541.3 Q 380.9,578.9 381.3,612.8 Q 240.6,610.2 100.8,611.7 Q 102.7,578.7 101.2,543.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.4"/><text x="240" y="566" font-family="'Courier New',monospace" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">4x6 @ 6x3</text><text x="240" y="586" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#4a7c59" text-anchor="middle">C[0][1]=24.5 ✓</text><text x="240" y="604" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">D118 手算锚点</text><path d="M 399.5,541.7 Q 539.4,543.9 681.5,542.7 Q 680.3,576.1 678.7,611.0 Q 539.4,613.1 399.9,613.0 Q 400.3,578.7 399.5,541.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.4"/><text x="540" y="566" font-family="'Courier New',monospace" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">3x4 @ 4x2</text><text x="540" y="586" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#4a7c59" text-anchor="middle">C[0][1]=6.0 ✓</text><text x="540" y="604" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">非方形 shape</text><path d="M 700.5,542.9 Q 842.3,540.0 980.0,541.3 Q 981.9,577.3 979.9,610.8 Q 840.8,612.3 698.7,612.4 Q 697.6,575.5 700.5,542.9  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.4"/><text x="840" y="566" font-family="'Courier New',monospace" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">8x8 @ 8x8</text><text x="840" y="586" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#4a7c59" text-anchor="middle">C[3][5]=58.0 ✓</text><text x="840" y="604" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">更大规模</text></svg>
