<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect x="4" y="4" width="1192" height="667" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="600.0" y="32" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="15" fill="#3B3B3B" text-anchor="middle" font-weight="bold">shape/stride 的两段旅程：S2 签名里的类型 → stage-5.ll 里的常量</text><ellipse cx="469.4" cy="53.7" rx="6" ry="5.4" fill="#A9C4D4" fill-opacity="0.85" stroke="#3B3B3B" stroke-width="1"/><text x="486" y="58" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">4＝M</text><ellipse cx="560.2" cy="54.1" rx="6" ry="5.4" fill="#9CBF8E" fill-opacity="0.85" stroke="#3B3B3B" stroke-width="1"/><text x="576" y="58" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">3＝N</text><ellipse cx="649.2" cy="54.3" rx="6" ry="5.4" fill="#E8A87C" fill-opacity="0.85" stroke="#3B3B3B" stroke-width="1"/><text x="666" y="58" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">6＝K</text><text x="950" y="58" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">——三个数字从左栏（类型）走进右栏（常量）</text><path d="M 40.9,72.5 Q 302.1,75.4 565.0,74.3 Q 566.5,291.9 565.0,511.2 Q 304.4,512.1 39.4,510.7 Q 40.4,291.8 40.9,72.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.28"/><text x="302" y="100" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">S2 产物：stage-2-loop.mlir（类型层）</text><text x="64" y="130" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="start">func.func @main_kernel(</text><text x="64" y="154" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="start">  %a:    memref&lt;4x6xf32, strided&lt;[6, 1]&gt;&gt;,</text><text x="64" y="178" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="start">  %b:    memref&lt;6x3xf32, strided&lt;[3, 1]&gt;&gt;,</text><text x="64" y="202" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="start">  %bias: memref&lt;3xf32, strided&lt;[1]&gt;&gt;,</text><text x="64" y="226" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="start">) -&gt; memref&lt;4x3xf32&gt;</text><path d="M 63.5,269.4 Q 139.6,270.3 211.6,268.8 Q 214.0,300.8 213.3,332.6 Q 137.2,332.3 62.9,332.9 Q 61.9,302.5 63.5,269.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.4"/><text x="137" y="292" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">A：M×K＝4×6</text><text x="137" y="314" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#6b6257" text-anchor="middle">行主序 stride [6,1]</text><path d="M 224.6,268.0 Q 300.5,268.0 374.7,268.6 Q 372.6,299.6 373.3,331.9 Q 299.4,333.4 223.1,331.7 Q 224.4,300.1 224.6,268.0  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.4"/><text x="299" y="292" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">B：K×N＝6×3</text><text x="299" y="314" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#6b6257" text-anchor="middle">行主序 stride [3,1]</text><path d="M 385.3,269.4 Q 459.3,267.9 536.5,268.1 Q 538.1,301.1 536.3,330.5 Q 461.7,330.9 386.9,333.2 Q 386.6,299.5 385.3,269.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.4"/><text x="461" y="292" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">C：M×N＝4×3</text><text x="461" y="314" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#6b6257" text-anchor="middle">返回值，kernel 内 alloc</text><text x="302" y="372" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">shape 与 stride 全部住在类型里——TP3 断言的「签名」证据</text><text x="302" y="396" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">图 IR 的 const.shape / arg.tensor / reshape.new_shape</text><text x="302" y="414" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">三来源经 _infer_shape 推断后写死进签名</text><text x="302" y="470" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#6b6257" text-anchor="middle">（本图代码为冻结产物逐字摘录，仅缩进对齐）</text><text x="600" y="240" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">S4/S5</text><text x="600" y="256" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">Lowering</text><text x="600" y="272" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">8 条 pass</text><path d="M 568.4,291.2 Q 600.9,291.8 632.0,292.0 M 618.5,294.1 L 632.0,292.0 L 618.5,289.9" stroke="#3B3B3B" stroke-width="2.2" stroke-linecap="round" fill="none"/><text x="600" y="322" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">类型→常量</text><text x="600" y="340" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="7.5" fill="#6b6257" text-anchor="middle">（finalize-</text><text x="600" y="353" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="7.5" fill="#6b6257" text-anchor="middle">memref-to-llvm</text><text x="600" y="366" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="7.5" fill="#6b6257" text-anchor="middle">等）</text><path d="M 634.7,74.5 Q 896.5,74.3 1158.7,75.4 Q 1158.5,290.6 1160.1,509.7 Q 898.9,510.4 635.9,509.5 Q 636.9,292.4 634.7,74.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.28"/><text x="898" y="100" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">S4/S5 之后：stage-5.ll（常量层）</text><text x="656" y="128" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">L26  %39 = call ptr @malloc(i64 48)</text><text x="1150" y="128" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#C97B7B" text-anchor="end" font-weight="bold">48＝4×3×4B（RUNTIME 分配）</text><text x="656" y="154" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">L30  %43 = insertvalue {…} %42, i64 4, 3, 0</text><text x="1150" y="154" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#A9C4D4" text-anchor="end" font-weight="bold">C.sizes[0]＝4（M）</text><text x="656" y="180" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">L31  %44 = insertvalue {…} %43, i64 3, 3, 1</text><text x="1150" y="180" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#9CBF8E" text-anchor="end" font-weight="bold">C.sizes[1]＝3（N）</text><text x="656" y="206" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">L38  %49 = icmp slt i64 %48, 4</text><text x="1150" y="206" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#A9C4D4" text-anchor="end" font-weight="bold">i 循环上界＝M＝4</text><text x="656" y="232" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">L46  %53 = icmp slt i64 %52, 3</text><text x="1150" y="232" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#9CBF8E" text-anchor="end" font-weight="bold">j 循环上界＝N＝3</text><text x="656" y="258" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">L58  %61 = icmp slt i64 %59, 6</text><text x="1150" y="258" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#E8A87C" text-anchor="end" font-weight="bold">k 循环上界＝K＝6</text><text x="656" y="284" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">L63  %64 = mul nuw nsw i64 %48, 6</text><text x="1150" y="284" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#E8A87C" text-anchor="end" font-weight="bold">A 行主序步进 6</text><text x="656" y="310" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">L68  %69 = mul nuw nsw i64 %59, 3</text><text x="1150" y="310" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#9CBF8E" text-anchor="end" font-weight="bold">B 行主序步进 3</text><text x="656" y="352" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#6b6257" text-anchor="start">{…}＝{ ptr, ptr, i64, [2 x i64], [2 x i64] }（描述符类型，此处省略）</text><text x="656" y="370" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#6b6257" text-anchor="start">L 号＝冻结 stage-5.ll 的行号（day-124 与 day-126 两份逐字节相同）</text><text x="898" y="408" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">4／3／6／48 全是立即数——TP3 的「边界常量」证据</text><text x="898" y="432" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">循环边界、地址步进、输出大小不再依赖任何运行期输入</text><text x="898" y="470" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#6b6257" text-anchor="middle">（本图代码为冻结产物逐字摘录，仅省略描述符类型文本）</text><path d="M 39.5,523.1 Q 600.4,523.3 1160.1,523.7 Q 1159.8,585.8 1159.4,652.3 Q 600.3,652.1 41.5,650.6 Q 41.0,588.0 39.5,523.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.85"/><text x="600.0" y="550" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">读图：同一份信息换了形态、没换归属——S2 签名里是类型，.ll 里是常量，两段都是 COMPILE（TP3 的口径）</text><text x="600.0" y="574" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">唯一的例外在 L26：48＝4×3×4B 是编译期算出的，但 malloc 分配动作发生在每次调用的运行期（RUNTIME——TP2 的证据）</text><text x="600.0" y="598" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">两条 grep 就是两条归属判决书：call ptr @malloc 计 1 处（分配＝RUNTIME）、call void @free 计 0 处（释放＝NONE）</text><text x="600.0" y="628" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">D128 预告：要翻成 RUNTIME 得动三处——签名 memref&lt;?x?x?&gt; ＋ 描述符 sizes 从常量变参数 ＋ 循环边界从 icmp 常量变 load</text></svg>
