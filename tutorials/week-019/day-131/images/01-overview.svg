<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480"><rect x="4" y="4" width="1072" height="472" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">malloc 债务结清：从裸分配到池化复用</text><path d="M 59.4,60.9 Q 277.3,58.6 498.7,59.3 Q 500.0,210.5 499.6,361.3 Q 280.6,360.5 59.5,360.3 Q 59.4,209.3 59.4,60.9  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.3"/><text x="280" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">裸 malloc 模式（D118 遗留）</text><text x="90" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">每次调用：</text><text x="90" y="134" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="start">  kernel 内 malloc(48) → 输出缓冲区</text><text x="90" y="156" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">  调用结束：没人 free！</text><text x="90" y="200" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">E1 实测（2000 次调用）：</text><text x="90" y="222" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#C97B7B" text-anchor="start">  理论泄漏 94KB（RSS Δ=160KB 含噪声）</text><text x="90" y="244" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#C97B7B" text-anchor="start">  C 堆只涨不跌——机制性泄漏</text><text x="90" y="288" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">真实服务换算：</text><text x="90" y="310" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="start">  100 万次/秒 × 48B = 48 MB/s</text><text x="90" y="332" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#C97B7B" text-anchor="start">  一小时 = 165 GB —— 服务必死</text><path d="M 559.1,58.6 Q 780.1,57.0 998.9,59.8 Q 1001.3,210.3 1000.3,360.8 Q 780.1,359.1 560.5,361.0 Q 558.3,207.9 559.1,58.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.35"/><text x="780" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">池化模式（今天实现）</text><text x="590" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">BufferPool（档位＋空闲链表）：</text><text x="590" y="134" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="start">  acquire(shape) → 池里有就复用</text><text x="590" y="156" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="start">  release(buf)  → 放回池（不 free）</text><text x="590" y="200" font-family="'Courier New',monospace" font-size="10.5" fill="#4a7c59" text-anchor="start">E2 实测（100 次 acquire/release）：</text><text x="590" y="222" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="start">  hit=99 miss=1 —— 只首次分配</text><text x="590" y="244" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#4a7c59" text-anchor="start">  分配量 48B vs 裸模式 4800B（100×）</text><text x="590" y="288" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">生命周期三层：</text><text x="590" y="310" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">  分配=Pool｜归还=调用方｜释放=destroy</text><text x="590" y="332" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#4a7c59" text-anchor="start">  （D127 审计「释放=NONE」的空格填上）</text><path d="M 503.6,210.9 Q 528.4,211.1 556.0,210.0 M 542.5,212.1 L 556.0,210.0 L 542.5,207.9" stroke="#3B3B3B" stroke-width="2.4" stroke-linecap="round" fill="none"/><text x="530.0" y="202.0" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">结清</text><path d="M 61.6,380.4 Q 538.8,381.3 1019.1,378.9 Q 1018.1,419.2 1021.5,460.0 Q 539.8,462.8 59.5,461.5 Q 60.3,421.2 61.6,380.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.8"/><text x="540.0" y="404" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">债的本质：kernel 的输出语义是「返回新分配的 memref」（D115 的 sret 合同）——</text><text x="540.0" y="426" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">教学版从调用方侧结清（池预分配输出缓冲区）；工程版改 kernel 签名（out 参数化——D124 任务单形态）——两条路都通向「分配次数与调用次数解耦」</text></svg>
