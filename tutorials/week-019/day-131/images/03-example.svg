<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480"><rect x="4" y="4" width="1072" height="472" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">生命周期三层＋真实系统的分配器对照</text><path d="M 59.0,60.5 Q 209.0,58.3 359.1,59.6 Q 358.6,110.0 361.2,160.4 Q 212.1,158.0 61.0,159.8 Q 58.6,110.7 59.0,60.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.35"/><text x="210" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">分配（acquire）</text><text x="210" y="108" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">Pool：miss 时 numpy 分配</text><text x="210" y="130" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">职责方：运行时</text><path d="M 389.2,59.5 Q 538.2,59.3 690.4,60.6 Q 689.4,110.3 688.6,158.7 Q 541.3,161.0 389.9,159.1 Q 390.9,108.6 389.2,59.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.35"/><text x="540" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">归还（release）</text><text x="540" y="108" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">调用方：用完放回（不 free）</text><text x="540" y="130" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">职责方：调用方</text><path d="M 718.8,59.2 Q 869.5,59.4 1019.0,61.0 Q 1019.4,111.5 1020.9,160.2 Q 867.6,158.8 718.6,159.2 Q 718.8,109.4 718.8,59.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.35"/><text x="870" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">释放（destroy）</text><text x="870" y="108" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">池：清空＋Python GC 兜底</text><text x="870" y="130" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">职责方：池</text><text x="540.0" y="200" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">真实系统的分配器对照</text><path d="M 50.1,218.7 Q 165.7,217.3 278.7,219.1 Q 276.5,294.3 278.5,371.3 Q 162.9,371.7 51.2,368.6 Q 50.0,295.3 50.1,218.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#B8A7CE" fill-opacity="0.3"/><text x="165" y="246" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">TVM</text><text x="165" y="270" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">TVMArray 从调用方来</text><text x="165" y="287" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">（WorkspacePool 已在图编译期规划）</text><text x="165" y="340" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#6b6257" text-anchor="middle">D100 的片外工作区就是它</text><path d="M 299.5,221.6 Q 413.6,219.7 531.0,221.6 Q 531.2,295.2 530.4,369.9 Q 415.9,367.9 301.5,369.8 Q 300.7,297.9 299.5,221.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#B8A7CE" fill-opacity="0.3"/><text x="415" y="246" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">PyTorch</text><text x="415" y="270" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">CUDACachingAllocator</text><text x="415" y="287" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">块缓存＋按尺寸分桶＋溢出释放</text><text x="415" y="340" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#6b6257" text-anchor="middle">与今天 BufferPool 同构！</text><path d="M 549.2,220.4 Q 664.0,220.4 780.4,221.5 Q 781.9,297.7 779.8,371.3 Q 664.1,372.9 549.3,370.7 Q 548.3,297.5 549.2,220.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#B8A7CE" fill-opacity="0.3"/><text x="665" y="246" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">CUDA</text><text x="665" y="270" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">cudaMallocAsync</text><text x="665" y="287" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">流序分配（D132 同步的前置）</text><text x="665" y="340" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#6b6257" text-anchor="middle">pool=stream 语义</text><path d="M 798.4,221.2 Q 915.9,222.0 1030.0,220.4 Q 1029.9,293.2 1031.2,368.9 Q 915.7,369.8 799.0,370.8 Q 798.2,297.9 798.4,221.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#B8A7CE" fill-opacity="0.3"/><text x="915" y="246" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">minic</text><text x="915" y="270" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">BufferPool 教学版</text><text x="915" y="287" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">档位＋空闲链表＋视图复用</text><text x="915" y="340" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#6b6257" text-anchor="middle">99% hit / 100 倍分配量差</text><path d="M 51.2,392.5 Q 538.8,393.0 1030.1,392.3 Q 1030.4,426.2 1031.3,461.8 Q 543.5,460.1 51.4,462.5 Q 49.5,429.6 51.2,392.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.8"/><text x="540.0" y="416" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">分配器设计的两难（今天的取舍）：池越大复用率越高、但常驻内存越大——</text><text x="540.0" y="438" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">档位分桶是折中（按需增长、按桶复用）；真实系统再加 LRU 淘汰与水位线（PyTorch 的 empty_cache）</text></svg>
