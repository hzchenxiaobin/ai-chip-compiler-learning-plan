<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="538" viewBox="0 0 1080 538"><rect x="4" y="4" width="1072" height="530" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">真实系统的回退对照与今天的边界</text><path d="M 51.2,61.0 Q 164.9,59.8 281.1,58.8 Q 279.8,145.8 280.7,229.3 Q 165.9,228.1 50.6,230.4 Q 52.2,145.7 51.2,61.0  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.35"/><text x="165" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">PyTorch 2.x</text><text x="165" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">torch.compile 失败 →</text><text x="165" y="130" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">回退 eager 解释器</text><text x="165" y="148" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">（graph break 也回退）</text><text x="165" y="166" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">FallbackDetector 计数</text><path d="M 300.3,59.6 Q 413.4,59.9 529.8,59.0 Q 529.6,142.5 530.3,229.5 Q 413.7,230.2 298.7,229.0 Q 299.0,142.5 300.3,59.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.35"/><text x="415" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">TVM</text><text x="415" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">编译 OOM →</text><text x="415" y="130" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">自动降 tile 重试</text><text x="415" y="148" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">（Ansor 的约束收缩）</text><text x="415" y="166" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">或回退 fallbackschedule</text><path d="M 550.7,59.9 Q 665.6,58.1 781.2,58.7 Q 779.3,143.4 780.9,231.2 Q 664.2,229.3 550.1,228.5 Q 549.2,145.3 550.7,59.9  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.35"/><text x="665" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">cuDNN</text><text x="665" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">kernel 不支持该 shape →</text><text x="665" y="130" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">内部算法枚举换一个</text><text x="665" y="148" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">（heuristics 的备选链）</text><text x="665" y="166" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">全不支持才报错</text><path d="M 801.0,60.1 Q 915.6,61.5 1029.6,60.6 Q 1031.2,143.9 1029.0,229.1 Q 913.6,229.0 800.6,230.9 Q 798.7,144.2 801.0,60.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.35"/><text x="915" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">minic（今天）</text><text x="915" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">特化崩→动态重试</text><text x="915" y="130" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">动态崩→E303 上抛</text><text x="915" y="148" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">校验拦→E301 拒收</text><text x="915" y="166" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">四级降级链</text><text x="540.0" y="262" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">回退的三个共性（不管哪个系统）</text><path d="M 78.8,283.2 Q 540.9,285.3 999.7,284.2 Q 998.3,310.4 1000.4,333.5 Q 538.4,332.2 80.4,333.6 Q 79.7,306.8 78.8,283.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.7"/><text x="110" y="304" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">① 永远有底</text><text x="110" y="324" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">最底层一定是一个「什么都能跑」的实现（eager/朴素循环/通用算法）——今天的动态版</text><path d="M 80.7,343.3 Q 539.4,344.5 999.6,342.5 Q 997.1,366.3 998.8,390.8 Q 539.6,391.9 80.7,390.9 Q 79.1,365.1 80.7,343.3  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.7"/><text x="110" y="362" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">② 降级可见</text><text x="110" y="382" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">回退不是静默的——计数/日志/警告（今天的 W301+stats.fallback）——否则退化无感</text><path d="M 79.3,401.1 Q 540.9,398.2 1000.6,399.2 Q 999.3,425.8 1000.7,449.6 Q 540.4,448.1 78.4,449.1 Q 77.0,426.6 79.3,401.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.7"/><text x="110" y="420" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">③ 底也会破</text><text x="110" y="440" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">底失败时要有结构化出口（今天的 E303）——「无声崩溃」是系统的耻辱</text><path d="M 81.0,463.4 Q 538.6,464.8 1000.1,463.3 Q 1002.3,495.8 1000.8,525.0 Q 540.8,525.3 79.6,523.3 Q 81.2,491.9 81.0,463.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#B8A7CE" fill-opacity="0.25"/><text x="540.0" y="488" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">今天的边界（诚实声明）：E3 的「坏 kernel」是 Python 层模拟的异常——真实段错误的回退</text><text x="540.0" y="508" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">需要信号处理（SIGSEGV catch）或进程隔离（子进程执行）——教学版演示「回退的语义」，工程版差机制</text></svg>
