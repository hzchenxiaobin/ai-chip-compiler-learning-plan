Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">E1 实测：4x6x3 命中特化 PASS</text><text x="757" y="282" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#6b6257" text-anchor="middle">（D129 行为保持——回归通过）</text><path d="M 373.2,260.9 Q 432.6,260.7 492.0,261.0 M 478.5,263.1 L 492.0,261.0 L 478.5,258.9" stroke="#6a8f5c" stroke-width="1.8" stroke-linecap="round" fill="none"/><text x="432.0" y="253.0" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">成功</text><path d="M 493.6,325.2 Q 758.3,323.2 1021.4,323.8 Q 1018.9,363.4 1020.0,407.0 Q 757.7,408.6 495.3,409.0 Q 496.0,369.2 493.6,325.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.4"/><text x="757" y="348" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">可观测性埋点：stats／events／W301</text><text x="757" y="366" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">* [W301] 走 stderr——默认 quiet=True 静音</text><text x="757" y="384" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">（实测输出里看不到警告行；events 可见）</text><text x="757" y="402" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#6b6257" text-anchor="middle">E3 事件：特化 kernel 执行异常，已回退动态版</text><path d="M 495.2,437.5 Q 756.1,438.6 1020.8,435.8 Q 1018.1,467.1 1018.4,498.3 Q 758.4,496.0 496.4,497.6 Q 493.9,467.1 495.2,437.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.45"/><text x="757" y="458" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">stats.miss += 1（未命中）／＋0（回退路径）</text><text x="757" y="474" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">→ return _read(dc)</text><text x="757" y="492" font-family="'Courier New',monospace" font-size="9" fill="#3B3B3B" text-anchor="middle">E1: 3x5x2 miss PASS｜E3 后 {hit:0,miss:0,fallback:1}</text><path d="M 371.9,467.6 Q 433.7,468.6 492.0,467.0 M 478.5,469.1 L 492.0,467.0 L 478.5,464.9" stroke="#6a8f5c" stroke-width="1.8" stroke-linecap="round" fill="none"/><text x="432.0" y="459.0" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">成功</text><path d="M 493.7,522.7 Q 756.3,522.1 1020.1,523.3 Q 1020.5,554.2 1021.0,584.5 Q 757.8,585.0 493.6,584.8 Q 492.8,555.3 493.7,522.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.5"/><text x="757" y="546" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">E4 实测：动态版执行失败：模拟：动态版也崩了</text><text x="757" y="564" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">→ 调用方拿到 code＋detail 结构化错误 ✓</text><path d="M 372.1,554.2 Q 431.2,552.0 492.0,553.0 M 478.5,555.1 L 492.0,553.0 L 478.5,550.9" stroke="#C97B7B" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M 59.7,600.7 Q 540.7,602.3 1021.4,600.7 Q 1018.6,637.8 1020.1,671.1 Q 541.1,674.1 59.8,673.6 Q 58.7,635.7 59.7,600.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.8"/><text x="540" y="626" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">降级链是控制流不是配置：①→②→③→④ 一条直线——没有跳回、没有重试（重试是调用方的策略）</text><text x="540" y="648" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">两级 try 对应两级降级；except 里不 return——控制流自然「落入」下一级；stats/events 埋在每一级</text></svg>
