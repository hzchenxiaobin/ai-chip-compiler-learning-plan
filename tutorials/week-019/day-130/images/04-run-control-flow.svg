<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="690" viewBox="0 0 1080 690"><rect x="4" y="4" width="1072" height="682" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">run() 的控制流：两级 try＝两级降级——stats/events 埋在每一级</text><path d="M 59.7,57.1 Q 215.9,59.4 370.4,57.5 Q 369.5,81.6 369.9,103.3 Q 216.5,104.2 59.2,103.4 Q 60.0,80.6 59.7,57.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.4"/><text x="215" y="80" font-family="'Courier New',monospace" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">run(A, B)</text><text x="215" y="96" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#6b6257" text-anchor="middle">单次调用——无重试、无跳回</text><path d="M 214.1,104.3 Q 213.8,112.2 215.0,124.0 M 212.9,110.5 L 215.0,124.0 L 217.1,110.5" stroke="#3B3B3B" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M 61.3,127.4 Q 217.8,125.3 370.8,124.5 Q 372.1,160.0 369.8,199.1 Q 214.0,197.2 61.4,196.5 Q 60.4,161.9 61.3,127.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.45"/><text x="215" y="148" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">① _validate(A, B)</text><text x="215" y="166" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">ndim／内维／dtype／shape 检查</text><text x="215" y="184" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#6b6257" text-anchor="middle">fail-fast：非法的不进 kernel</text><path d="M 214.6,196.7 Q 213.2,209.0 215.0,220.0 M 212.9,206.5 L 215.0,220.0 L 217.1,206.5" stroke="#3B3B3B" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M 60.3,223.0 Q 213.4,221.7 368.8,221.6 Q 368.8,261.8 371.2,301.5 Q 216.3,302.8 59.5,301.6 Q 59.6,264.3 60.3,223.0  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.45"/><text x="215" y="246" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">② if key in specialized</text><text x="215" y="264" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="middle">key = (M, K, N)</text><text x="215" y="282" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="middle">try: 特化 f(dc, da, db)</text><path d="M 216.1,301.2 Q 216.4,309.6 215.0,322.0 M 212.9,308.5 L 215.0,322.0 L 217.1,308.5" stroke="#C97B7B" stroke-width="1.7" stroke-linecap="round" fill="none"/><text x="215.0" y="303.0" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">except 异常</text><path d="M 60.0,322.7 Q 215.5,321.5 371.1,323.0 Q 370.8,365.2 368.9,408.0 Q 212.7,410.2 59.1,409.2 Q 59.5,366.8 60.0,322.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.45"/><text x="215" y="346" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">except（E302 事件）</text><text x="215" y="364" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="middle">stats.fallback += 1</text><text x="215" y="380" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="middle">events.append(E302)</text><text x="215" y="396" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">[W301] 警告 → stderr*</text><path d="M 213.7,409.6 Q 214.3,422.5 215.0,434.0 M 212.9,420.5 L 215.0,434.0 L 217.1,420.5" stroke="#3B3B3B" stroke-width="1.7" stroke-linecap="round" fill="none" stroke-dasharray="5,4"/><text x="215.0" y="413.0" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">落入③（不 return）</text><path d="M 61.1,435.5 Q 214.8,436.8 370.0,436.0 Q 372.2,464.8 370.6,497.8 Q 213.9,499.4 61.5,498.4 Q 62.5,468.5 61.1,435.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.45"/><text x="215" y="460" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">③ try: 动态版 kernel</text><text x="215" y="478" font-family="'Courier New',monospace" font-size="9" fill="#3B3B3B" text-anchor="middle">_mlir_ciface_kernel_dynamic</text><path d="M 214.0,499.1 Q 215.5,509.7 215.0,520.0 M 212.9,506.5 L 215.0,520.0 L 217.1,506.5" stroke="#C97B7B" stroke-width="1.7" stroke-linecap="round" fill="none"/><text x="215.0" y="501.0" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">except</text><path d="M 61.5,523.3 Q 214.5,524.2 370.9,521.3 Q 371.1,551.4 370.4,582.9 Q 215.5,581.8 60.5,584.3 Q 61.1,555.3 61.5,523.3  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.5"/><text x="215" y="546" font-family="'Courier New',monospace" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">④ raise RtError("E303")</text><text x="215" y="564" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">from e——保留原始栈</text><path d="M 426.8,271.1 Q 427.9,341.0 428.0,412.0 M 425.9,398.5 L 428.0,412.0 L 430.1,398.5" stroke="#3B3B3B" stroke-width="1.7" stroke-linecap="round" fill="none" stroke-dasharray="5,4"/><path d="M 427.1,416.8 Q 409.7,425.5 388.0,432.0 M 39