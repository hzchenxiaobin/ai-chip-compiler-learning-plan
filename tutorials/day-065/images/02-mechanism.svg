<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="780" viewBox="0 0 1060 780">
<rect width="1060" height="780" fill="#fdfaf2"/>
<text x="40" y="38" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="20" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="bold">核心机制：两个排列怎么组合成一个</text>
<text x="40" y="61" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12" fill="#84796a" text-anchor="start" opacity="1.0" font-weight="normal">C = T_q(T_p(A)) ⟹ C.shape[i] = A.shape[p[q[i]]]，r = compose(p, q)（内层先作用）· 数字全部来自真实运行</text>
<path d="M 40.0,78.0 L 204.4,77.3 L 367.0,77.1 L 530.0,78.9 L 692.6,78.6 L 857.4,77.9 L 1020.0,78.0 L 1020.0,78.0 L 1020.7,93.7 L 1021.1,109.7 L 1019.4,126.5 L 1019.3,141.8 L 1020.0,158.0 L 1020.0,174.0 L 1020.0,174.0 L 857.3,173.5 L 694.1,173.7 L 528.9,173.6 L 367.6,174.4 L 203.0,174.4 L 40.0,174.0 L 40.0,174.0 L 39.5,157.0 L 40.5,143.0 L 41.0,126.3 L 39.5,109.2 L 40.3,93.9 L 40.0,78.0" fill="#eef3f7" stroke="#6b6357" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="104" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12.5" fill="#4a7fa5" text-anchor="start" opacity="1.0" font-weight="bold">一步推导（约定来自第 64 天：out_shape[i] = in_shape[perm[i]]）</text><text x="60" y="130" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">B = T_p(A)：B.shape[i] = A.shape[p[i]]</text><text x="60" y="152" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="bold">C = T_q(B)：C.shape[i] = B.shape[q[i]] = A.shape[ p[ q[i] ] ]  →  r = compose(p, q)，r[i] = p[q[i]]</text><text x="960" y="104" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10" fill="#5a8a5a" text-anchor="end" opacity="1.0" font-weight="bold">36 对全排列对拍 ✓</text><path d="M 40.0,196.0 L 202.6,195.8 L 365.8,196.7 L 529.4,196.8 L 693.7,196.2 L 856.9,197.1 L 1020.0,196.0 L 1020.0,196.0 L 1021.0,226.8 L 1021.0,258.6 L 1020.9,289.8 L 1018.9,322.5 L 1021.1,354.1 L 1020.0,386.0 L 1020.0,386.0 L 856.9,385.8 L 692.8,386.9 L 530.0,384.9 L 367.1,385.9 L 203.4,387.1 L 40.0,386.0 L 40.0,386.0 L 41.1,354.4 L 39.0,322.9 L 40.6,291.5 L 39.5,260.0 L 40.1,227.0 L 40.0,196.0" fill="#ffffff" stroke="#6b6357" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="220" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="13" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="bold">维度流（贯穿例子 B(2,3,4)，3-循环 p = (1,2,0)）：</text><path d="M 70.0,234.0 L 92.3,235.0 L 117.5,235.0 L 140.0,233.7 L 163.9,233.4 L 187.5,233.0 L 210.0,234.0 L 210.0,234.0 L 209.0,243.3 L 209.1,253.9 L 208.9,265.3 L 211.0,274.9 L 208.9,285.2 L 210.0,296.0 L 210.0,296.0 L 187.7,295.0 L 164.1,296.1 L 140.6,296.3 L 117.4,296.7 L 94.5,296.9 L 70.0,296.0 L 70.0,296.0 L 69.3,284.8 L 70.8,275.2 L 68.9,265.6 L 69.3,253.6 L 69.1,244.6 L 70.0,234.0" fill="#f1efe9" stroke="#6b6357" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="140.0" y="256" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="13" fill="#3b352d" text-anchor="middle" opacity="1.0" font-weight="bold">A</text><text x="140.0" y="272" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11" fill="#3b352d" text-anchor="middle" opacity="1.0" font-weight="normal">(2,3,4)</text><text x="140.0" y="288" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.5" fill="#84796a" text-anchor="middle" opacity="1.0" font-weight="normal">strides (12,4,1)</text><path d="M 280.0,234.0 L 302.4,234.5 L 327.3,234.9 L 350.1,234.6 L 374.4,233.2 L 397.2,232.9 L 420.0,234.0 L 420.0,234.0 L 420.1,244.8 L 420.6,255.0 L 420.1,266.0 L 419.6,274.2 L 421.0,286.0 L 420.0,296.0 L 420.0,296.0 L 395.9,295.1 L 372.7,295.8 L 349.6,297.0 L 326.2,295.0 L 303.6,295.5 L 280.0,296.0 L 280.0,296.0 L 279.7,285.2 L 281.2,276.2 L 280.6,264.2 L 279.0,255.3 L 280.8,245.2 L 280.0,234.0" fill="#f8f0e2" stroke="#6b6357" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="350.0" y="256" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="13" fill="#3b352d" text-anchor="middle" opacity="1.0" font-weight="bold">T_p</text><text x="350.0" y="272" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11" fill="#3b352d" text-anchor="middle" opacity="1.0" font-weight="normal">p=(1,2,0)</text><text x="350.0" y="288" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.5" fill="#84796a" text-anchor="middle" opacity="1.0" font-weight="normal">拽第 1,2,0 维</text><path d="M 470.0,234.0 L 493.0,234.5 L 515.5,232.9 L 539.5,234.5 L 564.3,233.1 L 586.6,233.8 L 610.0,234.0 L 610.0,234.0 L 609.0,243.6 L 610.6,254.0 L 609.7,264.6 L 610.0,275.4 L 610.2,284.7 L 610.0,296.0 L 610.0,296.0 L 586.8,295.9 L 562.2,295.7 L 540.1,295.4 L 516.6,295.0 L 492.3,295.4 L 470.0,296.0 L 470.0,296.0 L 468.8,284.6 L 469.9,275.5 L 469.2,266.0 L 470.6,255.2 L 470.5,244.0 L 470.0,234.0" fill="#f1efe9" stroke="#6b6357" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="540.0" y="256" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="13" fill="#3b352d" text-anchor="middle" opacity="1.0" font-weight="bold">B</text><text x="540.0" y="272" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11" fill="#3b352d" text-anchor="middle" opacity="1.0" font-weight="normal">(3,4,2)</text><text x="540.0" y="288" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.5" fill="#84796a" text-anchor="middle" opacity="1.0" font-weight="normal">strides (4,1,12)</text><path d="M 680.0,234.0 L 702.5,235.0 L 727.1,233.0 L 749.7,234.0 L 772.2,234.1 L 797.8,234.5 L 820.0,234.0 L 820.0,234.0 L 821.1,245.2 L 820.3,254.6 L 821.0,264.6 L 818.8,275.6 L 820.2,286.1 L 820.0,296.0 L 820.0,296.0 L 797.3,295.2 L 773.2,294.8 L 750.0,295.0 L 727.0,296.7 L 702.5,295.4 L 680.0,296.0 L 680.0,296.0 L 679.9,285.0 L 678.9,275.1 L 680.6,265.7 L 679.7,253.8 L 679.9,245.1 L 680.0,234.0" fill="#f8f0e2" stroke="#6b6357" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="256" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="13" fill="#3b352d" text-anchor="middle" opacity="1.0" font-weight="bold">T_p</text><text x="750.0" y="272" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11" fill="#3b352d" text-anchor="middle" opacity="1.0" font-weight="normal">p=(1,2,0)</text><text x="750.0" y="288" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.5" fill="#84796a" text-anchor="middle" opacity="1.0" font-weight="normal">再来一次</text><path d="M 870.0,234.0 L 893.3,233.8 L 915.6,234.7 L 939.3,234.2 L 964.0,232.9 L 986.1,233.2 L 1010.0,234.0 L 1010.0,234.0 L 1011.0,244.3 L 1010.8,255.1 L 1011.0,264.3 L 1010.4,275.7 L 1010.2,285.3 L 1010.0,296.0 L 1010.0,296.0 L 987.6,295.2 L 962.2,296.6 L 939.8,296.7 L 915.9,295.9 L 892.9,295.5 L 870.0,296.0 L 870.0,296.0 L 870.0,286.3 L 869.6,275.6 L 870.5,264.5 L 870.7,255.1 L 869.9,244.4 L 870.0,234.0" fill="#f7ecea" stroke="#6b6357" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="940.0" y="256" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="13" fill="#3b352d" text-anchor="middle" opacity="1.0" font-weight="bold">C</text><text x="940.0" y="272" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11" fill="#3b352d" text-anchor="middle" opacity="1.0" font-weight="normal">(4,2,3)</text><text x="940.0" y="288" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.5" fill="#84796a" text-anchor="middle" opacity="1.0" font-weight="normal">≠ A！</text><path d="M 212.0,265.0 L 278.0,265.0" fill="none" stroke="#6b6357" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><path d="M 278.0,265.0 L 267.0,261.0" fill="none" stroke="#6b6357" stroke-width="2.0" stroke-linecap="round" opacity="1.0"/><path d="M 278.0,265.0 L 267.0,269.0" fill="none" stroke="#6b6357" stroke-width="2.0" stroke-linecap="round" opacity="1.0"/><path d="M 412.0,265.0 L 478.0,265.0" fill="none" stroke="#6b6357" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><path d="M 478.0,265.0 L 467.0,261.0" fill="none" stroke="#6b6357" stroke-width="2.0" stroke-linecap="round" opacity="1.0"/><path d="M 478.0,265.0 L 467.0,269.0" fill="none" stroke="#6b6357" stroke-width="2.0" stroke-linecap="round" opacity="1.0"/><path d="M 622.0,265.0 L 688.0,265.0" fill="none" stroke="#6b6357" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><path d="M 688.0,265.0 L 677.0,261.0" fill="none" stroke="#6b6357" stroke-width="2.0" stroke-linecap="round" opacity="1.0"/><path d="M 688.0,265.0 L 677.0,269.0" fill="none" stroke="#6b6357" stroke-width="2.0" stroke-linecap="round" opacity="1.0"/><text x="60" y="326" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11.5" fill="#b0605a" text-anchor="start" opacity="1.0" font-weight="normal">转两次 ≠ 原样（p² = (2,0,1) ≠ 恒等）；转三次才回 (2,3,4)——「阶」= 3。撤销一次转置要逆排列，不是再转一次。</text><text x="60" y="351" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11.5" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">compose(p,p) = (2,0,1) = inv(p)——3-循环的平方恰好是它的逆；compose(p, inv(p)) = (0,1,2) 恒等 → 互逆对可整体消除。</text><text x="60" y="374" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.5" fill="#84796a" text-anchor="start" opacity="1.0" font-weight="normal">实测：B 经 p 三连 (2,3,4) → (3,4,2) → (4,2,3) → (2,3,4)，值逐元素相等（T_p³ == x）。</text><path d="M 40.0,410.0 L 118.9,411.2 L 195.6,409.2 L 275.0,408.8 L 354.2,410.3 L 432.0,409.0 L 510.0,410.0 L 510.0,410.0 L 510.6,451.1 L 510.4,494.4 L 510.2,535.4 L 508.9,575.8 L 510.2,618.0 L 510.0,660.0 L 510.0,660.0 L 432.6,659.4 L 353.9,659.1 L 274.8,660.1 L 197.8,659.2 L 117.2,660.0 L 40.0,660.0 L 40.0,660.0 L 39.1,618.0 L 39.2,577.2 L 38.8,535.3 L 38.8,492.3 L 38.8,451.6 L 40.0,410.0" fill="#ffffff" stroke="#6b6357" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="436" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="13" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="bold">判定三条（今天的规则表）：</text><path d="M 60.0,454.0 L 131.1,453.5 L 202.8,453.0 L 274.3,454.8 L 346.7,453.1 L 417.6,455.1 L 490.0,454.0 L 490.0,454.0 L 490.3,462.7 L 490.5,472.4 L 489.6,483.0 L 490.8,491.7 L 489.9,502.4 L 490.0,512.0 L 490.0,512.0 L 417.5,512.8 L 346.4,511.2 L 275.0,512.2 L 203.5,512.7 L 132.4,511.6 L 60.0,512.0 L 60.0,512.0 L 58.9,501.4 L 58.9,491.7 L 59.4,484.0 L 60.8,474.1 L 58.9,464.0 L 60.0,454.0" fill="#edf4ee" stroke="#6b6357" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="74" y="476" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12" fill="#5a8a5a" text-anchor="start" opacity="1.0" font-weight="bold">互逆消除</text><text x="74" y="495" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.5" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">q == inv(p) ⟺ compose(p,q) == 恒等</text><text x="470" y="495" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.5" fill="#3b352d" text-anchor="end" opacity="1.0" font-weight="bold">T_q(T_p(x)) → x</text><path d="M 60.0,522.0 L 131.2,522.3 L 204.2,521.4 L 275.3,522.1 L 347.5,520.8 L 417.4,521.4 L 490.0,522.0 L 490.0,522.0 L 489.3,530.8 L 490.9,541.5 L 489.9,551.0 L 489.2,560.6 L 491.0,570.3 L 490.0,580.0 L 490.0,580.0 L 418.4,579.7 L 347.1,580.8 L 274.9,580.6 L 203.6,579.7 L 131.3,580.0 L 60.0,580.0 L 60.0,580.0 L 60.9,569.7 L 60.6,561.1 L 60.0,551.7 L 59.6,540.9 L 61.0,532.1 L 60.0,522.0" fill="#eef3f7" stroke="#6b6357" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="74" y="544" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12" fill="#4a7fa5" text-anchor="start" opacity="1.0" font-weight="bold">一般合并</text><text x="74" y="563" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.5" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">r = compose(p, q) = p[q[i]]</text><text x="470" y="563" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.5" fill="#3b352d" text-anchor="end" opacity="1.0" font-weight="bold">T_q(T_p(x)) → T_r(x)</text><path d="M 60.0,590.0 L 131.2,589.8 L 202.3,590.3 L 275.4,590.5 L 347.1,589.7 L 418.6,591.1 L 490.0,590.0 L 490.0,590.0 L 489.3,599.8 L 489.1,608.8 L 489.1,619.8 L 490.6,627.6 L 489.9,637.5 L 490.0,648.0 L 490.0,648.0 L 417.8,648.5 L 346.6,648.4 L 274.9,648.9 L 202.9,648.2 L 132.2,647.9 L 60.0,648.0 L 60.0,648.0 L 59.5,637.4 L 59.0,628.8 L 59.0,619.5 L 59.3,610.2 L 59.9,599.4 L 60.0,590.0" fill="#f8f0e2" stroke="#6b6357" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="74" y="612" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12" fill="#a8772e" text-anchor="start" opacity="1.0" font-weight="bold">链式自乘</text><text x="74" y="631" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.5" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">p 的阶 k：p^k = 恒等</text><text x="470" y="631" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.5" fill="#3b352d" text-anchor="end" opacity="1.0" font-weight="bold">T_p 连做 k 次 → x</text><path d="M 550.0,410.0 L 629.2,409.9 L 707.8,409.0 L 784.1,410.4 L 863.2,410.5 L 941.1,409.4 L 1020.0,410.0 L 1020.0,410.0 L 1019.5,452.7 L 1019.2,492.2 L 1019.7,535.6 L 1019.4,575.9 L 1019.3,617.5 L 1020.0,660.0 L 1020.0,660.0 L 942.5,660.4 L 862.2,660.0 L 784.5,660.3 L 707.6,661.0 L 627.7,659.4 L 550.0,660.0 L 550.0,660.0 L 551.1,619.4 L 549.3,576.3 L 550.6,534.8 L 549.7,494.3 L 549.9,450.8 L 550.0,410.0" fill="#f7ecea" stroke="#b0605a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="566" y="436" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="13" fill="#b0605a" text-anchor="start" opacity="1.0" font-weight="bold">方向陷阱：r[i] = q[p[i]] 就错了</text><text x="566" y="462" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.5" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">2D p=q=(1,0)：正确 (0,1) = 错误 (0,1)——对合两个方向重合，2D 测试永远全绿</text><text x="566" y="484" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.5" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">3D p=(1,2,0), q=(0,2,1)：</text><text x="580" y="502" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.5" fill="#5a8a5a" text-anchor="start" opacity="1.0" font-weight="normal">正确 r = (1,0,2) → 合并 shape (3,2,4) == 链终点 ✓</text><text x="580" y="520" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.5" fill="#b0605a" text-anchor="start" opacity="1.0" font-weight="normal">错误 r = (2,1,0) → 合并 shape (4,3,2) ≠ 链终点 (3,2,4) ✗</text><text x="566" y="550" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.5" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">为什么 p 在外圈？内层 T_p 先作用：C.shape[i] 先被 q 拽到 B 的第 q[i] 维，</text><text x="566" y="568" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.5" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">再被 p 拽到 A 的第 p[q[i]] 维——「后写的先读」</text><text x="566" y="594" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10" fill="#84796a" text-anchor="start" opacity="1.0" font-weight="normal">防御：用 3D 非对合链对拍 numpy（np.transpose 两步 vs 一步），</text><text x="566" y="612" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10" fill="#84796a" text-anchor="start" opacity="1.0" font-weight="normal">2D 全绿不能证明方向对（错误现场的完整输出在 outputs/）</text><path d="M 40.0,686.0 L 203.6,685.0 L 365.5,684.9 L 530.3,685.8 L 692.6,685.5 L 857.3,685.3 L 1020.0,686.0 L 1020.0,686.0 L 1019.3,694.9 L 1020.3,704.9 L 1021.1,713.8 L 1018.9,724.1 L 1021.2,733.0 L 1020.0,742.0 L 1020.0,742.0 L 857.0,740.9 L 694.4,741.7 L 530.7,742.8 L 367.0,742.6 L 202.5,743.0 L 40.0,742.0 L 40.0,742.0 L 41.0,733.0 L 41.0,722.5 L 39.2,715.1 L 39.6,704.1 L 40.0,695.2 L 40.0,686.0" fill="#f1efe9" stroke="#6b6357" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="710" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="bold">结合律 (p∘q)∘s == p∘(q∘s)：</text><text x="280" y="710" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11.5" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">729 组 3 元三元组验证——PassManager 长链先合并哪一对，终点都一样（E 节 8 连链 4 轮收敛）</text><text x="60" y="730" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.5" fill="#84796a" text-anchor="start" opacity="1.0" font-weight="normal">Pattern 只减 op 数（2→1 或 →0），不会振荡——迭代必然终止；max_rounds 只是防御上限</text></svg>
