<text x="67" y="378" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.2" fill="#3B3B3B" text-anchor="start">  [4,0] stride0←2   [4,1] stride1←1   → %c 就是描述符值</text>
