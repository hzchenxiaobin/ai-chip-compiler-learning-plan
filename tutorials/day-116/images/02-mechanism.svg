<text x="67" y="282" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.2" fill="#3B3B3B" text-anchor="start">%b_c = llvm.mlir.constant(16 : i64)    ← 2×2×4B</text>
