<text x="522" y="498" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.2" fill="#3B3B3B" text-anchor="start">内部合同（LLVM↔LLVM）：call %desc @add(%desc %a, %desc %b)</text>
<text x="522" y="514" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.2" fill="#3B3B3B" text-anchor="start">  实测汇编（aarch64，noinline 保边界）：bl add 前用 3 条</text>
<text x="522" y="530" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.2" fill="#3B3B3B" text-anchor="start">  stp/str 把 2×56B 入参复制上栈（14 个 8 字节 ＞ 8 个寄存器）；</text>
<text x="522" y="546" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.2" fill="#3B3B3B" text-anchor="start">  调用后 4 条 stp x0,x1,[x19] … str x6,[x19,#48] 把 56B</text>
<text x="522" y="562" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.2" fill="#3B3B3B" text-anchor="start">  返回值从 x0..x6 写回 outp——拆寄存器，不是 gcc 的 x8</text>
<text x="522" y="578" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.2" fill="#3B3B3B" text-anchor="start">边界合同（JIT↔ctypes/libffi）：define _mlir_ciface_add(ptr,ptr,ptr)</text>
<text x="522" y="594" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.2" fill="#3B3B3B" text-anchor="start">  三个指针＋store 回写——C 边界只信指针和标量</text>
<text x="522" y="610" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.2" fill="#3B3B3B" text-anchor="start">D115 补完：gcc 实测 56B 聚合返回走 x8（sret）；byval/直接</text>
<text x="522" y="626" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.2" fill="#3B3B3B" text-anchor="start">聚合配 ctypes 全部读错地方——边界必须降到指针合同</text>
<path d="M 54.9,662.3 Q 507.8,661.3 963.9,663.5" stroke="#E7DFCE" stroke-width="2" stroke-linecap="round" fill="none"/>
<text x="510" y="688" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">链条闭合：源 IR →（六类模式）→ LLVM 方言 →（R2 内联常量）→ .ll →（包装两份合同）→ MCJIT → ctypes → numpy bitwise</text>
<text x="510" y="710" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">@add：21 op → 142 op（膨胀 6.8×）→ .ll 133 条指令（8 条常量内联消失）——膨胀在模式层，收敛在导出层</text>
