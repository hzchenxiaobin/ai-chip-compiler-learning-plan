,519.2 L 768.2,520.6 L 779.8,520.0 L 794.0,520.0 L 794.0,520.0 L 794.2,533.2 L 792.9,547.0 L 795.2,561.7 L 794.0,576.0 L 794.0,576.0 L 780.0,576.5 L 768.0,575.3 L 754.2,577.0 L 740.0,576.0 L 740.0,576.0 L 739.2,562.8 L 739.7,549.1 L 740.4,534.3 L 740.0,520.0" fill="#ffffff" stroke="#6b6357" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="767.0" y="546.0" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="17" fill="#3b352d" text-anchor="middle" opacity="1.0" font-weight="bold">5</text><text x="767.0" y="570" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11" fill="#84796a" text-anchor="middle" opacity="1.0" font-weight="normal">@偏移5</text>
<text x="60" y="600" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11.5" fill="#84796a" text-anchor="start" opacity="1.0" font-weight="normal">A[1,2]、T[2,1]、B[1,1] 各自代入公式后，都准确落在自己的格子上——编译器和 numpy 算的是同一笔账</text>
<text x="60" y="640" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="13" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="bold">同一公式在 MLIR 里长什么样：</text>
<text x="60" y="664" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12" fill="#a8772e" text-anchor="start" opacity="1.0" font-weight="normal">memref&lt;3x2xf32, strided&lt;[1, 3], offset: 0&gt;&gt;  ← offset 与 strides 直接写进类型，就是公式的两个系数</text>
<text x="60" y="688" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">mlir-opt --canonicalize 之后，转置视图的元数据被折成常数：</text>
<text x="60" y="712" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12" fill="#5a8a5a" text-anchor="start" opacity="1.0" font-weight="normal">return %c0, %c1, %c3 : index, index, index   ← offset=0, strides=[1,3]，与 numpy 的 T 同口径（真实输出）</text>
<text x="60" y="744" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="13" fill="#b0605a" text-anchor="start" opacity="1.0" font-weight="bold">要点：转置/切片只改 (shape, strides, offset) 这张「元信息卡」，一格数据都不搬</text>
<text x="60" y="768" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11.5" fill="#84796a" text-anchor="start" opacity="1.0" font-weight="normal">边界：这条公式只覆盖「仿射布局」——步长恒定、不依赖数据本身；稀疏、压缩等布局不适用</text>
</svg>