<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="370" viewBox="0 0 1080 370"><rect x="4" y="4" width="1072" height="362" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">CE3 主案例解剖：教学 tile 为什么负优化</text><path d="M 60.5,58.5 Q 292.5,60.1 520.5,58.7 Q 521.6,198.5 519.6,340.8 Q 291.3,337.8 61.6,339.2 Q 61.9,197.1 60.5,58.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.25"/><text x="290" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">现象与机制</text><text x="290" y="112" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">现象：160³ tile(64,64) = 93.95ms</text><text x="290" y="134" font-family="'Courier New',monospace" font-size="10.5" fill="#C97B7B" text-anchor="middle">      朴素 O0 = 25.36ms → 0.3×（慢 3 倍）</text><text x="290" y="178" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">机制：点循环从块内起点到全局边界</text><text x="290" y="200" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">      每点被 (M/TM)² 个块重复计算</text><text x="290" y="222" font-family="'Courier New',monospace" font-size="10.5" fill="#C97B7B" text-anchor="middle">      tile=(64,64)：160/64≈2.5 → 6.25×</text><text x="290" y="244" font-family="'Courier New',monospace" font-size="10.5" fill="#C97B7B" text-anchor="middle">      tile=(16,16)：160/16=10 → 100×！</text><text x="290" y="288" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">代价对比：复用省的访存（~2×）</text><text x="290" y="310" font-family="'Courier New',monospace" font-size="10.5" fill="#C97B7B" text-anchor="middle">          &lt; 重复付的计算（6.25~100×）</text><path d="M 559.1,60.1 Q 789.9,59.9 1019.0,58.6 Q 1017.7,197.2 1018.5,339.3 Q 790.2,338.5 560.6,338.7 Q 561.2,197.3 559.1,60.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.85"/><text x="790" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">适用条件与教训</text><text x="790" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">适用条件（tile 化有益的前提）：</text><text x="790" y="134" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">  ① 块内边界完整（min 钳制——无重复）</text><text x="790" y="156" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">  ② 块内数据装得下 cache（复用真实发生）</text><text x="790" y="178" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">  ③ 重复率 = 1（每点恰好一次）</text><text x="790" y="222" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">教学版的教训：</text><text x="790" y="244" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">  · D146 验收 10/10 全过——机制正确</text><text x="790" y="266" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">  · D151 实测 0.3×——性能负优化</text><text x="790" y="288" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">  · 「正确」与「快」是两个独立维度</text><text x="790" y="310" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">  · 性能验收（D146 ④）当时用产物差异</text><text x="790" y="332" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">    代替了性能对照——这个妥协的账今天结清</text></svg>
