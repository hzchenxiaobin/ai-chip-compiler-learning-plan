i SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">injected-failures.json</text><text x="540.0" y="310" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="14" fill="#3B3B3B" text-anchor="middle" font-weight="bold">随机的价值：覆盖手工想不到的组合</text><path d="M 59.3,328.7 Q 538.6,329.9 1020.8,331.0 Q 1018.1,394.5 1019.7,458.5 Q 538.6,457.1 58.7,458.8 Q 57.8,394.4 59.3,328.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.8"/><text x="540.0" y="356" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">手工正反例（D134 的 16 例）覆盖「想得到的坑」；随机测试探索「想不到的组合」——</text><text x="540.0" y="380" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">M=1×K=1×N=1 的全退化、31×1×31 的极扁、16×16×16 的方阵——边界形态由分布自然给出</text><text x="540.0" y="404" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">配比纪律（计划条目）：先验证正确性再记录性能——今天只跑正确性（性能归 D138 的基准）</text><text x="540.0" y="496" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">一天的数字</text><path d="M 120.6,515.1 Q 218.7,514.0 320.0,517.2 Q 320.5,552.1 320.1,583.0 Q 221.2,581.7 121.4,581.9 Q 119.2,549.6 120.6,515.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.4"/><text x="220" y="542" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="14" fill="#3B3B3B" text-anchor="middle" font-weight="bold">200 组</text><text x="220" y="562" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">随机全对</text><path d="M 338.7,516.4 Q 439.8,515.4 540.8,516.2 Q 542.1,550.0 541.1,580.7 Q 439.2,580.8 338.8