<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540"><rect x="4" y="4" width="1072" height="532" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">实现方案：五个面的影响分析（三个零修改）</text><path d="M 50.3,60.6 Q 138.7,60.5 230.0,60.0 Q 231.4,135.7 229.5,211.1 Q 137.3,208.8 49.2,208.7 Q 48.0,133.8 50.3,60.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.35"/><text x="140" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">IR</text><text x="140" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">S2 生成新形态：</text><text x="140" y="132" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">块循环壳＋点循环</text><text x="140" y="152" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">（新增代码的主战场）</text><path d="M 249.5,61.3 Q 337.5,60.9 429.9,61.0 Q 431.8,133.8 431.0,208.8 Q 341.0,211.8 248.8,211.4 Q 250.6,135.5 249.5,61.3  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.35"/><text x="340" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">Pass</text><text x="340" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">零修改！</text><text x="340" y="132" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">scf→cf/memref/func</text><text x="340" y="152" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">对循环层数无感</text><path d="M 449.3,59.5 Q 536.9,58.1 628.5,58.5 Q 627.2,131.6 629.2,209.0 Q 540.4,208.1 450.8,209.5 Q 449.0,133.1 449.3,59.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.35"/><text x="540" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">Lowering</text><text x="540" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">零修改</text><text x="540" y="132" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">（同上——pass 不挑循环）</text><path d="M 650.3,60.9 Q 740.8,63.0 831.4,61.3 Q 829.6,135.9 829.2,210.4 Q 740.4,207.8 649.3,208.8 Q 647.7,136.5 650.3,60.9  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.35"/><text x="740" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">Runtime</text><text x="740" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">零修改</text><text x="740" y="132" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">ciface 签名不变</text><text x="740" y="152" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">tile 是编译期决策</text><path d="M 851.2,60.4 Q 942.5,58.8 1031.0,61.3 Q 1030.7,134.5 1030.7,211.5 Q 941.9,209.5 851.0,211.5 Q 852.2,137.2 851.2,60.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.35"/><text x="940" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">测试</text><text x="940" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">fuzz 沿用（块循环也过）</text><text x="940" y="132" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">＋tile 对照新增</text><path d="M 58.5,238.6 Q 540.5,240.3 1020.1,241.5 Q 1020.6,281.9 1021.5,320.9 Q 539.1,319.4 61.0,319.4 Q 59.7,277.7 58.5,238.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.85"/><text x="540.0" y="266" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">三个零修改是本周最大的好消息：块循环只动 S2 生成器一个文件——</text><text x="540.0" y="288" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">「新 IR 形态落在已有 pass 的能力圈内」是设计阶段的最重要的验证（今天蓝图已过管道证明这一点）</text><text x="540.0" y="356" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">蓝图样例（4x6x3, tile=2,2,3）——今天已过七 pass</text><path d="M 150.7,377.5 Q 539.0,377.4 929.2,375.3 Q 927.8,447.1 930.6,516.3 Q 539.0,515.7 149.6,516.0 Q 149.9,447.1 150.7,377.5  Z" stroke="#3B3B3B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="#FDFBF6" fill-opacity="0.95"/><text x="180" y="398" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">scf.for %i0 = %c0 to %cM step %cTM {     // 外层 tile 壳</text><text x="180" y="417" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">  scf.for %j0 = ... step %cTN {</text><text x="180" y="436" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">    scf.for %k0 = ... step %cTK {</text><text x="180" y="455" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">      scf.for %i = %i0 to %ihi step %c1 {   // 内层点循环</text><text x="180" y="474" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">        ... load/mulf/addf/store ...</text><text x="180" y="493" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">}}}}                                      // 四层嵌套（朴素版两层）</text></svg>
