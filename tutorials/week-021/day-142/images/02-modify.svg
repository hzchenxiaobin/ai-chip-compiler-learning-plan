-anchor="middle" font-weight="bold">最小可运行切片（D143 的目标）</text><path d="M 199.9,318.6 Q 538.1,319.1 880.4,319.2 Q 878.8,368.5 879.7,418.7 Q 538.8,418.2 200.8,418.5 Q 198.2,367.1 199.9,318.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.3"/><text x="540" y="346" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="start">① gen_loop_ir_full(g, tile=(2,2,3)) 生成蓝图形态</text><text x="540" y="370" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="start">② 七 pass 全通（今天蓝图已验证）</text><text x="540" y="394" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="start">③ 与朴素版 bitwise 对照（同 golden）——正确性第一关</text><path d="M 59.6,446.8 Q 541.3,444.2 1020.4,445.1 Q 1018.4,471.2 1020.0,500.5 Q 538.8,499.1 58.9,500.4 Q 60.8,473.7 59.6,446.8  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.85"/><text x="540.0" y="470" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">切片的设计原则：最小切片=「能看到端到端差异的最短路径」——</text><text x="540.0" y="490" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">tile=(2,2,3) 的产物与朴素版有 grep 可见的差异＋bitwise 一致——两个证据一起到手</text></svg>
