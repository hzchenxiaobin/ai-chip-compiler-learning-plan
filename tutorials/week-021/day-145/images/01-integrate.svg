<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="490" viewBox="0 0 1080 490"><rect x="4" y="4" width="1072" height="482" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">四个集成点全通＋一个真 bug 的发现与修复</text><path d="M 61.2,61.0 Q 175.6,61.5 286.3,58.4 Q 284.8,124.0 283.5,189.4 Q 170.5,191.5 60.9,190.6 Q 59.1,125.0 61.2,61.0  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.35"/><text x="172" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">I1 tile 端到端</text><text x="172" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">CLI→生成器→IR</text><text x="172" y="134" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">三种 tile 全过</text><path d="M 304.8,60.3 Q 418.8,61.6 529.3,59.7 Q 531.3,124.9 529.0,189.4 Q 415.7,188.7 305.0,188.5 Q 305.4,124.2 304.8,60.3  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.35"/><text x="417" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">I2 分发 key 扩展</text><text x="417" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">(shape,tile) 二元组</text><text x="417" y="134" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">3 特化全对</text><path d="M 550.1,59.4 Q 661.7,59.8 775.7,59.5 Q 777.3,124.6 775.6,188.9 Q 662.6,190.1 549.3,189.1 Q 549.3,123.1 550.1,59.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.35"/><text x="662" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">I3 fuzz 扩容</text><text x="662" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">30 组随机×轮换 tile</text><text x="662" y="134" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">30/30 全对</text><path d="M 794.1,61.5 Q 908.8,62.0 1021.3,60.3 Q 1022.4,125.5 1019.7,191.0 Q 908.2,191.5 795.5,190.7 Q 795.1,128.1 794.1,61.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.35"/><text x="907" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">I4 全管道数值</text><text x="907" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">IR→pass→执行→golden</text><text x="907" y="134" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">allclose 全过</text><path d="M 59.2,220.3 Q 537.7,223.0 1018.5,221.6 Q 1020.5,312.2 1021.5,399.0 Q 543.5,400.0 61.2,398.6 Q 61.9,308.4 59.2,220.3  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.25"/><text x="540.0" y="248" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13.5" fill="#C97B7B" text-anchor="middle" font-weight="bold">集成测试抓到的真 bug：k0 块的部分和覆盖</text><text x="100" y="274" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">现象：数值全错（out[0][0]=11.6 vs golden 22.1——差值恰好是部分和）</text><text x="100" y="296" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#C97B7B" text-anchor="start">根因：内层 k 循环从 %k0 出发（块内起点）——每个 k0 块只算 k≥k0 的尾巴，</text><text x="100" y="318" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#C97B7B" text-anchor="start">      多个 k0 块重复写同一点、最后写的块只含部分 k → 部分和覆盖完整和！</text><text x="100" y="340" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">修复：内层 k 从 %c0（完整 K 累加）——每点独立完整算，重复块写同值（幂等成立）</text><text x="100" y="362" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">教训：D143 的幂等论证有漏洞（「重复写同值」要求每块算出同值——k0 起点破坏了这一点）</text><path d="M 61.5,418.7 Q 540.8,419.9 1019.7,419.8 Q 1020.8,449.7 1018.9,476.6 Q 540.5,477.1 58.5,477.1 Q 59.9,449.5 61.5,418.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.85"/><text x="540.0" y="444" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">「集成不改旧」红线检查：tile=None 朴素路径零变化（D124 测试不受影响）</text><text x="540.0" y="464" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">组合测试的价值：单独测生成器全对、接进全管道立刻抓到 k0 bug——组合是新的失败面</text></svg>
