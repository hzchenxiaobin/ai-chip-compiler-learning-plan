<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 680" width="1080" height="680"><rect x="3" y="3" width="1074" height="674" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="30" y="44" text-anchor="start" font-size="25" fill="#3b3b3b">校验电池实测：17 个坏输入全被拒；好输入各有归宿</text><text x="30" y="70" text-anchor="start" font-size="14.5" fill="#6b6459">真实运行摘录（--battery / --show）；报错家族统一为 LoopOptionsError——驱动器一把抓</text><path d="M 31.1,82.9 Q 539.8,82.1 1049.6,82.4" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M 30.1,98.7 Q 287.2,99.5 545.2,99.5 M 546.3,100.6 Q 545.6,335.7 544.4,569.9 M 545.3,571.3 Q 287.1,569.8 30.6,569.5 M 28.7,570.0 Q 31.3,334.1 31.2,100.9 Z" fill="white" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" rx="8"/><path d="M 34.9,105.1 Q 288.1,106.0 538.5,104.8 M 540.1,107.2 Q 539.0,123.0 539.3,139.2 M 540.2,140.8 Q 288.0,139.2 35.2,140.3 M 36.9,139.1 Q 35.2,122.8 35.5,105.4 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" rx="5"/><text x="46" y="129" text-anchor="start" font-size="13.5" fill="#d96c5c" font-weight="bold">✗ 被拒（fail-closed，17/17，摘录 8 例）</text><text x="46" y="152" text-anchor="start" font-size="11.5" fill="#3b3b3b" font-weight="bold">order='ikm'</text><text x="280" y="152" text-anchor="middle" font-size="11.5" fill="#d96c5c">→</text><text x="46" y="167.0" text-anchor="start" font-size="9.6" fill="#6b6459">order 里出现不认识的循环变量 'm'（合法：i、j、k）</text><path d="M 42.0,178.0 Q 287.1,178.2 532.9,178.5" fill="none" stroke="#e9e4d8" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="204" text-anchor="start" font-size="11.5" fill="#3b3b3b" font-weight="bold">order='iij'</text><text x="280" y="204" text-anchor="middle" font-size="11.5" fill="#d96c5c">→</text><text x="46" y="219.0" text-anchor="start" font-size="9.6" fill="#6b6459">order 里的归纳变量重复了：('i', 'i', 'j')（每个恰好出现一次）</text><path d="M 42.4,229.7 Q 287.7,229.6 533.0,230.2" fill="none" stroke="#e9e4d8" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="256" text-anchor="start" font-size="11.5" fill="#3b3b3b" font-weight="bold">tile=(True,2,2)</text><text x="280" y="256" text-anchor="middle" font-size="11.5" fill="#d96c5c">→</text><text x="46" y="271.0" text-anchor="start" font-size="9.6" fill="#6b6459">tile_m 必须是正整数，拿到 True（bool）</text><path d="M 41.5,282.2 Q 287.8,281.8 533.3,281.8" fill="none" stroke="#e9e4d8" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="308" text-anchor="start" font-size="11.5" fill="#3b3b3b" font-weight="bold">tile=(1.5,2,2)</text><text x="280" y="308" text-anchor="middle" font-size="11.5" fill="#d96c5c">→</text><text x="46" y="323.0" text-anchor="start" font-size="9.6" fill="#6b6459">tile_m 必须是正整数，拿到 1.5（float）</text><path d="M 42.3,333.7 Q 287.6,333.6 533.1,333.6" fill="none" stroke="#e9e4d8" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="360" text-anchor="start" font-size="11.5" fill="#3b3b3b" font-weight="bold">unroll=0</text><text x="280" y="360" text-anchor="middle" font-size="11.5" fill="#d96c5c">→</text><text x="46" y="375.0" text-anchor="start" font-size="9.6" fill="#6b6459">unroll 必须是正整数（≥1），拿到 0</text><path d="M 41.6,386.2 Q 287.8,386.3 533.2,386.1" fill="none" stroke="#e9e4d8" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="412" text-anchor="start" font-size="11.5" fill="#3b3b3b" font-weight="bold">parse('foo=1')</text><text x="280" y="412" text-anchor="middle" font-size="11.5" fill="#d96c5c">→</text><text x="46" y="427.0" text-anchor="start" font-size="9.6" fill="#6b6459">不认识的配置项「foo」（合法键：order / tile / unroll）——拒绝猜测</text><path d="M 42.0,437.7 Q 287.6,437.8 532.9,437.9" fill="none" stroke="#e9e4d8" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="464" text-anchor="start" font-size="11.5" fill="#3b3b3b" font-weight="bold">parse('order=ikj,order=kij')</text><text x="280" y="464" text-anchor="middle" font-size="11.5" fill="#d96c5c">→</text><text x="46" y="479.0" text-anchor="start" font-size="9.6" fill="#6b6459">配置项「order」出现两次：'ikj' 和 'kij'——以哪个为准？拒绝猜测</text><path d="M 41.7,490.2 Q 288.0,490.2 533.2,489.6" fill="none" stroke="#e9e4d8" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="516" text-anchor="start" font-size="11.5" fill="#3b3b3b" font-weight="bold">parse('tile=2xXx3')</text><text x="280" y="516" text-anchor="middle" font-size="11.5" fill="#d96c5c">→</text><text x="46" y="531.0" text-anchor="start" font-size="9.6" fill="#6b6459">tile 的每个分量必须是正整数，拿到 '2xXx3'</text><path d="M 41.8,541.6 Q 288.0,542.4 532.9,542.0" fill="none" stroke="#e9e4d8" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 569.9,99.1 Q 809.4,99.2 1050.4,101.2 M 1050.6,100.7 Q 1049.8,333.8 1050.2,570.4 M 1049.6,570.4 Q 811.2,570.2 569.7,569.8 M 569.9,568.9 Q 570.1,335.4 569.3,99.9 Z" fill="white" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" rx="8"/><path d="M 576.8,106.2 Q 809.2,106.4 1043.1,105.5 M 1042.8,105.1 Q 1043.2,123.2 1043.0,140.0 M 1044.2,141.2 Q 809.4,140.6 576.4,139.1 M 575.1,138.7 Q 577.2,122.0 574.8,106.5 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" rx="5"/><text x="586" y="129" text-anchor="start" font-size="13.5" fill="#79b26a" font-weight="bold">✓ 通过（四类归宿，全部真实行为）</text><path d="M 583.3,139.1 Q 810.0,138.1 1039.1,136.8 M 1038.5,138.9 Q 1037.4,168.3 1038.6,197.7 M 1039.1,196.9 Q 810.1,198.2 581.8,199.1 M 582.4,196.9 Q 581.0,167.2 581.4,137.9 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" rx="4"/><text x="594" y="152" text-anchor="start" font-size="12" fill="#79b26a" font-weight="bold">（空串）</text><text x="720" y="150" text-anchor="start" font-size="10" fill="#3b3b3b">全默认：order=i-j-k、不 tiling、不展开</text><text x="720" y="164" text-anchor="start" font-size="10" fill="#3b3b3b">＝ Day 89~92 的默认跑法（18 op，LO4c 复现）</text><path d="M 581.5,207.0 Q 810.3,208.5 1038.8,209.3 M 1036.8,207.6 Q 1038.1,237.8 1039.2,268.9 M 1037.8,268.2 Q 810.0,266.8 582.6,268.1 M 583.2,268.8 Q 582.1,236.8 583.1,208.8 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" rx="4"/><text x="594" y="222" text-anchor="start" font-size="12" fill="#79b26a" font-weight="bold">order=ikj</text><text x="720" y="220" text-anchor="start" font-size="10" fill="#3b3b3b">端到端：21 op；C 流量 12L+12S+4 清零</text><text x="720" y="234" text-anchor="start" font-size="10" fill="#3b3b3b">与同序参考位等价 ✓（LO4b）</text><path d="M 582.5,278.7 Q 810.2,278.8 1039.2,279.3 M 1037.0,278.9 Q 1036.7,308.6 1038.0,336.7 M 1036.8,338.9 Q 810.4,338.5 582.5,339.0 M 582.7,337.0 Q 583.0,308.1 582.5,278.3 Z" fill="#fdead3" stroke="#e8973f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" rx="4"/><text x="594" y="292" text-anchor="start" font-size="12" fill="#e8973f" font-weight="bold">tile=2x2x3</text><text x="720" y="290" text-anchor="start" font-size="10" fill="#3b3b3b">③形状门全绿：2×3·3×2 三维整除（ok×3）</text><text x="720" y="304" text-anchor="start" font-size="10" fill="#3b3b3b">→ ④门拒（Day 94）——校验通过 ≠ 已经生效</text><path d="M 581.6,349.3 Q 811.1,347.4 1039.2,347.1 M 1037.1,347.9 Q 1037.3,378.7 1038.2,408.9 M 1037.2,407.7 Q 809.0,407.9 581.4,408.0 M 582.0,407.0 Q 582.4,379.1 581.2,347.6 Z" fill="#fdead3" stroke="#e8973f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" rx="4"/><text x="594" y="362" text-anchor="start" font-size="12" fill="#e8973f" font-weight="bold">tile=2x2x2</text><text x="720" y="360" text-anchor="start" font-size="10" fill="#3b3b3b">③形状门 warn：tile_k=2 ∤ K=3（→ Day 95 尾部）</text><text x="720" y="374" text-anchor="start" font-size="10" fill="#3b3b3b">→ ④门拒（Day 94）</text><path d="M 580.9,417.4 Q 810.7,416.9 1039.2,417.0 M 1037.9,418.2 Q 1038.9,446.9 1038.3,478.4 M 1037.4,478.7 Q 809.0,478.6 582.6,477.5 M 583.0,478.7 Q 582.6,447.1 583.3,418.5 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" rx="4"/><text x="594" y="432" text-anchor="start" font-size="12" fill="#79b26a" font-weight="bold">tile=1x1x1</text><text x="720" y="430" text-anchor="start" font-size="10" fill="#3b3b3b">放行 ＋ 附注：「平凡块（= 不分块）」</text><text x="720" y="444" text-anchor="start" font-size="10" fill="#3b3b3b">不是静默忽略——没生效也有案可查（LO6c）</text><path d="M 582.8,488.0 Q 811.3,487.8 1037.1,487.3 M 1038.0,489.2 Q 1037.1,517.7 1038.6,547.3 M 1039.0,549.0 Q 809.7,548.2 580.7,547.0 M 581.1,547.5 Q 581.4,518.1 581.6,486.9 Z" fill="#fdead3" stroke="#e8973f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" rx="4"/><text x="594" y="502" text-anchor="start" font-size="12" fill="#e8973f" font-weight="bold">unroll=2</text><text x="720" y="500" text-anchor="start" font-size="10" fill="#3b3b3b">③形状门 warn：∤ 最内层 k 的 trip 3（→ Day 96）</text><text x="720" y="514" text-anchor="start" font-size="10" fill="#3b3b3b">→ ④门拒（Day 96）</text><path d="M 30.7,590.2 Q 540.1,589.7 1049.2,590.5 M 1049.4,589.0 Q 1050.7,615.9 1050.8,642.4 M 1050.4,640.9 Q 538.8,642.9 30.3,642.9 M 30.3,643.2 Q 30.9,615.6 29.1,590.2 Z" fill="#e9e4d8" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" rx="5"/><text x="46" y="610" text-anchor="start" font-size="11.5" fill="#6b6459">判据（LO2）：每个坏输入必须抛 OptionsValidationError，且报错含定位片段——错在哪个字段、为什么、合法值是什么；</text><text x="46" y="629" text-anchor="start" font-size="11.5" fill="#6b6459">宽容式实现（filter 掉不认识的键、把坏值改成默认值）会让这 17 个错误全部静默消失——这正是 fail-closed 要防的世界。</text></g></svg>