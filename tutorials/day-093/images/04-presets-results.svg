hor="middle" font-size="11.5" fill="#3b3b3b">8447</text><text x="511.0" y="371" text-anchor="middle" font-size="11.5" fill="#3b3b3b">2463</text><path d="M 29.5,346.5 Q 286.1,345.9 542.6,345.4" fill="none" stroke="#e9e4d8" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 32.3,389.1 Q 286.5,388.7 539.7,389.1 M 539.6,388.7 Q 540.6,406.3 540.2,422.6 M 540.4,423.2 Q 286.4,422.5 32.0,422.5 M 32.0,422.5 Q 32.1,406.1 31.9,388.5 Z" fill="#f9dfd9" stroke="#e8973f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" rx="4"/><text x="46" y="411" text-anchor="start" font-size="11.5" fill="#e8973f" font-weight="bold">tile=16x16x16</text><text x="316.0" y="411" text-anchor="middle" font-size="11.5" fill="#d96c5c">— → ④门拒（点名 Day 94）</text><path d="M 32.0,428.6 Q 286.0,429.3 540.4,429.4 M 540.1,428.8 Q 539.7,446.2 540.2,462.8 M 540.5,463.6 Q 286.5,463.5 32.1,462.5 M 31.5,462.9 Q 32.5,446.5 31.9,428.6 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" rx="4"/><text x="46" y="451" text-anchor="start" font-size="11.5" fill="#d96c5c" font-weight="bold">unroll=2</text><text x="316.0" y="451" text-anchor="middle" font-size="11.5" fill="#d96c5c">— → ④门拒（点名 Day 96）</text><path d="M 418,206.13371389357064 C 418,181 468,181 468,206 C 468,231 418,231 418,206.13371389357064" fill="none" stroke="#e8973f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 488,165.33549583055176 C 488,143 534,143 534,166 C 534,189 488,189 488,165.33549583055176" fill="none" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="498" text-anchor="start" font-size="11" fill="#6b6459">高亮：512B 下 i-k-j 缺失最少（2580，橙圈）；1KB 下 i-j-k 反超（950，绿圈）——排名随容量翻转（Day 92 的发现，今天由配置触发）。</text><text x="30" y="514" text-anchor="start" font-size="11" fill="#6b6459">位等价 6/6：k 处处升序 → 舍入顺序不变——换配置不换数（Day 92 结论由配置触发）。</text><text x="30" y="530" text-anchor="start" font-size="11" fill="#6b6459">miss 列与 Day 92 的 order-table.txt 逐格一致——今天换的是「配置从哪来」，不是行为口径。</text><text x="30" y="546" text-anchor="start" font-size="11" fill="#6b6459">全默认也是一份合法配置：空串 → parse('') == LoopOptions()（无 flag = 默认行为）。</text><path d="M 619.2,104.4 Q 856.0,103.0 1088.8,105.2 M 1091.1,103.4 Q 1090.4,178.2 1089.9,254.3 M 1089.5,253.5 Q 855.9,252.8 619.7,252.9 M 621.0,253.2 Q 619.3,178.1 621.2,103.9 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" rx="8"/><text x="636" y="128" text-anchor="start" font-size="13.5" fill="#d96c5c" font-weight="bold">④门实录：校验通过 ≠ 已经生效</text><text x="636" y="148" text-anchor="start" font-size="10.5" fill="#3b3b3b">tile=16x16x16 通过了校验（第①~③道门），但 Tiling 的 lower</text><text x="636" y="163" text-anchor="start" font-size="10.5" fill="#3b3b3b">ing 是 Day 94 的内容——今天拒绝运行，绝不静默忽略</text><text x="636" y="222" text-anchor="start" font-size="10.5" fill="#d96c5c">宁可拒绝运行，不可静默忽略——</text><text x="636" y="236" text-anchor="start" font-size="10.5" fill="#d96c5c">配了没生效必须有响声（LO6a）</text><path d="M 618.8,270.6 Q 855.5,271.1 1090.3,269.7 M 1090.0,269.3 Q 1090.7,344.2 1088.8,420.8 M 1090.4,419.6 Q 855.0,419.2 620.9,418.9 M 620.7,420.4 Q 619.5,344.8 620.6,269.0 Z" fill="white" stroke="#5f8fcb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" rx="8"/><text x="636" y="294" text-anchor="start" font-size="13.5" fill="#5f8fcb" font-weight="bold">op 序列对照（真实转换输出）</text><text x="636" y="316" text-anchor="start" font-size="10" fill="#3b3b3b">i-j-k（18 op，空配置）：</text><text x="636" y="331" text-anchor="start" font-size="10" fill="#3b3b3b">alloc → constant×6 → for×3 → load×2 → mulf → addf → yield → store</text><text x="636" y="362" text-anchor="start" font-size="10" fill="#3b3b3b">i-k-j（21 op，order=ikj）：</text><text x="636" y="377" text-anchor="start" font-size="10" fill="#3b3b3b">alloc → constant×6 → for×2 → store → for×3 → load×3 → mulf → addf </text><text x="636" y="392" text-anchor="start" font-size="10" fill="#3b3b3b">→ store</text><text x="636" y="406" text-anchor="start" font-size="10" fill="#6b6459">差别：清零 nest＋3、体内多 1 个 load（读 C）、多 1 个 store（写回 C）。</text><path d="M 620.9,437.0 Q 855.8,435.6 1090.5,436.7 M 1090.1,436.0 Q 1090.3,461.1 1090.6,484.3 M 1089.1,483.1 Q 854.1,482.8 620.1,482.8 M 618.7,484.3 Q 619.6,459.5 619.5,434.8 Z" fill="white" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" rx="6"/><text x="634" y="466" text-anchor="start" font-size="13" fill="#d96c5c" font-weight="bold">坏输入</text><text x="716" y="467" text-anchor="middle" font-size="17" fill="#d96c5c" font-weight="bold">17/17</text><text x="750" y="466" text-anchor="start" font-size="10.5" fill="#3b3b3b">全部按预期拒绝，报错含定位片段（LO2）</text><path d="M 621.0,491.7 Q 854.7,493.1 1088.8,491.7 M 1089.5,492.6 Q 1089.6,515.5 1090.3,538.7 M 1090.8,538.9 Q 855.4,541.0 619.9,539.5 M 619.0,540.2 Q 621.1,515.8 619.4,493.3 Z" fill="white" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" rx="6"/><text x="634" y="522" text-anchor="start" font-size="13" fill="#79b26a" font-weight="bold">位等价</text><text x="716" y="523" text-anchor="middle" font-size="17" fill="#79b26a" font-weight="bold">6/6</text><text x="750" y="522" text-anchor="start" font-size="10.5" fill="#3b3b3b">6 份顺序配置端到端，与同序参考逐位相同（LO4）</text><path d="M 621.2,549.3 Q 855.7,548.6 1089.6,547.6 M 1090.2,549.1 Q 1090.4,571.3 1090.9,596.9 M 1089.3,595.9 Q 853.8,596.7 619.9,595.0 M 618.8,596.4 Q 620.7,571.3 619.0,548.1 Z" fill="white" stroke="#e8973f" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" rx="6"/><text x="634" y="578" text-anchor="start" font-size="13" fill="#e8973f" font-weight="bold">停在④门</text><text x="716" y="579" text-anchor="middle" font-size="17" fill="#e8973f" font-weight="bold">2</text><text x="750" y="578" text-anchor="start" font-size="10.5" fill="#3b3b3b">tile → D94；unroll → D96：校验过、消费没到（LO6）</text><path d="M 620.9,604.9 Q 855.4,603.5 1089.4,605.0 M 1088.7,604.1 Q 1090.7,629.1 10