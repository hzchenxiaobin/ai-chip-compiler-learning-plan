<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Bradley Hand, Comic Sans MS, Segoe Print, Kaiti SC, KaiTi, cursive">
  <defs>
    <filter id="wob" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wob2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wob3" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arr" viewBox="0 0 12 12" refX="9.5" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 2 C5 1.5, 9 4, 10 6 C9 8, 5 10.5, 2 10 C4 8, 4 4, 2 2 Z" fill="#2F2B27"/>
    </marker>
    <style>
      .bg { fill:#FBF9F3; }
      .t-title { font-size:21px; fill:#2F2B27; font-weight:bold; }
      .t-h { font-size:15px; fill:#2F2B27; font-weight:bold; }
      .t-b { font-size:12.5px; fill:#2F2B27; }
      .t-s { font-size:11px; fill:#5A544C; }
      .code { font-family:Consolas, Menlo, Courier New, monospace; fill:#1F3B57; }
      .box { fill:#FFFFFF; stroke:#2F2B27; stroke-width:2.2; stroke-linejoin:round; }
      .bbox { fill:#DAE8FC; stroke:#5B8DB8; stroke-width:2.4; stroke-linejoin:round; }
      .obox { fill:#FFE6CC; stroke:#D79B00; stroke-width:3; stroke-linejoin:round; }
      .gbox { fill:#D5E8D4; stroke:#82B366; stroke-width:2.4; stroke-linejoin:round; }
      .rbox { fill:#F8CECC; stroke:#B85450; stroke-width:2.4; stroke-linejoin:round; }
      .arrow { stroke:#2F2B27; stroke-width:2.2; fill:none; stroke-linecap:round; marker-end:url(#arr); }
      .chip { fill:#FFFFFF; stroke:#2F2B27; stroke-width:1.8; stroke-linejoin:round; }
    </style>
  </defs>

  <rect class="bg" width="1000" height="660"/>
  <text class="t-title" x="30" y="42">mini.matmul 输出 shape 推导：输入 → 逐维规则 → 输出，外加三种出口</text>
  <text class="t-s" x="975" y="68" text-anchor="end" fill="#8A8378">元素类型恒为 f32（ODS 保证），推导只管 shape</text>

  <!-- ===== 左：两个输入 ===== -->
  <g filter="url(#wob)">
    <rect class="bbox" x="28" y="96" width="250" height="140" rx="12" transform="rotate(-0.4 153 166)"/>
    <rect class="bbox" x="28" y="256" width="250" height="140" rx="12" transform="rotate(0.4 153 326)"/>
  </g>
  <text class="t-h" x="48" y="126">lhs 输入</text>
  <text class="code" x="48" y="156" font-size="14">tensor&lt;?x2x3xf32&gt;</text>
  <g filter="url(#wob2)">
    <rect class="chip" x="48" y="172" width="74" height="26" rx="7"/>
    <rect class="chip" x="128" y="172" width="44" height="26" rx="7"/>
    <rect class="chip" x="176" y="172" width="44" height="26" rx="7"/>
  </g>
  <text class="code" x="85" y="190" text-anchor="middle" font-size="11.5">batch=?</text>
  <text class="code" x="150" y="190" text-anchor="middle" font-size="11.5">M=2</text>
  <text class="code" x="198" y="190" text-anchor="middle" font-size="11.5">K=3</text>
  <text class="t-s" x="48" y="224">M、K 的信息只能来自 lhs</text>

  <text class="t-h" x="48" y="286">rhs 输入</text>
  <text class="code" x="48" y="316" font-size="14">tensor&lt;2x3x2xf32&gt;</text>
  <g filter="url(#wob2)">
    <rect class="chip" x="48" y="332" width="74" height="26" rx="7"/>
    <rect class="chip" x="128" y="332" width="44" height="26" rx="7"/>
    <rect class="chip" x="176" y="332" width="44" height="26" rx="7"/>
  </g>
  <text class="code" x="85" y="350" text-anchor="middle" font-size="11.5">batch=2</text>
  <text class="code" x="150" y="350" text-anchor="middle" font-size="11.5">K=3</text>
  <text class="code" x="198" y="350" text-anchor="middle" font-size="11.5">N=2</text>
  <text class="t-s" x="48" y="384">K、N 的信息只能来自 rhs</text>

  <!-- ===== 中：规则表 ===== -->
  <g filter="url(#wob)">
    <rect class="obox" x="336" y="96" width="336" height="310" rx="12" transform="rotate(0.3 504 251)"/>
  </g>
  <text class="t-h" x="356" y="126">规则表（明天原样翻译成 C++）</text>
  <g filter="url(#wob2)">
    <rect class="chip" x="356" y="146" width="40" height="26" rx="7"/>
    <rect class="chip" x="356" y="216" width="40" height="26" rx="7"/>
    <rect class="chip" x="356" y="270" width="40" height="26" rx="7"/>
    <rect class="chip" x="356" y="324" width="40" height="26" rx="7"/>
  </g>
  <text class="t-b" x="376" y="164" text-anchor="middle" font-weight="bold">R1</text>
  <text class="t-b" x="410" y="155">batch 维：取『已知一侧』</text>
  <text class="t-s" x="410" y="172">lhs 静态取 lhs，否则取 rhs；</text>
  <text class="t-s" x="410" y="188">两侧都 ? 才输出 ?（都静态时相等）</text>
  <text class="t-b" x="376" y="234" text-anchor="middle" font-weight="bold">R2</text>
  <text class="t-b" x="410" y="225">输出 M = lhs 倒数第 2 维</text>
  <text class="t-s" x="410" y="242">唯一来源，? 原样传播</text>
  <text class="t-b" x="376" y="288" text-anchor="middle" font-weight="bold">R3</text>
  <text class="t-b" x="410" y="279">输出 N = rhs 倒数第 1 维</text>
  <text class="t-s" x="410" y="296">唯一来源，? 原样传播</text>
  <text class="t-b" x="376" y="342" text-anchor="middle" font-weight="bold">R4</text>
  <text class="t-b" x="410" y="333">K 被消费，不进输出</text>
  <text class="t-s" x="410" y="350">2x? · ?x2 照样推出 2x2</text>
  <path d="M356 202 Q504 208 652 202" fill="none" stroke="#E8B96A" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M356 258 Q504 264 652 258" fill="none" stroke="#E8B96A" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M356 312 Q504 318 652 312" fill="none" stroke="#E8B96A" stroke-width="1.4" stroke-dasharray="5 4"/>

  <!-- ===== 右：输出 ===== -->
  <g filter="url(#wob)">
    <rect class="gbox" x="730" y="140" width="242" height="180" rx="12" transform="rotate(-0.4 851 230)"/>
  </g>
  <text class="t-h" x="750" y="170" font-size="14">输出（今天就能推出）</text>
  <text class="code" x="750" y="200" font-size="15" font-weight="bold">tensor&lt;2x2x2xf32&gt;</text>
  <g filter="url(#wob2)">
    <rect x="746" y="216" width="16" height="14" rx="3" fill="#DAE8FC" stroke="#5B8DB8" stroke-width="1.4"/>
    <rect x="746" y="240" width="16" height="14" rx="3" fill="#DAE8FC" stroke="#5B8DB8" stroke-width="1.4"/>
    <rect x="746" y="264" width="16" height="14" rx="3" fill="#DAE8FC" stroke="#5B8DB8" stroke-width="1.4"/>
  </g>
  <text class="t-b" x="770" y="228">batch=2 ← 取 rhs 已知侧</text>
  <text class="t-b" x="770" y="252">M=2 ← lhs 倒数第 2 维</text>
  <text class="t-b" x="770" y="276">N=2 ← rhs 倒数第 1 维</text>
  <text class="t-s" x="750" y="306" fill="#4C7A43">输入里那个 ? 被 rhs 的 2 补上了</text>

  <!-- 箭头：输入→规则→输出 -->
  <g filter="url(#wob2)">
    <path class="arrow" d="M282 166 Q310 158 334 170"/>
    <path class="arrow" d="M282 326 Q310 334 334 318"/>
    <path class="arrow" d="M676 250 Q704 238 728 228"/>
  </g>

  <!-- ===== 底部：三种出口 ===== -->
  <g filter="url(#wob2)">
    <path class="arrow" d="M450 410 Q300 436 190 452"/>
    <path class="arrow" d="M504 412 Q504 432 504 450"/>
    <path class="arrow" d="M560 410 Q710 436 818 452"/>
  </g>
  <g filter="url(#wob)">
    <rect class="gbox" x="28" y="456" width="300" height="168" rx="12" transform="rotate(-0.4 178 540)"/>
    <rect class="bbox" x="350" y="456" width="300" height="168" rx="12" transform="rotate(0.4 500 540)"/>
    <rect class="rbox" x="672" y="456" width="300" height="168" rx="12" transform="rotate(-0.3 822 540)"/>
  </g>
  <text class="t-h" x="48" y="488">出口① 推导成功 · 全静态</text>
  <text class="code" x="48" y="522" font-size="13.5">2x3 · 3x2 → 2x2</text>
  <text class="t-b" x="48" y="552">一个 ? 都没有</text>
  <text class="t-s" x="48" y="580" fill="#4C7A43">对应测试 T01–T05</text>

  <text class="t-h" x="370" y="488">出口② 推导成功 · 保留 ?</text>
  <text class="code" x="370" y="522" font-size="13.5">?x3 · 3x2 → ?x2</text>
  <text class="t-b" x="370" y="552">『不知道』不是错误，</text>
  <text class="t-b" x="370" y="572">绝不发明数字</text>
  <text class="t-s" x="370" y="598" fill="#3F6E9F">对应测试 T06–T12</text>

  <text class="t-h" x="692" y="488">出口③ 防御性失败</text>
  <text class="code" x="692" y="522" font-size="13.5">rank&lt;2 · 秩不等 · K 不等</text>
  <text class="t-b" x="692" y="552">正常管线里 ODS/Verifier</text>
  <text class="t-b" x="692" y="572">先拦，这里只是兜底</text>
  <text class="t-s" x="692" y="598" fill="#A0433F">对应测试 T13–T15</text>

  <text class="t-s" x="970" y="650" text-anchor="end" fill="#8A8378">Day 43 · 机制图 · R1–R4 与三分类失败语义</text>
</svg>
