<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540"><rect x="4" y="4" width="1072" height="532" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">反例弹药库：四个实测的「优化失效」</text><path d="M 60.8,59.5 Q 540.9,61.8 1020.7,61.1 Q 1020.7,102.7 1020.8,146.6 Q 539.4,145.1 60.6,146.8 Q 59.4,102.1 60.8,59.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.28"/><text x="200" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">融合收益归零</text><text x="200" y="114" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">D125</text><text x="620" y="100" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle">.ll 完全不变——cache 命中使 HBM 流量收益=0</text><path d="M 59.8,158.5 Q 540.3,157.0 1019.6,159.4 Q 1019.6,204.0 1020.8,247.3 Q 539.7,244.9 61.5,246.7 Q 59.1,202.4 59.8,158.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.28"/><text x="200" y="186" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">多使用者不融</text><text x="200" y="214" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">D83 T10</text><text x="620" y="200" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle">matmul 输出被两个下游用——融了破坏语义</text><path d="M 59.0,260.0 Q 541.3,259.9 1021.1,259.8 Q 1022.0,300.6 1021.6,345.0 Q 542.5,347.1 60.6,345.9 Q 60.3,301.4 59.0,260.0  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.28"/><text x="200" y="286" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">tile 负优化</text><text x="200" y="314" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">D151</text><text x="620" y="300" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle">0.3×——重复计算 ×6.25 吃掉复用收益</text><path d="M 59.4,361.2 Q 540.0,359.7 1018.5,361.3 Q 1017.5,404.7 1020.6,444.5 Q 541.6,445.2 61.5,447.1 Q 60.1,404.8 59.4,361.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#B8A7CE" fill-opacity="0.28"/><text x="200" y="386" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">O2 的 shape 依赖</text><text x="200" y="414" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">D152</text><text x="620" y="400" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle">64×160×32 只 1.7×——K=32 展开空间受限</text><path d="M 61.0,468.5 Q 542.0,469.2 1020.7,471.6 Q 1019.8,498.2 1020.7,526.6 Q 539.1,528.9 59.5,527.5 Q 59.0,496.8 61.0,468.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.85"/><text x="540.0" y="494" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">面试官问「你的优化什么时候失效？」——四个反例各有机制解释</text><text x="540.0" y="516" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">答得出反例才是真懂——背概念的人给不出 0.3× 这种数字</text></svg>
