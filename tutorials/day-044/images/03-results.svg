<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Bradley Hand, Comic Sans MS, Segoe Print, Kaiti SC, KaiTi, cursive">
  <defs>
    <filter id="wob" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wob2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="2" seed="27" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wob3" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arr" viewBox="0 0 12 12" refX="9.5" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 2 C5 1.5, 9 4, 10 6 C9 8, 5 10.5, 2 10 C4 8, 4 4, 2 2 Z" fill="#2F2B27"/>
    </marker>
    <style>
      .bg { fill:#FBF9F3; }
      .t-title { font-size:21px; fill:#2F2B27; font-weight:bold; }
      .t-h { font-size:15px; fill:#2F2B27; font-weight:bold; }
      .t-b { font-size:12.5px; fill:#2F2B27; }
      .t-s { font-size:11px; fill:#5A544C; }
      .code { font-family:Consolas, Menlo, Courier New, monospace; fill:#1F3B57; }
      .box { fill:#FFFFFF; stroke:#2F2B27; stroke-width:2.2; stroke-linejoin:round; }
      .bbox { fill:#DAE8FC; stroke:#5B8DB8; stroke-width:2.4; stroke-linejoin:round; }
      .obox { fill:#FFE6CC; stroke:#D79B00; stroke-width:3; stroke-linejoin:round; }
      .gbox { fill:#D5E8D4; stroke:#82B366; stroke-width:2.4; stroke-linejoin:round; }
      .rbox { fill:#F8CECC; stroke:#B85450; stroke-width:2.4; stroke-linejoin:round; }
      .arrow { stroke:#2F2B27; stroke-width:2.2; fill:none; stroke-linecap:round; marker-end:url(#arr); }
      .chip { fill:#FFFFFF; stroke:#2F2B27; stroke-width:1.8; stroke-linejoin:round; }
      .ok { fill:#D5E8D4; stroke:#82B366; stroke-width:1.8; stroke-linejoin:round; }
      .bad { fill:#F8CECC; stroke:#B85450; stroke-width:1.8; stroke-linejoin:round; }
    </style>
  </defs>

  <rect class="bg" width="1000" height="640"/>
  <text class="t-title" x="30" y="42">实测对照：同一输入 2x? · ?x2，结果类型的五种写法</text>
  <text class="t-s" x="975" y="68" text-anchor="end" fill="#8A8378">全部真实运行（code/run_all.sh）· MLIR 18.1.8 · Ubuntu 20.04（aarch64）</text>

  <!-- ===== 上排：三种合法写法 ===== -->
  <g filter="url(#wob)">
    <rect class="gbox" x="30"  y="92" width="300" height="206" rx="12" transform="rotate(-0.4 180 195)"/>
    <rect class="gbox" x="350" y="92" width="300" height="206" rx="12" transform="rotate(0.3 500 195)"/>
    <rect class="gbox" x="670" y="92" width="300" height="206" rx="12" transform="rotate(-0.3 820 195)"/>
  </g>

  <text class="t-h" x="50" y="122">写法一：结果写 ?x?</text>
  <text class="code" x="50" y="150" font-size="12.5">-> tensor&lt;?x?xf32&gt;</text>
  <g filter="url(#wob2)">
    <path class="arrow" d="M64 164 Q62 178 64 192"/>
  </g>
  <text class="code" x="82" y="184" font-size="10.5">-mini-infer-shape</text>
  <text class="code" x="50" y="220" font-size="12.5" font-weight="bold">-> tensor&lt;2x2xf32&gt;</text>
  <text class="t-s" x="50" y="252">M、N 两维都是推导补的</text>
  <text class="t-s" x="50" y="268">（refineShape 的“采纳”分支）</text>
  <g filter="url(#wob2)">
    <rect class="ok" x="272" y="106" width="42" height="22" rx="7"/>
  </g>
  <text class="code" x="293" y="121" text-anchor="middle" font-size="11" fill="#4C7A43">rc=0</text>

  <text class="t-h" x="370" y="122">写法二：结果写 2x?</text>
  <text class="code" x="370" y="150" font-size="12.5">-> tensor&lt;2x?xf32&gt;</text>
  <g filter="url(#wob2)">
    <path class="arrow" d="M384 164 Q382 178 384 192"/>
  </g>
  <text class="code" x="402" y="184" font-size="10.5">-mini-infer-shape</text>
  <text class="code" x="370" y="220" font-size="12.5" font-weight="bold">-> tensor&lt;2x2xf32&gt;</text>
  <text class="t-s" x="370" y="252">M 是承诺（保留），N 推导补</text>
  <text class="t-s" x="370" y="268">（逐维合并，各管各的）</text>
  <g filter="url(#wob2)">
    <rect class="ok" x="592" y="106" width="42" height="22" rx="7"/>
  </g>
  <text class="code" x="613" y="121" text-anchor="middle" font-size="11" fill="#4C7A43">rc=0</text>

  <text class="t-h" x="690" y="122">写法三：结果写 2x2</text>
  <text class="code" x="690" y="150" font-size="12.5">-> tensor&lt;2x2xf32&gt;</text>
  <g filter="url(#wob2)">
    <path class="arrow" d="M704 164 Q702 178 704 192"/>
  </g>
  <text class="code" x="722" y="184" font-size="10.5">不碰 IR（短路分支）</text>
  <text class="code" x="690" y="220" font-size="12.5" font-weight="bold">-> tensor&lt;2x2xf32&gt;</text>
  <text class="t-s" x="690" y="252">一个缺口都没有，IR 原样</text>
  <text class="t-s" x="690" y="268">（克制也是正确行为）</text>
  <g filter="url(#wob2)">
    <rect class="ok" x="912" y="106" width="42" height="22" rx="7"/>
  </g>
  <text class="code" x="933" y="121" text-anchor="middle" font-size="11" fill="#4C7A43">rc=0</text>

  <text class="t-s" x="500" y="318" text-anchor="middle">三种写法全部合法、全部停在 2x2 —— 差别只在“哪几维是推导补的”</text>

  <!-- ===== 下排：两种失败路径 ===== -->
  <g filter="url(#wob)">
    <rect class="rbox" x="30"  y="336" width="460" height="238" rx="12" transform="rotate(0.3 260 455)"/>
    <rect class="rbox" x="510" y="336" width="460" height="238" rx="12" transform="rotate(-0.3 740 455)"/>
  </g>

  <text class="t-h" x="50" y="366">写法四：结果写 ?x3 —— Verifier 解析期就拦下</text>
  <text class="code" x="50" y="392" font-size="12">2x? · ?x2 -> ?x3   （N：2 对 3，静态对静态）</text>
  <g filter="url(#wob2)">
    <rect class="chip" x="50" y="406" width="420" height="86" rx="8"/>
  </g>
  <text class="code" x="62" y="428" font-size="10.5" fill="#A03B37">error: 'mini.matmul' op result shape must</text>
  <text class="code" x="62" y="444" font-size="10.5" fill="#A03B37">be [M, N] ...: expected [..., 2, 2] ...</text>
  <text class="code" x="62" y="460" font-size="10.5" fill="#A03B37">but got 'tensor&lt;?x3xf32&gt;'</text>
  <text class="code" x="62" y="482" font-size="10.5">rc=1（加不加 -mini-infer-shape，报错一模一样）</text>
  <text class="t-s" x="50" y="518">Verifier 证明得了“静态对静态”的矛盾，</text>
  <text class="t-s" x="50" y="534">解析期拦截 —— 根本轮不到 Pass 出场</text>
  <g filter="url(#wob2)">
    <rect class="bad" x="424" y="350" width="48" height="22" rx="7"/>
  </g>
  <text class="code" x="448" y="365" text-anchor="middle" font-size="11" fill="#A03B37">rc=1</text>

  <text class="t-h" x="530" y="366">写法五：batch 写 2x2x2 —— Pass 冲突报错</text>
  <text class="code" x="530" y="392" font-size="12">?x2x3 · 4x3x2 -> 2x2x2   （R1 推 batch=4）</text>
  <g filter="url(#wob2)">
    <rect class="chip" x="530" y="406" width="420" height="86" rx="8"/>
  </g>
  <text class="code" x="542" y="428" font-size="10.5" fill="#A03B37">error: 'mini.matmul' op shape inference</text>
  <text class="code" x="542" y="444" font-size="10.5" fill="#A03B37">conflicts with the statically known result</text>
  <text class="code" x="542" y="460" font-size="10.5" fill="#A03B37">shape: inferred 4, 2, 2 but result type is</text>
  <text class="code" x="542" y="476" font-size="10.5" fill="#A03B37">'tensor&lt;2x2x2xf32&gt;'</text>
  <text class="code" x="542" y="498" font-size="10.5">rc=1（Verifier 拦不住：lhs batch 是 ?）</text>
  <text class="t-s" x="530" y="534">推导算出 4，与承诺 2 撞车 —— Pass 拒绝</text>
  <text class="t-s" x="530" y="550">推翻承诺，把矛盾大声报出来</text>
  <g filter="url(#wob2)">
    <rect class="bad" x="904" y="350" width="48" height="22" rx="7"/>
  </g>
  <text class="code" x="928" y="365" text-anchor="middle" font-size="11" fill="#A03B37">rc=1</text>

  <!-- ===== 底部结论条 ===== -->
  <g filter="url(#wob3)">
    <rect class="bbox" x="30" y="596" width="940" height="30" rx="10" transform="rotate(-0.2 500 611)"/>
  </g>
  <text class="t-s" x="500" y="616" text-anchor="middle" fill="#3F6E9E">同样的冲突、不同的守门人：上排是 refineShape 的三分支，下排画出 Verifier 与 Pass 的分工线</text>
</svg>
