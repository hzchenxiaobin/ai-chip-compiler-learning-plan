<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Bradley Hand, Comic Sans MS, Segoe Print, Kaiti SC, KaiTi, cursive">
  <defs>
    <filter id="wob" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wob2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wob3" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arr" viewBox="0 0 12 12" refX="9.5" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 2 C5 1.5, 9 4, 10 6 C9 8, 5 10.5, 2 10 C4 8, 4 4, 2 2 Z" fill="#2F2B27"/>
    </marker>
    <style>
      .bg { fill:#FBF9F3; }
      .t-title { font-size:21px; fill:#2F2B27; font-weight:bold; }
      .t-h { font-size:15px; fill:#2F2B27; font-weight:bold; }
      .t-b { font-size:12.5px; fill:#2F2B27; }
      .t-s { font-size:11px; fill:#5A544C; }
      .code { font-family:Consolas, Menlo, Courier New, monospace; fill:#1F3B57; }
      .box { fill:#FFFFFF; stroke:#2F2B27; stroke-width:2.2; stroke-linejoin:round; }
      .bbox { fill:#DAE8FC; stroke:#5B8DB8; stroke-width:2.4; stroke-linejoin:round; }
      .obox { fill:#FFE6CC; stroke:#D79B00; stroke-width:3; stroke-linejoin:round; }
      .gbox { fill:#D5E8D4; stroke:#82B366; stroke-width:2.4; stroke-linejoin:round; }
      .rbox { fill:#F8CECC; stroke:#B85450; stroke-width:2.4; stroke-linejoin:round; }
      .arrow { stroke:#2F2B27; stroke-width:2.2; fill:none; stroke-linecap:round; marker-end:url(#arr); }
      .chip { fill:#FFFFFF; stroke:#2F2B27; stroke-width:1.8; stroke-linejoin:round; }
    </style>
  </defs>

  <rect class="bg" width="1000" height="640"/>
  <text class="t-title" x="30" y="42">第 44 天的位置：把昨天的规则表装进 mini-opt 的 Pass 流水线</text>
  <text class="t-s" x="975" y="68" text-anchor="end" fill="#8A8378">验收升级：从“测试全绿”到“IR 真的变了”</text>

  <!-- ===== 顶部流水线 ===== -->
  <g filter="url(#wob)">
    <rect class="box" x="32"  y="98" width="138" height="52" rx="10" transform="rotate(-0.5 101 124)"/>
    <rect class="box" x="192" y="98" width="138" height="52" rx="10" transform="rotate(0.4 261 124)"/>
    <rect class="box" x="352" y="98" width="138" height="52" rx="10" transform="rotate(-0.3 421 124)"/>
    <rect class="obox" x="512" y="98" width="138" height="52" rx="10" transform="rotate(0.5 581 124)"/>
    <rect class="box" x="672" y="98" width="138" height="52" rx="10" transform="rotate(-0.4 741 124)"/>
    <rect class="box" x="832" y="98" width="138" height="52" rx="10" transform="rotate(0.3 901 124)"/>
  </g>
  <text class="t-b" x="101" y="121" text-anchor="middle" font-weight="bold">解析 Parser</text>
  <text class="t-s" x="101" y="139" text-anchor="middle">文本变 IR</text>
  <text class="t-b" x="261" y="121" text-anchor="middle" font-weight="bold">ODS 约束</text>
  <text class="t-s" x="261" y="139" text-anchor="middle">查“每个值自己”</text>
  <text class="t-b" x="421" y="121" text-anchor="middle" font-weight="bold">手写 Verifier</text>
  <text class="t-s" x="421" y="139" text-anchor="middle">查“值和值的关系”</text>
  <text class="code" x="581" y="120" text-anchor="middle" font-size="12.5" font-weight="bold">mini-infer-shape</text>
  <text class="t-s" x="581" y="139" text-anchor="middle" fill="#B5651D">今天新增！</text>
  <text class="t-b" x="741" y="121" text-anchor="middle" font-weight="bold">图优化</text>
  <text class="t-s" x="741" y="139" text-anchor="middle">Day 45 起</text>
  <text class="t-b" x="901" y="121" text-anchor="middle" font-weight="bold">Lowering …</text>
  <text class="t-s" x="901" y="139" text-anchor="middle">后置章节</text>
  <g filter="url(#wob2)">
    <path class="arrow" d="M172 124 Q182 122 190 124"/>
    <path class="arrow" d="M332 124 Q342 122 350 124"/>
    <path class="arrow" d="M492 124 Q502 122 510 124"/>
    <path class="arrow" d="M652 124 Q662 122 670 124"/>
    <path class="arrow" d="M812 124 Q822 122 830 124"/>
  </g>

  <!-- 流水线下的两条注记 -->
  <path d="M32 168 L32 178 Q261 182 490 178 L490 168" fill="none" stroke="#5B8DB8" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text class="t-s" x="261" y="200" text-anchor="middle" fill="#3F6E9E">只拦可证明非法 —— 信息只减不增</text>
  <text class="t-s" x="581" y="200" text-anchor="middle" fill="#B5651D">第一个往 IR 写信息的自定义 Pass</text>

  <!-- ===== 左卡：昨天 ===== -->
  <g filter="url(#wob)">
    <rect class="box" x="32" y="238" width="272" height="252" rx="12" transform="rotate(-0.4 168 364)"/>
  </g>
  <text class="t-h" x="52" y="268">昨天 Day 43：Python 规则表</text>
  <text class="code" x="52" y="298" font-size="14">matmul_infer.py</text>
  <text class="t-b" x="52" y="326">• R0～R4 五条规则</text>
  <text class="t-b" x="52" y="348">• 15 行测试全绿</text>
  <text class="t-b" x="52" y="370">• 2x? · ?x2 → 2x2 已可执行</text>
  <text class="t-s" x="52" y="402">但它活在 mini-opt 之外——</text>
  <text class="t-s" x="52" y="418">流水线上 ?x? 结果类型原样穿过，</text>
  <text class="t-s" x="52" y="434">后面的优化拿不到 shape</text>

  <!-- ===== 中卡：今天三步 ===== -->
  <g filter="url(#wob)">
    <rect class="obox" x="340" y="238" width="332" height="252" rx="12" transform="rotate(0.3 506 364)"/>
  </g>
  <text class="t-h" x="360" y="268">今天：三步翻译（C++ 直译）</text>
  <g filter="url(#wob2)">
    <rect class="chip" x="360" y="288" width="24" height="24" rx="7"/>
    <rect class="chip" x="360" y="346" width="24" height="24" rx="7"/>
    <rect class="chip" x="360" y="404" width="24" height="24" rx="7"/>
  </g>
  <text class="t-b" x="372" y="306" text-anchor="middle" font-weight="bold">1</text>
  <text class="t-b" x="394" y="300" font-weight="bold">纯函数 inferMatmulShape</text>
  <text class="t-s" x="394" y="316">R0～R4 直译；不碰 IR、不诊断</text>
  <text class="t-s" x="394" y="332">可直接单元测试</text>
  <text class="t-b" x="372" y="364" text-anchor="middle" font-weight="bold">2</text>
  <text class="t-b" x="394" y="358" font-weight="bold">合并 refineShape</text>
  <text class="t-s" x="394" y="374">old 是 ? → 采纳推导值</text>
  <text class="t-s" x="394" y="390">old 是数字 → 保留；冲突 → 报错</text>
  <text class="t-b" x="372" y="422" text-anchor="middle" font-weight="bold">3</text>
  <text class="t-b" x="394" y="416" font-weight="bold">Pass 壳 + 注册</text>
  <text class="t-s" x="394" y="432">walk 遍历 + setType 写回；</text>
  <text class="t-s" x="394" y="448">registerPass 一行进 mini-opt</text>

  <!-- ===== 右卡：验收 ===== -->
  <g filter="url(#wob)">
    <rect class="gbox" x="708" y="238" width="260" height="252" rx="12" transform="rotate(-0.4 838 364)"/>
  </g>
  <text class="t-h" x="728" y="268">今天的验收</text>
  <text class="t-s" x="728" y="296">输入（人写的）：</text>
  <text class="code" x="728" y="318" font-size="13">-> tensor&lt;?x?xf32&gt;</text>
  <g filter="url(#wob2)">
    <path class="arrow" d="M742 332 Q740 348 742 362"/>
  </g>
  <text class="code" x="760" y="352" font-size="10.5">-mini-infer-shape</text>
  <text class="t-s" x="728" y="386">输出（Pass 细化后）：</text>
  <text class="code" x="728" y="408" font-size="13" font-weight="bold">-> tensor&lt;2x2xf32&gt;</text>
  <text class="t-s" x="728" y="438">2x? · ?x2：M、N 有来源，</text>
  <text class="t-s" x="728" y="454">K 被消费不进输出</text>
  <text class="t-s" x="728" y="478" fill="#4C7A43">IR 真的变了 —— 这才是完成线</text>

  <!-- 卡片之间的箭头 -->
  <g filter="url(#wob2)">
    <path class="arrow" d="M304 364 Q322 356 338 364"/>
    <path class="arrow" d="M672 364 Q690 356 706 364"/>
  </g>
  <text class="t-s" x="321" y="350" text-anchor="middle">原样翻译</text>
  <text class="t-s" x="689" y="350" text-anchor="middle">接进管线</text>

  <!-- ===== 底部总结条 ===== -->
  <g filter="url(#wob3)">
    <rect class="bbox" x="32" y="516" width="936" height="94" rx="12" transform="rotate(-0.2 500 563)"/>
  </g>
  <text class="t-h" x="52" y="544">分工与注册（两句话带走）</text>
  <text class="t-b" x="52" y="568">ODS 查“每个值自己”，Verifier 查“值和值的关系”—— 都只拦可证明非法；Pass 第一个产出信息：只细化 ?，绝不发明数字。</text>
  <text class="t-b" x="52" y="592">MiniOpt.cpp 里 registerShapeInferencePass() 一行，-mini-infer-shape 就和 -cse 走同一条命令行通道。</text>
</svg>
