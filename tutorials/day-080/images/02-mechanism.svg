<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450"><rect x="3" y="3" width="954" height="444" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="55" y="50" text-anchor="start" font-size="26" fill="#3b3b3b">三个旋钮挂在哪一站：一条 MatMul 数据通路</text><text x="55" y="78" text-anchor="start" font-size="14.5" fill="#6b6459">乘法站免费精确，是“低精度输入 + 高精度累加”整条配方的数学底牌（数值全部真实运行）</text><path d="M 54.9,151.0 Q 129.2,148.8 206.0,149.2 M 205.2,149.9 Q 204.2,210.7 204.4,270.2 M 203.8,268.8 Q 129.0,270.7 55.3,269.3 M 55.0,270.0 Q 54.3,210.7 53.9,149.1 Z" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="174" text-anchor="middle" font-size="13" fill="#3b3b3b">A（2 字节/元素）</text><text x="130" y="196" text-anchor="middle" font-size="13" fill="#3b3b3b">B（2 字节/元素）</text><text x="130" y="222" text-anchor="middle" font-size="13" fill="#5f8fcb">fp16 / bf16</text><path d="M 59.8,113.7 Q 130.5,114.2 200.5,114.1 M 199.4,114.4 Q 200.6,127.2 199.8,140.7 M 199.4,140.8 Q 130.0,140.2 60.4,140.7 M 59.8,139.9 Q 59.9,127.4 59.5,114.1 Z" fill="#dbe7f6" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="132" text-anchor="middle" font-size="13.5" fill="#3b3b3b">旋钮① 输入精度</text><text x="130" y="250" text-anchor="middle" font-size="12.5" fill="#6b6459">0.1 →</text><text x="130" y="268" text-anchor="middle" font-size="11.5" fill="#6b6459">0.0999755859375</text><path d="M 209.0,209.2 Q 235.1,211.2 258.0,209.6" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 258.1,210.0 Q 252.0,212.8 246.1,215.8" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 257.5,209.5 Q 252.1,207.3 246.8,203.8" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 262.3,149.4 Q 348.2,151.0 433.2,151.0 M 432.9,149.1 Q 433.1,210.2 432.1,269.7 M 432.3,269.0 Q 347.9,268.8 261.4,270.5 M 260.9,271.2 Q 263.2,209.6 261.9,149.9 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 266.6,113.9 Q 346.9,114.3 427.6,114.6 M 426.3,113.9 Q 427.7,127.4 426.8,139.6 M 426.9,139.7 Q 347.5,139.2 266.4,140.4 M 266.7,139.4 Q 267.7,126.4 267.7,113.5 Z" fill="none" stroke="#79b26a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="347" y="132" text-anchor="middle" font-size="13" fill="#79b26a">旋钮② 乘法（免费精确）</text><text x="347" y="176" text-anchor="middle" font-size="14.5" fill="#3b3b3b">11 位 × 11 位</text><text x="347" y="200" text-anchor="middle" font-size="14.5" fill="#3b3b3b">= 22 位 ≤ 24 位</text><text x="347" y="226" text-anchor="middle" font-size="13.5" fill="#79b26a">FP32 桶装得下</text><text x="347" y="254" text-anchor="middle" font-size="11.5" fill="#6b6459">bf16: 8+8=16 位，更宽松</text><path d="M 436.8,209.8 Q 460.7,209.2 485.6,209.9" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 485.0,210.0 Q 479.3,212.7 472.8,216.0" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 485.1,209.4 Q 479.1,207.2 473.2,204.7" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 489.8,60.4 Q 589.7,60.2 689.8,60.7 M 689.9,59.9 Q 689.9,89.5 689.2,118.3 M 690.5,118.6 Q 590.1,117.9 490.0,118.5 M 490.0,118.6 Q 489.9,89.6 490.7,59.4 Z" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="590" y="96" text-anchor="middle" font-size="13.5" fill="#3b3b3b">旋钮③ 累加精度</text><path d="M 489.7,126.5 Q 589.9,125.2 690.0,126.1 M 689.3,126.3 Q 691.0,164.6 690.3,202.9 M 689.7,204.5 Q 591.2,204.5 490.6,204.3 M 490.8,205.1 Q 490.4,164.0 489.9,126.0 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="590" y="152" text-anchor="middle" font-size="14" fill="#79b26a">FP32 累加器（大桶）</text><text x="590" y="176" text-anchor="middle" font-size="12.5" fill="#3b3b3b">22 位乘积原样进 24 位桶</text><text x="590" y="198" text-anchor="middle" font-size="12.5" fill="#3b3b3b">税 ~1e-6，基本无损</text><path d="M 491.1,218.4 Q 590.2,218.2 689.6,217.6 M 689.0,216.9 Q 690.9,265.3 690.0,309.0 M 691.1,311.0 Q 589.2,310.1 491.2,309.3 M 490.8,311.1 Q 488.8,264.5 490.8,216.8 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="590" y="242" text-anchor="middle" font-size="14" fill="#d96c5c">FP16 累加器（漏桶）</text><text x="590" y="266" text-anchor="middle" font-size="12" fill="#3b3b3b">每加一步舍回 11 位 + 吸收：</text><text x="590" y="286" text-anchor="middle" font-size="13" fill="#d96c5c">2048 + 1 → 2048</text><text x="590" y="304" text-anchor="middle" font-size="12" fill="#3b3b3b">税随 K 按 √K 增长</text><path d="M 560.2,310.4 Q 573.0,304.4 584.8,298.4" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 584.4,297.7 Q 597.4,304.1 610.6,309.8" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="314" text-anchor="start" font-size="11.5" fill="#d96c5c">漏出去的：误差</text><path d="M 694.1,166.0 Q 718.8,166.2 742.5,164.6" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 742.4,165.5 Q 737.8,168.1 731.1,170.6" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 743.0,164.6 Q 736.6,161.8 731.2,159.2" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 693.9,263.7 Q 717.9,263.6 742.6,263.3" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M 743.5,264.0 Q 736.9,266.4 731.9,269.6" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 742.9,263.3 Q 736.9,261.6 731.8,258.8" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 747.3,114.5 Q 836.5,112.9 924.8,114.4 M 926.0,113.0 Q 924.8,169.0 926.1,223.4 M 924.3,223.6 Q 836.8,224.3 747.5,223.1 M 746.3,225.1 Q 747.2,168.3 746.4,115.2 Z" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 751.7,77.8 Q 836.6,78.1 919.7,78.7 M 920.0,77.7 Q 920.4,90.9 919.5,104.0 M 919.5,104.8 Q 836.0,104.0 752.6,104.2 M 752.6,104.4 Q 751.8,91.7 752.1,78.2 Z" fill="#fdead3" stroke="#e8973f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="836" y="96" text-anchor="middle" font-size="13.5" fill="#3b3b3b">旋钮④ 输出精度</text><text x="836" y="144" text-anchor="start" font-size="13.5" fill="#79b26a">FP32 出：0 刀</text><text x="836" y="166" text-anchor="start" font-size="13.5" fill="#e8973f">FP16 出：1 刀 ≈ 4.9e-4</text><text x="836" y="190" text-anchor="start" font-size="12" fill="#6b6459">省一半写回带宽</text><path d="M 770.8,217.3 Q 834.8,219.1 901.1,218.7" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="836" y="238" text-anchor="middle" font-size="12" fill="#3b3b3b">天花板 65504</text><text x="836" y="260" text-anchor="middle" font-size="13" fill="#d96c5c">180000 → inf ✗</text><text x="836" y="280" text-anchor="middle" font-size="11.5" fill="#6b6459">（FP32 出则安全）</text><path d="M 54.5,338.9 Q 269.5,339.7 484.4,339.3 M 484.8,341.3 Q 484.7,385.8 485.8,433.2 M 485.9,432.2 Q 270.0,432.0 56.2,432.0 M 56.1,431.0 Q 56.2,386.2 55.1,340.0 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="366" text-anchor="start" font-size="13.5" fill="#3b3b3b">吸收的实测（实验 2，真实运行）：</text><text x="71" y="390" text-anchor="start" font-size="14" fill="#79b26a">4096 个 1.0 相加：FP32 累加 = 4096.0</text><text x="71" y="412" text-anchor="start" font-size="14" fill="#d96c5c">FP16 累加 = 2048.0（卡死，差 50%）</text><text x="71" y="432" text-anchor="start" font-size="11.5" fill="#6b6459">numpy 的 fp16 @ 内部是 FP32 累加（位模式差 0 个码）</text><path d="M 509.8,338.7 Q 726.0,339.3 940.7,338.8 M 941.0,340.7 Q 940.6,387.1 941.1,432.0 M 940.3,432.2 Q 726.0,431.3 509.1,430.9 M 511.1,432.8 Q 509.4,386.2 510.7,340.4 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="526" y="366" text-anchor="start" font-size="13.5" fill="#3b3b3b">精确乘法的实测（实验 1，真实运行）：</text><text x="526" y="390" text-anchor="start" font-size="13.5" fill="#3b3b3b">fp16入·fp32累·fp32出</text><text x="526" y="412" text-anchor="start" font-size="14" fill="#79b26a">对量化输入版 golden：max_abs = 0</text><text x="526" y="432" text-anchor="start" font-size="11.5" fill="#6b6459">乘法精确 + 3 项和恰好无舍入 → 零实现税</text></g></svg>