><text x="660.0" y="341" text-anchor="middle" font-size="13" fill="#3b3b3b">2B/4B</text><path d="M 740.2,321.8 Q 774.8,321.9 810.5,322.4 M 809.4,322.3 Q 810.4,336.9 810.7,351.4 M 809.4,351.7 Q 774.7,352.8 739.6,351.3 M 740.5,352.5 Q 740.8,337.8 739.7,322.0 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="775" y="342" text-anchor="middle" font-size="14" fill="#d96c5c">FAIL *</text><path d="M 54.8,359.1 Q 489.4,359.2 925.5,359.4 M 925.1,359.3 Q 925.6,382.9 924.6,405.3 M 924.9,405.2 Q 489.6,405.6 54.9,406.8 M 55.5,406.5 Q 55.4,382.2 54.6,359.6 Z" fill="none" stroke="#3b3b3b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="69" y="387" text-anchor="start" font-size="13" fill="#3b3b3b">bf16入·fp32累·bf16出</text><text x="410.0" y="387" text-anchor="middle" font-size="13" fill="#3b3b3b">4.5e-3</text><text x="540.0" y="387" text-anchor="middle" font-size="13" fill="#3b3b3b">3.4e-3（一刀）</text><text x="660.0" y="387" text-anchor="middle" font-size="13" fill="#3b3b3b">2B/2B</text><path d="M 739.5,367.4 Q 774.8,367.7 810.0,367.6 M 809.6,368.7 Q 810.4,382.5 809.5,398.5 M 810.7,397.6 Q 775.6,397.8 739.7,397.8 M 739.9,398.1 Q 740.4,383.7 739.7,367.7 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="775" y="388" text-anchor="middle" font-size="14" fill="#79b26a">PASS</text><path d="M 55.0,418.7 Q 489.7,418.0 924.6,417.2 M 925.2,418.8 Q 924.6,433.5 925.0,448.5 M 925.8,448.3 Q 490.2,447.7 55.4,448.3 M 55.5,447.4 Q 54.5,432.3 54.6,417.9 Z" fill="none" stroke="#3b3b3b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="439" text-anchor="start" font-size="12.5" fill="#3b3b3b">换成量化输入版 golden 后，六种组合实现税全部 PASS（Day 79 的方法：格式税交给阈值表宽容，不混进实现误差）</text><path d="M 55.2,458.2 Q 491.2,458.7 925.5,458.4 M 925.1,457.9 Q 925.0,511.0 924.0,566.2 M 924.3,566.9 Q 490.2,566.1 55.0,566.1 M 54.0,566.6 Q 56.2,511.4 55.5,457.5 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="484" text-anchor="start" font-size="14.5" fill="#3b3b3b">结论（今天的“精度对照表和结论”产出）：</text><text x="71" y="508" text-anchor="start" font-size="13.5" fill="#3b3b3b">① 推荐配方 = 低精度输入 + FP32 累加：输入税有界（4.9e-4 / 3.9e-3）且可对齐，乘法精确，累加税 ~1e-6；</text><text x="71" y="530" text-anchor="start" font-size="13.5" fill="#3b3b3b">② 输出按下游选：FP16 出付一刀 ~4.9e-4 换一半写回带宽，但防 65504 溢出；</text><text x="71" y="552" text-anchor="start" font-size="13.5" fill="#3b3b3b">③ 字节列解释了为什么低精度值得：输入字节直接减半（4B→2B）。</text></g></svg>