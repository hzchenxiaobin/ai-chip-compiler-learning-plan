="13" fill="#3b3b3b">最后一刀 ≈ eps/2</text><text x="676" y="456" text-anchor="start" font-size="12.5" fill="#6b6459">FP16 出 ~4.9e-4，省一半写回；</text><text x="676" y="476" text-anchor="start" font-size="12.5" fill="#6b6459">超过 65504 → inf</text><path d="M 49.0,508.8 Q 491.3,510.5 929.7,511.0 M 930.0,510.1 Q 929.5,548.6 928.7,587.3 M 930.7,586.1 Q 488.8,585.4 49.0,584.9 M 48.9,586.9 Q 50.6,548.8 51.1,509.5 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="538" text-anchor="start" font-size="15.5" fill="#3b3b3b">贯穿问题：同一个 MatMul，输入 / 累加 / 输出各用什么精度，误差和性能各付什么代价？</text><text x="66" y="562" text-anchor="start" font-size="15.5" fill="#3b3b3b">—— 今天用真实数据把三笔税的单价、增长率和归属性量出来，</text><text x="66" y="582" text-anchor="start" font-size="12.5" fill="#6b6459">再回答“低精度迁移到底值不值、错在哪”。（昨天造好的尺子，今天一把不动地复用。）</text></g></svg>