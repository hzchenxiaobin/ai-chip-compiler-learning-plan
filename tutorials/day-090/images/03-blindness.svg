<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" width="1240" height="800"><rect x="3" y="3" width="1234" height="794" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="30" y="44" text-anchor="start" font-size="25" fill="#3b3b3b">方阵盲区：M、N、K 是三个旋钮——旋钮重合时，错误绑定的读数也一样</text><text x="30" y="70" text-anchor="start" font-size="14.5" fill="#6b6459">测试只能「区分」错误与正确；形状让错误与正确产生不同行为，才谈得上被发现</text><path d="M 30.3,80.9 Q 619.7,81.8 1209.0,82.5" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M 60.2,99.7 Q 341.2,100.5 618.9,100.6 M 619.3,100.9 Q 620.1,250.8 619.8,399.2 M 619.7,399.8 Q 340.9,400.2 60.2,399.0 M 60.0,399.9 Q 61.1,249.7 61.0,99.0 Z" fill="white" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="126" text-anchor="start" font-size="15" fill="#3b3b3b">形状 = 三个独立的旋钮</text><path d="M 110.2,120.2 Q 205.4,118.8 298.8,120.1" fill="none" stroke="#3b3b3b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 287,120.29422574930547 C 287,107 313,107 313,120 C 313,133 287,133 287,120.29422574930547" fill="#fdead3" stroke="#e8973f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="98" text-anchor="start" font-size="13" fill="#3b3b3b">M（行数）</text><path d="M 109.2,199.6 Q 204.0,200.4 299.8,200.3" fill="none" stroke="#3b3b3b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 287,200.58397233222797 C 287,187 313,187 313,200 C 313,213 287,213 287,200.58397233222797" fill="#fdead3" stroke="#e8973f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="178" text-anchor="start" font-size="13" fill="#3b3b3b">N（列数）</text><path d="M 109.5,280.1 Q 203.9,279.8 300.4,279.3" fill="none" stroke="#3b3b3b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 287,280.18210502061004 C 287,267 313,267 313,280 C 313,293 287,293 287,280.18210502061004" fill="#fdead3" stroke="#e8973f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="258" text-anchor="start" font-size="13" fill="#3b3b3b">K（归约长）</text><text x="96" y="336.0" text-anchor="start" font-size="12" fill="#3b3b3b">每个旋钮各管一段：i &lt; M（行）· j &lt; N（列）· k &lt; K（归约）</text><text x="96" y="352.5" text-anchor="start" font-size="12" fill="#3b3b3b">strides 也是三个数：A=[K,1] · B=[N,1] · C=[N,1]</text><path d="M 633.0,250.5 Q 657.1,251.1 679.6,249.6" fill="none" stroke="#6b6459" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 680.2,249.5 Q 674.5,252.3 669.0,256.3" fill="none" stroke="#6b6459" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 680.4,249.8 Q 674.0,247.7 668.0,244.1" fill="none" stroke="#6b6459" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 688.3,100.3 Q 935.0,100.5 1179.7,99.8 M 1180.5,98.8 Q 1180.7,249.8 1180.4,400.2 M 1179.6,400.2 Q 934.4,399.9 687.3,399.8 M 689.2,399.4 Q 688.1,250.7 688.1,100.2 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="704" y="128" text-anchor="start" font-size="15" fill="#d96c5c">方阵 (3,3,3)：三个旋钮指着同一个数</text><path d="M 739.4,169.7 Q 799.5,168.8 859.3,169.5" fill="none" stroke="#d96c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 747,170.22304839784536 C 747,157 773,157 773,170 C 773,183 747,183 747,170.22304839784536" fill="#fdead3" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 787,170.0899100921987 C 787,157 813,157 813,170 C 813,183 787,183 787,170.0899100921987" fill="#fdead3" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 827,169.8307417913579 C 827,157 853,157 853,170 C 853,183 827,183 827,169.8307417913579" fill="#fdead3" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="704" y="210.0" text-anchor="start" font-size="12" fill="#3b3b3b">M=N=K=3 → 交换/错绑后的「错误读数」与正确读数数值相同：</text><text x="704" y="226.5" text-anchor="start" font-size="12" fill="#3b3b3b">  · i 上界绑成 N：3 == 3 → 位相同（完全隐身）</text><text x="704" y="243.0" text-anchor="start" font-size="12" fill="#3b3b3b">  · k 上界绑成 N：3 == 3 → 位相同（完全隐身）</text><text x="704" y="259.5" text-anchor="start" font-size="12" fill="#3b3b3b">  · A[%k,%i] 配对写反：仍合法（读 Aᵀ）→ 静默算错，</text><text x="704" y="276.0" text-anchor="start" font-size="12" fill="#3b3b3b">    不崩、不越界——没有参考对照就溜了（ST2 实测：</text><text x="704" y="292.5" text-anchor="start" font-size="12" fill="#3b3b3b">    max|C−ref| = 2.199 / 1.701，两个 NUM 也是「无声」的）</text><text x="704" y="309.0" text-anchor="start" font-size="12" fill="#3b3b3b">  · (1,1,1) 更进一步：四个变异全部位相同（ST4）</text><path d="M 59.9,423.4 Q 340.3,423.7 620.1,425.1 M 620.3,424.4 Q 620.9,549.8 620.7,673.8 M 619.6,673.8 Q 340.3,673.7 60.3,672.8 M 58.7,673.1 Q 60.6,549.4 59.7,423.9 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="450" text-anchor="start" font-size="15" fill="#79b26a">非方形 (2,3,5)：三个旋钮各指各的数</text><path d="M 108.8,500.5 Q 204.2,499.2 298.9,500.3" fill="none" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 107,499.5780232078859 C 107,487.0 133,487.0 133,500.0 C 133,513.0 107,513.0 107,499.5780232078859" fill="#fdead3" stroke="#5f8fcb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 187,490.0889676346536 C 187,477.4 213,477.4 213,490.4 C 213,503.4 187,503.4 187,490.0889676346536" fill="#fdead3" stroke="#e8973f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 267,480.5771655216002 C 267,467.8 293,467.8 293,480.8 C 293,493.8 267,493.8 267,480.5771655216002" fill="#fdead3" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="546.0" text-anchor="start" font-size="12" fill="#3b3b3b">M=2、N=5、K=3 → 任何错绑都改变「读数」：</text><text x="76" y="562.5" text-anchor="start" font-size="12" fill="#3b3b3b">  · i 上界绑成 N=5 &gt; M=2 → 越界：load %a(1,0) 第 0 维 1 ∉ [0,2)</text><text x="76" y="579.0" text-anchor="start" font-size="12" fill="#3b3b3b">  · k 上界绑成 N=5 &gt; K=3 → 越界：load %a 走出归约维</text><text x="76" y="595.5" text-anchor="start" font-size="12" fill="#3b3b3b">  · 配对写反 A[%k,%i] → 第 0 维越界（k 当行用）</text><text x="76" y="612.0" text-anchor="start" font-size="12" fill="#3b3b3b">真实报错（ST3 实测，(2,3,5) 杀全部 4 个变异）：</text><text x="76" y="628.5" text-anchor="start" font-size="12" fill="#3b3b3b">  memref.load %a(2,0)：第 0 维下标 2 ∉ [0, 2)（shape (2, 3)）</text><path d="M 688.5,424.6 Q 933.1,423.1 1179.6,422.9 M 1179.3,424.1 Q 1179.8,549.6 1181.0,673.7 M 1179.8,673.3 Q 933.4,673.9 688.8,675.0 M 688.5,673.5 Q 688.0,550.0 687.6,423.8 Z" fill="white" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="704" y="450" text-anchor="start" font-size="15" fill="#3b3b3b">盲区地图（SAME = 该形状杀不了这个变异）</text><text x="704" y="480.0" text-anchor="start" font-size="12" fill="#3b3b3b">· 标量 (1,1,1)：四个变异全部 SAME——只测管道</text><text x="704" y="496.5" text-anchor="start" font-size="12" fill="#3b3b3b">· N=0 (3,2,0)：四个变异全部 SAME——零趟循环无访存</text><text x="704" y="513.0" text-anchor="start" font-size="12" fill="#3b3b3b">· K=0 / M=0：对配对类变异 SAME（无访存），</text><text x="704" y="529.5" text-anchor="start" font-size="12" fill="#3b3b3b">  但对边界类变异亮红（OOB）——退化维各有分工</text><text x="704" y="546.0" text-anchor="start" font-size="12" fill="#3b3b3b">· 巧合对各护一个盲区：M==N 护 i_ub_n · K==N 护 k_ub_n</text><text x="704" y="562.5" text-anchor="start" font-size="12" fill="#3b3b3b">结论：单个形状必有盲区；矩阵整体没有——这便是</text><text x="704" y="579.0" text-anchor="start" font-size="12" fill="#3b3b3b">「至少 8 组」背后的道理：形状组合起来才覆盖错误空间</text><text x="60" y="780" text-anchor="start" font-size="12.5" fill="#6b6459">数据来源：outputs/kill-matrix.txt（ST2/ST3/ST4 真实运行；OOB=越界探针拦截，NUM=参考对照抓到的静默算错，SAME=位相同）。</text></g></svg>