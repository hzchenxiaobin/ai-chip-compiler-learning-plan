<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 700" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive">
<path d="M 4.4,5.4 Q 511.9,2.9 1016.5,3.4 Q 1017.1,348.3 1017.2,696.8 Q 511.5,696.5 3.0,695.2 Q 1.6,351.3 4.4,5.4  Z" stroke="#E7DFCE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="#FDFBF6" fill-opacity="1.0"/>
<text x="510.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="18" fill="#3B3B3B" text-anchor="middle" font-weight="bold">实例对照：目标无关优化 → 目标相关编译（真实运行结果）</text>
<text x="48" y="66" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">① 目标无关优化（IR → IR）：只看 IR 能证明的事实，不看任何 CPU</text>
<path d="M 60.0,80.2 Q 248.3,81.1 439.6,81.2 Q 442.2,176.7 441.1,271.4 Q 250.7,272.6 60.5,269.8 Q 62.1,174.8 60.0,80.2  Z" stroke="#3B3B3B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.4"/>
<text x="72" y="99" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">优化前（step.ll 导出后）</text>
<text x="72" y="118.0" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.6" fill="#3B3B3B" text-anchor="start">基本块 4 个（entry / 6: / 8: / 10:）</text>
<text x="72" y="134.5" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.6" fill="#3B3B3B" text-anchor="start">指令 11 条 / SSA 值 7 个</text>
<text x="72" y="151.0" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.6" fill="#3B3B3B" text-anchor="start">2+3 没折、×4 没折、a+0 没消</text>
<text x="72" y="167.5" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.6" fill="#3B3B3B" text-anchor="start">四个块、一个 phi 汇合</text>
<text x="72" y="184.0" font-family="'Courier New',monospace" font-size="9.5" fill="#6b6257" text-anchor="start">  %3 = mul i32 %2, 4</text>
<text x="72" y="199.0" font-family="'Courier New',monospace" font-size="9.5" fill="#6b6257" text-anchor="start">  %4 = add i32 %0, 0</text>
<text x="72" y="214.0" font-family="'Courier New',monospace" font-size="9.5" fill="#6b6257" text-anchor="start">  br i1 %5, label %6, label %8</text>
<text x="72" y="229.0" font-family="'Courier New',monospace" font-size="9.5" fill="#6b6257" text-anchor="start">  %11 = phi i32 [ %7, %6 ], …</text>
<path d="M 578.5,81.1 Q 769.3,80.9 959.7,79.8 Q 960.2,173.6 961.4,271.6 Q 773.2,271.3 581.5,268.9 Q 580.3,175.0 578.5,81.1  Z" stroke="#3B3B3B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.4"/>
<text x="592" y="99" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">优化后（同一份 IR，3 个 pass 之后）</text>
<text x="592" y="118.0" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.6" fill="#3B3B3B" text-anchor="start">基本块 1 个（只剩 entry！）</text>
<text x="592" y="134.5" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.6" fill="#3B3B3B" text-anchor="start">指令 5 条 / SSA 值 4 个</text>
<text x="592" y="151.0" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.6" fill="#3B3B3B" text-anchor="start">2+3 → 5、5×4 → 20、a+0 → a</text>
<text x="592" y="167.5" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.6" fill="#3B3B3B" text-anchor="start">分支+phi 折成 select</text>
<text x="592" y="184.0" font-family="'Courier New',monospace" font-size="9.5" fill="#6b6257" text-anchor="start">  %2 = icmp sgt i32 %0, 20</text>
<text x="592" y="199.0" font-family="'Courier New',monospace" font-size="9.5" fill="#6b6257" text-anchor="start">  %5 = select i1 %2, i32 %3, i32 %4</text>
<text x="592" y="214.0" font-family="'Courier New',monospace" font-size="9.5" fill="#6b6257" text-anchor="start">  ret i32 %5</text>
<text x="510" y="150" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">instcombine + sccp</text>
<text x="510" y="164" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">+ simplifycfg</text>
<path d="M 40.8,298.7 Q 511.9,300.7 979.4,300.8" stroke="#E8A87C" stroke-width="2.5" stroke-linecap="round" fill="none"/>
<text x="510" y="292" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">目标无关 | 目标相关的分界线：上面不看 CPU，下面必须选 CPU</text>
<text x="48" y="336" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">② 目标相关编译（IR → 汇编）：同一份优化后 IR，交给两个目标</text>
<path d="M 61.0,350.4 Q 248.4,348.1 439.3,348.5 Q 440.7,453.4 440.1,561.5 Q 251.9,559.5 59.6,559.7 Q 62.0,456.0 61.0,350.4  Z" stroke="#3B3B3B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.4"/>
<text x="72" y="369" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">aarch64（-O2，4 条指令）</text>
<text x="72" y="388.0" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.8" fill="#3B3B3B" text-anchor="start">指令选择：csel（条件选择）</text>
<text x="72" y="404.5" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.8" fill="#3B3B3B" text-anchor="start">寄存器：w0/w8/w9（32 位）</text>
<text x="72" y="421.0" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.8" fill="#3B3B3B" text-anchor="start">常数直接当立即数 #20</text>
<text x="72" y="437.5" font-family="'Courier New',monospace" font-size="9.5" fill="#6b6257" text-anchor="start">  add   w8, w0, #20</text>
<text x="72" y="452.5" font-family="'Courier New',monospace" font-size="9.5" fill="#6b6257" text-anchor="start">  subs  w9, w0, #20</text>
<text x="72" y="467.5" font-family="'Courier New',monospace" font-size="9.5" fill="#6b6257" text-anchor="start">  csel  w0, w8, w9, gt</text>
<text x="72" y="482.5" font-family="'Courier New',monospace" font-size="9.5" fill="#6b6257" text-anchor="start">  ret</text>
<path d="M 580.4,349.3 Q 769.4,347.6 959.9,349.1 Q 959.1,454.2 961.3,559.6 Q 770.7,560.3 580.8,560.5 Q 581.4,456.6 580.4,349.3  Z" stroke="#3B3B3B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.4"/>
<text x="592" y="369" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">x86_64（-O2，5 条指令）</text>
<text x="592" y="388.0" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.8" fill="#3B3B3B" text-anchor="start">指令选择：leal 算地址式加法 + cmovll</text>
<text x="592" y="404.5" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.8" fill="#3B3B3B" text-anchor="start">寄存器：edi/ecx/eax（32 位视图）</text>
<text x="592" y="421.0" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.8" fill="#3B3B3B" text-anchor="start">比较写成 cmpl $21（= 20+1 的无溢出写法）</text>
<text x="592" y="437.5" font-family="'Courier New',monospace" font-size="9.5" fill="#6b6257" text-anchor="start">  leal   -20(%rdi), %ecx</text>
<text x="592" y="452.5" font-family="'Courier New',monospace" font-size="9.5" fill="#6b6257" text-anchor="start">  leal    20(%rdi), %eax</text>
<text x="592" y="467.5" font-family="'Courier New',monospace" font-size="9.5" fill="#6b6257" text-anchor="start">  cmpl   $21, %edi</text>
<text x="592" y="482.5" font-family="'Courier New',monospace" font-size="9.5" fill="#6b6257" text-anchor="start">  cmovll %ecx, %eax</text>
<text x="592" y="497.5" font-family="'Courier New',monospace" font-size="9.5" fill="#6b6257" text-anchor="start">  retq</text>
<text x="300" y="300" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">同一份 IR</text>
<text x="720" y="300" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">同一份 IR</text>
<path d="M 59.8,591.9 Q 509.2,590.5 959.0,592.5 Q 957.1,633.8 958.5,676.2 Q 508.8,678.2 58.4,675.9 Q 60.5,633.0 59.8,591.9  Z" stroke="#3B3B3B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.35"/>
<text x="510" y="614" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">5.4 节的两组对照实验（真实复现）</text>
<text x="510" y="634" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.6" fill="#3B3B3B" text-anchor="middle">A. 乘数 4→5：优化后 IR 的 20 全变 25，aarch64 立即数 #25、x86 leal ±25——源码常量一路流到机器码</text>
<text x="510" y="652" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.6" fill="#3B3B3B" text-anchor="middle">B. 加一条从未使用的 %dead：优化前 12 条指令，优化后回到 5 条——『没用到的计算』不看 CPU 就能删</text>
<text x="510" y="670" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#6b6257" text-anchor="middle">环境：Python 3.11.4 / llvmlite 内嵌 LLVM 22.1.0 / aarch64，2026-11-13 冻结运行</text>
</svg>
