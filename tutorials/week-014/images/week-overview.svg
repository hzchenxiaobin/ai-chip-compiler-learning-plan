<text x="52" y="272" font-size="13" fill="#3b352d" text-anchor="start" font-weight="bold">循环 IR（第 13 周交付）</text>
<text x="52" y="291" font-size="11" fill="#84796a" text-anchor="start">「怎么做」——能跑，但顺序单一</text>
<text x="52" y="314" font-size="10.5" fill="#3b352d" text-anchor="start">for i (0..M)</text>
<text x="52" y="332" font-size="10.5" fill="#3b352d" text-anchor="start">  for j (0..N)</text>
<text x="52" y="350" font-size="10.5" fill="#3b352d" text-anchor="start">    for k (0..K)</text>
<text x="52" y="368" font-size="10.5" fill="#3b352d" text-anchor="start">      acc += A[i,k]·B[k,j]</text>
<text x="52" y="386" font-size="10.5" fill="#3b352d" text-anchor="start">      C[i,j] = acc</text>
<text x="52" y="404" font-size="10.5" fill="#b0605a" text-anchor="start" font-weight="bold">工作集＝A＋B＋C 三个整矩阵</text>
<text x="600" y="266" font-size="13" fill="#3b352d" text-anchor="middle" font-weight="bold">变换引擎：LoopOptions 三个旋钮，先校验、后生效（D93）</text>
