" fill="#3b3b3b">+(−0.7506) → store</text><text x="300" y="212" text-anchor="start" font-size="11.5" fill="#3b3b3b">存 −0.7506</text><path d="M 542.2,133.3 Q 646.9,131.9 753.1,132.2 M 751.5,133.2 Q 752.0,179.4 751.3,227.0 M 752.1,227.3 Q 648.0,227.2 542.7,228.3 M 542.9,227.7 Q 541.5,180.7 542.6,132.9 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="556" y="156" text-anchor="start" font-size="13" fill="#79b26a" font-weight="bold">k-块 1（k0=1）</text><text x="556" y="178" text-anchor="start" font-size="11.5" fill="#3b3b3b">load −0.7506 → 乘加</text><text x="556" y="195" text-anchor="start" font-size="11.5" fill="#3b3b3b">+(−0.0076) → store</text><text x="556" y="212" text-anchor="start" font-size="11.5" fill="#3b3b3b">存 −0.7582</text><path d="M 797.3,132.1 Q 903.2,132.6 1008.1,130.7 M 1008.5,131.8 Q 1007.8,180.5 1009.0,228.0 M 1008.7,228.6 Q 902.9,228.5 797.6,229.2 M 796.8,227.3 Q 797.1,181.0 797.1,131.1 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="812" y="156" text-anchor="start" font-size="13" fill="#79b26a" font-weight="bold">k-块 2（k0=2）</text><text x="812" y="178" text-anchor="start" font-size="11.5" fill="#3b3b3b">load −0.7582 → 乘加</text><text x="812" y="195" text-anchor="start" font-size="11.5" fill="#3b3b3b">+(+0.0658) → store</text><text x="812" y="212" text-anchor="start" font-size="11.5" fill="#3b3b3b">终值 −0.6924 ✓</text><path d="M 241.4,178.9 Q 262.4,179.7 282.7,179.2" fill="none" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 282.5,180.0 Q 276.0,182.9 269.9,185.5" fill="none" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 281.9,180.4 Q 275.6,177.1 270.3,174.3" fill="none" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="263" y="169" text-anchor="middle" font-size="11" fill="#79b26a" font-weight="bold">0</text><path d="M 496.9,181.1 Q 517.9,179.9 537.4,180.6" fill="none" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 538.2,179.8 Q 532.3,182.3 526.1,185.1" fill="none" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 538.0,179.4 Q 532.4,176.9 525.7,173.5" fill="none" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="519" y="169" text-anchor="middle" font-size="11" fill="#79b26a" font-weight="bold">−0.7506</text><path d="M 752.8,180.5 Q 773.7,179.5 794.7,179.0" fill="none" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 793.9,180.2 Q 788.7,182.2 782.4,185.7" fill="none" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 794.4,180.4 Q 788.1,177.0 783.0,174.6" fill="none" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="775" y="169" text-anchor="middle" font-size="11" fill="#79b26a" font-weight="bold">−0.7582</text><text x="30" y="258.0" text-anchor="start" font-size="12.5" fill="#6b6459">终值 C[0,0] = −0.6924 = 参考值 → 与参考位等价 = True；</text><text x="30" y="275.0" text-anchor="start" font-size="12.5" fill="#6b6459">接力棒 0 → −0.7506 → −0.7582 → −0.6924，舍入顺序与 Day 89 完全相同（TL2e）。</text><text x="30" y="306" text-anchor="start" font-size="15" fill="#d96c5c" font-weight="bold">② 断链（--demo acczero）：初值 = %zero ——每棒从 0 重跑，块末 store 覆盖前棒成果</text><path d="M 29.0,321.2 Q 133.8,320.9 238.7,320.8 M 241.1,319.7 Q 241.2,368.5 239.9,416.7 M 239.2,416.6 Q 135.8,415.8 31.2,416.5 M 30.2,415.4 Q 29.5,368.4 30.8,319.3 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="344" text-anchor="start" font-size="13" fill="#d96c5c" font-weight="bold">k-块 0（k0=0）</text><text x="44" y="366" text-anchor="start" font-size="11.5" fill="#3b3b3b">初值 0 → +(−0.7506)</text><text x="44" y="383" text-anchor="start" font-size="11.5" fill="#3b3b3b">store −0.7506 → C</text><text x="44" y="400" text-anchor="start" font-size="11.5" fill="#3b3b3b">（这棒与正确链相同）</text><path d="M 285.1,319.3 Q 390.6,320.3 497.1,320.0 M 496.6,319.0 Q 496.1,368.8 494.9,415.1 M 494.8,415.0 Q 390.8,416.4 286.1,416.9 M 284.7,415.5 Q 286.0,369.3 284.8,320.6 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="344" text-anchor="start" font-size="13" fill="#d96c5c" font-weight="bold">k-块 1（k0=1）</text><text x="300" y="366" text-anchor="start" font-size="11.5" fill="#3b3b3b">load −0.7506（弃用）</text><text x="300" y="383" text-anchor="start" font-size="11.5" fill="#3b3b3b">初值 0 → +(−0.0076)</text><text x="300" y="400" text-anchor="start" font-size="11.5" fill="#3b3b3b">store −0.0076（覆盖）</text><path d="M 540.9,319.0 Q 647.1,321.0 751.6,320.3 M 752.2,319.1 Q 752.4,367.2 752.7,415.2 M 750.9,415.5 Q 647.5,416.7 543.2,416.0 M 541.2,417.1 Q 541.1,368.8 541.2,319.0 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="556" y="344" text-anchor="start" font-size="13" fill="#d96c5c" font-weight="bold">k-块 2（k0=2）</text><text x="556" y="366" text-anchor="start" font-size="11.5" fill="#3b3b3b">load −0.0076（弃用）</text><text x="556" y="383" text-anchor="start" font-size="11.5" fill="#3b3b3b">初值 0 → +(+0.0658)</text><text x="556" y="400" text-anchor="start" font-size="11.5" fill="#3b3b3b">store +0.0658（终值）</text><path d="M 243.0,369.2 Q 261.5,368.6 282.8,369.2" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M 282.5,367.9 Q 276.0,371.0 270.1,374.2" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 281.8,367.8 Q 275.6,365.5 270.5,362.1" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="263" y="357" text-anchor="middle" font-size="11" fill="#d96c5c" font-weight="bold">棒被弃</text><path d="M 498.9,369.0 Q 519.3,367.4 537.3,368.3" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M 538.4,368.3 Q 532.6,370.6 526.9,374.1" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 537.6,368.5 Q 532.7,364.5 526.0,362.5" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="519" y="357" text-anchor="middle" font-size="11" fill="#d96c5c" font-weight="bold">棒被弃</text><path d="M 798.7,320.7 Q 903.2,319.7 1006.7,318.8 M 1009.3,319.0 Q 1008.1,368.3 1007.4,416.1 M 1008.8,415.0 Q 903.2,416.5 797.8,414.8 M 797.4,415.5 Q 798.3,367.4 797.4,319.7 Z" fill="white" stroke="#d96c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="812" y="346" text-anchor="start" font-size="12.5" fill="#d96c5c">终值 C[0,0] = +0.0658</text><text x="812" y="366" text-anchor="start" font-size="12.5" fill="#d96c5c">参考 = −0.6924</text><text x="812" y="386" text-anchor="start" font-size="12.5" fill="#d96c5c">只剩最后一个 k-块</text><text x="812" y="406" text-anchor="start" font-size="11.5" fill="#6b6459">（k=2 的贡献）</text><path d="M 28.9,441.8 Q 539.3,442.6 1050.8,441.5 M 1048.8,441.7 Q 1049.7,477.0 1049.7,514.7 M 1051.0,514.6 Q 539.9,514.2 30.6,512.7 M 29.4,514.0 Q 29.4,479.0 30.0,441.0 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="468.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">实测（--demo acczero 真实输出）：与参考位等价 = False；max|C−ref| = 1.759；</text><text x="48" y="485.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">C 恰好等于最后一个 k-块（k=2）的部分和——前两个块的和凭空消失（每块都从 0 重新累加）。</text><path d="M 30.2,535.3 Q 541.1,535.9 1050.9,535.2 M 1050.0,536.7 Q 1049.9,573.3 1050.2,613.0 M 1049.1,611.2 Q 540.5,613.0 31.3,610.9 M 29.2,613.1 Q 30.7,572.7 31.0,534.8 Z" fill="white" stroke="#3b3b3b" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"/><text x="48" y="562.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">修复与判别：iter_args 初值接 %cv（跨块读端），块末 store 回 C（跨块写端）——接力棒从上一块的终点开始；</text><text x="48" y="579.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">复现命令：python3 tiling_pass.py --demo acczero；出错行：acc_init = zero.results[0] if self.acc_from_zero else cv.results[0]。</text><text x="30" y="646.0" text-anchor="start" font-size="11.5" fill="#6b6459">口径：A[0,0]·B[0,0] = −0.7506，A[0,1]·B[1,0] = −0.0076，A[0,2]·B[2,0] = +0.0658（float32 显示 4 位，加法自洽）；</text><text x="30" y="662.0" text-anchor="start" font-size="11.5" fill="#6b6459">断链里 load 仍然发生（访存日志照记），只是初值没用它——是「读了但弃用」，不是「没读」。</text></g></svg>