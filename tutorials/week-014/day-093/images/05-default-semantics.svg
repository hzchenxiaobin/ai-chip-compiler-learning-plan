<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 730" width="1120" height="730"><rect x="3" y="3" width="1114" height="724" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="30" y="44" text-anchor="start" font-size="25" fill="#3b3b3b">默认值语义与最小规范形：省略 ≠ 显式平凡，往返等价</text><text x="30" y="70" text-anchor="start" font-size="14.5" fill="#6b6459">图内输出与数值全部来自 loop_options.py 真实运行（LO1c／LO3a~c／LO6c）</text><path d="M 31.1,82.0 Q 560.2,81.6 1089.0,81.6" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><text x="40" y="124" text-anchor="start" font-size="16.5" fill="#3b3b3b" font-weight="bold">① 行为相同、值不同：tile=None ≠ tile=(1,1,1)（LO3c）</text><path d="M 44.1,141.0 Q 164.1,140.8 285.1,141.0 M 285.3,141.7 Q 286.1,227.4 285.7,312.4 M 285.7,313.1 Q 166.3,311.1 44.5,311.5 M 44.3,312.7 Q 46.1,225.9 44.1,143.1 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="168" text-anchor="start" font-size="15" fill="#3b3b3b" font-weight="bold">tile = None（未设置）</text><text x="60" y="194" text-anchor="start" font-size="12.5" fill="#3b3b3b">用户没说这一栏（字段缺省）</text><text x="60" y="213" text-anchor="start" font-size="12.5" fill="#3b3b3b">describe()：tile &lt;未设置&gt;</text><text x="72" y="232" text-anchor="start" font-size="12.5" fill="#6b6459">标注（默认值）</text><text x="60" y="251" text-anchor="start" font-size="12.5" fill="#3b3b3b">to_config_string() → ''</text><text x="72" y="270" text-anchor="start" font-size="12.5" fill="#6b6459">（字段整个省略）</text><text x="60" y="289" text-anchor="start" font-size="12.5" fill="#3b3b3b">④门：直接放行（无附注）</text><path d="M 309.0,140.9 Q 431.0,141.4 548.7,142.2 M 549.2,141.7 Q 549.5,227.8 551.2,313.2 M 550.0,313.1 Q 430.5,312.1 310.4,312.4 M 311.1,311.4 Q 311.1,227.9 310.3,142.0 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="325" y="168" text-anchor="start" font-size="15" fill="#3b3b3b" font-weight="bold">tile = 1x1x1（显式平凡）</text><text x="325" y="194" text-anchor="start" font-size="12.5" fill="#3b3b3b">用户显式说了句「废话」</text><text x="325" y="213" text-anchor="start" font-size="12.5" fill="#3b3b3b">describe()：tile = 1x1x1</text><text x="337" y="232" text-anchor="start" font-size="12.5" fill="#6b6459">标注（显式设置）</text><text x="325" y="251" text-anchor="start" font-size="12.5" fill="#3b3b3b">to_config_string()</text><text x="337" y="270" text-anchor="start" font-size="12.5" fill="#3b3b3b">→ 'tile=1x1x1'（写进规范形）</text><text x="325" y="289" text-anchor="start" font-size="12.5" fill="#3b3b3b">④门：放行 ＋ 附注「平凡块」</text><text x="60" y="336" text-anchor="start" font-size="13" fill="#d96c5c">值不同：== 为 False（LO3c）——审计能分清「用户要的」和「程序默认的」</text><path d="M 44.5,353.2 Q 297.3,350.9 551.3,352.3 M 549.9,350.7 Q 549.8,408.2 551.2,461.1 M 549.5,463.3 Q 298.0,462.1 44.1,462.3 M 43.8,460.8 Q 45.6,405.9 46.3,351.3 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="378" text-anchor="start" font-size="15" fill="#3b3b3b" font-weight="bold">行为相同（都是不分块）——LO6c 实测</text><text x="60" y="404" text-anchor="start" font-size="12.5" fill="#3b3b3b">端到端：18 op；C 流量 0L+4S；与同序参考位等价 ✓</text><text x="60" y="423" text-anchor="start" font-size="12.5" fill="#3b3b3b">tile=1x1x1 不是静默忽略：附注「平凡块＝不分块」留案底</text><text x="60" y="442" text-anchor="start" font-size="12.5" fill="#6b6459">tile=None：无附注（本来就没启用）</text><path d="M 43.8,479.6 Q 296.9,481.2 549.8,479.6 M 550.1,479.4 Q 548.7,506.8 550.4,536.1 M 548.7,537.3 Q 297.6,535.9 44.6,537.2 M 44.6,534.7 Q 46.0,508.2 46.1,479.5 Z" fill="#e9e4d8" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="504" text-anchor="start" font-size="12.5" fill="#3b3b3b">缺省自动补齐（LO3a）：parse('order=ikj') → tile=None、unroll=1</text><text x="60" y="524" text-anchor="start" font-size="12.5" fill="#6b6459">省略 ≠ 显式设置——没写的字段自动落到默认值</text><text x="585" y="124" text-anchor="start" font-size="16.5" fill="#3b3b3b" font-weight="bold">② 往返性质：parse(to_config_string(o)) == o（LO1c）</text><path d="M 601.3,140.8 Q 764.4,141.1 929.8,142.8 M 930.0,142.0 Q 930.3,179.2 931.3,217.1 M 929.8,218.6 Q 765.7,217.1 599.9,218.0 M 599.8,217.2 Q 600.5,179.9 599.7,142.5 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="615" y="168" text-anchor="start" font-size="12.5" fill="#3b3b3b">LoopOptions(order=('i','k','j'),</text><text x="615" y="187" text-anchor="start" font-size="12.5" fill="#3b3b3b">              tile=(2,2,3), unroll=2)</text><text x="615" y="208" text-anchor="start" font-size="11.5" fill="#6b6459">对象 o（显式设了三个字段）</text><path d="M 764.8,222.0 Q 764.8,240.7 764.3,256.7" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 764.8,257.8 Q 761.5,252.3 759.3,245.9" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 765.1,257.6 Q 768.1,251.8 771.0,246.0" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="785" y="240" text-anchor="start" font-size="12.5" fill="#3b3b3b">to_config_string()</text><text x="785" y="258" text-anchor="start" font-size="11.5" fill="#6b6459">最小规范形：只写与默认不同</text><path d="M 600.9,265.0 Q 763.9,265.1 929.1,265.2 M 931.1,263.2 Q 930.4,295.1 931.2,327.4 M 930.4,327.7 Q 764.3,327.0 599.3,329.1 M 599.4,327.5 Q 600.6,297.2 599.9,263.5 Z" fill="white" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="615" y="290" text-anchor="start" font-size="13" fill="#3b3b3b">'order=i-k-j,tile=2x2x3,unroll=2'</text><text x="615" y="310" text-anchor="start" font-size="11.5" fill="#6b6459">配置串（数据：可写进文件 / 命令行）</text><path d="M 765.7,331.7 Q 764.6,350.4 764.7,369.2" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 764.8,368.0 Q 761.7,362.7 758.7,356.8" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 765.3,368.5 Q 768.3,361.6 771.3,357.0" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="785" y="352" text-anchor="start" font-size="12.5" fill="#3b3b3b">parse()</text><path d="M 599.0,373.9 Q 765.2,374.6 930.9,374.6 M 930.2,374.9 Q 930.3,411.8 930.0,450.4 M 929.7,449.6 Q 765.3,448.7 598.8,450.2 M 598.8,450.2 Q 600.7,412.2 601.1,373.9 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="615" y="400" text-anchor="start" font-size="12.5" fill="#3b3b3b">LoopOptions(order=('i','k','j'),</text><text x="615" y="419" text-anchor="start" font-size="12.5" fill="#3b3b3b">              tile=(2,2,3), unroll=2)</text><text x="615" y="440" text-anchor="start" font-size="11.5" fill="#6b6459">新构造的对象 o′（字段逐一相同）</text><path d="M 764.3,453.9 Q 763.9,461.4 764.4,467.3" fill="none" stroke="#3b3b3b" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 764.4,467.5 Q 762.8,461.8 759.1,455.9" fill="none" stroke="#3b3b3b" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 765.5,468.0 Q 767.7,461.9 770.7,456.7" fill="none" stroke="#3b3b3b" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 600.7,469.5 Q 764.8,469.0 931.2,471.2 M 928.8,469.7 Q 930.8,497.7 929.6,528.0 M 930.4,528.8 Q 764.4,527.6 598.8,528.2 M 599.7,528.1 Q 599.1,497.8 600.6,470.3 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="615" y="494" text-anchor="start" font-size="13.5" fill="#3b3b3b" font-weight="bold">== ✓ 往返等价（字段逐一相等）</text><text x="615" y="514" text-anchor="start" font-size="11.5" fill="#6b6459">LO1c：parse(to_config_string(o)) == o</text><path d="M 764.9,531.0 Q 766.1,539.6 764.9,547.1" fill="none" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M 764.6,546.4 Q 761.5,540.6 759.9,535.0" fill="none" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 765.3,545.9 Q 768.0,539.9 770.5,534.0" fill="none" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 601.0,548.9 Q 765.9,548.4 929.7,547.4 M 928.8,547.6 Q 929.1,591.9 929.5,634.8 M 930.5,635.0 Q 764.2,634.7 599.4,635.5 M 598.9,636.4 Q 601.2,591.7 600.8,549.1 Z" fill="#e9e4d8" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="615" y="572" text-anchor="start" font-size="13" fill="#3b3b3b" font-weight="bold">特例：全默认 ↔ 空串</text><text x="615" y="594" text-anchor="start" font-size="12" fill="#3b3b3b">LoopOptions() → '' → parse('')</text><text x="615" y="612" text-anchor="start" font-size="12" fill="#3b3b3b">== LoopOptions()（LO3b）</text><text x="615" y="630" text-anchor="start" font-size="12" fill="#6b6459">「无 flag ＝ 默认行为」</text><path d="M 935.0,412.0 Q 1030.0,295.0 935.0,180.0" fill="none" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 934.8,179.9 Q 941.2,183.2 946.5,184.8" fill="none" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 935.5,179.3 Q 936.8,185.7 938.6,192.8" fill="none" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="1000" y="285" text-anchor="start" font-size="12.5" fill="#5f8fcb">往返不丢信息</text><path d="M 29.4,657.1 Q 559.9,657.0 1091.0,657.2 M 1089.2,656.1 Q 1090.1,678.2 1090.9,699.2 M 1090.3,700.5 Q 559.4,699.9 31.3,698.8 M 31.1,698.8 Q 30.8,676.9 29.0,654.8 Z" fill="#e9e4d8" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="684" text-anchor="start" font-size="13" fill="#3b3b3b">默认值第一设计原则：默认 ＝ 什么都不做——空配置行为与 Day 89~92 逐项一致（LO4c：18 op、0L+4S、位等价）；字段类型全不可变（tuple／None／int）</text></g></svg>