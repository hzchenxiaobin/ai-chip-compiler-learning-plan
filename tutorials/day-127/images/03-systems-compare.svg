</text><path d="M 40.5,419.0 Q 530.6,421.1 1021.5,420.3 Q 1021.0,487.0 1021.3,551.3 Q 529.3,550.2 38.4,551.0 Q 41.3,483.1 40.5,419.0  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.8"/><text x="540.0" y="446" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">划界的普适规律：</text><text x="540.0" y="472" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">① 越静态的划法性能越好、灵活性越差（minic 极端——编译期做完一切）</text><text x="540.0" y="496" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">② 越动态的划法越灵活、但需要「特化+缓存+回退」三件套兜底（PyTorch 2.x 的答案）</text><text x="540.0" y="520" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">③ 没有标准答案——只有「把哪些决策推给运行期」的显式选择（本周逐天做这个选择）</text><text x="540.0" y="560" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#6b6257" text-anchor="middle">下周地图：D128 运行期参数 → D129 特化 → D130 回退 → D131 内存 → D132 同步 → D133 复盘</text></svg>
