<text x="76" y="724" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.5" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">identity 恒等拒绝 ＝ 拒绝也是一种动作：IR 逐字不变、代价账本不变、use 计数原样（失败无副作用，第 52 天的规矩）</text>
<text x="76" y="746" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.5" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">verifier_reject ＝ 图本身就是非法的：parse + verify 当场报错，Pattern 根本没机会看到它（错误信息见 outputs/*.err）</text>
<text x="76" y="768" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.5" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">半融合不动点 ＝ C08/M04 的结局：MatMul+Bias 照融，Relu 吸不走——fused_matmul_bias + relu 是所有路线的共同终点</text>
