<text x="40" y="61" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12" fill="#84796a" text-anchor="start" opacity="1.0" font-weight="normal">全部 IR 来自 outputs/cast_elim_lab.txt 的真实打印（mini IR 文本格式）</text>
