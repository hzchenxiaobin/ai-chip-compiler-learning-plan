ke-linecap="round" stroke-linejoin="round" opacity="1.0"/><path d="M 596.0,163.0 L 585.0,159.0" fill="none" stroke="#5a8a5a" stroke-width="2.6" stroke-linecap="round" opacity="1.0"/><path d="M 596.0,163.0 L 585.0,167.0" fill="none" stroke="#5a8a5a" stroke-width="2.6" stroke-linecap="round" opacity="1.0"/><text x="572" y="147.0" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.5" fill="#5a8a5a" text-anchor="middle" opacity="1.0" font-weight="bold">P</text><path d="M 600.0,102.0 L 669.2,103.2 L 739.5,102.8 L 810.5,101.6 L 880.9,101.8 L 949.7,101.2 L 1020.0,102.0 L 1020.0,102.0 L 1019.8,122.4 L 1019.0,141.8 L 1021.0,162.2 L 1021.0,182.6 L 1018.9,204.3 L 1020.0,224.0 L 1020.0,224.0 L 951.0,223.0 L 879.1,225.1 L 810.8,223.0 L 739.1,223.2 L 669.4,224.4 L 600.0,224.0 L 600.0,224.0 L 600.4,204.0 L 600.2,182.6 L 600.7,162.3 L 600.8,142.8 L 600.9,122.0 L 600.0,102.0" fill="#edf4ee" stroke="#6b6357" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="616" y="124" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.5" fill="#84796a" text-anchor="start" opacity="1.0" font-weight="bold">优化后</text><text x="616" y="144" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.2" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="bold">%a = mini.cast %in from=f32 to=f16 : (2x3xf32) -&gt; (2x3xf16)</text><text x="616" y="161" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.2" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="bold">%b = mini.cast %in from=f32 to=i32 : (2x3xf32) -&gt; (2x3xi32)</text><text x="616" y="178" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.2" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="bold">func.return %a, %b</text><text x="616" y="206" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.2" fill="#5a8a5a" text-anchor="start" opacity="1.0" font-weight="normal">P 不看使用者数：删的是 op 自身（3 op → 2），%a/%b 全部改道读 %in</text><text x="40" y="252" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="13" fill="#5a8a5a" text-anchor="start" opacity="1.0" font-weight="bold">场景 B：identity 单跳直返 → return %in</text><path d="M 40.0,258.0 L 123.2,256.9 L 205.6,257.7 L 290.0,256.8 L 373.6,258.7 L 456.0,257.2 L 540.0,258.0 L 540.0,258.0 L 540.1,273.8 L 541.0,289.1 L 539.3,304.5 L 538.9,318.5 L 539.4,335.0 L 540.0,350.0 L 540.0,350.0 L 455.7,350.3 L 372.9,350.0 L 289.3,350.1 L 206.6,348.9 L 123.1,350.9 L 40.0,350.0 L 40.0,350.0 L 40.8,334.4 L 38.9,319.9 L 40.9,305.0 L 39.7,289.4 L 40.3,274.1 L 40.0,258.0" fill="#ffffff" stroke="#6b6357" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="280" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.5" fill="#84796a" text-anchor="start" opacity="1.0" font-weight="bold">优化前</text><text x="56" y="300" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.2" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">%c = mini.cast %in from=f32 to=f32 : (2x3xf32) -&gt; (2x3xf32)</text><text x="56" y="317" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.2" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">func.return %c</text><path d="M 548.0,304.0 L 596.0,304.0" fill="none" stroke="#5a8a5a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><path d="M 596.0,304.0 L 585.0,300.0" fill="none" stroke="#5a8a5a" stroke-width="2.6" stroke-linecap="round" opacity="1.0"/><path d="M 596.0,304.0 L 585.0,308.0" fill="none" stroke="#5a8a5a" stroke-width="2.6" stroke-linecap="round" opacity="1.0"/><text x="572" y="288.0" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.5" fill="#5a8a5a" text-anchor="middle" opacity="1.0" font-weight="bold">P</text><path d="M 600.0,258.0 L 669.6,258.4 L 740.8,258.8 L 810.4,258.9 L 880.2,258.8 L 949.5,257.5 L 1020.0,258.0 L 1020.0,258.0 L 1019.8,274.5 L 1019.7,289.2 L 1019.3,305.1 L 1018.8,319.2 L 1019.7,333.7 L 1020.0,350.0 L 1020.0,350.0 L 950.8,349.1 L 879.8,348.9 L 810.0,351.0 L 739.6,350.4 L 671.1,349.4 L 600.0,350.0 L 600.0,350.0 L 599.0,335.8 L 600.9,319.2 L 599.2,302.9 L 599.9,289.0 L 600.3,273.4 L 600.0,258.0" fill="#edf4ee" stroke="#6b6357" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="616" y="280" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.5" fill="#84796a" text-anchor="start" opacity="1.0" font-weight="bold">优化后</text><text x="616" y="300" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.2" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="bold">func.return %in</text><text x="616" y="332" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.2" fill="#5a8a5a" text-anchor="start" opacity="1.0" font-weight="normal">整体消除（1 op → 0）——被 return 也不挡：返回值改道读 %in</text><text x="40" y="378" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="13" fill="#4a7fa5" text-anchor="start" opacity="1.0" font-weight="bold">场景 C：混合图（identity + 扩展 + 缩减）→ 只消 identity</text><path d="M 40.0,384.0 L 124.4,384.8 L 207.2,383.3 L 290.8,383.1 L 372.8,385.0 L 455.7,383.2 L 540.0,384.0 L 540.0,384.0 L 540.2,405.2 L 539.4,427.1 L 540.3,449.8 L 541.0,471.2 L 539.5,493.2 L 540.0,516.0 L 540.0,516.0 L 456.0,516.9 L 373.2,516.7 L 291.2,516.9 L 207.1,516.7 L 124.0,516.6 L 40.0,516.0 L 40.0,516.0 L 39.9,493.6 L 39.2,471.9 L 40.7,450.0 L 39.9,428.1 L 40.2,405.7 L 40.0,384.0" fill="#ffffff" stroke="#6b6357" stroke-width