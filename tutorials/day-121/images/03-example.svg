<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620"><rect x="4" y="4" width="1072" height="612" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">位等价：优化不许改语义——以及今天修掉的一个真 bug</text><path d="M 58.6,60.9 Q 538.7,60.6 1018.4,61.1 Q 1016.8,133.3 1018.8,208.5 Q 541.0,210.6 60.5,208.9 Q 61.6,137.0 58.6,60.9  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.3"/><text x="540.0" y="84" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">验证框架（TP6）：3×10000 随机输入，原图 vs 优化图逐位对照</text><text x="110" y="112" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="start">x ~ N(0,1)，shape (2,12)</text><text x="110" y="132" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="start">eval(原图)：arg→reshape→reshape→matmul→add→relu</text><text x="110" y="152" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="start">eval(优化图)：arg→reshape→fused_matmul_bias_relu</text><text x="110" y="176" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#4a7c59" text-anchor="start" font-weight="bold">判据：np.array_equal（容差 = 0，不是 allclose）</text><text x="700" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">3 批 × 10000 个随机输入</text><text x="700" y="132" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#4a7c59" text-anchor="start" font-weight="bold">全部 bitwise 一致</text><text x="700" y="152" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">耗时 ~25 秒（numpy 向量化）</text><text x="540.0" y="244" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="14" fill="#3B3B3B" text-anchor="middle" font-weight="bold">开发过程中的真 bug：R04 折叠忘了量化语义</text><path d="M 61.4,262.6 Q 294.1,263.1 529.7,265.6 Q 528.7,360.4 531.2,455.4 Q 294.1,453.6 59.5,452.8 Q 59.8,359.8 61.4,262.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.35"/><text x="295" y="288" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#C97B7B" text-anchor="middle" font-weight="bold">第一版（错）</text><text x="295" y="312" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">DQ(Q(const)) 折叠 → 直接用原值</text><text x="295" y="332" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">0.3 → 折叠后还是 0.3</text><text x="295" y="356" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="middle">但原图语义：Q(0.3)=round(38.4)=38</text><text x="295" y="374" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="middle">DQ(38)=38×0.0078125=0.296875</text><text x="295" y="398" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#C97B7B" text-anchor="middle" font-weight="bold">0.3 ≠ 0.296875 → 位等价炸了（批0#0 就抓住）</text><text x="295" y="420" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">随机输入第一个就暴露——验证框架的价值</text><path d="M 551.5,264.8 Q 786.4,263.4 1020.5,263.1 Q 1019.4,359.6 1021.1,454.2 Q 783.3,453.1 548.9,455.2 Q 551.8,358.6 551.5,264.8  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.4"/><text x="785" y="288" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#4a7c59" text-anchor="middle" font-weight="bold">修复后（对）</text><text x="785" y="312" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">折叠值 = DQ(Q(v))——量化格点上的等价</text><text x="785" y="336" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="middle">values = [clip(round(v/s)+zp,</text><text x="785" y="354" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="middle">  -128,127)-zp)*s for v in values]</text><text x="785" y="378" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">0.3 → 0.296875（格点值）</text><text x="785" y="402" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#4a7c59" text-anchor="middle" font-weight="bold">与 D83 终图的 const 完全一致</text><text x="785" y="424" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">（D82 规则表 R04 的语义本来如此）</text><path d="M 60.7,477.8 Q 541.5,478.5 1019.9,478.3 Q 1019.4,534.5 1020.5,586.9 Q 541.8,586.0 61.2,586.6 Q 62.7,533.6 60.7,477.8  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.8"/><text x="540.0" y="502" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">三条教训（都写进了教程 6.1/6.2）</text><text x="540.0" y="526" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">① 「位等价」不是口号是测试——3×10000 随机输入第一个就抓住了折叠语义错；</text><text x="540.0" y="546" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">② 量化图的优化必须带着量化语义做——「值逐位不变」的承诺是格点意义上的（D82 的教训在 minic 里再犯一次）；</text><text x="540.0" y="566" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">③ 对照 D83 冻结产物是对账的第一手段——const 值 0.296875 出现在 D83 report.txt 里，diff 一下就知道折叠语义该是什么</text></svg>
