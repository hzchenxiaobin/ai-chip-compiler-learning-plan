<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 648" width="960" height="648"><rect x="3" y="3" width="954" height="642" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="55" y="50" text-anchor="start" font-size="25" fill="#3b3b3b">为什么换个顺序结果就不同：对阶与舍入</text><text x="55" y="78" text-anchor="start" font-size="14.5" fill="#6b6459">浮点加法 = 先把两数对齐指数，再相加尾数；尾数窗口只有 23 位，排不下的部分被舍入</text><path d="M 269.5,93.7 Q 479.3,93.6 689.4,93.2 M 688.9,92.9 Q 689.0,117.8 689.8,139.9 M 690.4,141.3 Q 479.3,140.6 268.9,140.8 M 270.3,139.0 Q 270.5,116.7 268.8,95.1 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="123" text-anchor="middle" font-size="16" fill="#3b3b3b">同一组数：[ 1e8, +1.0, -1e8 ]　数学真值 = 1.0</text><text x="55" y="190" text-anchor="start" font-size="15.5" fill="#3b3b3b">顺序 ①　(1e8 + 1.0) + (-1e8)</text><path d="M 59.2,199.0 Q 135.4,199.7 209.0,199.8 M 209.8,201.1 Q 211.2,223.0 211.1,245.3 M 210.9,247.3 Q 134.6,245.3 59.0,246.3 M 60.2,245.6 Q 61.1,223.6 60.0,199.5 Z" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="135.0" y="222" text-anchor="middle" font-size="16" fill="#3b3b3b">1e8 + 1.0</text><path d="M 250.0,199.9 Q 344.5,201.2 441.0,199.0 M 439.5,198.9 Q 439.2,224.2 441.2,246.6 M 439.1,245.0 Q 344.9,246.2 250.7,245.4 M 251.0,247.3 Q 250.2,222.8 248.9,200.7 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="345.0" y="222" text-anchor="middle" font-size="16" fill="#d96c5c">→ 1e8</text><text x="345.0" y="240" text-anchor="middle" font-size="11.5" fill="#6b6459">1.0 比半个间距还小，被舍掉</text><path d="M 469.1,200.0 Q 539.9,201.3 609.4,200.0 M 611.0,200.7 Q 608.8,223.7 611.0,246.1 M 609.0,244.8 Q 541.1,247.0 469.3,245.0 M 470.3,247.2 Q 470.4,222.5 471.1,200.4 Z" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="540.0" y="222" text-anchor="middle" font-size="16" fill="#3b3b3b">+ (-1e8)</text><path d="M 641.3,199.1 Q 704.6,200.2 769.5,200.4 M 769.3,200.1 Q 768.8,222.5 770.5,246.8 M 770.0,244.9 Q 704.6,246.8 641.1,244.8 M 639.3,245.9 Q 640.8,222.0 639.1,199.1 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="705.0" y="222" text-anchor="middle" font-size="16" fill="#d96c5c">= 0.0</text><text x="705.0" y="240" text-anchor="middle" font-size="11.5" fill="#6b6459">错 100%</text><path d="M 214.1,222.5 Q 231.2,222.5 247.0,222.7" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 247.0,222.7 Q 241.1,226.3 235.5,228.7" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 247.3,222.5 Q 241.1,220.7 235.0,217.3" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 444.3,222.4 Q 453.3,222.9 465.3,222.4" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 465.8,223.3 Q 460.8,226.1 453.8,228.7" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 465.8,223.6 Q 459.7,220.5 454.9,217.0" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 611.8,222.2 Q 624.0,224.2 636.4,222.4" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 635.3,223.1 Q 629.8,225.4 624.3,228.4" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 636.1,222.8 Q 629.8,220.8 624.8,217.6" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="300" text-anchor="start" font-size="15.5" fill="#3b3b3b">顺序 ②　(1e8 + (-1e8)) + 1.0</text><path d="