<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 606" width="960" height="606"><rect x="3" y="3" width="954" height="600" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="55" y="48" text-anchor="start" font-size="24" fill="#3b3b3b">真实实验：不同求法 / 累加器的相对误差（log 刻度）</text><text x="55" y="76" text-anchor="start" font-size="13.5" fill="#6b6459">环境 Python 3.11 + numpy 1.26.4；数据 0.1 x 100000 与 [1e8, 0.1 x 10万, -1e8]；误差相对精确和</text><path d="M 300.1,127.8 Q 299.5,343.7 300.2,560.3" fill="none" stroke="#6b6459" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><text x="300.0" y="582" text-anchor="middle" font-size="13.5" fill="#6b6459">1e-5</text><path d="M 423.9,127.8 Q 424.2,343.9 424.4,560.0" fill="none" stroke="#6b6459" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><text x="424.0" y="582" text-anchor="middle" font-size="13.5" fill="#6b6459">1e-4</text><path d="M 548.4,127.6 Q 548.2,344.4 547.6,559.8" fill="none" stroke="#6b6459" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><text x="548.0" y="582" text-anchor="middle" font-size="13.5" fill="#6b6459">1e-3</text><path d="M 672.1,128.0 Q 671.6,343.9 672.5,560.4" fill="none" stroke="#6b6459" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><text x="672.0" y="582" text-anchor="middle" font-size="13.5" fill="#6b6459">1e-2</text><path d="M 796.0,127.8 Q 796.3,343.6 796.2,560.2" fill="none" stroke="#6b6459" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><text x="796.0" y="582" text-anchor="middle" font-size="13.5" fill="#6b6459">1e-1</text><path d="M 920.2,127.8 Q 919.5,343.8 920.4,560.1" fill="none" stroke="#6b6459" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><text x="920.0" y="582" text-anchor="middle" font-size="13.5" fill="#6b6459">100%</text><text x="120" y="582" text-anchor="start" font-size="13.5" fill="#6b6459">相对误差：越靠右越糟 →</text><text x="300" y="150" text-anchor="start" font-size="15.5" fill="#5f8fcb">实验 B · FP32 混合量级求和</text><path d="M 300.0,165.6 Q 609.9,165.3 919.7,166.7 M 920.5,165.4 Q 920.3,176.2 919.2,185.6 M 920.7,185.7 Q 609.8,184.4 299.5,185.1 M 299.7,184.9 Q 300.0,176.3 300.3,165.9 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="290" y="181" text-anchor="end" font-size="14" fill="#3b3b3b">顺序左结合</text><text x="912.0" y="181" text-anchor="end" font-size="13" fill="#3b3b3b">100%（和 = 0，全被吃掉）</text><path d="M 300.2,192.2 Q 609.8,193.7 920.6,193.2 M 919.5,192.8 Q 920.3,203.0 919.5,212.4 M 920.3,212.6 Q 609.2,212.6 299.3,211.4 M 300.1,211.4 Q 299.4,202.0 299.3,192.4 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="290" y="208" text-anchor="end" font-size="14" fill="#3b3b3b">升序排序后再顺序</text><text x="912.0" y="208" text-anchor="end" font-size="13" fill="#3b3b3b">100%（和 = 0，排序救不了）</text><path d="M 300.7,220.6 Q 460.5,219.7 623.4,220.2 M 622.2,220.3 Q 623.2,230.2 623.2,239.3 M 622.9,239.7 Q 461.2,239.7 300.3,239.1 M 300.4,239.6 Q 299.9,229.8 300.5,219.4 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="290" y="235" text-anchor="end" font-size="14" fill="#3b3b3b">np.sum 分块两两</text><text x="632.6554389246674" y="235" text-anchor="start" font-size="13" fill="#3b3b3b">0.40%</text><path d="M 299.3,247.1 Q 302.8,246.7 306.5,246.8 M 306.2,246.9 Q 306.3,256.6 305.5,265.7 M 306.4,265.6 Q 302.2,265.6 299.6,266.8 M 299.9,265.7 Q 300.0,257.2 300.7,247.7 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="290" y="262" text-anchor="end" font-size="14" fill="#3b3b3b">math.fsum 精确和</text><text x="316.0" y="262" text-anchor="start" font-size="13" fill="#d96c5c">≈ 0</text><text x="300" y="292" text-anchor="start" font-size="15.5" fill="#e8973f">实验 D · FP16 输入 0.1 x 100000</text><path d="M 300.3,308.5 Q 609.0,308.8 918.6,308.6 M 918.8,308.3 Q 918.0,316.7 919.0,326.7 M 917.9,326.8 Q 609.4,327.3 300.8,326.8 M 299.5,326.9 Q 299.9,318.0 299.5,307.4 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="290" y="323" text-anchor="end" font-size="14" fill="#3b3b3b">FP16 累加器</text><text x="910.6034221358112" y="323" text-anchor="end" font-size="13" fill="#3b3b3b">97.4%（和停在 256）</text><path d="M 299.3,334.9 Q 373.8,335.4 449.6,335.2 M 448.7,334.6 Q 449.0,344.1 448.5,353.9 M 448.6,354.6 Q 374.0,353.5 299.8,353.7 M 300.0,353.8 Q 299.3,344.6 300.8,334.7 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="290" y="350" text-anchor="end" font-size="14" fill="#3b3b3b">FP32 累加器</text><text x="458.97324341573596" y="350" text-anchor="start" font-size="13" fill="#3b3b3b">0.016%</text><text x="300" y="404" text-anchor="start" font-size="15.5" fill="#79b26a">实验 E · BF16 输入 0.1 x 100000</text><path d="M 299.2,420.1 Q 609.3,419.3 919.7,419.4 M 920.4,419.2 Q 920.1,429.8 919.3,438.6 M 919.3,438.7 Q 610.4,439.5 300.5,439.6 M 299.3,439.7 Q 300.6,428.9 300.3,420.1 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="290" y="435" text-anchor="end" font-size="14" fill="#3b3b3b">BF16 累加器</text><text x="911.8273956350716" y="435" text-anchor="end" font-size="13" fill="#3b3b3b">99.7%（和停在 32）</text><path d="M 300.0,446.9 Q 359.4,446.3 417.7,447.0 M 418.1,446.9 Q 418.5,455.9 418.1,465.8 M 418.8,466.6 Q 358.8,466.0 299.3,466.6 M 299.7,466.8 Q 299.6,456.7 300.4,446.8 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="290" y="462" text-anchor="end" font-size="14" fill="#3b3b3b">FP32 累加器</text><text x="428.20626574674577" y="462" text-anchor="start" font-size="13" fill="#3b3b3b">0.0090%</text><path d="M 60.6,485.6 Q 480.7,487.3 900.6,487.0 M 901.0,486.3 Q 899.4,522.6 901.0,558.7 M 900.2,559.4 Q 479.5,560.7 61.1,560.7 M 59.7,559.0 Q 58.8,522.0 59.1,486.7 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="75" y="512" text-anchor="start" font-size="16" fill="#3b3b3b">同一份数据：输入用 FP16 / BF16 带来的量化误差只有 1e-4 量级，</text><text x="75" y="534" text-anchor="start" font-size="16" fill="#3b3b3b">累加器选错却能错到接近 100%——两者差 4~5 个数量级。</text><text x="75" y="554" text-anchor="start" font-size="14" fill="#6b6459">这就是 AI 芯片乘加单元用 FP32 累加器的原因。</text></g></svg>