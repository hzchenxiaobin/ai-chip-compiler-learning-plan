<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 716" width="1120" height="716"><rect x="3" y="3" width="1114" height="710" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="28" y="44" text-anchor="start" font-size="24" fill="#3b3b3b">为什么有的 Q→DQ 能删、有的不能：格点幂等 + 方向决定往返</text><text x="28" y="70" text-anchor="start" font-size="15" fill="#6b6459">左：值在不在格上，决定 Q 往返有没有位移；右：放宽在前才恒等；下：Cast 与 Quantize 的语义边界</text><path d="M 27.4,91.6 Q 287.9,90.9 547.4,91.9 M 548.7,90.9 Q 548.1,224.9 549.0,360.0 M 548.1,360.5 Q 287.5,360.9 28.6,360.4 M 27.8,359.4 Q 28.9,225.2 27.4,92.8 Z" fill="white" stroke="#5f8fcb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" rx="6"/><text x="44" y="120" text-anchor="start" font-size="15.5" fill="#3b3b3b">情况 A：值不在格上 —— 删 = 变值（R06 拒删）</text><path d="M 60.6,149.6 Q 60.6,157.7 61.2,165.8" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.4"/><text x="60.0" y="182" text-anchor="middle" font-size="12.5" fill="#6b6459">0.0</text><path d="M 115.6,149.2 Q 114.8,156.9 116.3,165.8" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.4"/><path d="M 169.3,150.8 Q 170.4,159.2 169.4,167.3" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.4"/><text x="170.0" y="182" text-anchor="middle" font-size="12.5" fill="#6b6459">1.0</text><path d="M 226.2,151.0 Q 226.1,156.8 226.1,165.7" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.4"/><path d="M 279.2,151.2 Q 279.6,158.0 278.9,164.9" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.4"/><text x="280.0" y="182" text-anchor="middle" font-size="12.5" fill="#6b6459">2.0</text><path d="M 333.9,149.8 Q 335.6,157.9 335.4,166.4" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.4"/><path d="M 390.0,150.2 Q 389.5,158.9 389.5,164.7" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.4"/><text x="390.0" y="182" text-anchor="middle" font-size="12.5" fill="#6b6459">3.0</text><path d="M 445.2,148.7 Q 444.2,157.8 446.0,164.8" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.4"/><path d="M 500.0,150.0 Q 500.0,157.8 500.6,166.4" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.4"/><text x="500.0" y="182" text-anchor="middle" font-size="12.5" fill="#6b6459">4.0</text><path d="M 58.9,196.2 Q 280.7,196.0 498.9,195.3" fill="none" stroke="#6b6459" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="203.0" y="142" text-anchor="middle" font-size="13" fill="#d96c5c">x = 1.3（格间）</text><circle cx="203" cy="196" r="6" fill="#d96c5c"/><circle cx="225" cy="196" r="6" fill="#79b26a"/><path d="M 202.3,211.3 Q 211.1,211.6 220.8,211.1" fill="none" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 221.3,211.5 Q 215.7,214.4 210.0,218.1" fill="none" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 221.4,211.4 Q 214.9,208.8 209.0,206.3" fill="none" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="304.0" y="232" text-anchor="middle" font-size="13" fill="#d96c5c">Q→DQ 靠档：x̂ = 1.5（位移 0.2 ≤ 半格）</text><text x="44" y="250" text-anchor="start" font-size="13.5" fill="#3b3b3b">删掉这对 → 读数从 1.5 变回 1.3 —— 图变了</text><text x="44" y="278" text-anchor="start" font-size="13.5" fill="#3b3b3b">所以裸 Q→DQ 不是 no-op：它就是『把值放上格点』这个动作本身</text><text x="44" y="304" text-anchor="start" font-size="13.5" fill="#6b6459">QAT 语义下删它 = 取消这条边的量化 —— 策略决定，不是优化</text><path d="M 28.7,376.6 Q 288.7,376.7 548.3,375.3 M 548.0,375.1 Q 548.9,509.6 548.6,643.7 M 548.4,643.3 Q 288.4,643.8 28.7,644.4 M 28.2,643.0 Q 27.9,509.1 28.8,376.7 Z" fill="white" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" rx="6"/><text x="44" y="404" text-anchor="start" font-size="15.5" fill="#3b3b3b">情况 B：值已在格上 —— 删了逐位不变（R03 可删）</text><path d="M 59.4,435.0 Q 60.6,442.8 60.6,448.7" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.4"/><text x="60.0" y="466" text-anchor="middle" font-size="12.5" fill="#6b6459">0.0</text><path d="M 115.7,433.4 Q 115.2,442.8 114.9,449.2" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.4"/><path d="M 170.4,433.4 Q 171.1,441.3 171.2,449.3" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.4"/><text x="170.0" y="466" text-anchor="middle" font-size="12.5" fill="#6b6459">1.0</text><path d="M 225.8,434.2 Q 226.3,441.9 226.3,449.3" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.4"/><path d="M 280.2,433.3 Q 280.1,441.4 280.3,450.4" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.4"/><text x="280.0" y="466" text-anchor="middle" font-size="12.5" fill="#6b6459">2.0</text><path d="M 336.1,433.5 Q 335.5,442.3 334.0,449.8" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.4"/><path d="M 391.3,433.7 Q 391.2,442.4 390.7,450.3" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.4"/><text x="390.0" y="466" text-anchor="middle" font-size="12.5" fill="#6b6459">3.0</text><path d="M 444.7,433.0 Q 446.0,441.0 445.4,449.9" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.4"/><path d="M 499.8,435.1 Q 501.2,441.7 500.9,450.8" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.4"/><text x="500.0" y="466" text-anchor="middle" font-size="12.5" fill="#6b6459">4.0</text><path d="M 59.0,480.1 Q 279.0,479.8 500.2,480.4" fill="none" stroke="#6b6459" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="280" cy="480" r="6" fill="#79b26a"/><text x="280.0" y="426" text-anchor="middle" font-size="13" fill="#79b26a">x₂ = 2.0（格点上）</text><text x="44" y="530" text-anchor="start" font-size="13.5" fill="#3b3b3b">Q(x₂) 精确回码、DQ 原样带回 —— 往返位移 = 0</text><text x="44" y="558" text-anchor="start" font-size="13.5" fill="#3b3b3b">账本：x₂/s = s·(q−z)/s = (q−z)(1+ε)，|m·ε| ≈ 6e-14</text><text x="44" y="584" text-anchor="start" font-size="13.5" fill="#3b3b3b">离 0.5 的靠档边界差 13 个数量级 → round 必中回 m → 幂等</text><path d="M 43.8,626.9 Q 47.2,630.6 50.2,633.8" fill="none" stroke="#79b26a" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.4"/><path d="M 49.5,633.1 Q 54.4,626.6 61.6,618.7" fill="none" stroke="#79b26a" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.4"/><text x="70" y="622" text-anchor="start" font-size="13.5" fill="#79b26a">qdq(qdq(x)) == qdq(x)：10 万随机值 ×3 批逐位相等（实验 2 实测）</text><path d="M 571.3,91.5 Q 832.0,92.9 1092.1,91.3 M 1091.7,92.6 Q 1092.5,225.5 1091.3,359.2 M 1091.0,360.0 Q 831.0,360.8 571.9,359.4 M 571.5,359.7 Q 571.8,225.9 572.5,92.5 Z" fill="white" stroke="#d96c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" rx="6"/><text x="588" y="120" text-anchor="start" font-size="15.5" fill="#3b3b3b">收窄在前 —— 往返必失真（R09/R10 禁删）</text><path d="M 601.5,156.5 Q 630.2,155.6 659.8,156.7 M 660.8,155.2 Q 660.4,171.4 659.5,187.4 M 659.6,187.7 Q 630.5,188.6 602.8,187.5 M 601.8,188.0 Q 601.2,172.4 602.8,155.9 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" rx="6"/><text x="631.0" y="177.12" text-anchor="middle" font-size="15" fill="#3b3b3b">int32</text><path d="M 702.2,156.0 Q 731.8,155.7 759.9,155.7 M 759.9,155.4 Q 759.9,172.1 760.2,188.6 M 759.3,187.6 Q 730.4,188.2 702.8,188.4 M 701.5,187.8 Q 702.4,172.8 701.8,156.5 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" rx="6"/><text x="731.0" y="177.12" text-anchor="middle" font-size="15" fill="#3b3b3b">int8</text><path d="M 802.1,156.0 Q 830.3,156.7 860.0,155.2 M 859.7,155.4 Q 859.6,171.8 860.5,187.3 M 859.7,187.6 Q 831.0,188.3 802.2,188.1 M 802.3,188.6 Q 802.1,172.7 802.5,156.5 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" rx="6"/><text x="831.0" y="177.12" text-anchor="middle" font-size="15" fill="#3b3b3b">int32</text><path d="M 660.4,171.3 Q 681.5,171.1 703.2,171.8" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 702.4,172.1 Q 695.6,174.7 690.3,178.4" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 701.3,171.6 Q 696.8,168.9 690.2,165.8" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 759.3,171.6 Q 780.2,172.0 801.4,172.7" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 802.6,171.3 Q 796.7,174.7 790.1,178.4" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 802.5,172.5 Q 795.7,168.5 790.9,166.4" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="660" y="194" text-anchor="middle" font-size="12.5" fill="#d96c5c">截断</text><text x="760" y="194" text-anchor="middle" font-size="12.5" fill="#d96c5c">复原≠原值</text><text x="602" y="226" text-anchor="start" font-size="14" fill="#3b3b3b">32258 → 饱和 127 / 回绕 2（实测）</text><text x="602" y="252" text-anchor="start" font-size="14" fill="#3b3b3b">fp 同理：fp32→fp16→fp32，max rel err 4.87e-4（实测）</text><text x="602" y="278" text-anchor="start" font-size="14" fill="#3b3b3b">1e5 → inf：连『有损』都算不上，直接没了</text><text x="602" y="316" text-anchor="start" font-size="13.5" fill="#6b6459">一句话：信息先丢了，回来就补不齐</text><path d="M 572.9,375.9 Q 831.4,375.0 1092.9,376.8 M 1092.5,376.5 Q 1091.4,511.0 1091.7,644.8 M 1091.9,644.1 Q 831.3,644.0 572.5,643.4 M 572.8,645.1 Q 572.2,509.3 572.9,376.9 Z" fill="white" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" rx="6"/><text x="588" y="404" text-anchor="start" font-size="15.5" fill="#3b3b3b">放宽在前 —— 无损往返（R02 可删）</text><path d="M 602.4,440.6 Q 631.3,440.2 660.5,439.7 M 660.7,439.6 Q 659.4,456.2 660.1,471.4 M 659.3,472.1 Q 631.7,472.5 602.6,472.5 M 601.3,471.5 Q 601.3,456.4 601.2,440.4 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" rx="6"/><text x="631.0" y="461.12" text-anchor="middle" font-size="15" fill="#3b3b3b">int8</text><path d="M 701.5,440.2 Q 731.5,439.2 760.7,440.1 M 759.4,439.8 Q 759.9,456.5 760.3,472.1 M 760.6,471.4 Q 730.3,472.0 701.8,472.5 M 702.0,471.3 Q 702.1,456.7 702.7,439.7 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" rx="6"/><text x="731.0" y="461.12" text-anchor="middle" font-size="15" fill="#3b3b3b">int32</text><path d="M 801.6,440.4 Q 830.3,439.3 859.4,440.6 M 860.5,440.4 Q 860.4,455.5 859.5,471.6 M 859.8,471.9 Q 831.5,471.3 801.7,472.3 M 802.1,471.4 Q 801.9,456.7 802.4,440.2 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" rx="6"/><text x="831.0" y="461.12" text-anchor="middle" font-size="15" fill="#3b3b3b">int8</text><path d="M 660.4,457.2 Q 681.9,456.4 702.2,456.9" fill="none" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 701.4,455.7 Q 695.8,458.3 690.2,462.0" fill="none" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 702.2,456.5 Q 695.6,453.3 689.9,450.8" fill="none" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 761.2,455.7 Q 780.8,456.7 801.6,455.3" fill="none" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 801.5,456.5 Q 796.1,458.4 790.6,462.2" fill="none" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 802.3,456.5 Q 796.7,452.7 790.4,450.6" fill="none" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="660" y="478" text-anchor="middle" font-size="12.5" fill="#79b26a">精确</text><text x="760" y="478" text-anchor="middle" font-size="12.5" fill="#79b26a">截而不丢</text><text x="602" y="510" text-anchor="start" font-size="14" fill="#3b3b3b">127 → 127 → 127：256 个码 int32 全装得下</text><text x="602" y="536" text-anchor="start" font-size="14" fill="#3b3b3b">fp16→fp32 同理：fp16 的每个值 fp32 都精确表示</text><text x="602" y="574" text-anchor="start" font-size="13.5" fill="#3b3b3b">所以判定只看一件事：第一跳是放宽还是收窄</text><path d="M 603.8,613.9 Q 606.8,618.4 609.5,620.1" fill="none" stroke="#79b26a" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.4"/><path d="M 609.6,620.6 Q 615.4,613.4 621.8,607.9" fill="none" stroke="#79b26a" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.4"/><text x="630" y="610" text-anchor="start" font-size="13.5" fill="#79b26a">int8→int32→int8：np.array_equal == True（实测）</text><path d="M 28.8,651.9 Q 560.2,652.1 1091.5,651.5 M 1092.2,651.3 Q 1092.8,678.1 1091.9,704.8 M 1092.6,704.5 Q 559.6,704.0 27.7,704.5 M 28.7,703.2 Q 27.1,677.5 27.6,652.8 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" rx="6"/><text x="44" y="674" text-anchor="start" font-size="15" fill="#3b3b3b">语义边界：Cast ≠ Quantize</text><text x="252" y="674" text-anchor="start" font-size="14" fill="#3b3b3b">Cast(0.5→int8) = 0（小数被截断，没有元数据）；Q(0.5) = −92（码，配 (s=0.0137, zp=−128) 才解码回 0.4941）</text></g></svg>