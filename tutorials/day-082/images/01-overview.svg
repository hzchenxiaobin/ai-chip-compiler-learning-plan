.5" fill="#3b3b3b">离开 (s, zp) 谁也不知道它是什么</text><text x="44" y="472" text-anchor="start" font-size="13.5" fill="#3b3b3b">成对出现，标注『这条边量化了』</text><path d="M 320.0,299.1 Q 444.8,300.8 570.4,300.6 M 569.8,300.9 Q 569.0,424.5 569.9,550.3 M 570.6,550.1 Q 445.8,550.5 319.4,549.6 M 319.4,550.4 Q 319.8,425.5 320.6,299.7 Z" fill="white" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" rx="6"/><path d="M 319.6,299.8 Q 444.2,300.5 570.2,300.1 M 570.2,300.1 Q 570.6,319.3 570.8,340.5 M 570.0,340.4 Q 445.6,340.4 320.5,339.4 M 320.0,340.7 Q 319.3,319.8 320.7,300.2 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" rx="6"/><text x="445.0" y="327" text-anchor="middle" font-size="16" fill="#3b3b3b">Cast：『搬运工』</text><text x="334" y="368" text-anchor="start" font-size="13.5" fill="#3b3b3b">只换表示，不带任何元数据：</text><text x="334" y="394" text-anchor="start" font-size="13.5" fill="#3b3b3b">放宽无损：int8→int32 精确</text><text x="334" y="420" text-anchor="start" font-size="13.5" fill="#3b3b3b">收窄失真：32258→127(饱和)</text><text x="334" y="446" text-anchor="start" font-size="13.5" fill="#3b3b3b">          或→2(回绕)</text><text x="334" y="472" text-anchor="start" font-size="13.5" fill="#3b3b3b">fp 收窄：0.1 只剩一半精度再丢</text><path d="M 610.0,299.4 Q 734.7,299.3 860.4,299.3 M 859.8,300.5 Q 860.4,424.8 859.4,549.8 M 859.4,549.9 Q 734.4,550.6 610.8,549.2 M 609.2,550.1 Q 610.8,424.2 609.2,299.5 Z" fill="white" stroke="#e8973f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" rx="6"/><path d="M 609.9,300.4 Q 735.2,299.2 859.4,300.0 M 860.6,299.3 Q 859.6,319.6 860.1,340.3 M 859.4,339.6 Q 734.6,340.4 609.6,340.3 M 609.5,339.8 Q 610.0,320.0 609.4,299.4 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" rx="6"/><text x="735.0" y="327" text-anchor="middle" font-size="16" fill="#3b3b3b">算子：『干活的人』</text><text x="624" y="368" text-anchor="start" font-size="13.5" fill="#3b3b3b">Relu / Add / MatMul 本体：</text><text x="624" y="394" text-anchor="start" font-size="13.5" fill="#3b3b3b">被 QDQ 夹着 → 量化岛</text><text x="624" y="420" text-anchor="start" font-size="13.5" fill="#3b3b3b">被 Cast 夹着 → 三明治(改口径)</text><text x="624" y="446" text-anchor="start" font-size="13.5" fill="#3b3b3b">岛和三明治都不能白拆，</text><text x="624" y="472" text-anchor="start" font-size="13.5" fill="#3b3b3b">要证明等价才动 —— 这是规则表</text><path d="M 895.0,300.3 Q 992.2,300.1 1089.4,300.4 M 1090.6,299.1 Q 1089.5,424.5 1090.7,550.9 M 1090.6,549.2 Q 993.0,549.3 894.8,550.1 M 894.9,549.4 Q 895.6,424.5 894.7,299.4 Z" fill="white" stroke="#d96c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" rx="6"/><path d="M 894.7,300.4 Q 993.2,299.5 1090.4,300.2 M 1090.1,299.8 Q 1090.4,319.4 1090.6,339.3 M 1089.9,340.2 Q 992.3,339.8 894.4,339.2 M 895.2,339.3 Q 894.6,319.3 894.3,299.3 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" rx="6"/><text x="992.5" y="327" text-anchor="middle" font-size="15.5" fill="#3b3b3b">判定三问</text><text x="909" y="368" text-anchor="start" font-size="13.5" fill="#3b3b3b">① 参数一致吗？(s, zp)</text><text x="909" y="394" text-anchor="start" font-size="13.5" fill="#3b3b3b">② 值已在格上吗？</text><text x="909" y="420" text-anchor="start" font-size="13.5" fill="#3b3b3b">③ 放宽在前还是收窄在前？</text><text x="909" y="446" text-anchor="start" font-size="13.5" fill="#3b3b3b">三问全过 → 可以删；</text><text x="909" y="472" text-anchor="start" font-size="13.5" fill="#3b3b3b">差一条 → 登记，不动手</text><text x="30" y="290" text-anchor="start" font-size="14" fill="#6b6459">今天要分清的三类角色 + 一套判定问题</text><path d="M 28.6,618.8 Q 558.7,619.5 1091.8,620.0" fill="none" stroke="#6b6459" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 6"/><text x="560.0" y="634" text-anchor="middle" font-size="13.5" fill="#6b6459">判定口径：bit-exact（删了逐位不变）—— 对应 Day 79 的误差判据思想：不变才叫冗余</text></g></svg>