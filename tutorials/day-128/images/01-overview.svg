<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="670" viewBox="0 0 1080 670"><rect x="4" y="4" width="1072" height="662" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">Shape 的语义翻转：从编译期常量到运行期参数</text><path d="M 61.4,59.2 Q 291.5,59.9 520.0,58.8 Q 519.5,217.0 518.5,378.9 Q 287.8,378.1 60.4,379.2 Q 60.4,221.0 61.4,59.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.3"/><text x="290" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">E1 静态基线（D124 原版）</text><text x="290" y="110" font-family="'Courier New',monospace" font-size="11" fill="#6b6257" text-anchor="middle">memref&lt;4x6xf32, strided&lt;[6,1]&gt;&gt;</text><text x="100" y="134" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">签名</text><text x="190" y="134" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">shape 是类型的一部分（4x6 写死）</text><text x="100" y="160" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">循环边界</text><text x="190" y="160" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">icmp slt i64 %38, 4 ← 常量 4</text><text x="100" y="186" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">验证</text><text x="190" y="186" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">一个 shape 编一次 kernel</text><text x="100" y="212" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">.ll 规模</text><text x="190" y="212" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">95 行 / extractvalue 17</text><path d="M 80.7,243.8 Q 289.1,244.5 498.9,243.7 Q 501.6,303.1 501.3,365.1 Q 290.7,362.1 79.4,363.4 Q 80.3,301.7 80.7,243.8  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#FDFBF6" fill-opacity="0.9"/><text x="100" y="266" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">  %cM = arith.constant 4 : index</text><text x="100" y="284" font-family="'Courier New',monospace" font-size="9.5" fill="#C97B7B" text-anchor="start">  %39 = icmp slt i64 %38, 4</text><text x="100" y="308" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#C97B7B" text-anchor="start">  ↑ 常量 4 直接编进指令</text><path d="M 560.2,59.3 Q 790.1,57.9 1020.8,59.6 Q 1018.6,219.7 1020.8,380.2 Q 789.1,379.8 559.5,381.0 Q 561.2,221.3 560.2,59.3  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.3"/><text x="800" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">E2 动态签名（今天实现）</text><text x="800" y="110" font-family="'Courier New',monospace" font-size="11" fill="#6b6257" text-anchor="middle">memref&lt;?x?xf32&gt;</text><text x="600" y="134" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">签名</text><text x="690" y="134" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">shape 是描述符字段（? 占位）</text><text x="600" y="160" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">循环边界</text><text x="690" y="160" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">icmp slt i64 %44, %29 ← SSA 值</text><text x="600" y="186" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">验证</text><text x="690" y="186" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">一份 kernel 吃任意 shape</text><text x="600" y="212" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">.ll 规模</text><text x="690" y="212" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">104 行 / extractvalue 23</text><path d="M 581.4,243.7 Q 790.1,244.4 1001.0,243.8 Q 1002.6,304.1 1000.6,364.0 Q 789.3,365.9 580.9,365.3 Q 581.6,305.2 581.4,243.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#FDFBF6" fill-opacity="0.9"/><text x="600" y="266" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">  %M = memref.dim %a, %c0</text><text x="600" y="284" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">  %29 = extractvalue ... 3, 0   // 读 sizes[0]</text><text x="600" y="302" font-family="'Courier New',monospace" font-size="9.5" fill="#9CBF8E" text-anchor="start">  %45 = icmp slt i64 %44, %29</text><text x="600" y="326" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#9CBF8E" text-anchor="start">  ↑ 与运行期读回的 M 比较</text><path d="M 522.6,220.2 Q 538.6,218.4 556.0,220.0 M 542.5,222.1 L 556.0,220.0 L 542.5,217.9" stroke="#3B3B3B" stroke-width="2.4" stroke-linecap="round" fill="none"/><text x="540.0" y="212.0" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">翻转</text><text x="540.0" y="410" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="14" fill="#3B3B3B" text-anchor="middle" font-weight="bold">翻转的代价（TP4 实测）</text><path d="M 121.3,432.8 Q 539.0,430.7 959.3,431.5 Q 959.6,450.7 958.6,466.5 Q 540.6,467.6 121.2,468.3 Q 121.7,452.4 121.3,432.8  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.3"/><text x="240" y="456" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">.ll 行数</text><text x="420" y="456" font-family="'Courier New',monospace" font-size="11" fill="#3B3B3B" text-anchor="middle">95 → 104</text><text x="700" y="456" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="start">+9%——全是头部开销</text><path d="M 120.7,473.2 Q 540.9,473.9 958.6,475.5 Q 960.2,491.0 958.7,510.2 Q 540.4,512.9 120.3,511.2 Q 122.1,493.2 120.7,473.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.3"/><text x="240" y="498" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">extractvalue</text><text x="420" y="498" font-family="'Courier New',monospace" font-size="11" fill="#3B3B3B" text-anchor="middle">17 → 23</text><text x="700" y="498" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="start">+6：3 个 dim 各读 2 处</text><path d="M 119.9,516.7 Q 540.7,514.9 960.6,517.0 Q 962.9,534.1 961.2,552.6 Q 541.2,551.2 119.0,552.1 Q 120.4,532.9 119.9,516.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.3"/><text x="240" y="540" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">phi / fmul</text><text x="420" y="540" font-family="'Courier New',monospace" font-size="11" fill="#3B3B3B" text-anchor="middle">4 / 1 → 4 / 1</text><text x="700" y="540" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="start">不变！核心循环体零差异</text><path d="M 119.0,557.1 Q 537.8,555.7 959.5,557.1 Q 958.0,577.4 958.8,595.5 Q 540.1,596.0 119.9,593.6 Q 119.7,575.4 119.0,557.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.3"/><text x="240" y="582" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">执行灵活性</text><text x="420" y="582" font-family="'Courier New',monospace" font-size="11" fill="#3B3B3B" text-anchor="middle">1 shape</text><text x="700" y="582" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="start">任意 shape（E3 三组验证）</text><path d="M 79.3,608.6 Q 539.9,609.6 999.5,608.7 Q 997.5,629.2 999.7,652.6 Q 540.4,653.3 79.3,653.2 Q 77.2,630.0 79.3,608.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.8"/><text x="540.0" y="628" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">结论：动态化的代价是一次性的头部开销（+9%），核心循环零差异——</text><text x="540.0" y="646" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">「为什么动态 Shape 不只是把常量改成变量」：还有描述符读回、动态 alloc、验证语义三件事</text></svg>
