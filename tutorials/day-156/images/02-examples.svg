ke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.2"/><text x="290" y="284" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">Tiling：前</text><text x="90" y="310" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">scf.for %i = 0 to 160 step 1</text><path d="M 558.5,260.4 Q 789.8,262.0 1020.3,260.5 Q 1021.7,351.2 1019.3,441.5 Q 788.3,441.2 558.4,441.0 Q 558.3,352.6 558.5,260.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.25"/><text x="790" y="284" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">Tiling：后</text><text x="590" y="310" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">scf.for %i0 = 0 to 160 step 64 {</text><text x="590" y="330" font-family="'Courier New',monospace" font-size="9.5" fill="#3B3B3B" text-anchor="start">  scf.for %i = %i0 to 160 ...</text><path d="M 59.8,470.2 Q 540.5,470.4 1021.3,471.2 Q 1021.7,498.6 1020.4,526.8 Q 541.8,524.4 61.5,525.2 Q 62.1,495.8 59.8,470.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.85"/><text x="540.0" y="494" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">前后 IR 是 Pass 文档的核心证据——比流程图更硬（可 grep 可 diff）</text><text x="540.0" y="514" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">「文档的每个说法都有 IR 片段背书」——这是 Pass 文档区别于讲义的地方</text></svg>
