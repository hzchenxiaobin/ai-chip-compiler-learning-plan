oke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.75"/><text x="735" y="296" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">④ 收益</text><text x="735" y="316" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">为什么值得</text><path d="M 838.8,272.7 Q 928.2,273.1 1020.0,273.3 Q 1019.0,304.8 1020.6,333.1 Q 929.1,334.1 840.8,333.2 Q 838.6,303.5 838.8,272.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.75"/><text x="930" y="296" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">⑤ 限制</text><text x="930" y="316" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">边界在哪</text><path d="M 59.4,356.8 Q 540.6,357.2 1020.6,356.9 Q 1021.7,386.3 1021.4,415.1 Q 541.8,414.6 60.6,416.7 Q 59.9,388.1 59.4,356.8  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.85"/><text x="540.0" y="380" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">五要素缺一的后果：缺输入→读者猜；缺合法性→误用；缺收益→不知道为何存在；</text><text x="540.0" y="400" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">缺限制→在不该用的地方用了——Tiling 的 0.3× 反例正是「限制」栏的价值（诚实记录负优化）</text></svg>
