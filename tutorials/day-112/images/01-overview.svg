<text x="524" y="525.5" font-size="9.8" fill="#3B3B3B" text-anchor="start">　　近对符号 j0−k0：−4.6 → −2.3 → +4.3 ns（翻面）</text>
<text x="524" y="542.0" font-size="9.8" fill="#3B3B3B" text-anchor="start">类比：体重秤——每台每天读数都不同，要的是纪律</text>
<text x="500" y="646" font-size="10.5" fill="#6b6257" text-anchor="middle">结论预告：正确性靠推理可以『证』，性能只能『测＋管理不确定度』——这就是模型会选错的根源</text>
