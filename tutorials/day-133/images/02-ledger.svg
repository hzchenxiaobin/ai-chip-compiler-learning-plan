<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="610" viewBox="0 0 1080 610"><rect x="4" y="4" width="1072" height="602" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">动态化的完整成本：一格翻转＝一串涟漪＋三件配套</text><path d="M 59.9,60.2 Q 289.5,57.9 519.6,58.9 Q 519.7,187.7 521.3,319.8 Q 292.1,318.4 59.9,320.8 Q 58.2,189.7 59.9,60.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.3"/><text x="290" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">一串涟漪（D128 六件事）</text><text x="100" y="112" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="start">① 签名 memref&lt;4x6&gt;→&lt;?x?x&gt;</text><text x="100" y="134" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="start">② 读回 dim+extractvalue</text><text x="100" y="156" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="start">③ 分配 alloc(%M,%N)</text><text x="100" y="178" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="start">④ 边界 icmp 常量→SSA</text><text x="100" y="200" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="start">⑤ 验证参数化</text><text x="100" y="222" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="start">⑥ 性能语义收缩（fmul 18→2）</text><text x="290" y="256" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#A9C4D4" text-anchor="middle" font-weight="bold">→ 改一个类型标注，六处跟着动</text><path d="M 560.5,59.0 Q 791.2,61.3 1020.3,59.8 Q 1018.4,188.3 1020.8,319.2 Q 789.0,319.0 558.9,318.6 Q 558.6,188.7 560.5,59.0  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.3"/><text x="790" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">三件配套（动态的安全网）</text><path d="M 590.5,110.5 Q 792.1,109.6 990.2,111.7 Q 991.2,135.4 988.5,160.7 Q 791.0,159.9 589.7,161.2 Q 591.0,136.1 590.5,110.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#FDFBF6" fill-opacity="0.9"/><text x="620" y="132" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="start" font-weight="bold">特化 D129</text><text x="620" y="150" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">拿性能：fmul 2→18</text><path d="M 590.8,170.9 Q 788.2,173.1 989.2,172.8 Q 989.1,196.6 989.3,222.9 Q 789.9,223.4 589.3,222.8 Q 590.4,194.9 590.8,170.9  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#FDFBF6" fill-opacity="0.9"/><text x="620" y="192" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="start" font-weight="bold">回退 D130</text><text x="620" y="210" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">兜正确：四级降级链</text><path d="M 589.2,232.6 Q 788.5,232.0 988.5,232.0 Q 988.7,256.5 989.9,281.3 Q 790.1,283.4 590.8,281.9 Q 588.3,257.5 589.2,232.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#FDFBF6" fill-opacity="0.9"/><text x="620" y="252" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="start" font-weight="bold">池化 D131</text><text x="620" y="270" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">管内存：99% 复用</text><text x="790" y="300" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#E8A87C" text-anchor="middle" font-weight="bold">缺一件：性能/正确性/内存三缺一</text><path d="M 60.3,339.7 Q 540.7,337.6 1019.7,339.0 Q 1020.9,400.0 1019.0,460.5 Q 538.9,459.4 58.7,460.7 Q 57.6,400.0 60.3,339.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.8"/><text x="540.0" y="366" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">「为什么动态 Shape 不只是把常量改成变量」——第 19 周的标准回答</text><text x="540.0" y="392" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle">不是一格翻转——是一串涟漪（签名/读回/分配/边界/验证/性能语义六处联动），</text><text x="540.0" y="414" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle">且每格翻转要配平三件事（特化拿性能＋回退兜正确＋池管内存）——</text><text x="540.0" y="436" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#4a7c59" text-anchor="middle" font-weight="bold">动态化的完整成本是「整个 Runtime 层」，不是改个类型标注。</text><text x="540.0" y="496" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="14" fill="#3B3B3B" text-anchor="middle" font-weight="bold">一周的数字战报</text><path d="M 101.5,514.9 Q 181.5,512.7 260.8,514.6 Q 259.0,548.3 259.4,584.5 Q 177.5,585.2 98.9,585.6 Q 100.8,552.0 101.5,514.9  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.4"/><text x="180" y="542" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="15" fill="#3B3B3B" text-anchor="middle" font-weight="bold">40 项</text><text x="180" y="564" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">判定全绿</text><path d="M 281.2,517.4 Q 360.3,517.2 441.2,516.3 Q 439.6,552.9 438.6,587.0 Q 360.0,586.5 279.9,584.5 Q 281.6,552.6 281.2,517.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.4"/><text x="360" y="542" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="15" fill="#3B3B3B" text-anchor="middle" font-weight="bold">fmul 2→18</text><text x="360" y="564" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">特化收益 9 倍</text><path d="M 459.8,515.4 Q 539.1,516.5 618.5,517.5 Q 617.8,553.4 621.4,587.0 Q 539.5,586.7 460.0,584.8 Q 461.4,549.0 459.8,515.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.4"/><text x="540" y="542" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="15" fill="#3B3B3B" text-anchor="middle" font-weight="bold">99%</text><text x="540" y="564" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">池化复用率</text><path d="M 639.6,514.6 Q 722.4,515.0 801.0,515.4 Q 798.9,550.9 800.8,584.8 Q 721.1,587.6 641.0,587.4 Q 641.6,550.7 639.6,514.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.4"/><text x="720" y="542" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="15" fill="#3B3B3B" text-anchor="middle" font-weight="bold">0.01ms</text><text x="720" y="564" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">launch 开销</text><path d="M 820.9,515.8 Q 900.4,513.7 980.3,514.7 Q 981.2,550.9 981.3,586.6 Q 900.2,587.7 818.7,587.4 Q 817.7,553.3 820.9,515.8  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.4"/><text x="900" y="542" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="