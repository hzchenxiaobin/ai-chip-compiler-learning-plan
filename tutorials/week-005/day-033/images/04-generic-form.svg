<text x="56" y="688" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11" fill="#c9923d" text-anchor="start" font-weight="bold">一句话：pretty 是门面，generic 是户口正本——"一条 op＝一次矩阵乘"＝一个 Region＋三张 affine_map</text>
<text x="56" y="712" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10" fill="#84796a" text-anchor="start" font-weight="normal">op 数按 generic form 清点才作数；affine_map 住在属性里数 op 数不出，却是循环层访存下标的来源。</text>
