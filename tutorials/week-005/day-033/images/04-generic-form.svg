<text x="616" y="568" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.8" fill="#a04a3c" text-anchor="start" font-weight="normal">pretty 打印会骗你：Region 里的 2 条 arith、属性里的 affine 都看不见；</text>
<text x="616" y="588" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.8" fill="#a04a3c" text-anchor="start" font-weight="normal">affine 数 op 数不出，却是实验②循环生成的原料（见左下）</text>
<text x="616" y="616" font-family="Consolas, Menlo, monospace" font-size="9.3" fill="#84796a" text-anchor="start" font-weight="normal">统计命令：grep -o '"dialect.op"' 后取姓去重计数（probe.sh 可复算）</text>
