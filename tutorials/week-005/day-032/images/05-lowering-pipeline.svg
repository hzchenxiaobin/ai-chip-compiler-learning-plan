<text x="612" y="112" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12" fill="#5d8fc9" text-anchor="start" font-weight="bold">① 输入：tensor／scf 世界</text>
<text x="612" y="136" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#3b352d" text-anchor="start">%out_i = scf.for %i = %c0 to %c2 … iter_args(%acc_i = %x)</text>
<text x="612" y="154" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#3b352d" text-anchor="start">  -&gt; (tensor&lt;2x3xf32&gt;) {</text>
<text x="612" y="172" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#3b352d" text-anchor="start">%xe = tensor.extract %x[%i, %j] : tensor&lt;2x3xf32&gt;</text>
<text x="612" y="190" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#3b352d" text-anchor="start">%ins = tensor.insert %mul into %acc[%i, %j] : tensor&lt;2x3xf32&gt;</text>
<text x="612" y="208" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.5" fill="#84796a" text-anchor="start">张量是值：extract 拿出来、insert 放回去</text>
<path d="M 596.0,228.0 Q 844.1,228.3 1094.0,228.0 M 1094.0,228.0 Q 1094.3,288.8 1094.0,352.0 M 1094.0,352.0 Q 843.8,353.8 596.0,352.0 M 596.0,352.0 Q 594.3,291.7 596.0,228.0" fill="#fbf8ee" stroke="#c9923d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="612" y="248" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12" fill="#c9923d" text-anchor="start" font-weight="bold">② 第 1 个 Pass 后：memref 世界</text>
<text x="612" y="272" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#3b352d" text-anchor="start">%0 = memref.get_global @__constant_2x3xf32_0 : memref&lt;2x3xf32&gt;</text>
<text x="612" y="290" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#3b352d" text-anchor="start">%6 = memref.load %0[%arg0, %arg2] : memref&lt;2x3xf32&gt;</text>
<text x="612" y="308" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#3b352d" text-anchor="start">%8 = arith.addf %6, %7 : f32</text>
<text x="612" y="326" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#3b352d" text-anchor="start">memref.store %9, %arg3[%arg0, %arg2] : memref&lt;2x3xf32&gt;</text>
<text x="612" y="344" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.5" fill="#84796a" text-anchor="start">tensor 全没了——类型被 Pass 改写，每一步 Verifier 重验契约</text>
<path d="M 596.0,364.0 Q 846.1,364.3 1094.0,364.0 M 1094.0,364.0 Q 1096.0,439.7 1094.0,514.0 M 1094.0,514.0 Q 843.0,515.8 596.0,514.0 M 596.0,514.0 Q 595.7,440.7 596.0,364.0" fill="#fbf8ee" stroke="#6a9c59" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="612" y="384" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12" fill="#6a9c59" text-anchor="start" font-weight="bold">③ 八个 Pass 全部走完：LLVM dialect</text>
<text x="612" y="408" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#3b352d" text-anchor="start">%43 = llvm.getelementptr %7[%42] : (!llvm.ptr, i64) -&gt; !llvm.ptr, f32</text>
<text x="612" y="426" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#3b352d" text-anchor="start">%44 = llvm.load %43 : !llvm.ptr -&gt; f32</text>
<text x="612" y="444" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#3b352d" text-anchor="start">%49 = llvm.fadd %44, %48 : f32</text>
<text x="612" y="462" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#3b352d" text-anchor="start">%50 = llvm.fmul %49, %1 : f32</text>
<text x="612" y="480" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#3b352d" text-anchor="start">llvm.store %50, %54 : f32, !llvm.ptr</text>
<text x="612" y="498" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#3b352d" text-anchor="start">%62 = llvm.fptosi %61 : f32 to i32</text>
<path d="M 596.0,526.0 Q 846.3,524.6 1094.0,526.0 M 1094.0,526.0 Q 1092.2,597.1 1094.0,672.0 M 1094.0,672.0 Q 846.1,673.2 596.0,672.0 M 596.0,672.0 Q 594.9,597.5 596.0,526.0" fill="#dce7f6" stroke="#5d8fc9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="612" y="546" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="12" fill="#5d8fc9" text-anchor="start" font-weight="bold">memref 的 LLVM 落脚：五元组描述符</text>
<text x="612" y="568" font-family="Courier New, Courier, monospace" font-size="9.5" fill="#3b352d" text-anchor="start">!llvm.struct&lt;(ptr, ptr, i64, array&lt;2 x i64&gt;, array&lt;2 x i64&gt;)&gt;</text>
<text x="612" y="590" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.5" fill="#84796a" text-anchor="start">① ptr：分配的指针——llvm.call @malloc 要来的</text>
<text x="612" y="607" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.5" fill="#84796a" text-anchor="start">② ptr：对齐后的指针（alignment = 64）</text>
<text x="612" y="624" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.5" fill="#84796a" text-anchor="start">③ i64：偏移 offset ＝ 0</text>
<text x="612" y="641" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.5" fill="#84796a" text-anchor="start">④ array&lt;2 x i64&gt;：形状 sizes ＝ [2, 3]</text>
<text x="612" y="658" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.5" fill="#84796a" text-anchor="start">⑤ array&lt;2 x i64&gt;：跨度 strides ＝ [3, 1]（行主序）</text>
