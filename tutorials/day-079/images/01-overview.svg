8fcb">|a - b| / |ref|</text><text x="371" y="460" text-anchor="start" font-size="12.5" fill="#6b6459">看比例；但 ref 接近 0 时爆炸</text><path d="M 659.5,386.1 Q 805.6,385.9 949.0,385.8 M 950.9,385.9 Q 950.2,431.3 951.1,473.9 M 948.7,474.0 Q 804.3,474.6 659.9,472.9 M 661.2,473.8 Q 659.0,431.2 659.8,385.6 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="676" y="412" text-anchor="start" font-size="16" fill="#3b3b3b">ULP</text><text x="676" y="436" text-anchor="start" font-size="14" fill="#3b3b3b">数浮点格子</text><text x="676" y="460" text-anchor="start" font-size="12.5" fill="#6b6459">最懂浮点；但近零区格数失真</text><path d="M 50.3,505.1 Q 489.3,504.7 931.0,505.1 M 930.3,505.7 Q 930.1,543.2 929.3,582.5 M 930.5,582.4 Q 489.2,581.8 50.0,581.0 M 50.0,581.2 Q 51.3,543.3 50.1,507.0 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="534" text-anchor="start" font-size="15.5" fill="#3b3b3b">贯穿问题：NPU 算子和 CPU 参考结果对不上，是算子写错了，</text><text x="66" y="558" text-anchor="start" font-size="15.5" fill="#3b3b3b">还是浮点本来就允许差一点？—— 今天给出能自动回答它的“判官”。</text><text x="66" y="578" text-anchor="start" font-size="12.5" fill="#6b6459">（昨天只解释了“为什么会有误差”，今天回答“差多少才算错”。）</text></g></svg>