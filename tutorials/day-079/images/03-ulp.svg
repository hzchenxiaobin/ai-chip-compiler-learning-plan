<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 558" width="960" height="558"><rect x="3" y="3" width="954" height="552" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="55" y="50" text-anchor="start" font-size="26" fill="#3b3b3b">ULP：在浮点刻度上数格子</text><text x="55" y="78" text-anchor="start" font-size="14.5" fill="#6b6459">绝对/相对误差给出一个小数，ULP 直接回答「差几格」—— 昨天讲的刻度间距，今天变成指标</text><text x="55" y="118" text-anchor="start" font-size="15.5" fill="#3b3b3b">例 1：FP16 里 0.1 + 0.2 vs 0.3（真实运行结果）</text><path d="M 55.7,130.9 Q 293.7,129.3 536.2,130.2 M 534.6,130.3 Q 536.1,239.3 535.9,351.2 M 534.6,351.2 Q 294.3,349.0 55.6,349.3 M 55.6,349.1 Q 53.9,239.0 54.3,128.8 Z" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 86.1,249.7 Q 295.0,249.0 504.6,250.5" fill="none" stroke="#3b3b3b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 109.7,240.2 Q 110.0,250.4 110.6,259.5" fill="none" stroke="#3b3b3b" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="280" text-anchor="middle" font-size="12.5" fill="#6b6459">0x34CB</text><path d="M 220.4,239.6 Q 219.6,249.4 220.0,260.7" fill="none" stroke="#3b3b3b" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="280" text-anchor="middle" font-size="12.5" fill="#6b6459">0x34CC</text><path d="M 329.4,240.0 Q 329.3,250.1 330.5,260.3" fill="none" stroke="#3b3b3b" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="280" text-anchor="middle" font-size="12.5" fill="#6b6459">0x34CD</text><path d="M 440.4,239.9 Q 439.8,249.7 439.7,259.9" fill="none" stroke="#3b3b3b" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="440" y="280" text-anchor="middle" font-size="12.5" fill="#6b6459">0x34CE</text><text x="110" y="232" text-anchor="middle" font-size="12" fill="#6b6459">0.29956</text><text x="220" y="232" text-anchor="middle" font-size="12" fill="#6b6459">0.29980</text><text x="330" y="232" text-anchor="middle" font-size="12" fill="#6b6459">0.30005</text><text x="440" y="232" text-anchor="middle" font-size="12" fill="#6b6459">0.30029</text><text x="505" y="280" text-anchor="end" font-size="12.5" fill="#6b6459">每格 = 1 ULP ≈ 2.4e-4</text><circle cx="220.0" cy="204.0" r="7" fill="#5f8fcb" stroke="#3b3b3b" stroke-width="1.8"/><text x="220" y="192" text-anchor="middle" font-size="13" fill="#5f8fcb">0.1f16 + 0.2f16 = 0.2998046875</text><circle cx="330.0" cy="306.0" r="7" fill="#e8973f" stroke="#3b3b3b" stroke-width="1.8"/><text x="330" y="332" text-anchor="middle" font-size="13" fill="#e8973f">0.3f16 = 0.300048828125</text><text x="275" y="256" text-anchor="middle" font-size="14" fill="#d96c5c">1 ULP</text><path d="M 239.6,240.8 Q 275.7,241.2 311.2,241.6 M 309.9,241.2 Q 309.9,250.5 310.5,258.2 M 310.2,258.0 Q 275.9,257.8 239.4,258.5 M 240.1,258.5 Q 239.2,249.2 239.1,242.1 Z" fill="none" stroke="#d96c5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="75" y="158" text-anchor="start" font-size="13" fill="#3b3b3b">两数各落在相邻的格子上，差 1 格；abs=2.4e-4 看不出</text><text x="75" y="178" text-anchor="start" font-size="13" fill="#3b3b3b">「差几格」，ULP = 1 一眼看清 —— 这不是 bug，是舍入路径不同。</text><text x="570" y="118" text-anchor="start" font-size="15.5" fill="#3b3b3b">怎么数格子：位模式 → 单调整数</text><path d="M 569.0,129.8 Q 751.1,130.8 929.4,128.7 M 929.4,128.9 Q 930.7,239.1 930.3,349.9 M 931.1,349.9 Q 749.2,350.8 569.6,349.5 M 570.1,349.0 Q 570.5,239.2 568.8,130.7 Z" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="588" y="156" text-anchor="start" font-size="13" fill="#3b3b3b">把浮点位模式当整数读，负数折叠：</text><path d="M 588.2,166.2 Q 616.6,166.5 644.7,166.0 M 644.7,166.3 Q 643.9,178.0 644.5,190.4 M 644.6,189.7 Q 616.2,189.9 588.5,189.7 M 587.9,190.6 Q 587.7,177.6 587.8,165.4 Z" fill="#dbe7f6" stroke="#3b3b3b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="616" y="183" text-anchor="middle" font-size="12.5" fill="#3b3b3b">+0</text><text x="660" y="183" text-anchor="start" font-size="13" fill="#3b3b3b">0x0000</text><text x="760" y="183" text-anchor="start" font-size="12" fill="#6b6459">… 编号居中</text><path d="M 588.2,200.0 Q 616.6,199.6 643.5,199.4 M 643.8,200.4 Q 643.6,212.0 644.0,224.7 M 644.6,223.5 Q 616.0,223.4 588.4,223.5 M 588.6,223.7 Q 588.5,212.3 587.8,199.4 Z" fill="#dbe7f6" stroke="#3b3b3b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="616" y="217" text-anchor="middle" font-size="12.5" fill="#3b3b3b">正数</text><text x="660" y="217" text-anchor="start" font-size="13" fill="#3b3b3b">0x3C00(=1)</text><text x="760" y="217" text-anchor="start" font-size="12" fill="#6b6459">编号 = 位模式 + 2^15</text><path d="M 587.4,234.3 Q 616.7,233.4 644.1,233.5 M 643.9,234.6 Q 644.4,245.6 644.4,258.1 M 644.6,258.3 Q 616.0,258.2 588.6,257.8 M 588.6,258.5 Q 587.8,246.6 588.5,234.3 Z" fill="#dbe7f6" stroke="#3b3b3b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="616" y="251" text-anchor="middle" font-size="12.5" fill="#3b3b3b">负数</text><text x="660" y="251" text-anchor="start" font-size="13" fill="#3b3b3b">0xBC00(=-1)</text><text x="760" y="251" text-anchor="start" font-size="12" fill="#6b6459">编号 = 2^16 - 位模式</text><text x="588" y="296" text-anchor="start" font-size="13" fill="#3b3b3b">折叠后：编号随浮点值严格递增 →</text><text x="588" y="318" text-anchor="start" font-size="13" fill="#5f8fcb">ULP 距离 = |编号(a) - 编号(舍入后的 ref)|</text><text x="55" y="384" text-anchor="start" font-size="15.5" fill="#3b3b3b">例 2：两个边角案例（真实运行结果，方向相反）</text><path d="M 54.9,396.5 Q 270.9,395.0 485.2,395.2 M 484.9,395.8 Q 485.4,466.1 485.9,536.4 M 483.8,535.1 Q 270.4,537.0 53.8,536.8 M 55.2,534.8 Q 54.9,465.5 54.5,396.6 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="424" text-anchor="start" font-size="13.5" fill="#3b3b3b">1e8 + 1（FP32）vs 真值 100000001：</text><text x="71" y="448" text-anchor="start" font-size="14" fill="#79b26a">abs = 1.0，rel = 1e-8，ULP = 0</text><text x="71" y="472" text-anchor="start" font-size="12.5" fill="#6b6459">100000001 舍入到 FP32 最近的格子还是 1e8</text><text x="71" y="494" text-anchor="start" font-size="12.5" fill="#6b6459">（该区间间距 8）→ 不是算错，是格子装不下。</text><text x="71" y="518" text-anchor="start" font-size="13" fill="#3b3b3b">ULP = 0 的含义：已经在最近的格子上了。</text><path d="M 509.0,394.7 Q 720.2,396.6 929.9,396.7 M 929.2,395.4 Q 931.1,465.1 931.2,536.5 M 930.9,536.1 Q 719.0,537.2 508.7,536.9 M 510.9,536.7 Q 510.2,466.1 509.8,395.1 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="526" y="424" text-anchor="start" font-size="13.5" fill="#3b3b3b">近零残差 1e-7（FP32）：</text><text x="526" y="448" text-anchor="start" font-size="14" fill="#d96c5c">abs = 1.9e-8，rel = 19%，ULP = 2,703,467 格</text><text x="526" y="472" text-anchor="start" font-size="12.5" fill="#6b6459">1e-7 附近一格只有 7.1e-15，格子极细，</text><text x="526" y="494" text-anchor="start" font-size="12.5" fill="#6b6459">数格子数出几百万 —— ULP 在近零区失真，</text><text x="526" y="518" text-anchor="start" font-size="13" fill="#3b3b3b">这里的「差多少」要用 atol 说话。</text></g></svg>