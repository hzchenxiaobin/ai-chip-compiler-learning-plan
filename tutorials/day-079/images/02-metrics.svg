round" stroke-linejoin="round"/><path d="M 437.6,119.3 Q 438.5,128.2 437.8,136.4" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 480.3,119.0 Q 480.6,127.7 480.4,136.8" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 522.0,119.1 Q 521.5,128.1 522.5,136.8" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 540.6,118.8 Q 540.3,127.8 540.5,136.5" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 599.5,119.1 Q 599.5,127.8 600.2,137.2" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 660.2,119.0 Q 659.7,128.0 660.5,137.6" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 720.4,119.0 Q 719.9,128.4 720.4,136.7" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 779.7,119.2 Q 779.6,127.7 780.6,136.5" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 839.6,119.4 Q 839.8,127.9 840.4,136.4" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="156" text-anchor="middle" font-size="13" fill="#6b6459">0</text><text x="300" y="156" text-anchor="middle" font-size="13" fill="#6b6459">1 附近</text><text x="660" y="156" text-anchor="middle" font-size="13" fill="#6b6459">1e8 附近</text><text x="460" y="106" text-anchor="middle" font-size="13.5" fill="#6b6459">浮点数轴：越往大数走，格子越疏（Day 78 的刻度尺）</text><path d="M 210.0,224.0 Q 210.0,190.0 210.0,174.0" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M 209.5,174.4 Q 212.6,179.5 216.4,185.2" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 209.8,173.9 Q 206.5,180.0 203.7,185.2" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 59.1,229.4 Q 209.9,229.1 358.9,231.1 M 359.6,228.9 Q 359.0,303.8 361.2,380.7 M 359.0,378.9 Q 210.7,380.5 60.2,380.0 M 60.5,381.1 Q 60.5,304.5 59.1,229.6 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="210" y="256" text-anchor="middle" font-size="15" fill="#d96c5c">近零区（残差 / 差分）</text><text x="74" y="284" text-anchor="start" font-size="12.5" fill="#3b3b3b">abs：唯一有意义的尺子（差 1.9e-8 确实小）</text><text x="74" y="308" text-anchor="start" font-size="12.5" fill="#3b3b3b">rel：|ref|→0，误差爆炸到 19% —— 误报</text><text x="74" y="332" text-anchor="start" font-size="12.5" fill="#3b3b3b">ULP：格子细到 7e-15，差出 270 万格 —— 失真</text><text x="74" y="356" text-anchor="start" font-size="12.5" fill="#3b3b3b">对策：用 atol 兜底（见下方组合公式）</text><path d="M 505.0,224.0 Q 505.0,190.0 505.0,174.0" fill="none" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M 505.4,173.7 Q 507.6,180.0 510.5,186.2" fill="none" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 505.1,174.2 Q 502.2,180.1 499.6,186.1" fill="none" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 354.1,228.8 Q 505.3,229.3 655.2,230.8 M 656.3,230.1 Q 655.2,306.0 655.9,380.9 M 656.1,380.6 Q 504.2,379.6 354.3,380.0 M 354.6,381.1 Q 355.5,303.9 355.0,229.9 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="505" y="256" text-anchor="middle" font-size="15" fill="#79b26a">中庸量级区（常规激活 / 权重）</text><text x="369" y="284" text-anchor="start" font-size="12.5" fill="#3b3b3b">abs：可用，但阈值要跟量纲绑定</text><text x="369" y="308" text-anchor="start" font-size="12.5" fill="#3b3b3b">rel：最常用 —— rtol=1e-5 (FP32) 一档</text><text x="369" y="332" text-anchor="start" font-size="12.5" fill="#3b3b3b">ULP：数学算子验收的黄金标尺（≤4 格）</text><text x="369" y="356" text-anchor="start" font-size="12.5" fill="#3b3b3b">对策：rtol 为主，ULP 做精密诊断</text><path d="M 800.0,224.0 Q 800.0,190.0 800.0,174.0" fill="none" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M 800.1,173.3 Q 802.4,180.5 806.3,185.8" fill="none" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 800.0,173.6 Q 797.6,180.0 794.3,185.3" fill="none" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 648.7,229.2 Q 799.6,229.3 951.0,231.3 M 951.0,230.0 Q 949.1,306.2 951.2,379.8 M 950.3,379.0 Q 800.5,380.2 648.9,379.1 M 649.1,380.7 Q 649.4,305.3 650.3,230.6 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="800" y="256" text-anchor="middle" font-size="15" fill="#5f8fcb">大数区（大 loss / 大坐标）</text><text x="664" y="284" text-anchor="start" font-size="12.5" fill="#3b3b3b">abs：过松 —— 差 1.0 也只占 1e-8</text><text x="664" y="308" text-anchor="start" font-size="12.5" fill="#3b3b3b">rel：合适（比例才是关心的东西）</text><text x="664" y="332" text-anchor="start" font-size="12.5" fill="#3b3b3b">ULP：格子粗到 8 —— 装不下就显示 0 格</text><text x="664" y="356" text-anchor="start" font-size="12.5" fill="#3b3b3b">对策：rtol 为主；ULP 只说「已到最近格」</text><path d="M 59.4,431.0 Q 480.9,431.0 900.9,430.3 M 899.7,430.1 Q 900.8,475.3 900.2,521.6 M 900.6,523.0 Q 478.8,523.2 60.5,521.6 M 60.2,521.0 Q 59.8,475.3 59.7,429.4 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="458" text-anchor="start" font-size="15.5" fill="#3b3b3b">取长补短的组合判定（np.allclose / torch.assert_close 同款公式）：</text><text x="480" y="490" text-anchor="middle" font-size="19" fill="#5f8fcb">|actual - desired|  ≤  atol  +  rtol × |desired|</text><text x="480" y="514" text-anchor="middle" font-size="13" fill="#6b6459">rtol 管住「按比例该多大」，atol 兜住「接近 0 时别误报」</text></g></svg>