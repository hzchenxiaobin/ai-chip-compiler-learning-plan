<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 544" width="960" height="544"><rect x="3" y="3" width="954" height="538" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="55" y="50" text-anchor="start" font-size="26" fill="#3b3b3b">三把误差尺子：绝对 / 相对 / ULP</text><text x="55" y="78" text-anchor="start" font-size="15" fill="#6b6459">同一个「差多少」的问题，在数轴不同区段要用不同的尺子量</text><path d="M 80.6,128.3 Q 479.9,128.9 879.7,127.3" fill="none" stroke="#3b3b3b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 880.3,128.6 Q 874.5,130.6 868.9,133.5" fill="none" stroke="#3b3b3b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 880.2,128.4 Q 873.7,124.7 869.0,122.3" fill="none" stroke="#3b3b3b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="884" y="110" text-anchor="start" font-size="13" fill="#6b6459">数值变大 →</text><path d="M 90.3,119.5 Q 89.8,128.3 90.4,136.4" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 94.8,118.7 Q 94.2,127.4 94.4,136.9" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 99.1,118.6 Q 99.5,127.5 99.6,137.1" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 103.2,118.8 Q 103.7,128.2 104.1,136.7" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 108.6,118.8 Q 108.4,128.0 107.4,137.5" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 112.1,118.5 Q 112.4,128.3 112.3,137.5" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 117.4,118.7 Q 116.9,128.4 117.1,137.5" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1