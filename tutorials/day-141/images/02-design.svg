ans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">每一条 × 都对应一个「下周可能会想加」的诱惑；写下来的作用是——周四凌晨两点想加的时候有东西拦你</text><text x="540.0" y="502" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">风险预案：边界钳制写错→fuzz 抓住；tile 太小反超→性能反例是合法结果（D153 伏笔）</text></svg>
