<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="530" viewBox="0 0 1080 530"><rect x="4" y="4" width="1072" height="522" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">一页扩展设计：输入、输出、完成标准、明确不做</text><path d="M 60.3,58.9 Q 282.6,61.3 500.6,60.3 Q 499.2,142.4 498.7,220.2 Q 281.7,217.3 60.9,218.6 Q 58.5,139.2 60.3,58.9  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.3"/><text x="280" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">输入</text><text x="280" y="116" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">main.graph＋--tile M,N,K</text><text x="280" y="138" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">（CLI 参数 D120 已有）</text><path d="M 539.2,60.1 Q 757.2,61.3 979.2,59.4 Q 979.0,141.4 978.8,219.2 Q 759.5,219.9 539.8,219.0 Q 539.1,138.1 539.2,60.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.3"/><text x="760" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">输出</text><text x="760" y="116" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">块循环 kernel＋可测的</text><text x="760" y="138" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">产物/性能差异</text><path d="M 61.5,239.2 Q 282.4,241.7 498.9,239.9 Q 500.9,319.9 501.0,399.4 Q 278.6,400.7 59.4,398.7 Q 60.6,319.6 61.5,239.2  Z" stroke="#3B3B3B" 