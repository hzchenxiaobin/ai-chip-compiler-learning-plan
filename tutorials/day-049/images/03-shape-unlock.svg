<text x="108" y="592" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11.5" fill="#3b352d" text-anchor="start" font-weight="bold">复盘答案（对应计划的问题“为什么一次 Pattern 遍历不一定得到最简 IR”）</text>
<text x="108" y="622" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.8" fill="#3b352d" text-anchor="start" font-weight="bold">一层：图会变。每次重写都可能制造新的匹配机会（常量出现了、下游变短了），只扫一遍必然漏掉“晚到的机会”——</text>
<text x="108" y="644" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.8" fill="#3b352d" text-anchor="start" font-weight="normal">        所以驱动要靠工作清单回头重看，迭代到不动点（图 4）。</text>
<text x="108" y="666" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.8" fill="#3b352d" text-anchor="start" font-weight="bold">二层：信息要齐。类型护栏拦下的重写，迭代一万次也放不了行——缺的不是遍数，是类型信息，</text>
<text x="108" y="688" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.8" fill="#3b352d" text-anchor="start" font-weight="normal">        而补信息是 Shape 推导（Pass）的职责，不是 Pattern 的职责。三种机制必须接力，缺一不可。</text>
</svg>