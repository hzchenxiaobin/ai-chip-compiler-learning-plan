<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540"><rect x="4" y="4" width="1072" height="532" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">明天 D151：有依据的优化——验证 H1 与 H2</text><path d="M 59.1,59.7 Q 541.3,59.5 1019.5,60.1 Q 1019.5,117.2 1019.4,174.9 Q 540.0,175.3 59.6,176.4 Q 59.0,115.9 59.1,59.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.28"/><text x="540" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">实验 A：O2 展开（验 H1）</text><text x="540" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">同一 kernel：-O0 vs -O2 编译</text><text x="540" y="132" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">对照 GFLOPS：0.39 → 3.4（预期 8×）</text><text x="540" y="152" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">若成立：循环开销是主因之一</text><path d="M 60.7,191.3 Q 540.6,190.5 1021.5,190.9 Q 1020.1,249.7 1020.1,306.8 Q 541.2,306.8 58.9,305.3 Q 59.3,247.6 60.7,191.3  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.28"/><text x="540" y="216" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">实验 B：tile 扫描（验 H2）</text><text x="540" y="242" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">tile=(32,32,32)/(64,64,64)/…</text><text x="540" y="262" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">对照朴素版的 GFLOPS</text><text x="540" y="282" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">若成立：块内复用提升有效</text><path d="M 61.1,320.7 Q 538.3,319.5 1019.7,319.6 Q 1020.3,379.8 1019.0,436.3 Q 540.1,436.7 59.8,437.4 Q 61.6,380.3 61.1,320.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#B8A7CE" fill-opacity="0.28"/><text x="540" y="346" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">实验 C：组合（O2＋tile）</text><text x="540" y="372" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">两个优化的叠加效果</text><text x="540" y="392" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">预期：&gt;各自单独（正交互用）</text><text x="540" y="412" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">D152 的跨 shape 验证基础</text><path d="M 59.9,459.9 Q 539.2,461.3 1020.4,460.3 Q 1020.5,492.8 1021.2,525.7 Q 542.2,524.3 59.8,527.3 Q 57.8,495.4 59.9,459.9  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.85"/><text x="540.0" y="486" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">「有依据」的含义：每个实验都对应今天的假设——不是「试试看」，</text><text x="540.0" y="508" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">而是「假设 H1 → 预测 O2 有效 → 实验验证 → 结论」的完整推理链——失败也 informative（假设被证伪）</text></svg>
