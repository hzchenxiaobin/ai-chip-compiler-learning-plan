<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="538" viewBox="0 0 1080 538"><rect x="4" y="4" width="1072" height="530" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="15" fill="#3B3B3B" text-anchor="middle" font-weight="bold">Roofline：实测 0.39GF 离两个屋顶都远——执行效率瓶颈</text><path d="M 61.0,61.3 Q 171.8,61.4 284.0,59.4 Q 286.4,118.9 284.9,178.9 Q 172.9,177.9 58.7,180.8 Q 61.3,119.4 61.0,61.3  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.35"/><text x="172" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">计算量</text><text x="172" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">2×160³ = 8.2 MFLOP</text><path d="M 306.1,60.0 Q 419.0,59.0 531.4,60.6 Q 529.7,120.2 529.9,178.8 Q 416.7,180.1 303.6,181.0 Q 305.0,122.0 306.1,60.0  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.35"/><text x="417" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">访存量</text><text x="417" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">最坏 61.4MB｜cache 25.6MB</text><path d="M 548.5,61.2 Q 662.2,60.4 775.5,61.5 Q 772.6,119.0 773.9,178.5 Q 663.6,180.7 549.4,179.0 Q 549.7,119.2 548.5,61.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.35"/><text x="662" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">算术强度 AI</text><text x="662" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">最坏 0.13｜cache 0.32</text><text x="662" y="132" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">FLOP/Byte</text><path d="M 793.8,61.1 Q 905.7,61.4 1018.8,59.3 Q 1021.1,120.5 1020.2,178.9 Q 908.3,180.9 794.9,178.6 Q 792.6,118.4 793.8,61.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#B8A7CE" fill-opacity="0.35"/><text x="907" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">拐点 AI*</text><text x="907" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">50GF/50GB = 1.0</text><text x="907" y="132" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">FLOP/Byte</text><text x="540.0" y="216" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">实测与屋顶的对照</text><path d="M 119.3,239.1 Q 538.8,236.5 961.0,238.2 Q 958.5,257.9 959.6,281.6 Q 540.0,281.0 121.4,282.3 Q 121.0,258.6 119.3,239.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.28"/><text x="330" y="266" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">实测（D148 基线）</text><text x="620" y="266" font-family="'Courier New',monospace" font-size="11.5" fill="#3B3B3B" text-anchor="middle">0.392 GFLOP/s</text><text x="860" y="266" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">——</text><path d="M 119.5,287.0 Q 539.3,290.0 961.3,288.9 Q 960.7,313.0 960.2,333.6 Q 540.3,331.8 119.4,333.1 Q 120.7,309.0 119.5,287.0  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.28"/><text x="330" y="316" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">计算屋顶</text><text x="620" y="316" font-family="'Courier New',monospace" font-size="11.5" fill="#3B3B3B" text-anchor="middle">50 GFLOP/s</text><text x="860" y="316" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#C97B7B" text-anchor="middle">差距 128×</text><path d="M 119.7,338.5 Q 538.4,336.7 961.3,337.0 Q 962.1,356.9 959.5,380.9 Q 540.7,381.6 121.5,382.5 Q 119.4,362.1 119.7,338.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.28"/><text x="330" y="366" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">访存屋顶（最坏 AI）</text><text x="620" y="366" font-family="'Courier New',monospace" font-size="11.5" fill="#3B3B3B" text-anchor="middle">12.4 GFLOP/s</text><text x="860" y="366" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#C97B7B" text-anchor="middle">差距 32×</text><path d="M 118.9,386.8 Q 540.4,386.1 959.0,388.5 Q 957.4,408.0 959.3,431.3 Q 540.0,431.3 121.2,432.6 Q 120.0,409.5 118.9,386.8  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#B8A7CE" fill-opacity="0.28"/><text x="330" y="416" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">访存屋顶（cache AI）</text><text x="620" y="416" font-family="'Courier New',monospace" font-size="11.5" fill="#3B3B3B" text-anchor="middle">12.3 GFLOP/s</text><text x="860" y="416" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#C97B7B" text-anchor="middle">差距 31×</text><path d="M 60.6,445.6 Q 539.6,444.8 1019.2,444.7 Q 1020.7,482.3 1021.0,523.3 Q 538.9,520.7 59.4,520.7 Q 60.3,481.8 60.6,445.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.85"/><text x="540.0" y="470" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">瓶颈判定：两个屋顶都远（128× 与 32×）——不是「计算 vs 访存」二选一，</text><text x="540.0" y="492" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">而是「执行效率」：循环控制/地址计算/依赖链的指令开销吞掉性能——每个乘加只用了 ~0.4GF 的有效算力</text></svg>
