<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440"><rect x="4" y="4" width="1072" height="432" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">三个假设：瓶颈的进一步分解（D151 的实验设计）</text><path d="M 59.8,60.4 Q 210.9,58.3 361.6,58.8 Q 358.6,199.0 358.9,341.1 Q 211.3,339.6 59.9,340.2 Q 58.5,198.9 59.8,60.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.3"/><text x="210" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">H1 循环控制开销</text><text x="210" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">机制</text><text x="210" y="130" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">三重循环每圈 ~10 条控制指令</text><text x="210" y="147" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">（cmp/br/自增）——占比高</text><text x="210" y="190" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">对策与验证</text><text x="210" y="208" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">展开可救（消循环控制）</text><text x="210" y="225" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">证据：D125 的 O2 = 3.4GF（8×）</text><text x="210" y="242" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">D151 验证：-O2 对照</text><path d="M 389.0,61.3 Q 540.2,61.2 691.0,60.7 Q 689.2,198.9 689.1,339.0 Q 539.2,