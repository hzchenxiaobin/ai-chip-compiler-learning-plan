<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="450" viewBox="0 0 1080 450"><rect x="4" y="4" width="1072" height="442" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">明天 D153：性能反例——完整的故事</text><text x="540.0" y="60" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">本周已积累的两个反例素材</text><path d="M 58.6,80.4 Q 278.7,79.6 500.2,78.9 Q 501.2,149.5 500.6,218.6 Q 278.4,220.3 60.1,221.2 Q 61.0,153.0 58.6,80.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.3"/><text x="280" y="108" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">tile 反例（D151）</text><text x="280" y="132" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">教学 tile 0.3×——重复计算（×6.25~100）</text><text x="280" y="154" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">吃掉复用收益</text><text x="280" y="176" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">方向对、实现不完整→更慢</text><path d="M 539.1,81.0 Q 757.6,78.7 979.3,79.0 Q 982.2,151.1 981.1,219.2 Q 761.6,220.4 539.5,220.5 Q 537.5,152.4 539.1,81.0  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.3"/><text x="760" y="108" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">O2 的 shape 反例（今天）</text><text x="760" y="132" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">64×160×32 只 1.7×——K=32 太小</text><text x="760" y="154" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">展开收益递减</text><text x="760" y="176" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">同优化不同 shape→失效</text><path d="M 61.4,240.9 Q 539.6,239.5 1020.2,240.8 Q 1018.3,299.7 1020.7,360.6 Q 541.6,360.2 60.6,358.4 Q 60.4,301.8 61.4,240.9  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.85"/><text x="540.0" y="266" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">D153 的任务：反例的正式化</text><text x="540.0" y="292" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">① 选一个反例做完整解剖（现象→机制→适用条件）</text><text x="540.0" y="314" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">② D125 的 -O2 小 kernel 反例（4³ 慢 60%）也是候选——伏笔兑现</text><text x="540.0" y="336" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">③ 产出：性能反例＋适用条件说明——「什么时候不该用这个优化」的边界文档</text><path d="M 61.3,381.2 Q 540.7,380.0 1020.9,380.0 Q 1019.2,408.6 1021.1,440.5 Q 542.9,440.8 60.8,439.8 Q 59.2,412.2 61.3,381.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#B8A7CE" fill-opacity="0.25"/><text x="540.0" y="404" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">反例的价值：它划清了优化的领土——没有反例的优化报告是广告，有反例的才是工程</text><text x="540.0" y="424" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">（面试金句：「你做过的优化里，什么时候会失效？」——答得出反例才是真懂）</text></svg>
