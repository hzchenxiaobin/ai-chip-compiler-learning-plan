<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480"><rect x="4" y="4" width="1072" height="472" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="15" fill="#3B3B3B" text-anchor="middle" font-weight="bold">性能反例：三个候选与一个意外发现（反例是环境函数）</text><path d="M 61.6,58.6 Q 212.5,61.6 359.2,61.1 Q 361.6,145.7 361.3,230.2 Q 210.0,231.3 60.3,231.1 Q 62.7,146.1 61.6,58.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.32"/><text x="210" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">CE1 O2 小 shape 反例</text><text x="210" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">D125（LLVM 18）：慢 60% ✓</text><text x="210" y="134" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">本机（LLVM 23）：快 22% ✗</text><text x="210" y="156" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">→ 反例是版本函数！</text><path d="M 391.1,61.0 Q 539.7,62.2 689.7,60.5 Q 689.1,144.9 690.2,230.5 Q 541.8,229.4 389.2,229.1 Q 390.8,145.6 391.1,61.0  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.32"/><text x="540" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">CE2 K 太小收益存疑</text><text x="540" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">64×160×32：1.7×</text><text x="540" y="134" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">（中位 9.4× 的 1/5）</text><text x="540" y="156" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">→ 收益存疑但不为负</text><path d="M 718.9,60.2 Q 868.2,60.7 1020.3,60.5 Q 1021.1,145.7 1019.8,230.4 Q 871.4,229.1 718.9,231.1 Q 719.9,145.5 718.9,60.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.32"/><text x="870" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">CE3 tile 负优化</text><text x="870" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">160³ tile(64,64)：0.3×</text><text x="870" y="134" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">重复计算 ×6.25</text><text x="870" y="156" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">→ 比朴素慢 3 倍（铁证）</text><path d="M 59.7,250.0 Q 541.3,248.3 1021.3,248.7 Q 1020.7,315.3 1019.8,379.9 Q 537.9,379.7 59.2,381.1 Q 59.9,316.8 59.7,250.0  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.85"/><text x="540.0" y="276" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">今天最大的发现：反例本身是环境函数</text><text x="540.0" y="302" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">D125 的 -O2 小 kernel 反例（LLVM 18/aarch64 Linux：慢 60%）在今天的 LLVM 23/macOS arm64 上不复现（反而快 22%）——</text><text x="540.0" y="324" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">编译器版本的展开启发式不同——LLVM 23 对小 kernel 的展开收敛了。</text><text x="540.0" y="346" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">教训：反例的适用条件必须带环境声明——「LLVM 18 的小 kernel 展开反例」≠「所有环境的小 kernel 反例」</text><path d="M 58.8,398.6 Q 538.6,397.8 1019.7,400.3 Q 1020.3,433.2 1021.0,465.7 Q 539.9,465.5 61.1,465.2 Q 60.4,430.0 58.8,398.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#B8A7CE" fill-opacity="0.25"/><text x="540.0" y="424" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">没有反例的优化报告是广告，有反例的才是工程——</text><text x="540.0" y="448" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">今天再加半句：反例也要带环境戳（版本/平台）——跨环境复用反例与复用优化一样危险</text></svg>
