<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="350" viewBox="0 0 1080 350"><rect x="4" y="4" width="1072" height="342" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">测量方法：小 kernel 对照法分离开销</text><path d="M 59.1,58.6 Q 211.3,59.0 359.4,59.9 Q 359.3,125.7 359.3,190.2 Q 210.9,192.3 59.4,190.4 Q 57.6,125.1 59.1,58.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.35"/><text x="210" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">① 测小 kernel</text><text x="210" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">2×2×2 同结构 kernel</text><text x="210" y="134" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">执行≈0 → 总时间≈纯开销</text><path d="M 391.4,60.2 Q 540.9,61.6 689.4,59.6 Q 691.5,123.7 690.7,189.6 Q 541.8,188.9 390.3,190.9 Q 390.0,127.2 391.4,60.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.35"/><text x="540" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">② 测大 kernel</text><text x="540" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">160³ 同结构 kernel</text><text x="540" y="134" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">总时间 = 开销 + 执行</text><path d="M 718.9,59.2 Q 868.1,58.6 1019.1,60.7 Q 1018.8,125.6 1020.2,190.6 Q 871.7,189.2 720.1,189.4 Q 720.7,125.4 718.9,59.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.35"/><text x="870" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">③ 相减</text><text x="870" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">净执行 = 大总 − 小总</text><text x="870" y="134" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">21.444 − 0.001 ≈ 21.44ms</text><path d="M 61.0,220.3 Q 540.1,219.0 1020.8,220.9 Q 1020.1,274.9 1019.7,331.1 Q 540.6,329.7 60.3,329.6 Q 58.5,274.4 61.0,220.3  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.85"/><text x="540.0" y="246" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">小 kernel 对照法的假设与边界</text><text x="540.0" y="272" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">假设：同结构的 2³ kernel 执行时间≈0（160³ 的 1/512000）——开销与 shape 无关（描述符/调用/小分配）</text><text x="540.0" y="294" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">边界：kernel 内 malloc 与 shape 相关（输出缓冲 160²×4B=102KB vs 16B）——但相对 21ms 仍可忽略</text><text x="540.0" y="316" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">对照：真实系统用空 kernel 或 nop kernel 做同样的分离（CUDA 的 empty kernel launch ~5µs）</text></svg>
