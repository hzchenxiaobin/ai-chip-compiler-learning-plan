<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600"><rect x="4" y="4" width="1072" height="592" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">口头汇报口径（5 分钟版）</text><path d="M 61.3,59.8 Q 542.9,58.4 1021.4,59.4 Q 1022.9,93.8 1020.3,124.7 Q 540.3,124.6 60.8,124.6 Q 61.2,91.1 61.3,59.8  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.25"/><text x="170" y="86" font-family="'Courier New',monospace" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">0:00~0:45</text><text x="170" y="110" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">问题</text><text x="560" y="98" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="start">160³ 朴素 kernel 20.9ms、0.39GF——离峰值百倍。基线五要素可复现。</text><path d="M 61.6,135.9 Q 542.4,137.0 1019.2,134.6 Q 1019.7,167.1 1019.9,203.2 Q 541.8,202.4 59.9,203.0 Q 62.2,169.6 61.6,135.9  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.25"/><text x="170" y="162" font-family="'Courier New',monospace" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">0:45~1:30</text><text x="170" y="186" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">拆解</text><text x="560" y="174" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="start">稳态执行占 100%——嫌疑唯一。首次视角编译 97.7%（JIT 冷启动）。</text><path d="M 60.3,211.4 Q 540.4,208.9 1020.7,210.6 Q 1020.5,247.1 1020.6,279.6 Q 541.4,281.0 60.0,278.4 Q 59.3,245.4 60.3,211.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.25"/><text x="170" y="238" font-family="'Courier New',monospace" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">1:30~2:15</text><text x="170" y="262" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">定性</text><text x="560" y="250" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="start">Roofline：AI=0.13，两屋顶都远——执行效率瓶颈。三假设。</text><path d="M 60.5,288.7 Q 540.0,289.8 1018.8,287.6 Q 1019.6,320.9 1019.2,355.6 Q 541.2,354.0 58.9,352.9 Q 58.6,319.6 60.5,288.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.25"/><text x="170" y="314" font-family="'Courier New',monospace" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">2:15~3:30</text><text x="170" y="338" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">验证</text><text x="560" y="326" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="start">O2 展开 8.4×（H1 成立）；tile 0.3×（H2 证伪——重复计算）。</text><path d="M 59.8,362.9 Q 541.3,362.6 1019.3,363.5 Q 1020.1,397.1 1020.7,430.3 Q 538.1,429.7 59.8,429.6 Q 60.2,397.4 59.8,362.9  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.25"/><text x="170" y="390" font-family="'Courier New',monospace" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">3:30~4:15</text><text x="170" y="414" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">范围</text><text x="560" y="402" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="start">跨 7 shape：1.7~14.1×。最差解剖（K 小）。反例是环境函数。</text><path d="M 59.1,440.3 Q 540.8,437.7 1019.5,438.8 Q 1019.5,472.6 1021.0,505.7 Q 539.5,507.6 61.6,506.4 Q 60.4,474.3 59.1,440.3  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.25"/><text x="170" y="466" font-family="'Courier New',monospace" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">4:15~5:00</text><text x="170" y="490" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">建议</text><text x="560" y="478" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="start">O2 默认开（中位 9.4×）；tile 完整版是后续；反例带环境戳。</text><path d="M 59.9,528.7 Q 540.9,526.7 1021.3,528.9 Q 1021.0,555.6 1018.4,586.5 Q 540.0,588.5 59.1,586.9 Q 57.5,558.1 59.9,528.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.85"/><text x="540.0" y="554" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">汇报的纪律：每段一个数字锚点（20.9ms→8.4×→0.3×→1.7~14.1×）——</text><text x="540.0" y="574" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">听者五分钟内能复述的就是这四个数字与「反例是环境函数」——准备到这个程度才算脱稿</text></svg>
