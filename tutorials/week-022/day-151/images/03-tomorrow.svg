<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390"><rect x="4" y="4" width="1072" height="382" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">明天 D152：跨 Shape 验证——不只报最好结果</text><path d="M 61.0,60.1 Q 289.3,58.1 520.4,59.2 Q 522.1,168.8 519.5,280.7 Q 291.7,282.0 61.4,279.5 Q 62.7,171.6 61.0,60.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.3"/><text x="290" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">今天（单 shape 160³）</text><text x="290" y="114" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle">O2 展开：8.4× ✓</text><text x="290" y="136" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle">tile：0.3× ✗</text><text x="290" y="158" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle">组合：2.5×（tile 拖累）</text><text x="290" y="202" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle">结论只对 160³ 成立</text><path d="M 559.8,59.2 Q 788.6,59.2 1021.1,61.5 Q 1020.1,170.6 1019.9,281.3 Q 790.8,280.9 558.6,281.3 Q 560.5,170.0 559.8,59.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.3"/><text x="790" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">明天（≥6 个 shape）</text><text x="790" y="114" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">O2 的 8.4× 在小 shape 还成立吗？</text><text x="790" y="136" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">（K 小时展开收益递减——D125 的 4³ 反例）</text><text x="790" y="158" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">tile 的 0.3× 在哪些 shape 反转？</text><text x="790" y="180" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">（重复率 = (M/TM)² 随 M 变）</text><text x="790" y="224" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">跨 shape 表 = 优化的适用范围图</text><path d="M 59.7,299.6 Q 538.6,301.6 1019.5,299.6 Q 1018.0,333.5 1019.7,369.0 Q 538.0,370.8 58.8,371.5 Q 60.0,334.6 59.7,299.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.85"/><text x="540.0" y="326" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">「不能只报最好结果」的含义：</text><text x="540.0" y="350" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">单一 shape 的加速比是轶事；跨 shape 的加速比分布才是结论——范围、均值、最差值三个数都要报</text></svg>
