<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440"><rect x="4" y="4" width="1072" height="432" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">H2 反例的解剖：教学 tile 为什么慢 3 倍？</text><path d="M 60.7,60.1 Q 541.7,59.4 1020.5,59.8 Q 1018.3,161.0 1018.5,261.3 Q 540.0,260.2 61.5,261.3 Q 61.8,161.7 60.7,60.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.22"/><text x="540.0" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#C97B7B" text-anchor="middle" font-weight="bold">重复计算——D145 已知的教学取舍在今天显形</text><text x="100" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">教学 tile（D143~D146）：点循环从块内起点到全局边界——重复块写同值（幂等正确）</text><text x="100" y="134" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#C97B7B" text-anchor="start">代价：tile=(64,64) 下每个点被 (160/64)² ≈ 6.25 个块重复计算——计算量 ×6.25！</text><text x="100" y="156" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#C97B7B" text-anchor="start">tile=(16,16) 更惨：(160/16)² = 100 个块重复——每点算 100 次 → 645ms（25×慢）</text><text x="100" y="200" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#C97B7B" text-anchor="start">复用的收益（省访存）&lt; 重复的代价（多计算）——净效果：慢 3~25 倍</text><path d="M 59.1,278.6 Q 541.2,278.4 1021.5,280.9 Q 1019.5,348.4 1018.6,418.4 Q 539.3,420.6 59.8,421.1 Q 57.5,350.5 59.1,278.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.85"/><text x="540.0" y="306" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">如果做完整版（块内边界 min 钳制）会怎样？</text><text x="100" y="330" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">完整版：内层 i/j 只跑 [i0, min(i0+TM,M))——每点恰好算一次（无重复）</text><text x="100" y="352" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">此时 tile 的收益（B 块在 L1 的复用）才能兑现——教学取舍的性能账今天结清</text><text x="100" y="374" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">诚实结论：教学版验证了「tile 机制正确」（D146 的 10/10），但性能验证需要完整版</text><text x="100" y="396" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="start">——这是 D153 反例的核心素材：「优化方向对、实现不完整时可能更慢」</text></svg>
