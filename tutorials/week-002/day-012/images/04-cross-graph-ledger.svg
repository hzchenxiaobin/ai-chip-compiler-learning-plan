<text x="60" y="612" font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','楷体',cursive" font-size="12" fill="#3A322A" text-anchor="start">· add_relu(foreign, "R") 只查得了空指针和类型——「这个值住在哪张图里」是全局信息，</text>
<text x="60" y="634" font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','楷体',cursive" font-size="12" fill="#3A322A" text-anchor="start">   手里的指针天然看不见；值归属检查要先把全图的值收进 unordered_set，才问得出这句。</text>
<text x="60" y="662" font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','楷体',cursive" font-size="12" fill="#3A322A" text-anchor="start">· 账本双向核对：正向「每个输入槽，账本里恰有一条记录」；反向「每条记录，节点在本图、</text>
<text x="60" y="684" font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','楷体',cursive" font-size="12" fill="#3A322A" text-anchor="start">   槽不越界、槽确实指回这个值」。replace／erase 动过账本之后还成立吗，也只有这里盯得住。</text>
<text x="500" y="744" font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','楷体',cursive" font-size="11" fill="#8A8378" text-anchor="middle">图 3</text>
