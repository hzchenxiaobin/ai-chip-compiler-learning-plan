<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400"><rect x="4" y="4" width="1072" height="392" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">随机测试的边界与下一步</text><path d="M 59.2,60.4 Q 289.0,60.6 518.9,60.1 Q 519.0,181.3 521.2,298.9 Q 291.0,301.2 58.6,300.8 Q 60.2,181.2 59.2,60.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.2"/><text x="290" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">随机测不到的（诚实清单）</text><text x="90" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">· 数值精度边界（atol=1e-4 的灰区）：</text><text x="90" y="134" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">  随机数据在大 K 下的舍入累积——阈值设紧会误报</text><text x="90" y="156" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">· 并发竞争（D132 场景 C）：</text><text x="90" y="178" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">  单线程 fuzz 触不到时序竞争</text><text x="90" y="200" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">· 极端规模（内存上限）：</text><text x="90" y="222" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">  [1,32] 的 shape 不触碰 OOM 路径</text><text x="90" y="244" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">· Tile 参数（计划条目提到）：</text><text x="90" y="266" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">  教学版 tile 不消费（D125 空变量）——待块循环</text><path d="M 560.4,58.5 Q 790.5,59.9 1019.1,60.4 Q 1018.9,181.0 1018.5,299.5 Q 788.0,300.9 559.7,299.5 Q 560.2,180.9 560.4,58.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.3"/><text x="790" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">随机测试的进化路线</text><text x="590" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">① 覆盖引导（coverage-guided）：</text><text x="590" y="134" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">  记录已覆盖的代码路径，倾向生成新路径的输入</text><text x="590" y="156" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">② 失败最小化（D137 预告）：</text><text x="590" y="178" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">  随机发现的失败 shape 自动 shrink 到最小</text><text x="590" y="200" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">③ 性能 fuzz（D138 预告）：</text><text x="590" y="222" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">  正确性全过后的性能分布记录</text><text x="590" y="244" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">④ 回归固化：</text><text x="590" y="266" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="start">  每个随机发现的坑→手工正反例（免疫回流）</text><path d="M 61.3,318.4 Q 541.1,318.8 1019.6,320.2 Q 1022.1,351.3 1020.6,379.0 Q 539.6,378.1 61.2,379.8 Q 62.4,350.5 61.3,318.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.8"/><text x="540.0" y="344" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">随机与手工的关系：手工是精锐（每例都有出处与意图），随机是军团（量级压倒）——</text><text x="540.0" y="366" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">D134 的 16 例手工正反例 + 今天的 200 组随机 = 教学项目的完整 L1 层</text></svg>
