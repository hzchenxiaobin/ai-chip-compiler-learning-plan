<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440"><rect x="4" y="4" width="1072" height="432" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">问题清单：must-fix 与 future 的分界</text><path d="M 61.0,60.0 Q 278.4,60.1 499.0,58.4 Q 498.7,185.5 499.1,311.3 Q 280.5,308.3 60.2,308.4 Q 61.4,183.0 61.0,60.0  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.3"/><text x="280" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#4a7c59" text-anchor="middle" font-weight="bold">必须修复（must-fix）：0 项</text><text x="280" y="116" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">判定标准：阻塞发布的缺陷</text><text x="280" y="138" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">  · 正确性失败（任何一个 FAIL）</text><text x="280" y="160" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">  · 性能回归超报警阈值</text><text x="280" y="182" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">  · 文档缺失关键交付</text><text x="280" y="226" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">现状：四维 7/7 全绿——无阻塞项</text><text x="280" y="248" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">这是「验收通过」的准确含义：</text><text x="280" y="270" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">不是「没有 bug」而是「已知的都处理了，</text><text x="280" y="292" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">未知的都有出口（future 清单）」</text><path d="M 579.6,59.6 Q 800.8,58.6 1019.5,58.6 Q 1020.0,185.7 1019.6,310.3 Q 799.1,309.7 580.9,311.3 Q 582.0,185.9 579.6,59.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.3"/><text x="800" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#E8A87C" text-anchor="middle" font-weight="bold">后续扩展（future）：8 项</text><text x="800" y="116" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">F-01 块循环 Tiling 的 minic 化</text><text x="800" y="138" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">F-02 JIT 执行路线接入</text><text x="800" y="160" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">F-03 多算子支持集（conv/池化）</text><text x="800" y="182" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">F-04 跨进程缓存与失效</text><text x="800" y="204" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">F-05 SIGSEGV 级回退</text><text x="800" y="226" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">F-06 真二分定位工具化</text><text x="800" y="248" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">F-07 自动化 Reduce</text><text x="800" y="270" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="middle">F-08 真实计时接入性能回归</text><text x="800" y="300" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">每项有当日「讲不清」记录＋练习出口</text><path d="M 59.1,329.0 Q 537.2,330.2 1018.8,331.4 Q 1020.3,374.5 1021.1,420.4 Q 539.9,422.6 61.6,420.9 Q 60.2,374.7 59.1,329.0  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.8"/><text x="540.0" y="356" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">分界的判定问题：「这个不修，本版本能发吗？」</text><text x="540.0" y="380" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">能发→future（显式排期：第 21 周起逐项做）｜不能发→must-fix（本版本内修完）</text><text x="540.0" y="402" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">清单的诚实性：must-fix=0 是因为四维全绿，不是因为「不想修」——每项 future 都有出处</text></svg>
