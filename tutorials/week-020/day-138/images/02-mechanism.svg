ll="#E8A87C" fill-opacity="0.4"/><text x="660.0" y="92" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">警告区 1.5~2×</text><text x="660.0" y="108" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.5" fill="#6b6257" text-anchor="middle">0.7~0.9×</text><path d="M 759.9,70.6 Q 857.9,68.6 959.3,70.5 Q 960.1,94.7 959.0,119.0 Q 860.5,120.2 761.2,118.8 Q 761.1,94.3 759.9,70.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.4"/><text x="860.0" y="92" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">报警区 &gt;2×</text><text x="860.0" y="108" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.5" fill="#6b6257" text-anchor="middle">0.9~1.1×</text><text x="540.0" y="170" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">两种「变慢」：波动（噪声）与退化（信号）</text><path d="M 59.6,190.9 Q 288.3,189.8 518.7,190.0 Q 520.4,281.8 520.9,369.7 Q 289.6,370.5 59.4,369.7 Q 59.0,282.0 59.6,190.9  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.28"/><text x="290" y="216" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">波动（±8% 噪声）</text><text x="290" y="240" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">来源：频率迁移/缓存状态/中断</text><text x="290" y="262" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">特征：无方向、有界</text><text x="290" y="284" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">应对：中位数＋阈值容忍</text><text x="290" y="306" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">误报后果：报警疲劳（狼来了）</text><path d="M 559.5,190.5 Q 788.1,191.8 1020.9,189.3 Q 1020.1,280.6 1021.0,370.3 Q 792.0,369.4 560.6,369.9 Q 562.0,282.0 559.5,190.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.28"/><text x="790" y="216" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">退化（2× 信号）</text><text x="790" y="240" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">来源：代码变更引入的低效</text><text x="790" y="262" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">特征：持续性、有方向</text><text x="790" y="284" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">应对：超过阈值立即报警</text><text x="790" y="306" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">漏报后果：性能悄悄烂掉</text><path d="M 60.4,390.6 Q 537.4,391.7 1018.7,390.9 Q 1020.2,431.2 1021.1,471.4 Q 538.0,472.2 58.6,469.4 Q 60.9,428.0 60.4,390.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.8"/><text x="540.0" y="414" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">阈值设计的经验法则</text><text x="540.0" y="438" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">阈值 ≥ 2×观测波动（8%×2 边际 ≈ 1.2×，取整 1.5×）——太紧误报疲劳、太松漏报真退化</text><text x="540.0" y="458" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">生产系统的分层：1.5× 警告（看看）／2× 报警（必须处理）／5× 冻结发布（灾难）——D139 的冻结检查</text></svg>
