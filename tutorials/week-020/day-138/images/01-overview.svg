<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="546" viewBox="0 0 1080 546"><rect x="4" y="4" width="1072" height="538" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">性能回归测试：基准、比较、报警——三件套</text><path d="M 59.0,59.8 Q 209.1,60.4 360.6,59.1 Q 362.8,146.2 361.2,229.2 Q 210.9,229.5 58.9,229.8 Q 60.7,145.0 59.0,59.8  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.35"/><text x="210" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">P1 基准采集</text><text x="210" y="114" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">4 个基准 shape</text><text x="210" y="134" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">×7 轮采样</text><text x="210" y="154" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">中位数+P90+波动范围</text><text x="210" y="174" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">→ baseline.json</text><path d="M 388.8,59.1 Q 539.0,58.4 691.2,58.5 Q 689.2,146.2 690.4,229.6 Q 539.4,229.3 389.1,228.9 Q 389.9,144.1 388.8,59.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.35"/><text x="540" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">P2 回归比较</text><text x="540" y="114" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">新测量 vs 基线</text><text x="540" y="134" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">每 shape 算比值</text><text x="540" y="154" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">&lt;1.5× STABLE</text><text x="540" y="174" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">&gt;1.5× REGRESSION</text><path d="M 720.3,61.1 Q 871.3,61.1 1020.7,61.2 Q 1019.7,144.2 1020.9,230.5 Q 871.0,229.8 720.0,228.4 Q 718.0,144.8 720.3,61.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.35"/><text x="870" y="88" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">P3 报警演练</text><text x="870" y="114" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">正常波动→不误报</text><text x="870" y="134" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">注入 2× 退化→必报</text><text x="870" y="154" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">阈值 1.5× 的权衡</text><text x="540.0" y="262" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">P1 基准实测（4 shape）</text><path d="M 199.1,283.4 Q 541.9,282.3 881.1,282.5 Q 881.5,300.0 880.8,315.6 Q 541.0,313.2 198.9,314.7 Q 198.0,299.5 199.1,283.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.3"/><text x="350" y="305" font-family="'Courier New',monospace" font-size="11" fill="#3B3B3B" text-anchor="middle">4×6×3</text><text x="550" y="305" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">中位 0.0211 µs</text><text x="750" y="305" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">±0%</text><path d="M 199.6,321.1 Q 539.8,321.4 880.9,322.1 Q 882.4,338.9 881.0,353.9 Q 540.6,352.7 201.1,353.3 Q 201.4,338.5 199.6,321.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.3"/><text x="350" y="343" font-family="'Courier New',monospace" font-size="11" fill="#3B3B3B" text-anchor="middle">8×8×8</text><text x="550" y="343" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">中位 0.1344 µs</text><text x="750" y="343" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">±0%</text><path d="M 200.3,361.1 Q 538.2,359.6 879.1,359.8 Q 879.6,375.3 879.8,391.3 Q 540.1,391.4 201.0,390.9 Q 200.8,375.6 200.3,361.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.3"/><text x="350" y="381" font-family="'Courier New',monospace" font-size="11" fill="#3B3B3B" text-anchor="middle">16×16×16</text><text x="550" y="381" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">中位 1.1232 µs</text><text x="750" y="381" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">±0%</text><path d="M 200.6,398.0 Q 538.8,398.1 878.4,398.2 Q 880.6,413.6 879.7,431.4 Q 539.5,431.4 200.2,428.8 Q 200.1,413.8 200.6,398.0  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.3"/><text x="350" y="419" font-family="'Courier New',monospace" font-size="11" fill="#3B3B3B" text-anchor="middle">32×32×32</text><text x="550" y="419" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">中位 8.9414 µs</text><text x="750" y="419" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">±0%</text><path d="M 58.7,446.5 Q 539.5,447.7 1018.9,446.7 Q 1022.1,490.0 1021.2,537.1 Q 539.3,535.4 58.6,535.3 Q 58.6,492.5 58.7,446.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.8"/><text x="540.0" y="470" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">三件套的分工：基线是尺子（什么算正常）、比较是判决（新的是否正常）、报警是底线（不正常必须有人知道）</text><text x="540.0" y="494" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">D107 的测量纪律（3+7/3+21）与 D125 的 kernel 级口径（同进程 2 万次）在今天的 formal 体系里会师</text><text x="540.0" y="514" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">性能回归与正确性回归的差别：正确性是二值（对/错）、性能是分布（好/坏/噪声）——所以要有阈值与统计口径</text></svg>
