<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500"><rect x="4" y="4" width="1072" height="492" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">性能回归体系的完整形态与本周会师</text><path d="M 61.5,58.5 Q 540.7,58.3 1018.5,58.7 Q 1021.0,153.9 1021.0,248.7 Q 537.9,248.7 58.9,250.9 Q 60.7,154.7 61.5,58.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#B8A7CE" fill-opacity="0.25"/><text x="540.0" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">性能回归体系（生产形态）</text><text x="180" y="106" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">基准集</text><text x="560" y="106" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">固定 shape＋固定数据＋固定环境声明——任何一条变，基线重采</text><text x="180" y="132" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">采集</text><text x="560" y="132" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">每 shape N 轮×M 次调用→中位数/P90/波动范围——冷启动剔除</text><text x="180" y="158" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">比较</text><text x="560" y="158" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">新代码 vs 基线→每 shape 比值→分层判定（稳定/警告/报警）</text><text x="180" y="184" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">报警</text><text x="560" y="184" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">CI 集成——报警的 commit 无法合入；恢复后基线更新</text><text x="180" y="210" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">复盘</text><text x="560" y="210" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="start">每季度复审基准集的代表性（新热点 shape 要进、过时要出）</text><text x="540.0" y="286" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">第 20 周的四天会师</text><path d="M 59.5,306.1 Q 133.8,307.3 210.0,306.0 Q 208.6,350.6 210.9,394.9 Q 134.6,395.5 60.9,395.9 Q 62.3,351.6 59.5,306.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.35"/><text x="135" y="330" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">D134</text><text x="135" y="350" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">测试整理</text><text x="135" y="370" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#6b6257" text-anchor="middle">16 例正反集</text><path d="M 224.9,305.0 Q 299.2,308.2 375.2,307.6 Q 374.1,352.0 373.8,396.9 Q 296.6,396.6 223.6,394.8 Q 224.4,348.5 224.9,305.0  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.35"/><text x="300" y="330" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">D135</text><text x="300" y="350" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">随机 fuzz</text><text x="300" y="370" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#6b6257" text-anchor="middle">200 组全对</text><path d="M 390.1,304.9 Q 466.1,307.9 540.5,307.3 Q 542.7,352.7 541.3,397.5 Q 464.4,397.2 389.0,397.3 Q 389.7,350.8 390.1,304.9  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.35"/><text x="465" y="330" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">D136</text><text x="465" y="350" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">二分定位</text><text x="465" y="370" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#6b6257" text-anchor="middle">注入精确指认</text><path d="M 555.8,307.1 Q 632.0,305.3 706.5,304.4 Q 707.2,348.2 705.7,394.8 Q 631.1,397.2 556.5,395.4 Q 554.2,351.0 555.8,307.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.35"/><text x="630" y="330" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">D137</text><text x="630" y="350" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">最小用例</text><text x="630" y="370" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#6b6257" text-anchor="middle">19→4 节点</text><path d="M 721.1,307.6 Q 798.3,304.5 871.3,305.2 Q 868.7,348.5 869.0,394.5 Q 794.0,394.1 719.9,394.6 Q 722.0,350.7 721.1,307.6  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.35"/><text x="795" y="330" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor=