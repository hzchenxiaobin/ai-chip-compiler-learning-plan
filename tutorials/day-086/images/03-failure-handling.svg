<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820"><rect x="3" y="3" width="1234" height="814" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="30" y="44" text-anchor="start" font-size="25" fill="#3b3b3b">转换失败的两级处理：Pattern 拒绝是悄悄的，驱动器失败是大声的</text><text x="30" y="70" text-anchor="start" font-size="14.5" fill="#6b6459">「失败要大声」没错——但大声的位置有讲究：Pattern 级默认安静（试下一条），驱动器级必须震耳</text><path d="M 29.9,80.9 Q 619.2,81.3 1209.0,82.1" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M 39.0,104.0 Q 324.3,104.1 611.0,104.5 M 608.9,103.3 Q 610.4,224.3 610.9,344.7 M 609.9,344.4 Q 325.0,343.4 40.6,342.9 M 38.7,345.0 Q 41.0,224.5 40.9,103.1 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="130" text-anchor="start" font-size="15" fill="#3b3b3b">Pattern 级：notifyMatchFailure（这条规则不翻）</text><text x="56" y="156" text-anchor="start" font-size="12.2" fill="#3b3b3b">match 条件不满足（维度≠2、内维不匹配……）→ rewriter.notifyMatchFailure(op, reason)</text><text x="56" y="176" text-anchor="start" font-size="12.2" fill="#3b3b3b">→ 返回 failure，驱动器换下一条 Pattern 再试（benefit 从高到低）</text><text x="56" y="196" text-anchor="start" font-size="12.2" fill="#3b3b3b">→ 展示方式由驱动器决定：dialect conversion 把 reason 放进调试树，</text><text x="56" y="216" text-anchor="start" font-size="12.2" fill="#3b3b3b">   普通运行默认不打印——不是丢消息，是设计（很多 Pattern 本来就不该匹配）</text><path d="M 56.1,248.6 Q 326.3,248.1 593.3,249.2 M 593.0,247.2 Q 593.3,289.6 595.2,329.9 M 594.8,329.9 Q 324.2,329.0 56.5,331.1 M 55.4,328.7 Q 55.1,288.8 56.9,249.2 Z" fill="white" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="268" text-anchor="start" font-size="11.3" fill="#3b3b3b">A(4,6) @ B(3,2) 的真实调试树（--debug，案例 2）：</text><text x="66" y="284" text-anchor="start" font-size="11.3" fill="#3b3b3b">  * Pattern : 'MatMulSkeletonPattern' {</text><text x="66" y="300" text-anchor="start" font-size="11.3" fill="#3b3b3b">  } -&gt; FAILURE : 内维不匹配：A.shape[1]=6 ≠ B.shape[0]=3，</text><text x="66" y="316" text-anchor="start" font-size="11.3" fill="#3b3b3b">                k 循环边界无从确定</text><path d="M 641.1,103.9 Q 919.0,105.3 1199.5,104.9 M 1201.1,104.2 Q 1200.5,225.2 1200.0,344.5 M 1200.9,345.1 Q 921.0,345.1 638.8,345.0 M 640.7,345.0 Q 639.7,222.8 638.8,105.2 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="656" y="130" text-anchor="start" font-size="15" fill="#3b3b3b">驱动器级：所有 Pattern 都不行（这个 op 没救）</text><path d="M 656.8,149.2 Q 786.1,148.1 913.2,148.6 M 915.3,146.9 Q 913.1,191.0 913.2,236.0 M 915.0,235.4 Q 785.3,235.6 656.5,236.4 M 657.1,236.4 Q 656.1,191.2 655.6,148.3 Z" fill="white" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="668" y="170" text-anchor="start" font-size="13" fill="#d96c5c">full 模式（今天选它）</text><text x="668" y="192" text-anchor="start" font-size="11.3" fill="#3b3b3b">整体失败、指名道姓：</text><text x="668" y="209" text-anchor="start" font-size="11.3" fill="#3b3b3b">无法合法化 'mini.conv'：没有注册</text><text x="668" y="226" text-anchor="start" font-size="11.3" fill="#3b3b3b">对应的 ConversionPattern</text><path d="M 927.6,147.3 Q 1056.2,147.2 1184.9,148.8 M 1185.2,147.8 Q 1185.5,193.3 1185.4,235.1 M 1185.5,236.6 Q 1057.2,237.3 929.2,236.0 M 926.7,236.7 Q 927.4,192.2 927.9,148.8 Z" fill="white" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="940" y="170" text-anchor="start" font-size="13" fill="#5f8fcb">partial 模式</text><text x="940" y="192" text-anchor="start" font-size="11.3" fill="#3b3b3b">成功但显式残留：</text><text x="940" y="209" text-anchor="start" font-size="11.3" fill="#3b3b3b">['mini.conv']（交给后续 Pass，</text><text x="940" y="226" text-anchor="start" font-size="11.3" fill="#3b3b3b">下游得有人接手）</text><text x="656" y="262" text-anchor="start" font-size="12" fill="#3b3b3b">同一个「无法合法化」有两种病因，诊断文本不同（今天实测）：</text><text x="656" y="281" text-anchor="start" font-size="12" fill="#3b3b3b">  · 没有注册 Pattern（mini.conv）→ 补规则或改目标</text><text x="656" y="300" text-anchor="start" font-size="12" fill="#3b3b3b">  · Pattern 都拒绝了（内维不匹配的 matmul）→ 看 --debug 调试树里的拒绝原因</text><text x="40" y="386" text-anchor="start" font-size="15" fill="#6b6459">原子回滚（DT6-A/B 实测）：失败的 Pattern 不留痕</text><path d="M 40.2,402.6 Q 619.8,400.8 1200.8,402.7 M 1199.6,401.1 Q 1201.1,503.3 1200.3,602.7 M 1199.0,601.0 Q 618.8,603.1 40.9,601.0 M 39.4,602.3 Q 41.1,500.9 39.7,402.6 Z" fill="white" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 59.9,424.4 Q 185.5,423.0 308.9,424.7 M 309.4,423.9 Q 309.6,470.5 309.8,516.3 M 310.2,516.3 Q 184.9,515.9 60.3,515.0 M 61.3,516.3 Q 59.4,469.8 59.2,424.2 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="74" y="450" text-anchor="start" font-size="13" fill="#3b3b3b">HalfDoneMatMulPattern</text><text x="74" y="468" text-anchor="start" font-size="11.5" fill="#6b6459">(benefit=2，先试)</text><text x="74" y="490" text-anchor="start" font-size="11.5" fill="#3b3b3b">先 create 了 memref.alloc</text><text x="74" y="506" text-anchor="start" font-size="11.5" fill="#3b3b3b">再 notifyMatchFailure</text><path d="M 313.0,469.1 Q 326.5,470.2 343.2,470.8" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 341.9,470.4 Q 335.7,473.6 330.8,476.1" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 342.3,470.1 Q 335.8,466.7 330.5,464.5" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 344.1,423.5 Q 468.9,423.5 593.2,423.1 M 594.1,425.2 Q 593.7,471.3 594.1,515.2 M 594.9,515.6 Q 468.6,515.3 343.4,515.5 M 342.9,515.2 Q 344.8,470.2 343.8,425.2 Z" fill="white" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="358" y="450" text-anchor="start" font-size="13" fill="#3b3b3b">rollback</text><text x="358" y="468" text-anchor="start" font-size="11.5" fill="#6b6459">(丢弃暂存)</text><text x="358" y="490" text-anchor="start" font-size="11.5" fill="#3b3b3b">暂存的 create/replace</text><text x="358" y="506" text-anchor="start" font-size="11.5" fill="#3b3b3b">全部丢弃</text><path d="M 595.9,470.7 Q 610.1,470.7 624.9,471.3" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 626.0,469.7 Q 620.4,472.7 613.8,476.3" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 626.0,470.5 Q 620.2,466.7 613.8,464.1" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 627.6,423.9 Q 751.7,422.8 878.1,424.1 M 877.8,422.8 Q 878.2,469.6 878.2,515.3 M 877.7,515.2 Q 752.0,514.8 629.2,514.7 M 629.3,515.6 Q 628.4,470.3 627.4,424.0 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="642" y="450" text-anchor="start" font-size="13" fill="#3b3b3b">MatMulSkeletonPattern</text><text x="642" y="468" text-anchor="start" font-size="11.5" fill="#6b6459">(benefit=1，接手)</text><text x="642" y="490" text-anchor="start" font-size="11.5" fill="#3b3b3b">重新 match＋rewrite</text><text x="642" y="506" text-anchor="start" font-size="11.5" fill="#3b3b3b">正常提交 10 个目标 op</text><path d="M 880.7,469.8 Q 895.9,468.9 909.4,468.8" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 909.5,469.8 Q 903.6,472.3 897.7,476.4" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 909.9,470.5 Q 903.5,466.5 898.4,464.3" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 911.3,423.5 Q 1038.1,424.3 1161.0,424.6 M 1160.7,424.4 Q 1162.0,470.6 1163.0,516.2 M 1162.2,515.9 Q 1036.3,515.9 912.8,517.2 M 912.9,514.8 Q 912.0,470.1 911.4,424.0 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="926" y="450" text-anchor="start" font-size="13" fill="#3b3b3b">终图（12 op）</text><text x="926" y="490" text-anchor="start" font-size="11.5" fill="#3b3b3b">与只用 Skeleton 的结果</text><text x="926" y="506" text-anchor="start" font-size="11.5" fill="#3b3b3b">逐字相同：True（实测）</text><text x="60" y="556" text-anchor="start" font-size="12" fill="#3b3b3b">反例 B：只注册 HalfDone → full 失败，且失败后 IR 的 op 序列 = [func.func, mini.matmul, func.return]（与转换前相同），</text><text x="60" y="575" text-anchor="start" font-size="12" fill="#3b3b3b">骨架半成品残留 = 无——「先建了 alloc 再放弃」没有留下任何东西。</text><text x="60" y="594" text-anchor="start" font-size="12" fill="#6b6459">契约反例 C：Forgetful 返回成功却忘了 replaceOp → 仿真硬失败：「root op 既未被 replaceOp 也未被 eraseOp」；</text><text x="60" y="613" text-anchor="start" font-size="12" fill="#6b6459">真实 MLIR 默认构建不查这条，需 -DMLIR_ENABLE_EXPENSIVE_PATTERN_API_CHECKS=ON。</text><path d="M 40.3,627.1 Q 619.6,626.8 1200.0,627.3 M 1199.4,625.2 Q 1200.7,664.9 1200.6,701.8 M 1199.7,700.8 Q 619.5,702.9 40.3,702.5 M 41.0,700.9 Q 39.8,665.2 40.5,624.7 Z" fill="white" stroke="#5f8fcb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="58" y="654" text-anchor="start" font-size="14.5" fill="#5f8fcb">排障路线（今天练成的肌肉记忆）</text><text x="58" y="678" text-anchor="start" font-size="12.5" fill="#3b3b3b">full 失败 → 看诊断点名谁 → 有注册 Pattern 吗？有 → 开 --debug 看拒绝原因（notifyMatchFailure）；</text><text x="58" y="697" text-anchor="start" font-size="12.5" fill="#3b3b3b">没有 → 补 Pattern / 调整 ConversionTarget / 换 partial 并确认下游接手。</text></g></svg>