<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" width="1240" height="780"><rect x="3" y="3" width="1234" height="774" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="30" y="44" text-anchor="start" font-size="25" fill="#3b3b3b">实测结果：DT1~DT6 全 PASS——骨架 10 op 就位，待填 6 op 有主</text><text x="30" y="70" text-anchor="start" font-size="14.5" fill="#6b6459">环境：Linux aarch64 · Python 3.11.4 · 无 MLIR（DialectConversion 语义仿真）——全部真实运行，无估算</text><path d="M 31.0,82.4 Q 619.9,81.9 1210.3,81.5" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><text x="40" y="112" text-anchor="start" font-size="15" fill="#6b6459">骨架 IR（skeleton-ir.txt，A(4,6)@B(6,3)→C(4,3)）：3 op → 12 op</text><path d="M 39.3,125.1 Q 319.5,125.0 600.9,125.1 M 599.5,126.3 Q 600.3,290.3 600.5,455.2 M 601.0,455.5 Q 318.9,457.3 40.4,454.9 M 39.6,456.2 Q 41.0,291.4 39.3,125.9 Z" fill="white" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="150" text-anchor="start" font-size="12" fill="#3b3b3b">func @main(%a: memref&lt;4x6…&gt;, %b: memref&lt;6x3…&gt;)</text><text x="54" y="171" text-anchor="start" font-size="12" fill="#3b3b3b">  %c   = memref.alloc() : memref&lt;4x3…&gt;      ← 骨架①</text><text x="54" y="192" text-anchor="start" font-size="12" fill="#3b3b3b">  %c0/%c1/%c4/%c3/%c6 = arith.constant     ← 骨架② 0/1/M/N/K</text><text x="54" y="213" text-anchor="start" font-size="12" fill="#3b3b3b">  scf.for %i = %c0 to %c4 step %c1 {</text><text x="54" y="234" text-anchor="start" font-size="12" fill="#3b3b3b">    scf.for %j = %c0 to %c3 step %c1 {</text><text x="54" y="255" text-anchor="start" font-size="12" fill="#3b3b3b">      scf.for %k = %c0 to %c6 step %c1 {</text><text x="54" y="276" text-anchor="start" font-size="12" fill="#3b3b3b">        scf.yield                        ← 占位：留白</text><text x="54" y="297" text-anchor="start" font-size="12" fill="#3b3b3b">      }</text><text x="54" y="318" text-anchor="start" font-size="12" fill="#3b3b3b">    }</text><text x="54" y="339" text-anchor="start" font-size="12" fill="#3b3b3b">  }</text><text x="54" y="360" text-anchor="start" font-size="12" fill="#3b3b3b">  return %c</text><path d="M 53.6,335.4 Q 174.0,334.7 294.1,336.5 M 292.8,337.1 Q 295.1,366.1 295.0,398.4 M 293.3,398.4 Q 174.2,398.2 53.4,397.1 M 55.2,396.9 Q 53.5,368.1 53.9,335.0 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="356" text-anchor="start" font-size="12.5" fill="#79b26a">Day 87 填：初始化</text><text x="66" y="374" text-anchor="start" font-size="11" fill="#3b3b3b">%zero = arith.constant 0.0</text><text x="66" y="389" text-anchor="start" font-size="11" fill="#3b3b3b">＋ iter_args(%acc = %zero) 升级</text><path d="M 309.3,335.7 Q 448.6,336.0 585.0,336.7 M 586.7,336.8 Q 585.8,368.2 585.3,397.6 M 585.0,398.7 Q 447.1,397.6 308.8,397.1 M 309.4,399.1 Q 309.0,367.3 309.9,336.2 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="322" y="356" text-anchor="start" font-size="12.5" fill="#e8973f">Day 88 填：访存与累加</text><text x="322" y="374" text-anchor="start" font-size="11" fill="#3b3b3b">load×2 ＋ mulf ＋ addf ＋ store</text><text x="322" y="389" text-anchor="start" font-size="11" fill="#3b3b3b">（yield 原位升级为回传 %s）</text><text x="54" y="424" text-anchor="start" font-size="11.8" fill="#6b6459">骨架 10 op ＋ 待填 6 op = 完整目标 16 op（Day 85 的 op 名级</text><text x="54" y="441" text-anchor="start" font-size="11.8" fill="#6b6459">仿真记 14 op：5 个常量算 1 条）；yield 是占位，不重复计数。</text><text x="640" y="112" text-anchor="start" font-size="15" fill="#6b6459">诊断测试 DT1~DT6（真实执行，全部 PASS）</text><path d="M 639.9,132.2 Q 919.9,131.0 1199.1,133.0 M 1200.4,131.9 Q 1201.2,153.4 1200.0,176.6 M 1199.0,176.3 Q 919.3,176.0 638.9,176.8 M 639.1,176.8 Q 641.1,153.1 640.2,133.2 Z" fill="white" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="150" text-anchor="start" font-size="12.5" fill="#79b26a">PASS</text><text x="706" y="150" text-anchor="start" font-size="13" fill="#3b3b3b">DT1 匹配与替换</text><text x="706" y="167" text-anchor="start" font-size="11.3" fill="#6b6459">3 op → 12 op，op 序列与预期骨架完全一致，mini 残留 = 无</text><path d="M 640.3,183.6 Q 919.8,184.3 1200.3,184.5 M 1200.1,183.5 Q 1200.9,206.0 1201.1,228.3 M 1200.2,227.0 Q 920.5,227.4 640.6,229.1 M 641.1,227.0 Q 639.6,205.2 639.2,185.2 Z" fill="white" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="202" text-anchor="start" font-size="12.5" fill="#79b26a">PASS</text><text x="706" y="202" text-anchor="start" font-size="13" fill="#3b3b3b">DT2 骨架结构</text><text x="706" y="219" text-anchor="start" font-size="11.3" fill="#6b6459">alloc 类型/strides、常量 {0,1,3,4,6}、边界 4/3/6、嵌套深度 3</text><path d="M 639.3,235.1 Q 918.8,235.3 1200.2,236.6 M 1199.2,234.9 Q 1201.1,259.0 1200.1,279.8 M 1200.9,279.0 Q 919.8,280.4 639.9,278.8 M 640.4,280.7 Q 639.7,258.6 641.2,236.9 Z" fill="white" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="254" text-anchor="start" font-size="12.5" fill="#79b26a">PASS</text><text x="706" y="254" text-anchor="start" font-size="13" fill="#3b3b3b">DT3 类型缝合</text><text x="706" y="271" text-anchor="start" font-size="11.3" fill="#6b6459">adaptor 拿到 %a/%b（memref）；终图无 tensor、无悬空引用</text><path d="M 639.9,289.3 Q 918.8,287.4 1201.1,289.0 M 1199.8,286.7 Q 1198.7,309.1 1200.8,331.6 M 1199.0,330.8 Q 918.9,332.6 641.2,332.5 M 640.7,331.8 Q 638.9,309.3 641.3,287.0 Z" fill="white" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="306" text-anchor="start" font-size="12.5" fill="#79b26a">PASS</text><text x="706" y="306" text-anchor="start" font-size="13" fill="#3b3b3b">DT4 驱动器级失败</text><text x="706" y="323" text-anchor="start" font-size="11.3" fill="#6b6459">mini.conv：full 指名失败 / partial 残留 ['mini.conv']</text><path d="M 640.6,339.2 Q 919.0,341.2 1199.1,339.0 M 1200.0,340.1 Q 1198.7,361.0 1198.7,384.2 M 1199.6,384.9 Q 919.9,384.2 640.0,383.6 M 640.8,382.8 Q 639.4,363.2 639.7,340.0 Z" fill="white" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="358" text-anchor="start" font-size="12.5" fill="#79b26a">PASS</text><text x="706" y="358" text-anchor="start" font-size="13" fill="#3b3b3b">DT5 Pattern 级失败</text><text x="706" y="375" text-anchor="start" font-size="11.3" fill="#6b6459">内维 6≠3：拒绝原因只在 --debug 调试树，普通运行静默</text><path d="M 639.7,391.7 Q 920.4,392.3 1200.0,391.3 M 1200.9,391.8 Q 1199.6,413.1 1199.8,435.1 M 1200.1,437.3 Q 918.9,436.3 640.7,435.7 M 640.1,436.5 Q 639.5,415.1 638.7,392.4 Z" fill="white" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="410" text-anchor="start" font-size="12.5" fill="#79b26a">PASS</text><text x="706" y="410" text-anchor="start" font-size="13" fill="#3b3b3b">DT6 原子性与契约</text><text x="706" y="427" text-anchor="start" font-size="11.3" fill="#6b6459">回滚后终图逐字相同；忘 replaceOp → 契约硬失败</text><text x="640" y="452" text-anchor="start" font-size="15" fill="#6b6459">两个对照实验（真实数据）</text><path d="M 641.0,466.3 Q 776.5,464.9 914.5,465.2 M 914.4,466.2 Q 913.3,524.2 913.4,583.6 M 913.8,583.9 Q 777.0,583.5 638.9,583.6 M 640.2,585.0 Q 641.0,525.6 641.1,465.6 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="488" text-anchor="start" font-size="12.5" fill="#3b3b3b">对照 1：只注册半途而废的 Pattern</text><text x="654" y="510" text-anchor="start" font-size="11.2" fill="#3b3b3b">full 模式失败；失败后 op 序列</text><text x="654" y="526" text-anchor="start" font-size="11.2" fill="#3b3b3b">= [func.func, mini.matmul,</text><text x="654" y="542" text-anchor="start" font-size="11.2" fill="#3b3b3b">  func.return]（与转换前相同）</text><text x="654" y="558" text-anchor="start" font-size="11.2" fill="#3b3b3b">骨架半成品残留 = 无 → 失败不留痕</text><path d="M 926.7,465.8 Q 1064.2,465.4 1200.7,466.4 M 1200.1,466.6 Q 1201.2,525.3 1199.7,584.4 M 1200.6,584.0 Q 1063.2,583.0 925.0,582.7 M 925.2,584.3 Q 926.9,523.9 925.8,465.9 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="940" y="488" text-anchor="start" font-size="12.5" fill="#3b3b3b">对照 2：换形状 --shape 2 3 2</text><text x="940" y="510" text-anchor="start" font-size="11.2" fill="#3b3b3b">骨架 12 op 不变；常量变 {0,1,2,2,3}，</text><text x="940" y="526" text-anchor="start" font-size="11.2" fill="#3b3b3b">M=N=2 出现两个「2」→ 命名去重</text><text x="940" y="542" text-anchor="start" font-size="11.2" fill="#3b3b3b">%c2 与 %c2'；边界 i/j/k = 2/2/3；</text><text x="940" y="558" text-anchor="start" font-size="11.2" fill="#3b3b3b">alloc 变 memref&lt;2x2, strided&lt;[2,1]&gt;&gt;</text><path d="M 40.6,626.0 Q 619.8,626.6 1199.1,626.5 M 1200.5,626.0 Q 1198.7,669.1 1198.9,713.8 M 1201.2,715.1 Q 618.9,713.0 40.7,712.9 M 40.6,714.0 Q 39.7,669.9 39.0,625.1 Z" fill="white" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="654" text-anchor="start" font-size="14.5" fill="#79b26a">验收口径（诚实声明）</text><text x="58" y="678" text-anchor="start" font-size="12.3" fill="#3b3b3b">今天的验收是结构性的：匹配、骨架、类型缝合、失败诊断（DT1~DT6）；骨架不做数值计算，执行等价（同序 fp32 位等价）从 Day 87 起逐块补上。</text><text x="58" y="698" text-anchor="start" font-size="12.3" fill="#3b3b3b">与真实 MLIR 的差异见脚本头部：rollback 深度（Pattern 级 vs 整条路径）、签名转换前置、契约检查策略。</text></g></svg>