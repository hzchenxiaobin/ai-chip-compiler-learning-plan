<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" width="1240" height="800"><rect x="3" y="3" width="1234" height="794" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="30" y="44" text-anchor="start" font-size="25" fill="#3b3b3b">ConversionPattern ＋ ConversionPatternRewriter：一次事务性翻译的解剖</text><text x="30" y="70" text-anchor="start" font-size="14.5" fill="#6b6459">所有修改先暂存，Pattern 成功才提交；失败回滚，IR 永远不停在「改了一半」的状态</text><path d="M 29.4,81.9 Q 619.7,81.5 1209.6,82.7" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M 41.0,104.1 Q 214.3,103.6 391.1,103.2 M 390.1,104.8 Q 390.5,270.2 390.3,435.1 M 389.5,433.0 Q 214.8,433.3 41.2,433.5 M 40.3,433.8 Q 41.2,269.7 40.9,105.3 Z" fill="white" stroke="#6b6459" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="130" text-anchor="start" font-size="15.5" fill="#3b3b3b">matchAndRewrite 的三件套</text><path d="M 56.9,147.5 Q 214.6,148.4 373.3,148.0 M 374.2,149.0 Q 373.9,191.5 373.7,236.9 M 373.1,235.4 Q 214.7,235.8 55.3,236.4 M 55.2,236.4 Q 55.7,191.6 56.4,147.3 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="172" text-anchor="start" font-size="13.5" fill="#3b3b3b">① op（原文）</text><text x="68" y="192" text-anchor="start" font-size="11.8" fill="#d96c5c">%mm = mini.matmul(%x, %w)</text><text x="68" y="210" text-anchor="start" font-size="11.2" fill="#6b6459">职责：交代完整语义——</text><text x="68" y="226" text-anchor="start" font-size="11.2" fill="#6b6459">操作数类型/shape、内维契约、结果类型</text><path d="M 56.3,243.6 Q 214.6,244.1 373.0,243.1 M 374.3,244.5 Q 373.5,288.4 373.5,332.6 M 373.6,332.8 Q 214.8,332.1 55.4,331.0 M 56.3,332.1 Q 56.2,289.0 56.6,244.4 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="268" text-anchor="start" font-size="13.5" fill="#3b3b3b">② adaptor（已换币的钱）</text><text x="68" y="288" text-anchor="start" font-size="11.8" fill="#e8973f">operands = [%a, %b]（memref）</text><text x="68" y="306" text-anchor="start" font-size="11.2" fill="#6b6459">最近一次替换后的值；类型已是</text><text x="68" y="322" text-anchor="start" font-size="11.2" fill="#6b6459">TypeConverter 合法化后的类型</text><path d="M 56.7,340.2 Q 215.6,341.0 374.3,340.8 M 374.1,340.1 Q 374.3,384.5 373.1,427.6 M 375.0,428.6 Q 215.4,428.6 55.1,428.6 M 57.0,427.0 Q 56.8,384.5 55.7,339.4 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="364" text-anchor="start" font-size="13.5" fill="#3b3b3b">③ rewriter（唯一通道）</text><text x="68" y="384" text-anchor="start" font-size="11.8" fill="#5f8fcb">create / replaceOp / eraseOp</text><text x="68" y="402" text-anchor="start" font-size="11.2" fill="#6b6459">改 IR 只许走它；直接 op.erase()</text><text x="68" y="418" text-anchor="start" font-size="11.2" fill="#6b6459">在真实 MLIR 里是违规操作</text><text x="56" y="444.0" text-anchor="start" font-size="11.5" fill="#6b6459">对应 MLIR：ConversionPattern 比 RewritePattern</text><text x="56" y="460.0" text-anchor="start" font-size="11.5" fill="#6b6459">多一个 operands/adaptor 参数；配了 TypeConverter</text><text x="56" y="476.0" text-anchor="start" font-size="11.5" fill="#6b6459">时类型即合法化类型，操作数无法合法化则</text><text x="56" y="492.0" text-anchor="start" font-size="11.5" fill="#6b6459">pattern 在调用前就失败。</text><path d="M 430.1,103.4 Q 624.5,104.8 820.7,104.0 M 818.9,104.7 Q 821.3,268.3 820.0,432.8 M 820.3,434.7 Q 624.7,434.4 429.8,434.0 M 429.5,433.7 Q 430.3,268.8 431.0,103.0 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="446" y="130" text-anchor="start" font-size="15.5" fill="#3b3b3b">事务暂存区（staging）</text><text x="446" y="156" text-anchor="start" font-size="12" fill="#3b3b3b">MatMulSkeletonPattern 里发生的事（真实顺序）：</text><text x="446" y="175" text-anchor="start" font-size="12" fill="#3b3b3b">  create  memref.alloc        → %c</text><text x="446" y="194" text-anchor="start" font-size="12" fill="#3b3b3b">  create  arith.constant ×5   → %c0..%c6</text><text x="446" y="213" text-anchor="start" font-size="12" fill="#3b3b3b">  create  scf.yield           → 占位</text><text x="446" y="232" text-anchor="start" font-size="12" fill="#3b3b3b">  create  scf.for %k / %j / %i → 从内向外</text><text x="446" y="251" text-anchor="start" font-size="12" fill="#3b3b3b">  replaceOp(matmul, [%c])     → 处置 root</text><path d="M 445.0,288.4 Q 530.1,288.0 615.3,289.2 M 616.4,288.4 Q 617.1,312.9 615.7,337.2 M 615.0,338.5 Q 531.0,337.4 445.2,338.6 M 445.2,338.0 Q 446.8,313.1 446.3,288.5 Z" fill="white" stroke="#79b26a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="456" y="308" text-anchor="start" font-size="12.5" fill="#79b26a">返回 success</text><text x="456" y="328" text-anchor="start" font-size="11.5" fill="#3b3b3b">commit：插入＋记账</text><path d="M 633.9,287.8 Q 720.0,286.9 802.8,288.5 M 803.6,288.5 Q 804.0,312.8 803.1,336.9 M 803.6,337.5 Q 718.8,338.2 633.4,339.2 M 632.9,338.0 Q 633.8,312.1 633.2,288.1 Z" fill="white" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="644" y="308" text-anchor="start" font-size="12.5" fill="#d96c5c">返回 failure</text><text x="644" y="328" text-anchor="start" font-size="11.5" fill="#3b3b3b">rollback：全部丢弃</text><text x="446" y="360" text-anchor="start" font-size="11.8" fill="#3b3b3b">commit 做两件事：新建 op 顶替 root 的位置；</text><text x="446" y="378" text-anchor="start" font-size="11.8" fill="#3b3b3b">%mm → %c 记入替换映射（uses 延迟替换）。</text><text x="446" y="402" text-anchor="start" font-size="11.2" fill="#6b6459">真实 MLIR 的 rollback 模式更彻底：replaceOp/</text><text x="446" y="419" text-anchor="start" font-size="11.2" fill="#6b6459">eraseOp 延迟到整个转换结束才生效，还能回滚</text><text x="446" y="436" text-anchor="start" font-size="11.2" fill="#6b6459">已应用的 Pattern（allowPatternRollback）。</text><path d="M 859.3,104.4 Q 1030.6,103.4 1200.8,103.6 M 1199.1,102.8 Q 1199.1,270.3 1200.1,433.5 M 1200.2,434.3 Q 1029.3,434.0 859.7,433.3 M 861.2,434.1 Q 858.7,270.0 859.6,104.6 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="876" y="130" text-anchor="start" font-size="15" fill="#3b3b3b">替换映射＋finalize（延迟替换）</text><text x="876" y="150" text-anchor="start" font-size="11.5" fill="#6b6459">%x : tensor&lt;4x6&gt;</text><path d="M 1001.3,147.1 Q 1015.2,146.8 1030.7,145.4" fill="none" stroke="#e8973f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1030.5,145.6 Q 1024.4,148.7 1018.3,152.0" fill="none" stroke="#e8973f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1030.6,146.4 Q 1023.8,143.3 1018.7,140.0" fill="none" stroke="#e8973f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="1038" y="150" text-anchor="start" font-size="11.5" fill="#3b3b3b">%a : memref&lt;4x6, strided&lt;[6,1]&gt;&gt;</text><text x="876" y="166" text-anchor="start" font-size="11" fill="#6b6459">S1 签名转换</text><text x="876" y="194" text-anchor="start" font-size="11.5" fill="#6b6459">%w : tensor&lt;6x3&gt;</text><path d="M 999.9,190.8 Q 1015.0,190.1 1029.5,191.2" fill="none" stroke="#e8973f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1029.7,189.7 Q 1024.6,193.0 1018.5,196.3" fill="none" stroke="#e8973f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1030.3,189.9 Q 1024.1,186.9 1017.9,183.8" fill="none" stroke="#e8973f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="1038" y="194" text-anchor="start" font-size="11.5" fill="#3b3b3b">%b : memref&lt;6x3, strided&lt;[3,1]&gt;&gt;</text><text x="876" y="210" text-anchor="start" font-size="11" fill="#6b6459">S1 签名转换</text><text x="876" y="238" text-anchor="start" font-size="11.5" fill="#6b6459">%mm : tensor&lt;4x3&gt;</text><path d="M 999.5,235.3 Q 1014.1,235.0 1029.2,235.3" fill="none" stroke="#e8973f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1029.9,233.9 Q 1024.4,236.8 1019.0,239.1" fill="none" stroke="#e8973f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1029.5,233.6 Q 1023.9,230.6 1017.8,227.8" fill="none" stroke="#e8973f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="1038" y="238" text-anchor="start" font-size="11.5" fill="#3b3b3b">%c : memref&lt;4x3, strided&lt;[3,1]&gt;&gt;</text><text x="876" y="254" text-anchor="start" font-size="11" fill="#6b6459">Pattern 提交（今天）</text><path d="M 876.7,296.0 Q 1030.1,296.1 1184.6,295.8 M 1184.8,295.8 Q 1184.5,323.1 1184.1,352.6 M 1182.7,352.1 Q 1030.2,351.0 876.0,352.8 M 874.8,352.5 Q 874.9,323.4 875.7,295.3 Z" fill="white" stroke="#e8973f" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="888" y="318" text-anchor="start" font-size="12.5" fill="#3b3b3b">finalize：转换结束后统一改 uses</text><text x="888" y="338.0" text-anchor="start" font-size="11" fill="#6b6459">return 的操作数 %mm → %c；中途的「半 tensor</text><text x="888" y="353.5" text-anchor="start" font-size="11" fill="#6b6459">半 memref」由映射缝上（DT3 实测无悬空引用）</text><text x="876" y="378" text-anchor="start" font-size="11.8" fill="#3b3b3b">adaptor 的底座就是这张映射：</text><text x="876" y="396" text-anchor="start" font-size="11.8" fill="#3b3b3b">getRemappedValue(%x) → %a。</text><path d="M 391.1,250.0 Q 408.9,248.9 426.9,250.9" fill="none" stroke="#6b6459" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 428.7,250.7 Q 422.0,253.3 416.5,255.9" fill="none" stroke="#6b6459" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 428.4,250.6 Q 422.5,247.1 416.9,244.6" fill="none" stroke="#6b6459" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="410" y="236" text-anchor="middle" font-size="12" fill="#6b6459">调用</text><path d="M 822.7,250.3 Q 839.1,249.1 856.0,249.6" fill="none" stroke="#6b6459" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 855.4,249.5 Q 850.0,253.3 844.6,256.4" fill="none" stroke="#6b6459" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 855.8,250.1 Q 850.6,247.7 843.7,244.7" fill="none" stroke="#6b6459" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="839" y="236" text-anchor="middle" font-size="12" fill="#6b6459">记账</text><path d="M 40.1,470.6 Q 620.1,470.8 1200.2,469.0 M 1200.4,470.5 Q 1199.3,534.6 1199.4,598.7 M 1200.5,599.2 Q 618.7,599.8 38.8,601.1 M 39.2,599.4 Q 40.0,533.8 40.3,470.9 Z" fill="white" stroke="#d96c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="498" text-anchor="start" font-size="14.5" fill="#d96c5c">Pattern 的三条契约（真实 MLIR 文档《Pattern Rewriting》Restrictions）</text><text x="58" y="524" text-anchor="start" font-size="12.5" fill="#3b3b3b">① 一切 IR 修改（包括创建）必须经过 PatternRewriter——不许 op.erase() 绕过；</text><text x="58" y="545" text-anchor="start" font-size="12.5" fill="#3b3b3b">② root op 必须 in-place 更新、replace 或 erase——「匹配了却没处置」是违约；</text><text x="58" y="566" text-anchor="start" font-size="12.5" fill="#3b3b3b">③ matchAndRewrite 返回 success 当且仅当 IR 被修改——返回 failure 就不许留下任何改动。</text><text x="58" y="586" text-anchor="start" font-size="11.8" fill="#6b6459">运行时检查：-DMLIR_ENABLE_EXPENSIVE_PATTERN_API_CHECKS=ON（默认构建不查；今天的仿真一律硬失败，DT6-C 实测）</text><path d="M 39.5,625.2 Q 620.4,626.3 1199.9,625.8 M 1201.1,625.2 Q 1199.6,662.9 1199.0,702.3 M 1200.1,701.2 Q 619.2,701.3 40.1,701.1 M 38.8,701.5 Q 40.6,663.4 39.4,625.8 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="654" text-anchor="start" font-size="14.5" fill="#79b26a">驱动器视角的一句话</text><text x="58" y="678" text-anchor="start" font-size="12.5" fill="#3b3b3b">先序遍历（op 先于其 region）；非法 op 按 benefit 从高到低逐条试 Pattern；全都不行才轮到</text><text x="58" y="697" text-anchor="start" font-size="12.5" fill="#3b3b3b">驱动器级失败（full 整体失败 / partial 显式残留）——失败的两级结构见下一张图。</text></g></svg>