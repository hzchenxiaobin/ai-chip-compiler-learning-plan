<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440"><rect x="4" y="4" width="1072" height="432" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">bug 解剖：部分和覆盖的机制</text><path d="M 58.7,61.4 Q 289.2,59.6 520.4,59.2 Q 518.8,191.0 520.9,319.8 Q 290.9,318.2 60.4,319.1 Q 61.5,189.1 58.7,61.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.25"/><text x="290" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#C97B7B" text-anchor="middle" font-weight="bold">错误版（D143~144）</text><text x="90" y="112" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">scf.for %k0 = ... step %cTK {      // k0 外层块</text><text x="90" y="134" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">  scf.for %i ... {</text><text x="90" y="156" font-family="'Courier New',monospace" font-size="10" fill="#C97B7B" text-anchor="start">    %acc = scf.for %k = %k0 to %cK  // ← 从 k0 出发！</text><text x="90" y="178" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">    // k0=0 块：算 k=0..5（完整）</text><text x="90" y="200" font-family="'Courier New',monospace" font-size="10" fill="#C97B7B" text-anchor="start">    // k0=3 块：算 k=3..5（尾巴！）</text><text x="90" y="222" font-family="'Courier New',monospace" font-size="10" fill="#C97B7B" text-anchor="start">    // store ← 每块都写！</text><text x="90" y="244" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">}}</text><text x="90" y="266" font-family="'Courier New',monospace" font-size="10" fill="#C97B7B" text-anchor="start">→ 最后写的 k0=3 块只含 k≥3 的部分和</text><path d="M 559.5,59.2 Q 788.2,60.5 1018.8,59.6 Q 1019.1,188.0 1019.0,320.7 Q 787.8,318.9 559.9,319.5 Q 560.4,188.9 559.5,59.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.3"/><text x="790" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#4a7c59" text-anchor="middle" font-weight="bold">修复版（今天）</text><text x="590" y="112" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">scf.for %k0 = ... step %cTK {      // k0 外层块仍在</text><text x="590" y="134" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">  scf.for %i ... {</text><text x="590" y="156" font-family="'Courier New',monospace" font-size="10" fill="#4a7c59" text-anchor="start">    %acc = scf.for %k = %c0 to %cK  // ← 从 0 出发！</text><text x="590" y="178" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">    // 每个块都算完整 K</text><text x="590" y="200" font-family="'Courier New',monospace" font-size="10" fill="#4a7c59" text-anchor="start">    // store ← 重复块写同值</text><text x="590" y="222" font-family="'Courier New',monospace" font-size="10" fill="#3B3B3B" text-anchor="start">}}</text><text x="590" y="266" font-family="'Courier New',monospace" font-size="10" fill="#4a7c59" text-anchor="start">→ 幂等成立：任何块写出同值＝正确</text><path d="M 60.8,340.5 Q 541.0,338.7 1019.1,340.9 Q 1018.4,381.5 1018.5,421.5 Q 537.3,421.7 59.4,418.7 Q 58.1,378.1 60.8,340.5  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.85"/><text x="540.0" y="366" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12" fill="#3B3B3B" text-anchor="middle" font-weight="bold">幂等论证的正确前提：每个块必须「独立算出与朴素版相同的值」</text><text x="540.0" y="390" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">k 从 k0 出发破坏前提（每块算不同的部分）；k 从 0 出发恢复前提（每块算完整值）——D143 的论证漏洞今天补上</text></svg>
