ic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11" fill="#84796a" text-anchor="middle" opacity="1.0" font-weight="normal">中间形状 s1 有没有必要留？</text><text x="180" y="288" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10" fill="#84796a" text-anchor="middle" opacity="1.0" font-weight="normal">（B(2,3,4) → (6,4) → (24,)）</text><path d="M 370.0,180.0 L 421.0,179.1 L 469.5,179.3 L 520.3,179.9 L 570.3,178.8 L 619.3,180.1 L 670.0,180.0 L 670.0,180.0 L 670.5,201.3 L 669.2,221.4 L 669.4,242.4 L 670.9,261.9 L 668.9,282.9 L 670.0,304.0 L 670.0,304.0 L 620.9,302.9 L 569.0,303.7 L 519.8,304.9 L 468.8,305.1 L 419.5,305.1 L 370.0,304.0 L 370.0,304.0 L 370.4,282.5 L 369.2,263.8 L 369.4,241.5 L 370.6,220.9 L 371.1,199.8 L 370.0,180.0" fill="#eef3f7" stroke="#6b6357" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="520" y="204" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="13.5" fill="#4a7fa5" text-anchor="middle" opacity="1.0" font-weight="bold">Pattern 1 恒等消除</text><text x="520" y="232" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.8" fill="#3b352d" text-anchor="middle" opacity="1.0" font-weight="bold">Reshape(x, shape(x)) → x</text><text x="520" y="260" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10" fill="#84796a" text-anchor="middle" opacity="1.0" font-weight="normal">链尾 == 输入形状；无需唯一使用者</text><text x="520" y="286" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10" fill="#84796a" text-anchor="middle" opacity="1.0" font-weight="normal">P1 是 P2 合成恒等的特例（同昨天）</text><path d="M 319.0,242.0 L 333.6,241.9 L 344.8,242.3 L 357.3,242.0 L 371.1,242.0" fill="none" stroke="#6b6357" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><path d="M 370.0,242.0 L 359.0,238.0" fill="none" stroke=