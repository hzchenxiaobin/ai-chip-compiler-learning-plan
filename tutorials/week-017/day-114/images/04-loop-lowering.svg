<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive">
<path d="M 3.2,2.7 Q 598.9,1.0 1196.5,3.2 Q 1197.9,338.3 1196.4,669.9 Q 600.3,669.0 5.5,671.6 Q 6.5,338.9 3.2,2.7  Z" stroke="#E7DFCE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="#FDFBF6" fill-opacity="1.0"/>
<text x="600.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="17.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">C1 模式：一条 scf.for 拆成四块——头块参数导出后是 phi，P3 断线点在体块的 fadd</text>
<path d="M 390.8,45.5 Q 599.8,42.6 809.4,44.6" stroke="#E8A87C" stroke-width="3" stroke-linecap="round" fill="none"/>
<path d="M 45.2,56.8 Q 222.5,55.7 401.3,56.4 Q 402.3,170.8 399.1,281.4 Q 220.3,279.5 45.0,281.2 Q 43.5,169.7 45.2,56.8  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.42"/>
<text x="56" y="76" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="start" font-weight="bold">源：k 循环（三层中最里层，loop_ir.mlir）</text>
<text x="56" y="94" font-family="'Courier New',monospace" font-size="9.3" fill="#3B3B3B" text-anchor="start">%acc = scf.for %k = %c0 to %cK step %c1</text>
<text x="56" y="108" font-family="'Courier New',monospace" font-size="9.3" fill="#3B3B3B" text-anchor="start">        iter_args(%acc = %zero) -&gt; (f32) {</text>
<text x="56" y="122" font-family="'Courier New',monospace" font-size="9.3" fill="#3B3B3B" text-anchor="start">  %xa = memref.load %a[%i, %k]</text>
<text x="56" y="136" font-family="'Courier New',monospace" font-size="9.3" fill="#3B3B3B" text-anchor="start">  %xb = memref.load %b[%k, %j]</text>
<text x="56" y="150" font-family="'Courier New',monospace" font-size="9.3" fill="#3B3B3B" text-anchor="start">  %p  = arith.mulf %xa, %xb : f32</text>
<text x="56" y="164" font-family="'Courier New',monospace" font-size="9.3" fill="#3B3B3B" text-anchor="start">  %s  = arith.addf %acc, %p : f32</text>
<text x="56" y="178" font-family="'Courier New',monospace" font-size="9.3" fill="#3B3B3B" text-anchor="start">  scf.yield %s : f32</text>
<text x="56" y="192" font-family="'Courier New',monospace" font-size="9.3" fill="#3B3B3B" text-anchor="start">}</text>
<text x="56" y="214" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="start">体内 5 个 op：2×load ＋ mulf ＋ addf ＋ yield；</text>
<text x="56" y="232" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="start">iter_args 初值 %zero，循环结果是 %acc</text>
<path d="M 43.2,294.9 Q 220.9,294.9 400.1,297.5 Q 398.2,337.4 399.9,378.7 Q 220.2,377.7 42.8,379.4 Q 41.2,337.4 43.2,294.9  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.42"/>
<text x="56" y="316" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="start" font-weight="bold">翻译手册的 C1 行（排期 D117）</text>
<text x="56" y="336" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.6" fill="#3B3B3B" text-anchor="start">llvm.br ＋ 块参数 ＋ llvm.icmp ＋ llvm.cond_br</text>
<text x="56" y="354" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.6" fill="#3B3B3B" text-anchor="start">＋ 回边传值；scf.yield 折叠进回边——目标形态里没有 yield</text>
<path d="M 44.8,395.5 Q 219.8,395.6 398.7,395.8 Q 396.6,418.7 398.6,442.8 Q 223.1,445.6 43.2,445.3 Q 43.9,419.4 44.8,395.5  Z" stroke="#E7DFCE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#FDFBF6" fill-opacity="1.0"/>
<text x="56" y="414" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.3" fill="#6b6257" text-anchor="start">图中的块名、块参数与指令逐字出自</text>
<text x="56" y="430" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.3" fill="#6b6257" text-anchor="start">outputs/llvm-dialect-target.mlir 与 gemm.ll</text>
<path d="M 689.2,56.1 Q 829.6,55.3 969.8,55.2 Q 967.5,96.2 968.5,132.9 Q 829.8,131.3 691.6,133.5 Q 692.5,95.5 689.2,56.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.42"/>
<text x="830" y="76" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">前置块 ^j_body（进循环前的块）</text>
<text x="830" y="98" font-family="'Courier New',monospace" font-size="9" fill="#3B3B3B" text-anchor="middle">llvm.br ^k_hdr(%c0 : i64, %zero : f32)</text>
<text x="830" y="118" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.3" fill="#6b6257" text-anchor="middle">带两份初值：下界 0 与 iter_args 初值 %zero</text>
<path d="M 660.8,168.1 Q 827.0,168.9 989.1,169.0 Q 988.2,232.0 990.8,292.0 Q 827.7,292.9 661.4,291.0 Q 660.8,230.0 660.8,168.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.5"/>
<text x="825" y="188" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">头块 ^k_hdr(%k : i64, %acc_h : f32)</text>
<text x="825" y="206" font-family="'Courier New',monospace" font-size="8.8" fill="#3B3B3B" text-anchor="middle">%cmp_k = llvm.icmp "slt" %k, %cK : i64</text>
<text x="825" y="219" font-family="'Courier New',monospace" font-size="8.8" fill="#3B3B3B" text-anchor="middle">llvm.cond_br %cmp_k, ^k_body,</text>
<text x="825" y="232" font-family="'Courier New',monospace" font-size="8.8" fill="#3B3B3B" text-anchor="middle">                ^k_done(%acc_h : f32)</text>
<text x="825" y="254" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.3" fill="#3B3B3B" text-anchor="middle">块参数＝“活着”的归纳变量与 iter_args</text>
<text x="825" y="272" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.3" fill="#6b6257" text-anchor="middle">（导出后每个块参数变一条 phi）</text>
<path d="M 440.3,330.7 Q 595.8,329.8 749.7,328.8 Q 748.2,387.7 749.5,443.5 Q 592.0,441.1 438.5,443.0 Q 440.1,388.6 440.3,330.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.42"/>
<text x="595" y="348" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">体块 ^k_body</text>
<text x="595" y="366" font-family="'Courier New',monospace" font-size="8.8" fill="#3B3B3B" text-anchor="middle">…%xa、%xb = 2 × llvm.load（各 10 条 op）…</text>
<text x="595" y="379" font-family="'Courier New',monospace" font-size="8.8" fill="#3B3B3B" text-anchor="middle">%s  = llvm.fadd %acc_h, %p : f32</text>
<text x="595" y="392" font-family="'Courier New',monospace" font-size="8.8" fill="#3B3B3B" text-anchor="middle">%kn = llvm.add %k, %c1 : i64</text>
<text x="595" y="405" font-family="'Courier New',monospace" font-size="8.8" fill="#3B3B3B" text-anchor="middle">llvm.br ^k_hdr(%kn, %s)</text>
<path d="M 504.8,382.7 Q 596.8,384.2 686.4,384.0" stroke="#9CBF8E" stroke-width="1.8" stroke-linecap="round" fill="none"/>
<path d="M 789.0,331.2 Q 934.0,333.2 1080.8,331.5 Q 1081.6,389.4 1079.6,443.8 Q 936.0,444.2 790.2,443.4 Q 787.6,388.7 789.0,331.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.42"/>
<text x="935" y="348" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">出口块 ^k_done(%acc : f32)</text>
<text x="935" y="366" font-family="'Courier New',monospace" font-size="8.8" fill="#3B3B3B" text-anchor="middle">…M2 地址计算（9 条 op）…</text>
<text x="935" y="379" font-family="'Courier New',monospace" font-size="8.8" fill="#3B3B3B" text-anchor="middle">llvm.store %acc, %c_st_ptr</text>
<text x="935" y="398" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.3" fill="#3B3B3B" text-anchor="middle">块参数 %acc 接住 iter_args 终值</text>
<text x="935" y="414" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.3" fill="#6b6257" text-anchor="middle">（cond_br 的 false 边传来的 %acc_h）；</text>
<text x="935" y="430" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.3" fill="#6b6257" text-anchor="middle">store 之后接 j 循环 latch（%jn、br ^j_hdr）</text>
<path d="M 830.5,131.0 Q 828.8,148.5 830.0,164.0 M 827.0,151.0 L 830.0,164.0 L 833.0,151.0" stroke="#3B3B3B" stroke-width="1.8" stroke-linecap="round" fill="none"/>
