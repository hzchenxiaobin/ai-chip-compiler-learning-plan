<text x="612" y="308" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.3" fill="#3B3B3B" text-anchor="end">true：%k、%acc_h 活着进来</text>
<text x="952" y="312" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.3" fill="#3B3B3B" text-anchor="start">false：传 %acc_h</text>
<text x="790" y="316" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.3" fill="#3B3B3B" text-anchor="start">回边：传新值 %kn、%s</text>
<path d="M 43.9,471.4 Q 324.8,473.3 603.2,470.9 Q 605.5,524.8 603.9,575.5 Q 322.3,574.4 42.6,573.0 Q 41.1,522.1 43.9,471.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.35"/>
<text x="56" y="490" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="start" font-weight="bold">导出 LLVM IR 后（D113 规则 R3）：头块参数变 phi——gemm.ll 的真实两行</text>
<text x="56" y="512" font-family="'Courier New',monospace" font-size="9.3" fill="#3B3B3B" text-anchor="start">%k     = phi i64   [ 0, %j_body ], [ %kn, %k_body ]</text>
<text x="56" y="526" font-family="'Courier New',monospace" font-size="9.3" fill="#3B3B3B" text-anchor="start">%acc_h = phi float [ 0.000000e+00, %j_body ], [ %s, %k_body ]</text>
<text x="56" y="550" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.3" fill="#6b6257" text-anchor="start">每条 phi 的入边记录：一条来自前置块（初值）、一条来自回边（新值）</text>
<path d="M 630.0,468.7 Q 894.5,468.8 1155.0,471.2 Q 1156.0,521.0 1156.1,574.5 Q 892.5,574.4 631.1,575.4 Q 628.5,520.4 630.0,468.7  Z" stroke="#C97B7B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.35" stroke-dasharray="7 5"/>
<text x="642" y="490" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="start" font-weight="bold">P3 探针断线点（红虚线箭头指向体块的 fadd 行）</text>
<text x="642" y="512" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.6" fill="#3B3B3B" text-anchor="start">fadd 第一个操作数应为头块参数 %acc_h；P3 接回初值 %zero——</text>
<text x="642" y="530" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.6" fill="#3B3B3B" text-anchor="start">phi 照转但没人消费：每个 (i,j) 只剩最后一项乘积</text>
<text x="642" y="552" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.6" fill="#C97B7B" text-anchor="start">（实测 max|diff| = 191.1975，被 TP5 逐位比对咬住）</text>
<path d="M 661.6,464.9 Q 678.6,428.3 694.0,388.0 M 691.8,401.2 L 694.0,388.0 L 686.3,398.9" stroke="#C97B7B" stroke-width="1.8" stroke-linecap="round" fill="none" stroke-dasharray="6 5"/>
<text x="600" y="600" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.3" fill="#3B3B3B" text-anchor="middle">C1 的“新东西”是控制流和 phi——数值计算一条不少地来自 body；出口块接住 iter_args 终值后把控制权交回 j 循环 latch</text>
<text x="600" y="624" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">数据出处：llvm-dialect-target.mlir（块与块参数）· gemm.ll（phi 行）· conversion-report.txt（P3 实测 191.1975）——对应正文 §4 第 3 步与 §6 的 P3 排查</text>
</svg>
