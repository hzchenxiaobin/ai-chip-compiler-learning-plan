<text x="885" y="238" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">8:</text>
<text x="885" y="256" font-family="'Courier New',monospace" font-size="8.5" fill="#3B3B3B" text-anchor="middle">%9 = sub i32 %4, %3</text>
<text x="885" y="272" font-family="'Courier New',monospace" font-size="8.5" fill="#3B3B3B" text-anchor="middle">br label %10</text>
<path d="M 605.0,349.5 Q 758.6,349.8 913.8,349.5 Q 916.2,398.5 915.8,444.7 Q 761.2,444.1 605.9,447.2 Q 603.7,397.4 605.0,349.5  Z" stroke="#3B3B3B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="#FDFBF6" fill-opacity="1.0"/>
<text x="760" y="370" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">10:——块首第一条指令就是 phi</text>
<path d="M 626.6,379.2 Q 762.1,382.2 896.2,381.4 Q 896.4,402.2 896.3,424.7 Q 759.3,423.2 624.0,423.6 Q 626.7,399.9 626.6,379.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.6"/>
<text x="760" y="397" font-family="'Courier New',monospace" font-size="8.8" fill="#3B3B3B" text-anchor="middle">%11 = phi i32 [ %7, %6 ], [ %9, %8 ]</text>
<text x="760" y="415" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.5" fill="#3B3B3B" text-anchor="middle">对账单：前驱 6 送 %7；前驱 8 送 %9</text>
<text x="760" y="438" font-family="'Courier New',monospace" font-size="8.5" fill="#3B3B3B" text-anchor="middle">ret i32 %11</text>
<text x="760" y="340" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#6b6257" text-anchor="middle">边上不带值（br label %10）</text>
<text x="760" y="462" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">责任集中在一条指令：Verifier 检查 phi 恰好覆盖每个前驱各一条</text>
<text x="760" y="478" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9" fill="#6b6257" text-anchor="middle">（谁漏了一目了然——对账单集中一处）</text>
<path d="M 60.0,511.1 Q 509.4,510.4 960.7,509.7 Q 960.0,541.8 960.6,576.4 Q 510.8,577.8 61.0,575.6 Q 60.6,541.2 60.0,511.1  Z" stroke="#3B3B3B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.35"/>
<text x="510" y="534" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">同一份数据流、两种记账位置：MLIR 把值挂在边上（跳转时递），LLVM 把对账单贴在汇合块块首</text>
<text x="510" y="556" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">这就是 14 − 4 ＋ 1 = 11 里那个 "+1"——phi 是导出时新生的指令，MLIR 侧没有对应 op</text>
<text x="510" y="600" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.6" fill="#6b6257" text-anchor="middle">数据来自 step.mlir 与 outputs/step.ll（2026-11-13 冻结运行）</text>
