<text x="260" y="394" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">进门即得 %m（收礼口在块门口）</text>
<text x="260" y="414" font-family="'Courier New',monospace" font-size="8.5" fill="#3B3B3B" text-anchor="middle">llvm.return %m : i32</text>
<text x="138" y="198" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">真</text>
<text x="402" y="198" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">假</text>
