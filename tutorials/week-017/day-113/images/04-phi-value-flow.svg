<text x="760" y="130" font-family="'Courier New',monospace" font-size="9" fill="#3B3B3B" text-anchor="middle">%5 = icmp sgt i32 %4, %3</text>
<text x="760" y="148" font-family="'Courier New',monospace" font-size="9" fill="#3B3B3B" text-anchor="middle">br i1 %5, label %6, label %8</text>
