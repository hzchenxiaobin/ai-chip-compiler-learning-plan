<text x="655" y="256" font-family="'Courier New',monospace" font-size="8.5" fill="#3B3B3B" text-anchor="middle">%7 = add i32 %4, %3</text>
<text x="655" y="272" font-family="'Courier New',monospace" font-size="8.5" fill="#3B3B3B" text-anchor="middle">br label %10</text>
