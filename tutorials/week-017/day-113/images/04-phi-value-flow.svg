<path d="M 555.0,92.6 Q 762.4,92.0 966.3,93.2 Q 967.8,133.1 965.2,171.4 Q 761.7,170.3 555.3,171.3 Q 556.2,132.7 555.0,92.6  Z" stroke="#3B3B3B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="#FDFBF6" fill-opacity="1.0"/>
