<text x="260" y="462" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">责任分散在每个前驱：Verifier 检查每条跳转都传了值</text>
