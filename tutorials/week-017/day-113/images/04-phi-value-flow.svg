<path d="M 54.4,90.6 Q 257.4,90.2 464.8,92.8 Q 463.2,132.1 464.5,169.9 Q 261.0,167.7 54.3,169.3 Q 56.4,132.0 54.4,90.6  Z" stroke="#3B3B3B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="#FDFBF6" fill-opacity="1.0"/>
<text x="260" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">^entry（隐式入口块）</text>
<text x="260" y="130" font-family="'Courier New',monospace" font-size="9" fill="#3B3B3B" text-anchor="middle">%cond = llvm.icmp "sgt" %z, %s20 : i32</text>
<text x="260" y="148" font-family="'Courier New',monospace" font-size="9" fill="#3B3B3B" text-anchor="middle">llvm.cond_br %cond, ^hi, ^lo</text>
<path d="M 60.0,215.6 Q 157.2,213.8 250.6,215.1 Q 250.5,249.1 249.4,281.2 Q 154.8,282.1 60.8,281.2 Q 60.9,246.5 60.0,215.6  Z" stroke="#3B3B3B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="#FDFBF6" fill-opacity="1.0"/>
<text x="155" y="238" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">^hi</text>
<text x="155" y="256" font-family="'Courier New',monospace" font-size="8.5" fill="#3B3B3B" text-anchor="middle">%x1 = llvm.add %z, %s20</text>
<text x="155" y="272" font-family="'Courier New',monospace" font-size="8.5" fill="#3B3B3B" text-anchor="middle">llvm.br ^merge(%x1 : i32)</text>
<path d="M 288.8,214.5 Q 386.4,216.8 480.7,216.2 Q 482.6,245.7 480.3,278.4 Q 386.0,281.7 291.4,280.8 Q 289.3,249.4 288.8,214.5  Z" stroke="#3B3B3B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="#FDFBF6" fill-opacity="1.0"/>
<text x="385" y="238" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle" font-weight="bold">^lo</text>
<text x="385" y="256" font-family="'Courier New',monospace" font-size="8.5" fill="#3B3B3B" text-anchor="middle">%x2 = llvm.sub %z, %s20</text>
<text x="385" y="272" font-family="'Courier New',monospace" font-size="8.5" fill="#3B3B3B" text-anchor="middle">llvm.br ^merge(%x2 : i32)</text>
<path d="M 105.5,351.5 Q 257.4,352.0 413.4,350.3 Q 412.9,392.8 415.8,437.7 Q 262.1,436.0 105.9,437.6 Q 105.0,396.0 105.5,351.5  Z" stroke="#3B3B3B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="#FDFBF6" fill-opacity="1.0"/>
