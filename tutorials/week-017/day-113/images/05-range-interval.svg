<text x="705" y="250" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">a=21 → 41（左端，最小）</text>
<text x="100" y="226" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.5" fill="#6b6257" text-anchor="middle"></text>
<text x="100" y="272" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#6b6257" text-anchor="middle">−2³¹</text>
