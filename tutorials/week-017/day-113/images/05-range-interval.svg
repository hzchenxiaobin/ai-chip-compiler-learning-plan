<text x="510" y="330" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">LLVM 不写两段，写成一个回绕区间：range(i32 41, 1)</text>
<text x="510" y="354" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">读法：[a, b) 且 a ≥ b 表示回绕——从 41 向右取到 +2³¹−1，绕回 −2³¹ 继续，到 0 为止（1 是开区间端点，不含）</text>
<text x="435" y="376" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#3B3B3B" text-anchor="middle">41 → 一路向右 → 绕回 → 0</text>
<text x="510" y="412" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.8" fill="#6b6257" text-anchor="middle">（LangRef：The pair a,b represents the range [a,b). The range is allowed to wrap.）</text>
<path d="M 60.3,441.5 Q 512.2,442.8 961.6,443.5 Q 961.3,491.0 958.8,535.1 Q 510.2,534.0 61.0,532.7 Q 61.2,487.4 60.3,441.5  Z" stroke="#3B3B3B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.3"/>
<text x="510" y="466" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">为什么两端也安全：a 接近 +2³¹ 时 a+20 回绕成负数、a 接近 −2³¹ 时 a−20 回绕成正数——</text>
<text x="510" y="486" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">落点分别落在对面那段绿色区间里，值域并集不变</text>
<text x="510" y="510" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle" font-weight="bold">练习 1 的两个端点：41 ← a=21；0 ← a=20（1..40 永不出现）</text>
<text x="510" y="556" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="8.6" fill="#6b6257" text-anchor="middle">数据来自 outputs/opt_after_step.ll 的 define range(i32 41, 1) i32 @step（2026-11-13 冻结运行）</text>
</svg>
