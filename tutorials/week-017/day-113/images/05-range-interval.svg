<text x="510" y="96" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">返回值只可能落在下面两段绿色区间——红色段 1..40 没有任何输入能命中</text>
