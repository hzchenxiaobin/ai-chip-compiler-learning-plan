<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760"><rect x="4" y="4" width="1072" height="752" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="38" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">运行库符号：@malloc 在四条路线上的解析路径与失败时机</text><text x="540.0" y="60" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#6b6257" text-anchor="middle">IR 只声明、宿主提供——链接器 / 加载器 / JIT 引擎的硬合同（对应 3.2 节）</text><path d="M 300.0,75.2 Q 538.3,74.3 778.5,75.9 Q 778.2,112.1 778.7,148.8 Q 541.4,148.2 300.7,147.8 Q 300.1,111.9 300.0,75.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#E8A87C" fill-opacity="0.5"/><text x="540" y="102" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">gemm-3.ll 的外部依赖（第一笔运行库符号）</text><text x="540" y="124" font-family="'Courier New',monospace" font-size="12" fill="#3B3B3B" text-anchor="middle">declare ptr @malloc(i64)</text><text x="540" y="142" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">只有声明、没有定义——kernel 假设运行环境会提供它</text><path d="M 429.3,150.5 Q 365.4,171.6 300.0,190.0 M 312.3,184.0 L 300.0,190.0 L 313.6,188.1" stroke="#3B3B3B" stroke-width="1.8" stroke-linecap="round" fill="none"/><text x="340" y="158" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">AOT：离线履约</text><path d="M 650.7,150.3 Q 713.5,168.6 780.0,190.0 M 766.4,188.1 L 780.0,190.0 L 767.7,184.0" stroke="#3B3B3B" stroke-width="1.8" stroke-linecap="round" fill="none"/><text x="740" y="158" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">JIT：在线履约</text><path d="M 59.2,171.4 Q 288.8,170.3 519.1,172.1 Q 520.4,187.1 520.3,206.0 Q 291.7,204.4 60.4,206.7 Q 60.1,186.9 59.2,171.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.6"/><text x="290" y="194" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">AOT（离线）：链接器 / 加载器履约</text><path d="M 69.3,215.3 Q 289.4,217.3 511.2,216.1 Q 511.3,273.4 511.5,331.5 Q 292.3,331.1 71.4,332.9 Q 71.4,275.0 69.3,215.3  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.32"/><text x="290" y="238" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">路线 1 AOT-静态：clang gemm-3.ll driver.c</text><text x="290" y="258" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">链接期：链接器把 @malloc 解析绑定到 libc</text><text x="290" y="278" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#C97B7B" text-anchor="middle" font-weight="bold">缺符号 → 链接期报 undefined symbol</text><text x="290" y="298" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">（编译期错误，上线前暴露——友好）</text><path d="M 68.5,345.1 Q 289.6,343.9 509.5,345.0 Q 509.3,409.7 508.7,476.3 Q 289.3,475.6 71.0,475.1 Q 68.2,408.6 68.5,345.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#A9C4D4" fill-opacity="0.32"/><text x="290" y="366" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">路线 2 AOT-共享库：llc → .o → dylib / .so</text><text x="290" y="386" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">macOS：-undefined dynamic_lookup</text><text x="290" y="404" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">（符号推迟到加载期解析，dlopen 语义）</text><text x="290" y="424" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">Linux：-shared 默认允许未解析符号</text><text x="290" y="442" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">→ 加载期再绑定（两个 OS 两种履约时刻）</text><text x="290" y="464" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">ctypes.CDLL 加载后按合同调用 12/12</text><path d="M 561.3,173.2 Q 788.9,172.6 1020.0,173.5 Q 1018.4,188.9 1018.9,204.5 Q 787.9,206.2 561.1,206.0 Q 562.4,189.8 561.3,173.2  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.6"/><text x="790" y="194" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">JIT（在线）：引擎回调宿主进程符号履约</text><path d="M 569.4,214.7 Q 791.0,213.0 1009.1,215.4 Q 1008.5,282.1 1009.8,344.6 Q 790.8,344.6 571.5,345.9 Q 570.3,279.5 569.4,214.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#9CBF8E" fill-opacity="0.32"/><text x="790" y="238" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">路线 3 lli ／ 路线 4 MCJIT 驱动</text><text x="790" y="258" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">运行期 parse → 编译到内存 → 查符号 → 调用</text><text x="790" y="278" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">JIT 引擎把 @malloc 解析到本进程的 libc</text><text x="790" y="298" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">getFunctionAddress 返回非零地址（实测）</text><text x="790" y="318" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">——与 AOT 可执行文件里的符号地址语义等价</text><text x="790" y="338" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">（本节当天实测证据：路线 4 履约成功）</text><path d="M 569.6,358.7 Q 792.1,357.2 1010.5,359.2 Q 1009.4,417.4 1010.2,476.5 Q 789.6,476.6 568.5,476.0 Q 568.9,418.7 569.6,358.7  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#C97B7B" fill-opacity="0.25"/><text x="790" y="380" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">JIT 侧缺符号的失败形态</text><text x="790" y="400" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">getFunctionAddress 拿到 0（符号未登记）</text><text x="790" y="420" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">或调用时崩溃（依赖符号解析不到）</text><text x="790" y="440" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">（运行期错误——晚，但定位也不难）</text><text x="790" y="462" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#6b6257" text-anchor="middle">报错时刻晚于 AOT 的链接期一步</text><path d="M 58.6,494.1 Q 537.4,493.5 1019.4,495.3 Q 1020.6,569.0 1021.4,643.8 Q 541.4,643.3 59.1,644.0 Q 59.4,569.4 58.6,494.1  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.8"/><path d="M 81.5,494.7 Q 537.9,493.4 1000.8,493.9" stroke="#6b6257" stroke-width="1.2" stroke-linecap="round" fill="none"/><text x="540" y="520" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="12.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">失败时机对照：同一份合同、两种报错时刻</text><text x="540" y="546" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle">AOT：符号缺失在编译 / 链接期报错（undefined symbol）——早暴露、信息友好</text><text x="540" y="570" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle">JIT：符号缺失到 getFunctionAddress 拿 0 或调用时才崩——晚一步，但堆栈就在现场</text><text x="540" y="594" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle">macOS 与 Linux 对路线 2 是两种履约时刻（链接期 vs 加载期）——错误 3 的活案例</text><path d="M 121.5,606.5 Q 538.4,607.9 959.6,607.2" stroke="#E7DFCE" stroke-width="1.2" stroke-linecap="round" fill="none"/><text x="540" y="630" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">运行库符号家族不止 malloc：printf（调试 dump）、memcpy（批量搬运）、</text><text x="540" y="648" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#6b6257" text-anchor="middle">乃至自定义 rt.alloc / rt.launch——D127 Runtime 职责划分的主角</text><text x="540" y="690" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11" fill="#3B3B3B" text-anchor="middle">一份 .ll，四条路线，同一份合同——谁提供 malloc，谁就在履约</text></svg>
