<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" font-family="Bradley Hand, Comic Sans MS, Segoe Print, Kaiti SC, KaiTi, cursive">
  <defs>
    <filter id="wob" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wob2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wob3" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arr" viewBox="0 0 12 12" refX="9.5" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 2 C5 1.5, 9 4, 10 6 C9 8, 5 10.5, 2 10 C4 8, 4 4, 2 2 Z" fill="#2F2B27"/>
    </marker>
    <marker id="arrO" viewBox="0 0 12 12" refX="9.5" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 2 C5 1.5, 9 4, 10 6 C9 8, 5 10.5, 2 10 C4 8, 4 4, 2 2 Z" fill="#D79B00"/>
    </marker>
    <style>
      .bg { fill:#FBF9F3; }
      .t-title { font-size:21px; fill:#2F2B27; font-weight:bold; }
      .t-h { font-size:15px; fill:#2F2B27; font-weight:bold; }
      .t-b { font-size:12.5px; fill:#2F2B27; }
      .t-s { font-size:11px; fill:#5A544C; }
      .code { font-family:Consolas, Menlo, Courier New, monospace; fill:#1F3B57; }
      .codec { font-family:Consolas, Menlo, Courier New, monospace; fill:#B85450; }
      .codeg { font-family:Consolas, Menlo, Courier New, monospace; fill:#4A7A42; }
      .box { fill:#FFFFFF; stroke:#2F2B27; stroke-width:2.2; stroke-linejoin:round; }
      .bbox { fill:#DAE8FC; stroke:#5B8DB8; stroke-width:2.4; stroke-linejoin:round; }
      .obox { fill:#FFE6CC; stroke:#D79B00; stroke-width:3; stroke-linejoin:round; }
      .gbox { fill:#D5E8D4; stroke:#82B366; stroke-width:2.4; stroke-linejoin:round; }
      .rbox { fill:#F8CECC; stroke:#B85450; stroke-width:2.4; stroke-linejoin:round; }
      .arrow { stroke:#2F2B27; stroke-width:2.2; fill:none; stroke-linecap:round; marker-end:url(#arr); }
      .arrowB { stroke:#5B8DB8; stroke-width:2.4; fill:none; stroke-linecap:round; marker-end:url(#arr); }
      .arrowR { stroke:#B85450; stroke-width:2.4; fill:none; stroke-linecap:round; marker-end:url(#arr); }
      .arrowG { stroke:#82B366; stroke-width:2.4; fill:none; stroke-linecap:round; marker-end:url(#arr); }
      .arrowO { stroke:#D79B00; stroke-width:2.6; fill:none; stroke-linecap:round; marker-end:url(#arrO); }
      .dash { stroke:#8A8378; stroke-width:1.8; fill:none; stroke-dasharray:6 5; stroke-linecap:round; }
      .chip { fill:#FFFFFF; stroke:#2F2B27; stroke-width:1.8; stroke-linejoin:round; }
    </style>
  </defs>
  <rect class="bg" width="1000" height="690"/>
  <text class="t-title" x="30" y="42">matchAndRewrite 两步：顺着边看一步（匹配），改掉所有的边（重写）</text>
  <text class="t-s" x="975" y="66" text-anchor="end">贯穿例子 multi_user：外层结果有 2 个使用者，替换必须两边都改</text>
  <g filter="url(#wob)"><rect class="box" x="28" y="96" width="330" height="250" rx="12" transform="rotate(-0.4 193.0 221.0)"/></g>
  <text class="t-h" x="48" y="124">BEFORE</text>
  <text class="code" x="48" y="150" font-size="12.5">%r1 = mini.relu %arg0</text>
  <text class="codec" x="48" y="174" font-size="12.5">%r2 = mini.relu %r1</text>
  <text class="t-s" x="300" y="174" text-anchor="end">← outer（根节点）</text>
  <text class="code" x="48" y="198" font-size="12.5">%s  = mini.add %r2, %arg1</text>
  <text class="code" x="48" y="222" font-size="12.5">return %r2, %s</text>
  <path class="arrowR" d="M238 168 Q248.0 181.0 238 194"/>
  <path class="arrowR" d="M258 168 Q248.0 193.0 258 218"/>
  <text class="codec" x="300" y="208" text-anchor="end">%r2 的两条边</text>
  <text class="codec" x="300" y="224" text-anchor="end">（add + return）</text>
  <text class="t-s" x="48" y="262">驱动把每个 mini.relu 依次递给 Pattern</text>
  <text class="t-s" x="48" y="280">（包括最内层那个——输入是块参数）</text>
  <g filter="url(#wob2)"><rect class="obox" x="388" y="96" width="250" height="250" rx="12" transform="rotate(0.4 513.0 221.0)"/></g>
  <text class="t-h" x="408" y="124">matchAndRewrite(outer)</text>
  <text class="t-b" x="408" y="150">① 匹配：顺边看一步</text>
  <text class="code" x="408" y="170" font-size="11">outer.getInput()</text>
  <text class="code" x="408" y="186" font-size="11">  .getDefiningOp&amp;lt;ReluOp&amp;gt;()</text>
  <text class="t-s" x="408" y="206">是 mini.relu？→ inner</text>
  <text class="t-s" x="408" y="222">块参数 / 别的算子？→ failure()</text>
  <text class="t-b" x="408" y="250">② 重写：只动边，不动值</text>
  <text class="code" x="408" y="270" font-size="11">rewriter.replaceAllUsesWith</text>
  <text class="code" x="408" y="286" font-size="11">  (%r2 → %r1)   改边</text>
  <text class="code" x="408" y="306" font-size="11">rewriter.eraseOp(outer)  摘除</text>
  <text class="t-s" x="408" y="330">SSA 值不可改写：替换 = 改使用者</text>
  <g filter="url(#wob3)"><rect class="gbox" x="668" y="96" width="304" height="250" rx="12" transform="rotate(-0.3 820.0 221.0)"/></g>
  <text class="t-h" x="688" y="124">AFTER</text>
  <text class="codeg" x="688" y="150" font-size="12.5">%r1 = mini.relu %arg0</text>
  <text class="t-s" x="950" y="150" text-anchor="end">← 内层原样保留</text>
  <text class="code" x="688" y="174" font-size="12.5">%s  = mini.add %r1, %arg1</text>
  <text class="code" x="688" y="198" font-size="12.5">return %r1, %s</text>
  <path class="arrowG" d="M880 160 Q886.0 165.0 880 170"/>
  <path class="arrowG" d="M898 160 Q892.0 177.0 898 194"/>
  <text class="codeg" x="950" y="208" text-anchor="end">两条边都改指 %r1</text>
  <text class="t-s" x="688" y="236">外层 %r2 连定义者一起消失；</text>
  <text class="t-s" x="688" y="254">少一次逐元素 max(0,·)，值一个不变</text>
  <text class="t-s" x="688" y="280">（max(0,max(0,x)) == max(0,x)）</text>
  <path class="arrowO" d="M360 220 Q372.0 226.0 384 220"/>
  <path class="arrowO" d="M640 220 Q652.0 226.0 664 220"/>
  <g filter="url(#wob)"><rect class="box" x="28" y="396" width="944" height="258" rx="12" transform="rotate(0.25 500.0 525.0)"/></g>
  <text class="t-h" x="52" y="424">驱动：贪婪工作表，迭代到不动点（triple_relu 实测：3 层 → 1 层，剥了两轮）</text>
  <g filter="url(#wob3)"><rect class="chip" x="52" y="444" width="150" height="64" rx="10" transform="rotate(0.5 127.0 476.0)"/></g>
  <text class="t-b" x="127" y="470" text-anchor="middle">取一个 op</text>
  <g filter="url(#wob3)"><rect class="chip" x="232" y="444" width="150" height="64" rx="10" transform="rotate(-0.5 307.0 476.0)"/></g>
  <text class="t-b" x="307" y="470" text-anchor="middle">试它的 Pattern</text>
  <g filter="url(#wob3)"><rect class="chip" x="412" y="444" width="150" height="64" rx="10" transform="rotate(0.5 487.0 476.0)"/></g>
  <text class="t-b" x="487" y="470" text-anchor="middle">success？</text>
  <g filter="url(#wob3)"><rect class="chip" x="592" y="444" width="150" height="64" rx="10" transform="rotate(-0.5 667.0 476.0)"/></g>
  <text class="t-b" x="667" y="470" text-anchor="middle">受影响的 op</text>
  <text class="t-b" x="667" y="487" text-anchor="middle">重新排队</text>
  <g filter="url(#wob3)"><rect class="chip" x="772" y="444" width="150" height="64" rx="10" transform="rotate(0.5 847.0 476.0)"/></g>
  <text class="t-b" x="847" y="470" text-anchor="middle">队列空 =</text>
  <text class="t-b" x="847" y="487" text-anchor="middle">不动点，收工</text>
  <path class="arrow" d="M204 476 Q217.0 482.0 230 476"/>
  <path class="arrow" d="M384 476 Q397.0 482.0 410 476"/>
  <path class="arrow" d="M564 476 Q577.0 482.0 590 476"/>
  <path class="arrow" d="M744 476 Q757.0 482.0 770 476"/>
  <text class="t-s" x="397" y="470" text-anchor="middle">success</text>
  <path class="arrow" d="M667 514 C667 540, 127 540, 127 514"/>
  <text class="t-s" x="52" y="544">failure → 原样放回，试下一个</text>
  <text class="t-s" x="500" y="560" text-anchor="middle">重新排队后回到「取一个 op」</text>
  <text class="t-b" x="52" y="588">triple_relu 走了两轮：第一轮剥掉最外层 → 新暴露的外层重新排队 → 第二轮再剥一层 → 只剩 1 层，再也匹配不上。</text>
  <text class="t-s" x="52" y="612">驱动在匹配之前还会先做 folding 和简单 DCE（头文件原文）——无使用者的纯算子被白送删掉，dead_op_after_rewrite 探针实测验证。</text>
  <text class="t-s" x="52" y="636">三条铁律：改 IR 必须走 rewriter；空指针必须 return failure()；擦除前必须先改完所有边。</text>
</svg>
