<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700"><rect x="3" y="3" width="1194" height="694" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="30" y="44" text-anchor="start" font-size="25" fill="#3b3b3b">补讲 2（量化）：非 2 幂 scale 的半格分叉——golden「无缘无故」差一个码的解剖</text><text x="30" y="72" text-anchor="start" font-size="15" fill="#6b6459">实弹数据：s = 0.7/127 = 0.005512，w = 0.0082677165…（定向扫描第一发）</text><path d="M 30.3,84.0 Q 600.8,84.3 1170.8,83.0" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M 39.7,106.9 Q 388.8,107.0 740.9,106.6 M 741.2,105.7 Q 741.3,281.5 739.9,457.1 M 740.9,455.8 Q 389.5,456.6 38.8,456.9 M 41.3,455.1 Q 39.8,281.1 39.6,106.6 Z" fill="white" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="138" text-anchor="start" font-size="15" fill="#3b3b3b">数轴：商 w/s（量化前除法的结果）</text><path d="M 90.5,299.7 Q 381.1,299.9 670.5,300.6" fill="none" stroke="#3b3b3b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 139.5,288.7 Q 137.2,300.0 137.5,309.1" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="138.33333333333331" y="334" text-anchor="middle" font-size="13.5" fill="#3b3b3b">码 1</text><path d="M 379.5,291.2 Q 381.2,300.1 380.0,311.0" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="379.99999999999994" y="334" text-anchor="middle" font-size="13.5" fill="#3b3b3b">半格 1.5</text><path d="M 620.6,290.5 Q 620.6,300.1 621.9,309.7" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="621.6666666666666" y="334" text-anchor="middle" font-size="13.5" fill="#3b3b3b">码 2</text><path d="M 380.9,289.6 Q 379.0,248.2 381.0,203.8" fill="none" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><path d="M 318.4,124.0 Q 377.4,123.5 437.1,124.1 M 437.0,123.9 Q 437.2,137.4 436.0,151.2 M 436.8,151.2 Q 377.0,152.6 318.6,152.9 M 317.9,152.0 Q 317.7,138.6 318.2,124.9 Z" fill="#dbe7f6" stroke="#dbe7f6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="377.2199999999999" y="144.16" text-anchor="middle" font-size="13.5" fill="#3b3b3b">fp32 商 = 1.5</text><path d="M 379.0,153.0 Q 381.1,176.3 380.2,201.0" fill="none" stroke="#5f8fcb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 379.8,200.5 Q 377.5,194.2 373.9,188.1" fill="none" stroke="#5f8fcb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 380.4,199.8 Q 383.1,193.8 386.2,188.6" fill="none" stroke="#5f8fcb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="387.99999999999994" y="234" text-anchor="start" font-size="12.5" fill="#5f8fcb">除法把商舍到了半格上</text><path d="M 380.0,288.0 Q 414.0,366.0 617.7,366.0" fill="none" stroke="#5f8fcb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 617.3,365.7 Q 612.0,368.6 606.1,372.3" fill="none" stroke="#5f8fcb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 617.3,365.7 Q 612.3,363.5 606.7,360.3" fill="none" stroke="#5f8fcb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="609.6666666666666" y="392" text-anchor="end" font-size="13" fill="#5f8fcb">round-half-even 进到码 2</text><path d="M 293.1,124.5 Q 390.3,124.7 486.9,124.3 M 487.1,124.1 Q 485.9,138.7 486.7,152.9 M 486.4,151.5 Q 389.2,151.3 292.3,152.8 M 293.5,151.8 Q 293.5,138.7 292.6,124.2 Z" fill="#fdead3" stroke="#fdead3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="389.885" y="144.16" text-anchor="middle" font-size="13.5" fill="#3b3b3b">fp64 商 = 1.4999999944</text><path d="M 341.2,153.8 Q 360.5,221.3 379.4,287.9" fill="none" stroke="#e8973f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 379.0,288.5 Q 374.9,282.6 371.2,278.3" fill="none" stroke="#e8973f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 379.8,288.3 Q 380.2,281.7 382.5,275.0" fill="none" stroke="#e8973f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="186.66666666666669" y="234" text-anchor="start" font-size="12.5" fill="#e8973f">真商在半格下方 5.6e-09</text><path d="M 379.7,288.0 Q 283.3,366.0 144.3,366.0" fill="none" stroke="#e8973f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 144.9,366.3 Q 149.9,362.6 155.8,360.0" fill="none" stroke="#e8973f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 143.6,366.4 Q 149.6,368.6 156.0,372.1" fill="none" stroke="#e8973f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="148.33333333333331" y="392" text-anchor="start" font-size="13" fill="#e8973f">退回码 1</text><path d="M 58.7,399.7 Q 390.3,399.3 722.2,399.0 M 722.5,400.0 Q 721.1,421.0 722.6,440.9 M 722.6,440.0 Q 390.7,439.7 57.3,439.7 M 57.0,439.4 Q 58.8,420.2 58.7,400.1 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="426" text-anchor="start" font-size="13.5" fill="#3b3b3b">码差 1 → 反量化值差 = 一个 scale = 0.00551（w = 0.0082677165…，s = 0.7/127）</text><text x="58" y="168" text-anchor="start" font-size="13.5" fill="#3b3b3b">同一个 w，两种精度各算各的 w/s：</text><text x="58" y="192" text-anchor="start" font-size="13" fill="#3b3b3b">随机压测 2,000,000 个权重：分叉 5 个（0.00025%——半格是道窄门）</text><text x="58" y="216" text-anchor="start" font-size="13" fill="#3b3b3b">定向扫描 k=1..127 每条半格 (k+0.5)·s 的 fp32 邻域：命中 62 个</text><text x="58" y="240" text-anchor="start" font-size="13" fill="#6b6459">→ 不是都市传说，是窄概率事件：随机测难命中，半格边上密密麻麻</text><path d="M 773.0,107.0 Q 964.9,106.3 1160.4,105.0 M 1160.3,106.1 Q 1160.1,190.7 1159.7,273.3 M 1160.0,273.3 Q 967.1,274.4 772.4,274.1 M 771.8,274.7 Q 773.1,189.9 773.1,106.7 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="788" y="136" text-anchor="start" font-size="15.5" fill="#3b3b3b">修正 A：scale 取 2 的幂</text><text x="788" y="164" text-anchor="start" font-size="13" fill="#3b3b3b">s = 2⁻⁷ = 1/128（Day 83 主图的纪律）</text><text x="788" y="190" text-anchor="start" font-size="13" fill="#3b3b3b">同一批 2,000,000 权重：随机 0 ＋ 定向 0 个分叉</text><text x="788" y="216" text-anchor="start" font-size="13" fill="#3b3b3b">除以 2 的幂是精确操作——两种精度看到</text><text x="788" y="240" text-anchor="start" font-size="13" fill="#3b3b3b">同一个商，round 永远落在同一格</text><path d="M 771.3,296.5 Q 966.4,295.7 1159.9,295.9 M 1159.7,295.9 Q 1160.5,376.2 1160.2,455.9 M 1159.5,456.4 Q 965.5,456.4 771.7,456.3 M 771.9,455.3 Q 772.0,375.2 771.9,295.0 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="788" y="326" text-anchor="start" font-size="15.5" fill="#3b3b3b">修正 B：golden 的量化同精度</text><text x="788" y="354" text-anchor="start" font-size="13" fill="#3b3b3b">参考实现也用 fp32 口径做量化：分叉 0 个</text><text x="788" y="380" text-anchor="start" font-size="13" fill="#3b3b3b">账本只记执行误差；若必须保留非 2 幂 scale，</text><text x="788" y="404" text-anchor="start" font-size="13" fill="#3b3b3b">atol 放宽一个 scale 并写明理由</text><path d="M 772.6,477.1 Q 967.0,479.1 1159.4,478.0 M 1159.0,477.3 Q 1160.8,536.6 1159.4,595.7 M 1160.9,595.5 Q 966.5,595.8 772.0,595.0 M 771.7,596.9 Q 771.2,537.1 772.7,478.7 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="788" y="508" text-anchor="start" font-size="15" fill="#3b3b3b">对照清单 D3（声明层检查）</text><text x="788" y="536" text-anchor="start" font-size="12.8" fill="#3b3b3b">5.4 节实测：scale 换 3.2/127 后 D3 立刻红；</text><text x="788" y="560" text-anchor="start" font-size="12.8" fill="#3b3b3b">D2 在 5 组输入上没踩中半格（窄门）仍绿——</text><text x="788" y="584" text-anchor="start" font-size="12.8" fill="#3b3b3b">确定性报警 > 概率性事故，不等事故发生</text><path d="M 38.9,620.5 Q 599.3,619.3 1159.7,619.7 M 1160.6,621.2 Q 1160.1,643.1 1159.1,666.8 M 1159.4,665.2 Q 599.7,665.6 39.8,667.2 M 39.5,665.2 Q 39.0,642.8 39.5,619.6 Z" fill="white" stroke="#3b3b3b" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="648" text-anchor="start" font-size="13.5" fill="#3b3b3b">结论：「无缘无故差一个码」= fp32 的除法自己制造了一个半格点——数值管理的意思是：连除法的舍入都要在账本里</text></g></svg>