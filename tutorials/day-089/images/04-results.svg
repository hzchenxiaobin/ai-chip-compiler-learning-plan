<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" width="1240" height="780"><rect x="3" y="3" width="1234" height="774" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="30" y="44" text-anchor="start" font-size="25" fill="#3b3b3b">实测结果：AT1~AT6 全 PASS，循环体有了真实数值</text><text x="30" y="70" text-anchor="start" font-size="14.5" fill="#6b6459">环境：Linux aarch64，Python 3.11.4，numpy 1.26.4；本机未安装 MLIR（DialectConversion 语义仿真）</text><path d="M 30.5,82.9 Q 619.9,81.3 1209.6,82.2" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M 61.2,100.3 Q 270.1,100.7 479.0,100.0 M 479.1,100.2 Q 479.6,263.0 479.2,426.8 M 479.9,427.8 Q 269.3,428.8 59.3,428.3 M 61.1,428.3 Q 61.1,264.4 59.4,99.6 Z" fill="white" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="126" text-anchor="start" font-size="15" fill="#3b3b3b">检查测试（全部真实运行）</text><path d="M 81,136.96611156617604 C 81,128 99,128 99,137 C 99,146 81,146 81,136.96611156617604" fill="#e5f1dc" stroke="#79b26a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="142" text-anchor="middle" font-size="12" fill="#79b26a">✓</text><text x="108" y="142" text-anchor="start" font-size="12.5" fill="#3b3b3b">AT1 结构与位置</text><text x="118" y="159" text-anchor="start" font-size="11.5" fill="#6b6459">18 op；k 体五连、store 在 k 外 j 内；回滚不留痕</text><path d="M 81,183.36357282862093 C 81,174 99,174 99,183 C 99,192 81,192 81,183.36357282862093" fill="#e5f1dc" stroke="#79b26a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="188" text-anchor="middle" font-size="12" fill="#79b26a">✓</text><text x="108" y="188" text-anchor="start" font-size="12.5" fill="#3b3b3b">AT2 地址映射与覆盖</text><text x="118" y="205" text-anchor="start" font-size="11.5" fill="#6b6459">156 条访存逐条核对；A×3 / B×4 / C×1</text><path d="M 81,228.2835592671719 C 81,220 99,220 99,229 C 99,238 81,238 81,228.2835592671719" fill="#e5f1dc" stroke="#79b26a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="234" text-anchor="middle" font-size="12" fill="#79b26a">✓</text><text x="108" y="234" text-anchor="start" font-size="12.5" fill="#3b3b3b">AT3 数值与访存统计</text><text x="118" y="251" text-anchor="start" font-size="11.5" fill="#6b6459">同序参考实现位等价；load 144、store 12</text><path d="M 81,274.47274876459255 C 81,266 99,266 99,275 C 99,284 81,284 81,274.47274876459255" fill="#e5f1dc" stroke="#79b26a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="280" text-anchor="middle" font-size="12" fill="#79b26a">✓</text><text x="108" y="280" text-anchor="start" font-size="12.5" fill="#3b3b3b">AT4 边界 shape 端到端</text><text x="118" y="297" text-anchor="start" font-size="11.5" fill="#6b6459">7 组形状逐位相等（含 K=0 零趟）</text><path d="M 81,321.28551561113335 C 81,312 99,312 99,321 C 99,330 81,330 81,321.28551561113335" fill="#e5f1dc" stroke="#79b26a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="326" text-anchor="middle" font-size="12" fill="#79b26a">✓</text><text x="108" y="326" text-anchor="start" font-size="12.5" fill="#3b3b3b">AT5 静态前提</text><text x="118" y="343" text-anchor="start" font-size="11.5" fill="#6b6459">动态 '?' 保守拒绝（strides 无法物化）</text><path d="M 81,366.6350034230678 C 81,358 99,358 99,367 C 99,376 81,376 81,366.6350034230678" fill="#e5f1dc" stroke="#79b26a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="372" text-anchor="middle" font-size="12" fill="#79b26a">✓</text><text x="108" y="372" text-anchor="start" font-size="12.5" fill="#3b3b3b">AT6 反面控制组</text><text x="118" y="389" text-anchor="start" font-size="11.5" fill="#6b6459">四个注入探针全部被拦下（见右下）</text><path d="M 509.4,100.7 Q 617.1,100.5 723.8,99.2 M 723.9,100.9 Q 723.5,138.1 724.6,177.9 M 723.7,178.2 Q 616.5,178.3 509.1,178.5 M 510.5,178.9 Q 510.2,138.7 509.7,99.8 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="617" y="132" text-anchor="middle" font-size="17" fill="#3b3b3b">18 op</text><text x="617" y="156" text-anchor="middle" font-size="11.5" fill="#6b6459">13（D88）＋ 5 块肉</text><path d="M 738.5,99.6 Q 844.9,100.4 951.3,100.0 M 952.5,100.7 Q 951.3,138.7 952.0,177.9 M 952.2,177.1 Q 844.8,178.5 737.9,178.2 M 738.0,178.0 Q 738.9,138.6 737.3,100.7 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="845" y="132" text-anchor="middle" font-size="17" fill="#3b3b3b">load 144</text><text x="845" y="156" text-anchor="middle" font-size="11.5" fill="#6b6459">= 2·M·N·K = 2·4·3·6</text><path d="M 965.2,99.5 Q 1072.2,99.0 1180.6,100.2 M 1180.2,100.8 Q 1180.7,138.4 1180.2,179.0 M 1180.8,178.1 Q 1072.3,177.3 966.4,177.8 M 965.0,178.4 Q 966.1,138.5 965.8,99.6 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="1073" y="132" text-anchor="middle" font-size="17" fill="#3b3b3b">store 12</text><text x="1073" y="156" text-anchor="middle" font-size="11.5" fill="#6b6459">= M·N = 4·3（每格写 1 次）</text><path d="M 510.6,192.6 Q 616.9,192.1 723.1,192.9 M 724.3,192.9 Q 724.0,231.5 723.2,269.5 M 723.2,270.5 Q 616.5,270.7 510.8,270.6 M 509.4,270.7 Q 510.8,231.5 510.3,191.6 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="617" y="224" text-anchor="middle" font-size="17" fill="#3b3b3b">A 每格读 3 次</text><text x="617" y="248" text-anchor="middle" font-size="11.5" fill="#6b6459">N 次：A 的元素被所有 j 复用</text><path d="M 738.8,191.6 Q 844.7,191.4 951.7,191.4 M 951.6,191.9 Q 951.2,231.0 951.8,270.5 M 951.7,270.1 Q 844.5,269.5 737.3,269.4 M 737.3,270.9 Q 737.8,230.7 738.4,191.4 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="845" y="224" text-anchor="middle" font-size="17" fill="#3b3b3b">B 每格读 4 次</text><text x="845" y="248" text-anchor="middle" font-size="11.5" fill="#6b6459">M 次：B 的元素被所有 i 复用</text><path d="M 966.1,191.3 Q 1072.1,191.3 1180.1,191.8 M 1179.8,192.8 Q 1179.4,231.8 1179.8,269.2 M 1180.0,269.9 Q 1073.0,270.6 965.3,269.9 M 965.2,269.4 Q 965.1,231.1 965.8,192.7 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="1073" y="224" text-anchor="middle" font-size="17" fill="#3b3b3b">C 每格写 1 次</text><text x="1073" y="248" text-anchor="middle" font-size="11.5" fill="#6b6459">只写最终值（k 外、j 内）</text><path d="M 509.0,289.2 Q 851.0,286.8 1194.0,287.6 M 1195.2,288.9 Q 1194.2,319.4 1194.3,351.5 M 1192.8,353.2 Q 852.6,351.0 510.7,351.4 M 510.4,351.9 Q 510.3,320.9 510.4,287.1 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="526" y="312" text-anchor="start" font-size="13" fill="#3b3b3b">位等价（AT3）：C 与同序参考实现（i/j/k＋float32 逐步舍入）逐位相等 = True</text><text x="526" y="334" text-anchor="start" font-size="12" fill="#6b6459">np.matmul 对照：逐位相等 = False，max|diff| = 2.384e-07（舍入顺序不同——单独报告，不算失败）</text><text x="526" y="352" text-anchor="start" font-size="12" fill="#6b6459">首格对账：C[0,0] = -0.949548（12 次加载＋1 次存储的一生）</text><text x="60" y="456" text-anchor="start" font-size="14.5" fill="#3b3b3b">四个注入探针（AT6 反面控制组）——今天讲的四件事，每件都有真实报错作证：</text><path d="M 60.1,469.8 Q 342.4,470.9 626.8,470.3 M 625.2,469.6 Q 626.5,522.9 626.0,574.7 M 626.8,573.0 Q 342.9,574.7 60.5,574.3 M 59.7,574.3 Q 59.3,522.5 60.1,470.1 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="494" text-anchor="start" font-size="14.5" fill="#3b3b3b">P1 配对写反</text><text x="210" y="494" text-anchor="start" font-size="12" fill="#6b6459">load %a[%k,%i]：A(4,6) 被当 6×4 用</text><text x="76" y="516.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">拦截前读的是 A 的第 0 列（(0,0)(1,0)(2,0)(3,0)）；</text><text x="76" y="532.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">报错：第 0 维下标 4 ∉ [0, 4)——按维越界探针拦下</text><path d="M 643.0,470.4 Q 924.5,470.7 1207.4,470.2 M 1207.4,470.6 Q 1207.5,522.5 1207.1,573.3 M 1208.2,574.1 Q 925.2,573.5 641.8,573.9 M 641.6,573.6 Q 643.0,522.0 640.9,469.6 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="658" y="494" text-anchor="start" font-size="14.5" fill="#3b3b3b">P2 位置错误</text><text x="792" y="494" text-anchor="start" font-size="12" fill="#6b6459">store 放进 k 体、写 %s（部分和）</text><text x="658" y="516.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">数值恰好还对（最后写覆盖）；但 store 72 次 = 6×</text><text x="658" y="532.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">写放大：一旦有别的读者/并发就是正确性 bug</text><path d="M 60.6,587.0 Q 343.0,588.1 626.4,586.9 M 625.6,587.5 Q 625.9,639.0 625.5,691.6 M 626.8,691.1 Q 342.2,691.0 59.5,692.1 M 60.1,692.3 Q 60.9,639.8 59.7,588.6 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="612" text-anchor="start" font-size="14.5" fill="#3b3b3b">P3 写回断开</text><text x="210" y="612" text-anchor="start" font-size="12" fill="#6b6459">yield %p（丢掉累加，只留最后一项）</text><text x="76" y="634.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">C[i,j] = A[i,5]·B[5,j]；访存计数 144/12 全正常</text><text x="76" y="650.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">max|C−ref| = 5.071e+00——只有数值对照抓得住</text><path d="M 642.6,588.3 Q 925.9,587.6 1208.7,587.6 M 1207.4,589.0 Q 1207.3,639.7 1208.0,692.3 M 1208.3,693.0 Q 925.1,691.0 641.7,690.9 M 642.0,692.7 Q 642.4,639.1 641.4,588.3 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="658" y="612" text-anchor="start" font-size="14.5" fill="#3b3b3b">P4 初值错误</text><text x="792" y="612" text-anchor="start" font-size="12" fill="#6b6459">累加器初值 = load %c[%i,%j]（读输出）</text><text x="658" y="634.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">12 次未初始化读（Day 87 探针）；load 156 = 144＋12</text><text x="658" y="650.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">max|C−ref| = 8.540e+02：垃圾值 777＋7·addr 混进结果</text><path d="M 61.2,711.6 Q 620.7,712.9 1179.8,710.9 M 1180.6,712.6 Q 1180.3,734.5 1179.3,757.2 M 1179.2,757.0 Q 621.0,757.5 61.0,757.3 M 60.0,757.0 Q 59.4,733.9 59.1,712.1 Z" fill="white" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="76" y="730.0" text-anchor="start" font-size="11.5" fill="#6b6459">诚实边界：访存日志/地址核对/覆盖统计/按维越界是解释执行器的仿真探针；iv/iter_args 用 attrs 里的 Value 模拟（真实 MLIR 是 BlockArgument）；</text><text x="76" y="746.0" text-anchor="start" font-size="11.5" fill="#6b6459">AT4 的 7 组 shape 是循环体正确性预飞——Day 90 按计划做 ≥8 组边界 shape 的系统对照与修复。</text></g></svg>