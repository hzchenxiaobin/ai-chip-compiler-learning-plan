<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" width="1240" height="800"><rect x="3" y="3" width="1234" height="794" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="30" y="44" text-anchor="start" font-size="25" fill="#3b3b3b">循环体五块肉的位置：作用域交集的最内层＋「只写最终值」</text><text x="30" y="70" text-anchor="start" font-size="14.5" fill="#6b6459">位置不是拍脑袋：每个 op 放在「它依赖的值全部可见」的最内层，再由语义约束收窄</text><path d="M 31.2,82.0 Q 619.7,80.8 1209.9,81.6" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M 60.4,109.4 Q 410.9,109.2 759.8,107.7 M 759.0,108.1 Q 761.4,431.2 760.2,754.9 M 758.7,755.3 Q 409.1,755.4 60.1,756.3 M 61.0,756.9 Q 60.4,431.6 58.7,106.6 Z" fill="white" stroke="#3b3b3b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="134" text-anchor="start" font-size="14" fill="#3b3b3b">func @main(%a, %b)</text><path d="M 100.7,148.1 Q 260.7,148.6 419.9,148.6 M 420.7,147.6 Q 420.2,162.4 420.1,178.2 M 419.2,178.5 Q 259.9,178.2 99.4,178.6 M 99.5,178.0 Q 99.7,163.2 99.9,148.0 Z" fill="#fdead3" stroke="#e8973f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="260.0" y="168" text-anchor="middle" font-size="12" fill="#3b3b3b">%c = memref.alloc()（不清零，D87）</text><path d="M 99.6,186.1 Q 260.0,186.6 419.1,185.4 M 419.7,185.6 Q 419.3,200.5 419.1,216.6 M 419.9,216.6 Q 260.6,216.3 100.2,216.5 M 99.5,216.4 Q 99.5,200.2 100.3,185.4 Z" fill="#fdead3" stroke="#e8973f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="260.0" y="206" text-anchor="middle" font-size="12" fill="#3b3b3b">%zero = arith.constant 0.0（初值，D87）</text><path d="M 84.9,229.7 Q 408.5,230.3 734.7,230.0 M 734.2,229.7 Q 733.6,415.8 732.8,602.5 M 734.0,601.8 Q 408.3,600.9 84.5,603.0 M 85.2,601.5 Q 84.2,414.9 84.4,228.8 Z" fill="#fbf6ec" stroke="#5f8fcb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="254" text-anchor="start" font-size="13" fill="#5f8fcb">scf.for %i = 0 to 4（M 行）—— %i 从这里开始可见</text><path d="M 75.9,263.2 Q 381.1,264.7 685.3,262.9 M 686.2,264.8 Q 684.9,426.0 686.3,590.6 M 686.2,589.2 Q 380.8,589.5 77.1,589.4 M 76.1,590.4 Q 76.2,426.8 76.7,264.0 Z" fill="white" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="288" text-anchor="start" font-size="13" fill="#79b26a">scf.for %j = 0 to 3（N 列）—— %j 从这里开始可见</text><path d="M 73.5,298.7 Q 354.2,297.5 633.5,297.8 M 634.1,297.3 Q 634.1,406.9 633.9,514.5 M 634.4,514.2 Q 354.6,513.1 74.3,513.9 M 74.6,513.3 Q 74.1,405.2 74.7,297.2 Z" fill="#fcfaf3" stroke="#e8973f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="320" text-anchor="start" font-size="12.5" fill="#b06a1e">scf.for %k = 0 to 6，iter_args(%acc = %zero) —— %k 只在这里可见</text><path d="M 104.6,332.9 Q 304.0,332.1 503.5,332.0 M 503.2,331.5 Q 504.6,347.2 504.3,362.3 M 504.5,361.6 Q 303.8,361.3 103.7,361.9 M 104.6,361.1 Q 104.8,347.5 103.8,331.4 Z" fill="#dbe7f6" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="304.0" y="352" text-anchor="middle" font-size="12" fill="#3b3b3b">%xa = memref.load %a[%i, %k]</text><text x="520" y="352" text-anchor="start" font-size="11.5" fill="#6b6459">读 A：需要 %i、%k</text><path d="M 103.5,367.3 Q 303.4,367.1 504.2,367.3 M 504.3,368.1 Q 504.5,383.5 504.1,398.2 M 503.4,398.1 Q 304.1,398.5 103.7,397.5 M 104.2,397.3 Q 103.4,383.9 103.1,368.8 Z" fill="#dbe7f6" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="304.0" y="388" text-anchor="middle" font-size="12" fill="#3b3b3b">%xb = memref.load %b[%k, %j]</text><text x="520" y="388" text-anchor="start" font-size="11.5" fill="#6b6459">读 B：需要 %k、%j</text><path d="M 104.6,404.6 Q 303.7,404.5 503.8,403.6 M 504.4,404.6 Q 504.9,419.3 504.1,434.8 M 503.7,433.5 Q 303.4,434.1 103.1,434.1 M 104.0,433.9 Q 103.4,419.4 103.1,404.6 Z" fill="white" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="304.0" y="424" text-anchor="middle" font-size="12" fill="#3b3b3b">%p = arith.mulf %xa, %xb</text><text x="520" y="424" text-anchor="start" font-size="11.5" fill="#6b6459">依赖两个 load</text><path d="M 104.7,439.5 Q 304.4,439.7 504.1,440.7 M 504.7,440.5 Q 503.5,455.7 503.2,470.8 M 504.3,470.9 Q 304.2,469.5 104.1,469.8 M 104.6,470.8 Q 104.2,455.5 103.5,439.2 Z" fill="white" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="304.0" y="460" text-anchor="middle" font-size="12" fill="#3b3b3b">%s = arith.addf %acc, %p</text><text x="520" y="460" text-anchor="start" font-size="11.5" fill="#6b6459">读 %acc（区域参数）</text><path d="M 103.9,475.5 Q 304.8,475.2 503.9,476.7 M 503.8,475.2 Q 504.0,491.3 504.8,506.7 M 504.3,505.4 Q 303.9,506.4 103.6,505.4 M 103.4,506.4 Q 103.8,491.4 103.9,475.8 Z" fill="#f6f0dc" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="304.0" y="496" text-anchor="middle" font-size="12" fill="#3b3b3b">scf.yield %s  ← 写回通道</text><text x="520" y="496" text-anchor="start" font-size="11.5" fill="#6b6459">交给下一趟 %acc</text><path d="M 104.1,532.3 Q 303.3,531.5 504.3,531.5 M 503.5,531.5 Q 504.0,546.8 503.5,561.4 M 504.4,562.1 Q 303.5,562.4 103.2,561.7 M 103.2,561.7 Q 104.8,547.7 104.3,532.2 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="304.0" y="552" text-anchor="middle" font-size="12" fill="#3b3b3b">memref.store %acc, %c[%i, %j]</text><text x="520" y="552" text-anchor="start" font-size="11.5" fill="#d96c5c">k 外、j 内：只写最终值</text><path d="M 302.9,550.9 Q 303.6,540.1 303.2,529.6" fill="none" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 303.4,529.5 Q 307.1,535.7 310.0,541.4" fill="none" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 304.0,530.4 Q 301.5,535.8 298.9,542.2" fill="none" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="314" y="566" text-anchor="start" font-size="11.5" fill="#d96c5c">%acc 出了 k 循环才存在（循环结果）</text><path d="M 99.8,616.0 Q 259.6,616.9 419.7,616.4 M 419.3,615.9 Q 419.3,631.0 419.1,646.8 M 419.1,646.0 Q 260.2,646.3 100.0,645.6 M 100.6,646.0 Q 100.0,630.9 99.3,616.7 Z" fill="white" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="260.0" y="636" text-anchor="middle" font-size="12" fill="#3b3b3b">return %c</text><path d="M 799.7,109.2 Q 1000.6,107.5 1199.7,108.1 M 1200.4,106.7 Q 1201.1,234.1 1201.1,357.7 M 1198.7,357.4 Q 1000.7,356.9 799.4,356.9 M 800.9,357.0 Q 801.2,234.1 801.2,108.2 Z" fill="white" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="816" y="134" text-anchor="start" font-size="15" fill="#3b3b3b">位置法则（依赖 → 位置）</text><text x="818" y="164" text-anchor="start" font-size="12" fill="#3b3b3b">load %a[%i,%k]</text><text x="968" y="164" text-anchor="start" font-size="11.5" fill="#6b6459">需要 %i、%k</text><text x="1116" y="164" text-anchor="start" font-size="11.5" fill="#5f8fcb">k 体内</text><path d="M 813.3,170.9 Q 999.5,168.7 1187.2,169.9" fill="none" stroke="#e5ddd0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="818" y="190" text-anchor="start" font-size="12" fill="#3b3b3b">load %b[%k,%j]</text><text x="968" y="190" text-anchor="start" font-size="11.5" fill="#6b6459">需要 %k、%j</text><text x="1116" y="190" text-anchor="start" font-size="11.5" fill="#5f8fcb">k 体内</text><path d="M 813.9,195.5 Q 1000.7,195.3 1184.8,197.1" fill="none" stroke="#e5ddd0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="818" y="216" text-anchor="start" font-size="12" fill="#3b3b3b">mulf / addf</text><text x="968" y="216" text-anchor="start" font-size="11.5" fill="#6b6459">依赖 load / %acc</text><text x="1116" y="216" text-anchor="start" font-size="11.5" fill="#5f8fcb">k 体内</text><path d="M 814.9,222.4 Q 998.8,221.2 1185.8,221.4" fill="none" stroke="#e5ddd0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="818" y="242" text-anchor="start" font-size="12" fill="#3b3b3b">yield %s</text><text x="968" y="242" text-anchor="start" font-size="11.5" fill="#6b6459">终止器（必须收尾）</text><text x="1116" y="242" text-anchor="start" font-size="11.5" fill="#5f8fcb">k 体末尾</text><path d="M 815.2,248.4 Q 1001.0,248.6 1186.1,248.3" fill="none" stroke="#e5ddd0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="818" y="268" text-anchor="start" font-size="12" fill="#3b3b3b">store</text><text x="968" y="268" text-anchor="start" font-size="11.5" fill="#6b6459">%acc＋%i＋%j；只写最终值</text><text x="1116" y="268" text-anchor="start" font-size="11.5" fill="#d96c5c">k 外、j 内</text><path d="M 814.0,273.6 Q 1000.0,273.2 1187.2,275.0" fill="none" stroke="#e5ddd0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 801.1,376.3 Q 999.4,374.8 1200.4,376.3 M 1200.2,377.0 Q 1200.3,514.8 1200.7,656.6 M 1200.6,655.1 Q 1000.7,655.0 799.2,656.0 M 799.3,657.2 Q 800.2,516.3 799.6,374.7 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="816" y="402" text-anchor="start" font-size="15" fill="#3b3b3b">累加器的环路（读 → 算 → 写回）</text><text x="840" y="432" text-anchor="start" font-size="12.5" fill="#3b3b3b">%zero（初值）</text><path d="M 827.3,437.6 Q 826.8,443.3 826.8,448.7" fill="none" stroke="#5f8fcb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 826.3,447.9 Q 823.0,442.5 819.8,437.0" fill="none" stroke="#5f8fcb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 826.1,447.8 Q 828.3,442.2 831.8,436.2" fill="none" stroke="#5f8fcb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="840" y="462" text-anchor="start" font-size="12.5" fill="#3b3b3b">iter_args 传入 → %acc</text><path d="M 825.8,467.4 Q 826.0,474.2 826.9,477.3" fill="none" stroke="#5f8fcb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 826.2,478.1 Q 822.8,471.9 820.9,465.7" fill="none" stroke="#5f8fcb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 825.9,478.5 Q 828.6,472.3 831.6,466.2" fill="none" stroke="#5f8fcb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="840" y="492" text-anchor="start" font-size="12.5" fill="#3b3b3b">addf：s = acc + p</text><path d="M 826.0,497.7 Q 825.6,503.5 826.3,507.4" fill="none" stroke="#5f8fcb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 825.7,507.5 Q 823.0,502.0 820.3,496.1" fill="none" stroke="#5f8fcb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 825.8,508.1 Q 828.3,501.6 832.4,497.0" fill="none" stroke="#5f8fcb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="840" y="522" text-anchor="start" font-size="12.5" fill="#3b3b3b">yield %s → 下一趟 acc</text><path d="M 825.0,528.0 Q 824.9,531.8 826.6,537.6" fill="none" stroke="#5f8fcb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 826.3,538.5 Q 823.6,532.7 820.5,526.8" fill="none" stroke="#5f8fcb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 826.4,537.3 Q 828.6,532.8 831.4,526.7" fill="none" stroke="#5f8fcb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="840" y="552" text-anchor="start" font-size="12.5" fill="#3b3b3b">循环结束 → %acc（结果）</text><path d="M 826.3,558.5 Q 827.0,562.9 827.0,568.4" fill="none" stroke="#5f8fcb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 826.0,567.8 Q 823.4,562.6 820.1,555.8" fill="none" stroke="#5f8fcb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 826.3,568.5 Q 828.3,562.2 831.6,557.0" fill="none" stroke="#5f8fcb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="840" y="582" text-anchor="start" font-size="12.5" fill="#3b3b3b">store 写进 C[i,j]</text><path d="M 816.0,614.2 Q 1001.1,613.8 1183.6,613.1" fill="none" stroke="#5f8fcb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text x="816" y="636" text-anchor="start" font-size="12" fill="#6b6459">D88 的占位 yield %zero = 恒等循环（全零）；</text><text x="816" y="654" text-anchor="start" font-size="12" fill="#6b6459">今天换成 yield %s——环路闭合，开始真的累加。</text><text x="60" y="780" text-anchor="start" font-size="12.5" fill="#6b6459">结构依据：AT1（k 体 = load×2＋mulf＋addf＋yield；store 在 fj.body=[fk, store]）；打印自 outputs/body-ir.txt。</text></g></svg>