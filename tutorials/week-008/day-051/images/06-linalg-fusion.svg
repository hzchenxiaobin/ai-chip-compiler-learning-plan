Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','楷体',cursive" font-size="12" fill="#3A3A3A" text-anchor="start" opacity="0.85">标量 %cst 在区域外定义、块内直接引用</text><text x="546" y="368" font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','楷体',cursive" font-size="12.5" fill="#7FB069" text-anchor="start" opacity="1.0">块内标量 %2 只活在循环体里，</text><text x="546" y="388" font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','楷体',cursive" font-size="12.5" fill="#7FB069" text-anchor="start" opacity="1.0" font-weight="bold">不经过内存（不落盘）</text><text x="546" y="414" font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','楷体',cursive" font-size="12.5" fill="#3A3A3A" text-anchor="start" opacity="0.85">→ 输出 %1（tensor）</text><path d="M 470.0,230.0 L 483.2,231.3 L 497.7,229.7 L 514.0,230.0" fill="none" stroke="#7FB069" stroke-width="3.0" stroke-linecap="round"/><path d="M 514.0,230.0 L 504.3,235.2 M 514.0,230.0 L 504.3,224.8" fill="none" stroke="#7FB069" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><text x="462" y="216" font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','楷体',cursive" font-size="12" fill="#7FB069" text-anchor="start" opacity="1.0">融合</text><path d="M 40.9,490.5 L 336.5,493.6 L 635.8,493.4 L 941.8,489.1 L 937.5,492.6 L 941.4,503.8 L 939.5,521.4 L 939.1,533.1 L 940.3,536.5 L 643.4,534.1 L 344.9,533.2 L 40.2,534.3 L 40.0,538.4 L 39.8,520.1 L 41.1,508.5 L 38.6,492.2 Z" fill="#7FB069" fill-opacity="0.22" stroke="none"/><text x="490" y="516" font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','楷体',cursive" font-size="15.5" fill="#3A3A3A" text-anchor="middle" opacity="1.0" font-weight="bold">生产者-消费者链合并成一次遍历：中间张量 %0 不再物化</text><text x="490" y="536" font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','楷体',cursive" font-size="12.5" fill="#3A3A3A" text-anchor="middle" opacity="0.8">——与手写的 mini.fused_add_relu 同一思想（名称与数值取自正文真实输出）</text></svg>
