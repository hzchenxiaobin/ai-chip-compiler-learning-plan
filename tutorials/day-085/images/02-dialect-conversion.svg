<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780"><rect x="3" y="3" width="1194" height="774" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="30" y="44" text-anchor="start" font-size="25" fill="#3b3b3b">DialectConversion：一次有目标的翻译，由四个角色咬合完成</text><text x="30" y="70" text-anchor="start" font-size="14.5" fill="#6b6459">驱动器反复改写非法 op，直到 ConversionTarget 清单全绿——或 full 模式整体失败</text><path d="M 30.9,80.9 Q 600.3,82.6 1169.6,83.1" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M 39.5,104.5 Q 189.8,103.5 340.4,103.7 M 339.1,104.5 Q 341.2,253.8 340.7,402.8 M 339.7,404.0 Q 189.2,403.1 39.7,404.6 M 39.4,403.5 Q 38.7,255.1 39.0,103.3 Z" fill="white" stroke="#6b6459" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="132" text-anchor="start" font-size="15.5" fill="#3b3b3b">源图 S0：tensor 世界</text><text x="56" y="158.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">@main(%x: tensor&lt;4x6xf32&gt;,</text><text x="56" y="174.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">      %w: tensor&lt;6x3xf32&gt;)</text><path d="M 66.4,187.2 Q 164.7,185.0 265.6,186.9 M 264.9,186.6 Q 265.3,206.0 266.7,227.3 M 265.1,228.1 Q 165.5,226.8 65.1,228.2 M 66.2,227.3 Q 65.1,206.3 66.2,185.5 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="212" text-anchor="start" font-size="13.5" fill="#3b3b3b">%c = mini.matmul</text><text x="76" y="250.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">return %c : tensor&lt;4x3xf32&gt;</text><path d="M 57.2,269.0 Q 188.8,270.2 325.2,269.4 M 323.6,269.6 Q 323.7,299.0 324.3,327.2 M 323.1,326.4 Q 189.8,325.4 56.2,325.7 M 55.7,325.8 Q 56.8,298.6 56.6,269.8 Z" fill="white" stroke="#d96c5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text x="70" y="292" text-anchor="start" font-size="13" fill="#d96c5c">源 op 的职责：提供语义</text><text x="70" y="312.0" text-anchor="start" font-size="11.5" fill="#6b6459">操作数类型/shape、内维契约</text><text x="70" y="328.0" text-anchor="start" font-size="11.5" fill="#6b6459">(4,6)×(6,3)、结果类型</text><text x="56" y="352" text-anchor="start" font-size="12.5" fill="#d96c5c">mini 方言 = 非法（必须消失）</text><text x="56" y="374" text-anchor="start" font-size="12" fill="#6b6459">转换完成后被替换、擦除</text><path d="M 378.7,104.5 Q 580.6,103.4 778.8,105.0 M 778.8,103.7 Q 780.4,188.1 781.1,272.1 M 781.2,272.3 Q 581.0,271.5 379.6,271.4 M 380.2,271.4 Q 380.5,188.7 380.0,103.7 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="396" y="132" text-anchor="start" font-size="15" fill="#3b3b3b">驱动器（applyFull / applyPartial）</text><text x="396" y="158.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">工作列表：发现非法 op → 查 Pattern → 改写 →</text><text x="396" y="175.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">再扫一遍，直到没有非法 op（或失败）</text><path d="M 395.9,183.3 Q 486.8,185.2 575.7,184.0 M 575.8,183.8 Q 575.5,206.0 576.2,228.7 M 576.8,229.3 Q 485.6,228.6 395.1,228.4 M 397.2,228.8 Q 395.7,207.0 396.6,183.5 Z" fill="white" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="406" y="202" text-anchor="start" font-size="13" fill="#5f8fcb">full 模式</text><text x="406" y="220" text-anchor="start" font-size="11.5" fill="#3b3b3b">剩 1 个非法 → 整体失败</text><path d="M 589.6,184.6 Q 679.1,184.9 765.4,183.3 M 765.4,184.7 Q 764.7,206.0 765.5,227.6 M 766.7,227.2 Q 677.9,228.6 590.2,229.2 M 589.3,227.1 Q 589.2,206.5 589.9,182.8 Z" fill="white" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="202" text-anchor="start" font-size="13" fill="#5f8fcb">partial 模式</text><text x="600" y="220" text-anchor="start" font-size="11.5" fill="#3b3b3b">允许残留给后续 Pass</text><text x="396" y="252.0" text-anchor="start" font-size="12" fill="#79b26a">实测：主图 3 op → 14 op，全绿；</text><text x="396" y="268.5" text-anchor="start" font-size="12" fill="#79b26a">mini.conv（无 Pattern）full 失败 / partial 残留</text><path d="M 380.3,300.4 Q 579.9,299.8 781.2,301.3 M 779.2,301.1 Q 779.1,374.1 780.8,450.9 M 779.2,450.8 Q 581.0,449.8 379.8,449.9 M 380.4,448.8 Q 379.2,375.1 379.2,299.5 Z" fill="white" stroke="#79b26a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="396" y="326" text-anchor="start" font-size="15" fill="#3b3b3b">ConversionTarget：合法性清单</text><text x="396" y="352.0" text-anchor="start" font-size="12" fill="#3b3b3b">合法（终图允许出现）：</text><text x="396" y="368.5" text-anchor="start" font-size="12" fill="#3b3b3b">  func · memref.alloc/fill/load/store</text><text x="396" y="385.0" text-anchor="start" font-size="12" fill="#3b3b3b">  scf.for/yield · arith.constant/mulf/addf</text><text x="396" y="401.5" text-anchor="start" font-size="12" fill="#3b3b3b">  bufferization.to_tensor/to_memref</text><text x="396" y="436" text-anchor="start" font-size="12.5" fill="#79b26a">清单 = 「降级完成」的定义，验收就看它</text><path d="M 379.6,476.9 Q 579.1,475.9 780.7,476.9 M 780.6,476.4 Q 781.1,542.8 780.1,607.8 M 779.3,608.6 Q 579.7,608.7 381.3,608.0 M 379.2,608.0 Q 379.7,541.1 379.0,476.7 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="396" y="502" text-anchor="start" font-size="15" fill="#3b3b3b">TypeConverter：类型也要降级</text><text x="396" y="528.0" text-anchor="start" font-size="12" fill="#3b3b3b">convertType: tensor&lt;4x6xf32&gt;</text><text x="396" y="544.5" text-anchor="start" font-size="12" fill="#3b3b3b">   → memref&lt;4x6xf32, strided&lt;[6,1]&gt;&gt;</text><path d="M 395.6,552.2 Q 484.4,551.4 572.8,552.4 M 571.2,550.8 Q 572.5,571.8 572.8,593.8 M 571.8,593.8 Q 483.0,593.9 395.2,594.9 M 396.4,595.3 Q 397.0,572.5 396.9,551.1 Z" fill="white" stroke="#e8973f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="404" y="568" text-anchor="start" font-size="12" fill="#e8973f">物化钩子①</text><text x="404" y="586" text-anchor="start" font-size="11" fill="#3b3b3b">to_memref: tensor→memref</text><path d="M 586.6,551.5 Q 675.4,553.1 766.1,553.3 M 765.0,551.2 Q 766.2,571.9 766.8,592.9 M 765.9,593.8 Q 676.2,595.1 586.9,593.5 M 585.8,594.1 Q 585.1,573.9 586.1,550.9 Z" fill="white" stroke="#e8973f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="594" y="568" text-anchor="start" font-size="12" fill="#e8973f">物化钩子②</text><text x="594" y="586" text-anchor="start" font-size="11" fill="#3b3b3b">to_tensor: memref→tensor</text><text x="396" y="604" text-anchor="start" font-size="11.5" fill="#6b6459">缝合「半 tensor 半 memref」的中途状态（TP5 实测）</text><path d="M 819.0,105.0 Q 991.1,103.4 1161.0,105.3 M 1159.8,104.0 Q 1159.5,254.7 1160.7,403.6 M 1159.5,403.3 Q 989.0,404.8 820.1,404.3 M 820.7,403.3 Q 820.1,253.4 820.9,103.2 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="836" y="132" text-anchor="start" font-size="15.5" fill="#3b3b3b">目标 op：循环＋内存世界</text><text x="836" y="158.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">%c = memref.alloc()  (48 B)</text><text x="836" y="174.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">%zero = arith.constant 0.0</text><text x="836" y="190.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">scf.for %i = 0 to 4 {</text><text x="836" y="206.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">  scf.for %j = 0 to 3 {</text><text x="836" y="222.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">    %acc = scf.for %k = 0 to 6</text><text x="836" y="238.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">      iter_args(%acc = %zero)</text><text x="836" y="254.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">      load %a[%i,%k] · load %b[%k,%j]</text><text x="836" y="270.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">      mulf → addf → yield</text><text x="836" y="286.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">    store %c[%i,%j]</text><path d="M 835.5,318.5 Q 989.0,316.9 1144.0,318.4 M 1143.4,316.8 Q 1143.4,352.5 1142.7,388.1 M 1144.6,388.4 Q 990.6,387.4 834.7,388.5 M 835.6,386.8 Q 836.2,353.1 836.9,318.5 Z" fill="white" stroke="#79b26a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text x="850" y="340" text-anchor="start" font-size="12.5" fill="#79b26a">目标 op 的职责（三条都要满足）</text><text x="850" y="360.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">① 在 ConversionTarget 里合法</text><text x="850" y="376.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">② 类型经过 TypeConverter 认可</text><text x="850" y="392.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">③ 组合后与源 op 数值等价（TP 验收）</text><text x="836" y="408" text-anchor="start" font-size="12.5" fill="#6b6459">Pattern = 读源 op，写目标 op</text><text x="836" y="428" text-anchor="start" font-size="11.5" fill="#6b6459">（matchAndRewrite：adaptor 给出</text><text x="836" y="446" text-anchor="start" font-size="11.5" fill="#6b6459">  已转换类型的操作数）</text><path d="M 344.4,254.0 Q 359.3,255.0 377.0,253.9" fill="none" stroke="#6b6459" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 376.5,254.3 Q 369.5,256.6 364.2,259.7" fill="none" stroke="#6b6459" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 375.9,254.7 Q 370.2,251.2 364.8,248.4" fill="none" stroke="#6b6459" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="240" text-anchor="middle" font-size="12" fill="#6b6459">改写</text><path d="M 784.3,253.2 Q 798.8,254.8 816.3,253.6" fill="none" stroke="#6b6459" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 816.6,254.1 Q 810.4,257.2 803.7,260.3" fill="none" stroke="#6b6459" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 816.3,253.6 Q 809.9,250.6 804.5,248.7" fill="none" stroke="#6b6459" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 580.0,476.0 Q 560.0,430.0 580.0,454.0" fill="none" stroke="#e8973f" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path d="M 580.4,454.6 Q 574.2,451.4 568.1,449.4" fill="none" stroke="#e8973f" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 580.1,453.5 Q 578.1,447.4 576.6,441.1" fill="none" stroke="#e8973f" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 380.0,540.0 Q 330.0,470.0 300.0,408.0" fill="none" stroke="#e8973f" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path d="M 300.4,408.6 Q 305.6,412.6 309.9,416.5" fill="none" stroke="#e8973f" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 300.4,407.5 Q 299.7,415.2 299.5,421.1" fill="none" stroke="#e8973f" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="316" y="470" text-anchor="start" font-size="11.5" fill="#e8973f">签名降级</text><path d="M 39.5,640.5 Q 598.8,640.4 1160.0,639.2 M 1160.9,640.7 Q 1159.1,692.7 1160.0,744.3 M 1159.9,743.7 Q 600.9,745.2 41.0,744.3 M 40.9,744.0 Q 39.3,693.1 40.3,640.0 Z" fill="white" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="668" text-anchor="start" font-size="14.5" fill="#d96c5c">失败模式也是设计（真实输出）：</text><text x="58" y="692.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">含 mini.conv 的变体（还没写规则）：full 模式 → 整体失败：</text><text x="58" y="709.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">  无法合法化 'mini.conv'：没有注册对应的 ConversionPattern（模式=full，整体失败）</text><text x="58" y="726.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">partial 模式 → 成功但显式残留 ['mini.conv']，交给后续 Pass——失败要大声，不能悄悄吞掉。</text></g></svg>