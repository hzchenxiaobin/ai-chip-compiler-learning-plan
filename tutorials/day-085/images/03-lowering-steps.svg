<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 810" width="1240" height="810"><rect x="3" y="3" width="1234" height="804" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="30" y="44" text-anchor="start" font-size="25" fill="#3b3b3b">mini.matmul → 循环表示：S0→S4 五步路线＋三张任务清单</text><text x="30" y="70" text-anchor="start" font-size="14.5" fill="#6b6459">贯穿例子：A(4,6) @ B(6,3) → C(4,3)，种子 85——所有数字来自真实运行</text><path d="M 28.8,82.6 Q 621.1,80.8 1209.5,82.4" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M 40.7,103.7 Q 144.7,104.1 251.0,104.5 M 249.1,102.8 Q 249.9,229.3 249.1,355.2 M 249.7,353.5 Q 145.9,355.1 40.3,354.9 M 40.5,353.8 Q 40.1,228.8 39.1,104.1 Z" fill="white" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="132" text-anchor="start" font-size="15" fill="#3b3b3b">S0 原图</text><path d="M 53.8,144.1 Q 93.5,143.3 134.8,144.2 M 134.9,144.4 Q 133.4,157.0 134.2,169.5 M 133.7,169.0 Q 94.9,169.4 54.8,168.6 M 53.2,169.1 Q 54.6,156.8 54.7,144.8 Z" fill="#fdf9f0" stroke="#fdf9f0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="94.08500000000001" y="162.0" text-anchor="middle" font-size="11.5" fill="#3b3b3b">tensor 世界</text><text x="54" y="200.0" text-anchor="start" font-size="11.2" fill="#3b3b3b">@main(%x: tensor&lt;4x6&gt;,</text><text x="54" y="216.5" text-anchor="start" font-size="11.2" fill="#3b3b3b">      %w: tensor&lt;6x3&gt;)</text><text x="54" y="233.0" text-anchor="start" font-size="11.2" fill="#3b3b3b">%c = mini.matmul(%x,%w)</text><text x="54" y="249.5" text-anchor="start" font-size="11.2" fill="#3b3b3b">return %c</text><text x="54" y="340" text-anchor="start" font-size="11.5" fill="#6b6459">声明式：只说做什么</text><path d="M 250.2,228.9 Q 260.5,228.1 271.1,229.3" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 270.4,229.5 Q 265.3,231.6 260.0,235.2" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 271.1,229.5 Q 264.8,226.4 259.7,223.9" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 272.9,103.4 Q 376.6,104.9 481.4,103.3 M 481.6,103.6 Q 483.1,228.9 482.8,354.0 M 482.2,354.3 Q 377.1,353.6 271.7,355.3 M 272.9,354.8 Q 272.8,228.2 273.1,104.1 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="286" y="132" text-anchor="start" font-size="15" fill="#3b3b3b">S1 签名降级</text><path d="M 286.5,143.2 Q 340.2,144.7 394.9,144.6 M 395.4,144.0 Q 394.6,157.0 394.4,169.6 M 394.3,168.5 Q 341.2,168.9 286.5,169.3 M 285.4,168.5 Q 286.0,155.8 285.4,144.2 Z" fill="white" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="340.345" y="162.0" text-anchor="middle" font-size="11.5" fill="#3b3b3b">TypeConverter</text><text x="286" y="200.0" text-anchor="start" font-size="11.2" fill="#3b3b3b">入参 tensor → memref</text><text x="286" y="216.5" text-anchor="start" font-size="11.2" fill="#3b3b3b">%a: memref&lt;4x6,</text><text x="286" y="233.0" text-anchor="start" font-size="11.2" fill="#3b3b3b">   strided&lt;[6,1]&gt;</text><text x="286" y="249.5" text-anchor="start" font-size="11.2" fill="#3b3b3b">%b: memref&lt;6x3,</text><text x="286" y="266.0" text-anchor="start" font-size="11.2" fill="#3b3b3b">   strided&lt;[3,1]&gt;</text><text x="286" y="282.5" text-anchor="start" font-size="11.2" fill="#3b3b3b">体内还没动</text><text x="286" y="340" text-anchor="start" font-size="11.5" fill="#6b6459">convertType</text><path d="M 482.6,228.0 Q 492.5,230.1 503.8,230.1" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 502.9,228.7 Q 497.4,232.1 490.7,235.3" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 503.5,228.6 Q 497.8,226.6 491.0,223.2" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 502.9,103.9 Q 608.2,103.0 713.8,103.9 M 713.2,103.7 Q 714.6,229.4 714.2,353.1 M 713.0,352.8 Q 608.3,354.7 505.0,354.2 M 505.3,355.0 Q 504.9,230.3 503.3,102.9 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="518" y="132" text-anchor="start" font-size="15" fill="#3b3b3b">S2 核心改写</text><path d="M 518.3,144.1 Q 586.9,143.3 655.1,143.8 M 655.4,143.8 Q 654.8,157.1 654.7,168.2 M 654.8,169.7 Q 585.8,169.6 517.6,169.2 M 518.3,169.9 Q 518.0,156.2 517.2,144.7 Z" fill="white" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="586.605" y="162.0" text-anchor="middle" font-size="11.5" fill="#3b3b3b">ConversionPattern</text><text x="518" y="200.0" text-anchor="start" font-size="11.2" fill="#3b3b3b">%c = memref.alloc()</text><text x="518" y="216.5" text-anchor="start" font-size="11.2" fill="#3b3b3b">scf.for %i 0..4</text><text x="518" y="233.0" text-anchor="start" font-size="11.2" fill="#3b3b3b"> scf.for %j 0..3</text><text x="518" y="249.5" text-anchor="start" font-size="11.2" fill="#3b3b3b">  %acc = for %k 0..6</text><text x="518" y="266.0" text-anchor="start" font-size="11.2" fill="#3b3b3b">   load · mulf · addf</text><text x="518" y="282.5" text-anchor="start" font-size="11.2" fill="#3b3b3b">  store %c[%i,%j]</text><text x="518" y="299.0" text-anchor="start" font-size="11.2" fill="#3b3b3b">mini.matmul 消失</text><text x="518" y="340" text-anchor="start" font-size="11.5" fill="#6b6459">matchAndRewrite</text><path d="M 714.7,228.9 Q 726.0,229.8 734.9,228.2" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 734.4,229.6 Q 728.7,232.6 723.0,235.0" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 735.7,229.6 Q 729.6,225.7 723.1,223.7" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 735.7,103.2 Q 840.7,104.4 945.3,104.8 M 944.9,104.3 Q 946.9,229.5 946.7,353.9 M 945.7,353.9 Q 841.5,353.4 736.6,354.1 M 736.0,354.4 Q 735.3,229.4 737.2,105.0 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="750" y="132" text-anchor="start" font-size="15" fill="#3b3b3b">S3 边界缝合</text><path d="M 750.6,143.4 Q 772.8,144.2 794.6,144.7 M 794.8,143.5 Q 793.9,157.0 794.8,169.0 M 794.6,169.6 Q 772.2,169.5 749.9,168.4 M 749.7,169.4 Q 749.8,157.0 750.8,144.3 Z" fill="white" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="772.26" y="162.0" text-anchor="middle" font-size="11.5" fill="#3b3b3b">物化钩子</text><text x="750" y="200.0" text-anchor="start" font-size="11.2" fill="#3b3b3b">return 要 tensor，</text><text x="750" y="216.5" text-anchor="start" font-size="11.2" fill="#3b3b3b">手里只有 memref</text><text x="750" y="233.0" text-anchor="start" font-size="11.2" fill="#3b3b3b">→ bufferization</text><text x="750" y="249.5" text-anchor="start" font-size="11.2" fill="#3b3b3b">   .to_tensor %c</text><text x="750" y="266.0" text-anchor="start" font-size="11.2" fill="#3b3b3b">缝上中途状态</text><text x="750" y="340" text-anchor="start" font-size="11.5" fill="#6b6459">to_tensor</text><path d="M 947.5,227.8 Q 955.9,227.7 968.1,228.3" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 967.1,229.3 Q 961.3,232.0 955.8,234.3" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 967.3,229.6 Q 960.5,225.5 955.8,223.4" fill="none" stroke="#6b6459" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 968.9,104.0 Q 1073.1,103.0 1178.9,103.1 M 1179.2,104.7 Q 1178.6,228.1 1178.4,354.3 M 1178.6,354.8 Q 1072.2,354.2 969.1,354.6 M 967.4,352.8 Q 967.2,227.8 967.3,104.5 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="982" y="132" text-anchor="start" font-size="15" fill="#3b3b3b">S4 合法性验收</text><path d="M 982.0,144.3 Q 1047.1,143.4 1112.5,143.3 M 1111.7,144.7 Q 1112.8,157.0 1112.6,169.1 M 1112.0,168.2 Q 1047.8,169.4 981.3,169.1 M 982.8,169.8 Q 982.3,156.0 982.7,143.2 Z" fill="white" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="1047.04" y="162.0" text-anchor="middle" font-size="11.5" fill="#3b3b3b">ConversionTarget</text><text x="982" y="200.0" text-anchor="start" font-size="11.2" fill="#3b3b3b">终图 ∩ 非法集</text><text x="982" y="216.5" text-anchor="start" font-size="11.2" fill="#3b3b3b">     = ∅  ✓</text><text x="982" y="233.0" text-anchor="start" font-size="11.2" fill="#3b3b3b">3 op → 14 op</text><text x="982" y="249.5" text-anchor="start" font-size="11.2" fill="#3b3b3b">mini 方言清零</text><text x="982" y="266.0" text-anchor="start" font-size="11.2" fill="#3b3b3b">（full 模式）</text><text x="982" y="340" text-anchor="start" font-size="11.5" fill="#6b6459">全绿才算完成</text><text x="40" y="402" text-anchor="start" font-size="15" fill="#6b6459">S2 动手前必须填好的三张任务清单（实践的核心交付）：</text><path d="M 38.8,417.6 Q 219.2,419.0 399.6,417.8 M 400.7,418.2 Q 400.8,507.9 398.8,594.7 M 401.0,596.2 Q 219.0,595.1 39.1,597.0 M 39.2,596.3 Q 39.4,506.3 40.9,417.4 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="446" text-anchor="start" font-size="14.5" fill="#3b3b3b">① 类型任务（TypeConverter）</text><text x="56" y="472.0" text-anchor="start" font-size="11.8" fill="#3b3b3b">%x  tensor&lt;4x6xf32&gt; → memref&lt;4x6,</text><text x="56" y="489.5" text-anchor="start" font-size="11.8" fill="#3b3b3b">                        strided&lt;[6,1]&gt;  96 B</text><text x="56" y="507.0" text-anchor="start" font-size="11.8" fill="#3b3b3b">%w  tensor&lt;6x3xf32&gt; → memref&lt;6x3,</text><text x="56" y="524.5" text-anchor="start" font-size="11.8" fill="#3b3b3b">                        strided&lt;[3,1]&gt;  72 B</text><text x="56" y="542.0" text-anchor="start" font-size="11.8" fill="#3b3b3b">%c  tensor&lt;4x3xf32&gt; → alloc 48 B</text><text x="56" y="559.5" text-anchor="start" font-size="11.8" fill="#3b3b3b">shape/元素类型不变，只换「读法」</text><path d="M 423.8,418.2 Q 613.5,416.9 805.1,417.3 M 805.0,417.2 Q 803.5,506.4 804.8,597.0 M 804.4,595.5 Q 613.3,596.9 424.9,596.5 M 422.8,595.7 Q 422.8,505.9 424.5,417.3 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="440" y="446" text-anchor="start" font-size="14.5" fill="#3b3b3b">② 索引任务（地址＋边界）</text><text x="440" y="472.0" text-anchor="start" font-size="11.8" fill="#3b3b3b">A[i,k]: addr = 6·i + 1·k   i∈[0,4) ← A.shape[0]</text><text x="440" y="489.5" text-anchor="start" font-size="11.8" fill="#3b3b3b">B[k,j]: addr = 3·k + 1·j   j∈[0,3) ← B.shape[1]</text><text x="440" y="507.0" text-anchor="start" font-size="11.8" fill="#3b3b3b">C[i,j]: addr = 3·i + 1·j   k∈[0,6) ← 内维契约</text><text x="440" y="524.5" text-anchor="start" font-size="11.8" fill="#3b3b3b">探针 (i=3,j=2,k=5): addr = 23 / 17 / 11</text><text x="440" y="542.0" text-anchor="start" font-size="11.8" fill="#3b3b3b">vs numpy ravel_multi_index 全部 ✓</text><path d="M 827.1,417.4 Q 1012.8,418.1 1199.2,418.4 M 1200.4,419.1 Q 1199.5,508.3 1201.2,596.7 M 1199.1,596.5 Q 1012.9,594.8 828.5,597.3 M 827.3,596.0 Q 828.2,506.6 826.7,418.5 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="844" y="446" text-anchor="start" font-size="14.5" fill="#3b3b3b">③ 输出初始化任务（alloc 不清零）</text><text x="844" y="472.0" text-anchor="start" font-size="11.8" fill="#3b3b3b">A fill 0＋读改写：位等价，＋96 B 流量</text><text x="844" y="489.5" text-anchor="start" font-size="11.8" fill="#3b3b3b">B iter_args(%acc=0.0)：位等价，＋0 B</text><text x="844" y="507.0" text-anchor="start" font-size="11.8" fill="#3b3b3b">  ✓ 选定（寄存器累加，只写一次）</text><text x="844" y="524.5" text-anchor="start" font-size="11.8" fill="#3b3b3b">什么都不做：垃圾值起步 = 未定义行为</text><text x="844" y="542.0" text-anchor="start" font-size="11.8" fill="#3b3b3b">  （探针 P2 实测 max|diff| = 777.0001）</text><path d="M 40.3,626.1 Q 620.2,625.5 1199.1,625.9 M 1199.9,624.8 Q 1200.0,700.7 1199.1,776.6 M 1200.0,777.2 Q 620.0,776.6 40.9,776.0 M 39.7,776.0 Q 40.4,701.2 40.2,626.3 Z" fill="white" stroke="#6b6459" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><text x="58" y="654" text-anchor="start" font-size="14.5" fill="#6b6459">两条设计备注（衔接前后的天）</text><text x="58" y="680" text-anchor="start" font-size="12.5" fill="#3b3b3b">1. Day 83 终图剩下的 reshape((24,)→(4,6)) 在 Lowering 里免费：24 元素连续存储，重排只是</text><text x="58" y="702" text-anchor="start" font-size="12.5" fill="#3b3b3b">   strides=[6,1] 的元信息改写，零搬运（Day 84 补讲 1 的 shares_memory=True 已证明）→ 选做挑战。</text><text x="58" y="724" text-anchor="start" font-size="12.5" fill="#3b3b3b">2. Day 86 把 S2 从「规则表」变成真正的 ConversionPattern 骨架（ConversionPatternRewriter 的</text><text x="58" y="746" text-anchor="start" font-size="12.5" fill="#3b3b3b">   原子提交、失败处理）——上面三张清单就是那天的填空题：类型/索引/初始化各就各位。</text></g></svg>