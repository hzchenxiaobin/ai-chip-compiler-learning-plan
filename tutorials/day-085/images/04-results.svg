ound" stroke-linejoin="round"/><text x="58" y="590" text-anchor="start" font-size="15" fill="#79b26a">测试计划总览（真实执行，全部 PASS）</text><text x="58" y="614" text-anchor="start" font-size="13" fill="#79b26a">PASS</text><text x="110" y="614" text-anchor="start" font-size="13" fill="#3b3b3b">TP1 类型完整性</text><text x="58" y="634" text-anchor="start" font-size="11.5" fill="#6b6459">strides vs 行主序计算值</text><text x="428" y="614" text-anchor="start" font-size="13" fill="#79b26a">PASS</text><text x="480" y="614" text-anchor="start" font-size="13" fill="#3b3b3b">TP2 索引探针</text><text x="428" y="634" text-anchor="start" font-size="11.5" fill="#6b6459">addr vs ravel_multi_index</text><text x="798" y="614" text-anchor="start" font-size="13" fill="#79b26a">PASS</text><text x="850" y="614" text-anchor="start" font-size="13" fill="#3b3b3b">TP3 输出初始化</text><text x="798" y="634" text-anchor="start" font-size="11.5" fill="#6b6459">三策略 vs 同序参考</text><text x="58" y="666" text-anchor="start" font-size="13" fill="#79b26a">PASS</text><text x="110" y="666" text-anchor="start" font-size="13" fill="#3b3b3b">TP4 合法性收敛</text><text x="58" y="686" text-anchor="start" font-size="11.5" fill="#6b6459">full/partial 两种模式</text><text x="428" y="666" text-anchor="start" font-size="13" fill="#79b26a">PASS</text><text x="480" y="666" text-anchor="start" font-size="13" fill="#3b3b3b">TP5 边界缝合</text><text x="428" y="686" text-anchor="start" font-size="11.5" fill="#6b6459">to_tensor 物化钩子</text><text x="798" y="666" text-anchor="start" font-size="13" fill="#79b26a">PASS</text><text x="850" y="666" text-anchor="start" font-size="13" fill="#3b3b3b">TP6 执行等价</text><text x="798" y="686" text-anchor="start" font-size="11.5" fill="#6b6459">循环 IR vs 同序参考</text><text x="58" y="716" text-anchor="start" font-size="11.8" fill="#6b6459">附注：循环 IR vs np.matmul 的 max|diff| = 2.384e-07（累加顺序不同，只记录不判红绿）；位等价的对照对象是同序 fp32 参考。</text></g></svg>