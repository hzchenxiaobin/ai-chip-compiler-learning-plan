 639.3,252.6 Q 639.5,232.2 638.7,212.6 Z" fill="white" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="238" text-anchor="start" font-size="12.5" fill="#3b3b3b">P2 忘了初始化</text><path d="M 782.3,219.5 Q 808.1,219.1 834.3,219.2 M 834.5,219.9 Q 833.6,232.6 834.4,245.4 M 833.4,244.5 Q 808.5,244.9 782.7,244.8 M 782.0,245.8 Q 781.3,231.7 782.3,219.2 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="808" y="238" text-anchor="middle" font-size="13" fill="#79b26a">绿</text><path d="M 870.8,219.4 Q 896.7,218.4 922.7,218.5 M 922.3,218.3 Q 921.3,232.5 922.3,245.7 M 921.2,245.6 Q 896.1,244.3 870.1,245.6 M 869.4,245.0 Q 870.7,232.0 870.2,219.2 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="896" y="238" text-anchor="middle" font-size="13" fill="#79b26a">绿</text><path d="M 957.3,219.3 Q 983.7,218.9 1009.8,219.0 M 1010.2,218.3 Q 1009.7,231.3 1009.4,245.6 M 1009.6,244.6 Q 984.4,245.3 958.6,245.4 M 957.6,245.5 Q 958.8,232.6 958.7,218.2 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="984" y="238" text-anchor="middle" font-size="13" fill="#d96c5c">红</text><path d="M 1046.6,219.0 Q 1072.7,219.7 1098.8,219.4 M 1098.1,218.6 Q 1098.3,231.2 1098.0,245.6 M 1098.4,245.6 Q 1071.8,245.5 1046.6,245.3 M 1045.9,245.7 Q 1045.5,231.3 1045.9,219.7 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="1072" y="238" text-anchor="middle" font-size="13" fill="#d96c5c">红</text><path d="M 639.2,251.3 Q 900.8,251.8 1160.5,252.4 M 1161.3,250.9 Q 1159.1,273.2 1159.4,291.8 M 1160.4,293.0 Q 900.0,292.3 639.3,293.2 M 639.8,292.8 Q 639.9,270.9 639.9,252.7 Z" fill="white" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="278" text-anchor="start" font-size="12.5" fill="#3b3b3b