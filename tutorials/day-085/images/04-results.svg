<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760"><rect x="3" y="3" width="1194" height="754" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="30" y="44" text-anchor="start" font-size="25" fill="#3b3b3b">实测结果：测试计划咬得住人（6/6 PASS ＋ 3 探针全红）</text><text x="30" y="70" text-anchor="start" font-size="14.5" fill="#6b6459">环境：Linux aarch64 · Python 3.11.4 · numpy 1.26.4 · 种子 85——全部真实运行，无估算</text><path d="M 30.3,81.8 Q 601.1,82.3 1170.8,81.2" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><text x="40" y="112" text-anchor="start" font-size="15" fill="#6b6459">对照实验：输出初始化三策略（同一 A(4,6)@B(6,3)，同一参考）</text><path d="M 38.7,132.0 Q 321.2,132.0 600.6,132.3 M 599.1,132.8 Q 600.0,178.8 600.5,228.8 M 600.1,227.1 Q 320.7,227.2 40.7,228.5 M 40.2,228.3 Q 41.1,179.8 38.8,133.2 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="160" text-anchor="start" font-size="14.5" fill="#3b3b3b">方案 B：iter_args（选定）</text><text x="58" y="182" text-anchor="start" font-size="11.8" fill="#6b6459">%acc 从常量 0.0 起步</text><text x="58" y="182" text-anchor="start" font-size="11.8" fill="#6b6459">C 每元素只写一次</text><text x="58" y="208" text-anchor="start" font-size="13" fill="#79b26a">max|diff| = 0（位等价）</text><text x="300" y="208" text-anchor="start" font-size="12" fill="#6b6459">额外流量 +0 B</text><text x="566" y="176" text-anchor="middle" font-size="30" fill="#79b26a">✓</text><path d="M 38.9,241.5 Q 319.6,241.0 598.8,240.8 M 599.7,242.6 Q 600.7,290.2 601.0,336.9 M 599.9,336.8 Q 320.0,337.2 40.5,337.3 M 39.6,338.1 Q 39.9,291.1 39.3,242.5 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="270" text-anchor="start" font-size="14.5" fill="#3b3b3b">方案 A：fill 0 ＋ 读改写</text><text x="58" y="292" text-anchor="start" font-size="11.8" fill="#6b6459">先 fill 再 load-accumulate</text><text x="58" y="318" text-anchor="start" font-size="13" fill="#5f8fcb">max|diff| = 0（位等价）</text><text x="300" y="318" text-anchor="start" font-size="12" fill="#6b6459">额外流量 +96 B（2×M×N×4）</text><text x="566" y="286" text-anchor="middle" font-size="30" fill="#5f8fcb">✓</text><path d="M 39.8,353.2 Q 320.4,352.2 599.0,351.3 M 599.9,350.8 Q 598.8,398.8 600.8,448.5 M 601.2,447.3 Q 320.8,446.8 40.2,448.3 M 41.1,447.7 Q 39.7,400.0 39.7,353.0 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="380" text-anchor="start" font-size="14.5" fill="#3b3b3b">A′：什么都不做</text><text x="58" y="402" text-anchor="start" font-size="11.8" fill="#6b6459">读改写从垃圾 777.0 起步</text><text x="58" y="428" text-anchor="start" font-size="13" fill="#d96c5c">max|diff| = 777.0001</text><text x="300" y="428" text-anchor="start" font-size="12" fill="#6b6459">＝未定义行为</text><text x="566" y="396" text-anchor="middle" font-size="30" fill="#d96c5c">✗</text><text x="40" y="468.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">结论：初始化是 Lowering 的显式任务——alloc 不清零，</text><text x="40" y="485.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">「忘了」不是性能问题，是正确性问题。</text><text x="640" y="112" text-anchor="start" font-size="15" fill="#6b6459">探针矩阵：故意埋 3 个 bug，看哪些检查变红</text><path d="M 639.4,131.8 Q 899.4,130.8 1159.2,132.4 M 1160.1,132.9 Q 1161.2,152.4 1158.8,172.7 M 1159.1,173.0 Q 898.9,171.2 638.9,171.3 M 640.9,171.0 Q 640.0,151.0 640.0,132.8 Z" fill="white" stroke="#6b6459" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="158" text-anchor="start" font-size="13" fill="#6b6459">探针</text><text x="808" y="158" text-anchor="middle" font-size="13" fill="#6b6459">TP1</text><text x="896" y="158" text-anchor="middle" font-size="13" fill="#6b6459">TP2</text><text x="984" y="158" text-anchor="middle" font-size="13" fill="#6b6459">TP3</text><text x="1072" y="1