ill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">MLIR 探针（5）</text><path d="M 40.0,530.0 L 222.8,529.3 L 407.6,529.1 L 591.1,530.4 L 773.7,529.3 L 956.5,531.0 L 1140.0,530.0 L 1140.0,530.0 L 1139.4,553.1 L 1140.3,576.7 L 1139.0,599.4 L 1140.6,623.7 L 1139.8,646.4 L 1140.0,670.0 L 1140.0,670.0 L 955.9,669.8 L 773.3,669.7 L 589.2,669.0 L 406.8,670.3 L 223.5,669.8 L 40.0,670.0 L 40.0,670.0 L 40.5,646.1 L 40.0,624.3 L 40.0,600.3 L 40.2,577.0 L 40.7,553.3 L 40.0,530.0" fill="#f8f0e2" stroke="#6b6357" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="556" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="13" fill="#a8772e" text-anchor="start" opacity="1.0" font-weight="bold">带走的三句话</text><text x="60" y="578" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11" fill="#a8772e" text-anchor="start" opacity="1.0" font-weight="bold">1</text><text x="74" y="578" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">结构账本（state_hash）只回答「值怎么算」；内存账本（buffer/strides/traffic）回答「字节怎么搬」</text><text x="74" y="596" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">—— 同一张图在视图世界和物理世界是两种程序（48B vs 144B）。</text><text x="60" y="618" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11" fill="#a8772e" text-anchor="start" opacity="1.0" font-weight="bold">2</text><text x="74" y="618" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">每条消除/传播规则的守卫，都是某个反例的墓碑</text><text x="74" y="636" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">—— 守卫不是官僚作风，是语义边界。</text><text x="60" y="658" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11" fill="#a8772e" text-anchor="start" opacity="1.0" font-weight="bold">3</text><text x="74" y="658" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">值等价是改写的必要条件，不是充分条件：</text><text x="74" y="676" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11" fill="#3b352d" text-anchor="start" opacity="1.0" font-weight="normal">别名、布局、副作用、精度、轴语义都住在值世界看不见的地方。</text><text x="40" y="682" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11.5" fill="#84796a" text-anchor="start" opacity="1.0" font-weight="normal">一页复盘：code/review-onepage.md ｜ 反例集全文：code/counterexamples.md</text></svg>
