ill="#9CBF8E" text-anchor="middle" font-weight="bold">总 42ms（1.4×——真并行）</text><path d="M 58.7,578.4 Q 538.2,577.9 1021.0,581.1 Q 1022.4,609.8 1020.9,641.4 Q 540.1,641.8 58.7,640.3 Q 60.6,609.7 58.7,578.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.8"/><text x="540.0" y="604" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">异步的全部收益：调用方从「等 60ms」变「等 0.02ms＋自由时间」——</text><text x="540.0" y="626" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">自由时间可以准备下一批输入、launch 更多 kernel、或干脆省电；同步点从「每次调用」减到「真正需要结果时」</text></svg>
