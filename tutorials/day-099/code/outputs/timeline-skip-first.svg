<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 466" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive">
<style>text { fill:#3B3B3B; } .t { font-size:23px; font-weight:bold; }.s { font-size:13.5px; fill:#6b6257; } .h { font-size:13px; font-weight:bold; }.n { font-size:15px; font-weight:bold; } .d { font-size:11.5px; fill:#5a554d; }.v { font-size:13.5px; font-weight:bold; }.box { stroke:#3B3B3B; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }</style>
