<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 648" width="1200" height="648"><rect x="3" y="3" width="1194" height="642" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="60" y="54" text-anchor="start" font-size="25" fill="#3b3b3b">冻结点怎么找：半间距追上（或追平）增量的那一档</text><text x="60" y="82" text-anchor="start" font-size="14" fill="#6b6459">FP16：在 [2^k, 2^(k+1)) 档内，间距 = 2^(k-10)，半间距 = 2^(k-11)——和一旦爬进「半间距 ≥ 增量」的档，每次加法都被舍回</text><path d="M 180.8,460.5 Q 466.9,459.1 753.3,461.2" fill="none" stroke="#3b3b3b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 754.5,460.2 Q 748.7,462.4 742.4,466.3" fill="none" stroke="#3b3b3b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 754.5,460.6 Q 747.6,457.6 742.6,453.8" fill="none" stroke="#3b3b3b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 180.1,459.9 Q 179.9,297.8 179.1,138.0" fill="none" stroke="#3b3b3b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 180.2,138.4 Q 183.0,143.4 186.1,150.0" fill="none" stroke="#3b3b3b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 179.7,138.4 Q 176.9,144.2 174.0,149.1" fill="none" stroke="#3b3b3b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="128" y="300" text-anchor="start" font-size="13" fill="#6b6459" transform="rotate(-90 128 300)">半间距（log 刻度）</text><path d="M 179.6,440.5 Q 459.6,440.8 740.1,440.5" fill="none" stroke="#6b6459" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><text x="170" y="445.4085703216096" text-anchor="end" font-size="13" fill="#6b6459">0.01</text><path d="M 180.1,323.3 Q 460.4,323.1 740.4,323.8" fill="none" stroke="#6b6459" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><text x="170" y="328.38610334262296" text-anchor="end" font-size="13" fill="#6b6459">0.1</text><path d="M 180.4,206.5 Q 460.2,206.2 740.3,206.5" fill="none" stroke="#6b6459" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><text x="170" y="211.36363636363637" text-anchor="end" font-size="13" fill="#6b6459">1</text><path d="M 179.6,453.5 Q 459.5,304.7 739.3,157.5" fill="none" stroke="#5f8fcb" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><text x="285" y="372" text-anchor="start" font-size="15" fill="#5f8fcb" transform="rotate(-28 285 372)">半间距 = 2^(k-11)</text><path d="M 180.0,323.1 Q 460.0,323.0 740.0,323.4" fill="none" stroke="#e8973f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 7"/><text x="196" y="309" text-anchor="start" font-size="13.5" fill="#e8973f">增量 0.1（存储值 0.09998）</text><path d="M 180.1,206.2 Q 460.2,206.5 740.0,206.5" fill="none" stroke="#79b26a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 7"/><text x="196" y="192" text-anchor="start" font-size="13.5" fill="#79b26a">增量 1.0（精确值）</text><circle cx="425.2" cy="323.4" r="7" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.4"/><path d="M 446.4,323.5 Q 446.9,391.8 447.0,460.0" fill="none" stroke="#d96c5c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/><path d="M 431.2,329.4 Q 443.2,360.0 462.0,380.0" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 461.6,380.5 Q 455.2,377.6 449.8,375.7" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 461.7,379.8 Q 460.5,374.2 457.9,367.6" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="468" y="388" text-anchor="start" font-size="13" fill="#d96c5c">半间距首次 ≥ 0.09998 的档是 k=8</text><text x="468" y="410" text-anchor="start" font-size="13" fill="#d96c5c">→ [256,512) → 冻结在 256（实验 D ✓）</text><circle cx="646.7" cy="206.4" r="7" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.4"/><path d="M 638.7,198.4 Q 600.0,175.0 585.0,185.0" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 584.3,184.6 Q 587.8,178.9 591.8,173.5" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 584.8,185.4 Q 592.1,183.5 597.3,182.8" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="478" y="168" text-anchor="start" font-size="13" fill="#d96c5c">k=11 档半间距恰好 = 1.0（平局）</text><text x="478" y="190" text-anchor="start" font-size="13" fill="#d96c5c">→ 舍入到偶数送回 2048（5.4 实测 ✓）</text><text x="200" y="356" text-anchor="start" font-size="12" fill="#6b6459">半间距 &lt; 增量 → 还能爬</text><text x="502" y="444" text-anchor="start" font-size="12" fill="#6b6459">半间距 ≥ 增量 → 加了被舍回（吸收）</text><path d="M 179.6,455.2 Q 179.9,460.3 180.1,465.3" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="180.0" y="480" text-anchor="middle" font-size="10" fill="#3b3b3b">[16,32)</text><path d="M 246.3,455.1 Q 247.0,459.8 246.9,465.0" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="246.66666666666666" y="480" text-anchor="middle" font-size="10" fill="#3b3b3b">[32,64)</text><path d="M 313.3,454.9 Q 313.4,460.2 313.2,465.3" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="313.3333333333333" y="480" text-anchor="middle" font-size="10" fill="#3b3b3b">[64,128)</text><path d="M 380.3,455.1 Q 379.7,460.0 379.7,464.8" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="380.0" y="480" text-anchor="middle" font-size="10" fill="#3b3b3b">[128,256)</text><path d="M 446.3,454.8 Q 446.9,459.7 446.7,465.0" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="446.66666666666663" y="480" text-anchor="middle" font-size="10.5" fill="#e8973f">[256,512)</text><path d="M 513.3,455.1 Q 513.2,460.0 513.5,464.7" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="513.3333333333333" y="480" text-anchor="middle" font-size="10" fill="#3b3b3b">[512,1024)</text><path d="M 580.3,455.3 Q 579.6,460.2 580.2,465.3" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="580.0" y="480" text-anchor="middle" font-size="10" fill="#3b3b3b">[1024,2048)</text><path d="M 646.5,455.1 Q 646.4,459.8 646.8,464.8" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="646.6666666666666" y="480" text-anchor="middle" font-size="10.5" fill="#79b26a">[2048,4096)</text><path d="M 713.6,455.2 Q 713.1,460.0 713.3,465.3" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="713.3333333333333" y="480" text-anchor="middle" font-size="10" fill="#3b3b3b">[4096,8192)</text><text x="460" y="507" text-anchor="middle" font-size="13" fill="#6b6459">和所在的档（binade [2^k, 2^(k+1))）→</text><text x="798" y="140" text-anchor="start" font-size="15" fill="#3b3b3b">已实测的落点（改一个参数就能对答案）</text><path d="M 789.3,155.2 Q 969.7,156.0 1148.8,156.7 M 1149.2,155.7 Q 1150.0,201.1 1149.4,244.8 M 1148.7,245.5 Q 971.0,246.6 789.3,247.0 M 789.8,245.7 Q 791.0,201.7 788.9,155.7 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="802" y="180" text-anchor="start" font-size="12.5" fill="#3b3b3b">增量 0.1（存储 0.09998）：</text><text x="802" y="203" text-anchor="start" font-size="12.5" fill="#3b3b3b">[128,256) 半间距 0.0625 → 还能爬</text><text x="802" y="226" text-anchor="start" font-size="12.5" fill="#3b3b3b">进 [256,512) 半间距 0.125 → 冻结 256（实验 D ✓）</text><path d="M 790.9,258.6 Q 968.9,257.3 1151.0,258.7 M 1150.4,257.6 Q 1149.1,302.3 1150.2,349.2 M 1150.9,348.0 Q 971.3,348.1 790.6,347.2 M 790.0,347.7 Q 790.6,302.3 789.6,259.3 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="802" y="282" text-anchor="start" font-size="12.5" fill="#3b3b3b">增量 1.0：[1024,2048) 半间距 0.5 → 还能爬</text><text x="802" y="305" text-anchor="start" font-size="12.5" fill="#3b3b3b">到 [2048,4096) 半间距 1 = 1.0 → 平局</text><text x="802" y="328" text-anchor="start" font-size="12.5" fill="#3b3b3b">就近舍入到偶数 → 送回 2048（5.4 实测 ✓）</text><path d="M 790.5,358.9 Q 969.6,361.3 1151.1,359.3 M 1150.5,358.9 Q 1150.2,393.4 1150.1,427.6 M 1151.2,428.1 Q 969.8,428.7 790.5,428.1 M 790.2,428.9 Q 789.6,394.2 790.4,359.3 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="802" y="384" text-anchor="start" font-size="12.5" fill="#3b3b3b">BF16 同一规律（间距 = 2^(k-7)）：</text><text x="802" y="407" text-anchor="start" font-size="12.5" fill="#3b3b3b">0.1 → 冻结 32；1.0 → 冻结 256（均已实测 ✓）</text><path d="M 789.0,441.0 Q 969.3,440.9 1150.0,440.9 M 1150.1,440.1 Q 1149.7,479.6 1148.8,519.1 M 1149.1,519.2 Q 970.9,518.6 789.9,518.5 M 791.2,518.2 Q 790.3,477.9 790.9,440.4 Z" fill="none" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="802" y="464" text-anchor="start" font-size="12.5" fill="#d96c5c">必做练习：增量 0.01（存储 0.010002）</text><text x="802" y="487" text-anchor="start" font-size="12.5" fill="#d96c5c">相当于再画一条更低的水平线——</text><text x="802" y="510" text-anchor="start" font-size="12.5" fill="#d96c5c">半间距追上它的档是哪一档？先笔算再运行。</text><path d="M 60.4,549.0 Q 605.9,548.6 1149.0,548.9 M 1150.6,547.2 Q 1150.9,587.1 1149.7,626.7 M 1150.1,627.3 Q 605.6,625.8 61.2,626.8 M 60.2,626.3 Q 61.2,587.9 59.0,548.1 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="578" text-anchor="start" font-size="15.5" fill="#3b3b3b">一句话：冻结点 = 半间距首次追上（或追平）增量的那一档的起点 2^k。</text><text x="80" y="605" text-anchor="start" font-size="13.5" fill="#6b6459">先笔算交点，就能在运行之前预测实验 D／E、5.4 改参数和必做练习的结果。</text></g></svg>