<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 656" width="1200" height="656"><rect x="3" y="3" width="1194" height="650" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="60" y="54" text-anchor="start" font-size="25" fill="#3b3b3b">Kahan 补偿求和：被吃掉的低位先记账，攒够了再进场</text><text x="60" y="82" text-anchor="start" font-size="14" fill="#6b6459">核心四句 y = item - c；t = s + y；c = (t - s) - y；s = t——用实验 B 的 [1e8, 0.1×100000, -1e8] 真实跑前 43 步</text><path d="M 69.4,125.4 Q 169.6,126.1 268.9,125.3 M 269.8,124.7 Q 270.5,157.2 270.4,190.2 M 271.0,192.2 Q 169.9,191.5 70.6,191.6 M 70.7,191.3 Q 71.1,159.0 69.7,124.2 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="170" y="153" text-anchor="middle" font-size="15.5" fill="#3b3b3b">① y = item - c</text><text x="170" y="175" text-anchor="middle" font-size="11.5" fill="#6b6459">先扣掉上次多付的</text><path d="M 301.1,124.5 Q 399.2,125.0 500.3,124.4 M 499.6,124.0 Q 499.1,158.2 500.0,191.2 M 500.7,190.9 Q 399.3,191.3 300.6,192.0 M 299.2,190.7 Q 299.2,158.6 299.4,126.2 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="400" y="153" text-anchor="middle" font-size="15.5" fill="#3b3b3b">② t = s + y</text><text x="400" y="175" text-anchor="middle" font-size="11.5" fill="#6b6459">试加（结果会被舍入）</text><path d="M 301.2,249.5 Q 400.0,250.1 500.7,248.9 M 500.3,249.3 Q 500.9,282.3 498.8,316.8 M 499.5,315.5 Q 400.9,316.9 299.7,317.1 M 299.3,315.4 Q 301.0,282.5 299.6,250.3 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="400" y="278" text-anchor="middle" font-size="15.5" fill="#3b3b3b">③ c = (t - s) - y</text><text x="400" y="300" text-anchor="middle" font-size="11.5" fill="#6b6459">这一步丢的/多付的 → 记账</text><path d="M 69.7,250.5 Q 169.0,248.8 270.5,249.0 M 271.0,248.8 Q 269.1,283.7 270.9,315.4 M 270.9,314.9 Q 169.1,315.6 70.7,316.4 M 71.1,315.5 Q 70.0,282.8 69.1,249.2 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="170" y="278" text-anchor="middle" font-size="15.5" fill="#3b3b3b">④ s = t</text><text x="170" y="300" text-anchor="middle" font-size="11.5" fill="#6b6459">和前进（或原地不动）</text><path d="M 273.9,156.7 Q 284.4,158.9 296.3,158.4" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 296.2,158.6 Q 290.6,160.4 284.4,163.1" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 296.6,158.7 Q 290.7,155.8 284.1,152.6" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 399.0,195.8 Q 399.1,221.3 398.8,247.1" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 400.2,246.6 Q 397.4,240.6 393.7,234.6" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 400.6,245.9 Q 402.4,239.8 405.8,233.8" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 296.0,281.8 Q 285.5,283.7 275.1,281.7" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 273.6,282.4 Q 280.0,280.1 285.7,277.4" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 273.6,282.6 Q 279.3,285.6 285.2,289.4" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 170.1,246.3 Q 169.6,219.6 171.0,193.7" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 169.8,194.8 Q 173.0,201.4 175.8,206.7" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 170.2,195.7 Q 166.5,200.9 163.8,206.3" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="178" y="218" text-anchor="start" font-size="11.5" fill="#6b6459">下一轮</text><text x="412" y="218" text-anchor="start" font-size="11.5" fill="#6b6459">舍入损失</text><text x="412" y="236" text-anchor="start" font-size="11.5" fill="#6b6459">在这里现形</text><text x="285" y="308" text-anchor="middle" font-size="11.5" fill="#6b6459">账本 c 随下一轮的 y 一起结清</text><text x="70" y="112" text-anchor="start" font-size="12.5" fill="#6b6459">输入流 item：0.1, 0.1, 0.1, …（每次进一个）</text><path d="M 129.8,105.3 Q 131.3,112.9 131.3,121.1" fill="none" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 130.5,120.6 Q 127.6,114.1 124.8,107.9" fill="none" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 129.8,120.3 Q 132.6,114.2 135.3,108.0" fill="none" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 59.9,341.1 Q 284.0,339.4 509.1,340.7 M 509.1,341.1 Q 510.9,384.9 509.5,428.8 M 509.8,428.5 Q 283.9,429.1 60.7,427.6 M 58.8,428.5 Q 59.0,385.2 59.2,340.9 Z" fill="none" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><text x="78" y="366" text-anchor="start" font-size="13" fill="#3b3b3b">对照右边看：s 在 1e8 档的间距是 8，</text><text x="78" y="390" text-anchor="start" font-size="13" fill="#3b3b3b">单个 0.1 进不去；但 c 把它们一个个攒起来，</text><text x="78" y="414" text-anchor="start" font-size="13" fill="#3b3b3b">攒过半个间距（4）就能一次跳进下一格。</text><text x="560" y="125" text-anchor="start" font-size="15" fill="#3b3b3b">真实变量值（FP32 存储值，实验 B 数据）</text><path d="M 552.3,140.2 Q 811.6,140.5 1070.6,140.4 M 1069.7,139.8 Q 1069.4,154.4 1070.7,167.3 M 1069.8,167.9 Q 810.7,167.4 551.4,168.2 M 551.8,167.8 Q 551.6,154.2 551.6,140.3 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="564" y="160" text-anchor="start" font-size="12" fill="#3b3b3b">步</text><text x="614" y="160" text-anchor="start" font-size="12" fill="#3b3b3b">item</text><text x="699" y="160" text-anchor="start" font-size="12" fill="#3b3b3b">y</text><text x="819" y="160" text-anchor="start" font-size="12" fill="#3b3b3b">t = s</text><text x="954" y="160" text-anchor="start" font-size="12" fill="#3b3b3b">c（账本）</text><path d="M 552.3,197.6 Q 811.0,197.8 1069.6,198.2" fill="none" stroke="#6b6459" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="564" y="189" text-anchor="start" font-size="11.5" fill="#3b3b3b">1</text><text x="614" y="189" text-anchor="start" font-size="11.5" fill="#3b3b3b">1e8</text><text x="699" y="189" text-anchor="start" font-size="11.5" fill="#3b3b3b">1e8</text><text x="819" y="189" text-anchor="start" font-size="11.5" fill="#3b3b3b">100000000</text><text x="954" y="189" text-anchor="start" font-size="11.5" fill="#3b3b3b">0</text><path d="M 551.8,228.3 Q 810.8,227.9 1070.0,227.7" fill="none" stroke="#6b6459" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="564" y="219" text-anchor="start" font-size="11.5" fill="#3b3b3b">2</text><text x="614" y="219" text-anchor="start" font-size="11.5" fill="#3b3b3b">0.1</text><text x="699" y="219" text-anchor="start" font-size="11.5" fill="#3b3b3b">0.1</text><text x="819" y="219" text-anchor="start" font-size="11.5" fill="#3b3b3b">100000000</text><text x="954" y="219" text-anchor="start" font-size="11.5" fill="#3b3b3b">-0.1</text><path d="M 551.6,258.1 Q 810.7,258.1 1069.9,258.2" fill="none" stroke="#6b6459" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="564" y="249" text-anchor="start" font-size="11.5" fill="#3b3b3b">3</text><text x="614" y="249" text-anchor="start" font-size="11.5" fill="#3b3b3b">0.1</text><text x="699" y="249" text-anchor="start" font-size="11.5" fill="#3b3b3b">0.2</text><text x="819" y="249" text-anchor="start" font-size="11.5" fill="#3b3b3b">100000000</text><text x="954" y="249" text-anchor="start" font-size="11.5" fill="#3b3b3b">-0.2</text><path d="M 551.8,287.8 Q 811.0,288.4 1070.1,288.0" fill="none" stroke="#6b6459" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="564" y="279" text-anchor="start" font-size="11.5" fill="#3b3b3b">4~40</text><text x="614" y="279" text-anchor="start" font-size="11.5" fill="#3b3b3b">0.1</text><text x="699" y="279" text-anchor="start" font-size="11.5" fill="#3b3b3b">0.3 … 3.9</text><text x="819" y="279" text-anchor="start" font-size="11.5" fill="#3b3b3b">100000000</text><text x="954" y="279" text-anchor="start" font-size="11.5" fill="#3b3b3b">-0.3 … -3.9</text><path d="M 551.6,288.4 Q 810.4,288.5 1069.6,287.6 M 1070.6,288.6 Q 1070.3,302.6 1069.7,318.1 M 1070.6,317.9 Q 811.5,317.9 551.9,318.0 M 551.5,317.9 Q 552.5,303.0 551.8,288.2 Z" fill="#fdead3" stroke="#3b3b3b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="564" y="309" text-anchor="start" font-size="11.5" fill="#3b3b3b">41</text><text x="614" y="309" text-anchor="start" font-size="11.5" fill="#3b3b3b">0.1</text><text x="699" y="309" text-anchor="start" font-size="11.5" fill="#3b3b3b">3.9999983</text><text x="819" y="309" text-anchor="start" font-size="11.5" fill="#3b3b3b">100000000</text><text x="954" y="309" text-anchor="start" font-size="11.5" fill="#3b3b3b">-3.9999983</text><path d="M 551.4,318.2 Q 811.2,317.4 1069.6,318.5 M 1069.5,318.6 Q 1070.2,333.0 1070.1,348.3 M 1069.6,348.2 Q 810.4,348.5 552.4,348.5 M 551.6,348.5 Q 551.7,333.3 551.9,318.5 Z" fill="#e5f1dc" stroke="#3b3b3b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="564" y="339" text-anchor="start" font-size="11.5" fill="#3b3b3b">42</text><text x="614" y="339" text-anchor="start" font-size="11.5" fill="#3b3b3b">0.1</text><text x="699" y="339" text-anchor="start" font-size="11.5" fill="#3b3b3b">4.0999985</text><text x="819" y="339" text-anchor="start" font-size="11.5" fill="#3b3b3b">100000008</text><text x="954" y="339" text-anchor="start" font-size="11.5" fill="#3b3b3b">+3.9000015</text><path d="M 552.2,378.4 Q 810.9,378.2 1070.3,377.8" fill="none" stroke="#6b6459" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="564" y="369" text-anchor="start" font-size="11.5" fill="#3b3b3b">43</text><text x="614" y="369" text-anchor="start" font-size="11.5" fill="#3b3b3b">0.1</text><text x="699" y="369" text-anchor="start" font-size="11.5" fill="#3b3b3b">-3.8000016</text><text x="819" y="369" text-anchor="start" font-size="11.5" fill="#3b3b3b">100000008</text><text x="954" y="369" text-anchor="start" font-size="11.5" fill="#3b3b3b">+3.8000016</text><text x="560" y="396" text-anchor="start" font-size="11" fill="#6b6459">y／c 列显示 7 位有效数字（0.1 的 FP32 存储值是 0.1000000015）</text><text x="560" y="452" text-anchor="start" font-size="12.5" fill="#3b3b3b">第 2 步：0.1 被吸收 → 损失记进 c，c 一路攒到 -3.9999983</text><text x="560" y="476" text-anchor="start" font-size="12.5" fill="#3b3b3b">第 42 步：y 越过半个间距 4 → t 跳到 100000008，多付的 3.9 记回 c（符号反转）</text><text x="560" y="500" text-anchor="start" font-size="12.5" fill="#3b3b3b">第 43 步：y = 0.1 - 3.9 ≈ -3.8，先扣再试加 → 不重复吸收</text><path d="M 60.9,545.2 Q 604.1,546.0 1149.9,544.1 M 1148.9,544.8 Q 1149.1,587.3 1151.3,626.2 M 1151.0,626.5 Q 604.7,628.1 61.2,626.9 M 59.9,625.8 Q 59.4,587.2 59.0,546.3 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="574" text-anchor="start" font-size="15.5" fill="#3b3b3b">关键：s 的间距没变（还是 8），但被吸收的低位没有丢——真和 ≈ s - c。</text><text x="80" y="601" text-anchor="start" font-size="13" fill="#6b6459">第 43 步末 s - c = 100000008 - 3.8000016 ≈ 100000004.2，正是 1e8 ＋ 42 个 0.1 的精确和（差约 2e-6）——误差有界、不随累加次数增长。</text></g></svg>