6.0" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 672.3,265.6 Q 677.5,262.0 681.5,258.3" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 671.8,265.5 Q 679.0,267.8 684.6,268.9" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="675" y="332" text-anchor="start" font-size="12.5" fill="#d96c5c">撞墙 → q=127 → 还原 0.995（被牺牲）</text><text x="55" y="336" text-anchor="start" font-size="12.5" fill="#79b26a">4096 个正常值：max|err| = 0.0039，rms = 0.0023</text><path d="M 55.0,370.0 Q 493.9,370.4 934.6,369.1 M 934.6,369.7 Q 933.8,430.4 934.5,491.1 M 934.8,490.8 Q 495.0,491.6 54.5,492.4 M 55.4,491.0 Q 54.0,431.4 54.7,369.1 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="398" text-anchor="start" font-size="14" fill="#3b3b3b">结论：分位数校准 = 主动选择牺牲谁（3.4 节那句话的数字版）</text><text x="71" y="424" text-anchor="start" font-size="13" fill="#3b3b3b">离群点交给饱和：100.0 → q = 127 → 还原 0.995；4096 个正常值不再为它交 51 倍的税</text><text x="71" y="448" text-anchor="start" font-size="13" fill="#3b3b3b">scale：0.39608 → 0.00783（1/51）；正常值 max|err|：0.1980 → 0.0039、rms：0.1153 → 0.0023</text><text x="71" y="472" text-anchor="start" font-size="12.5" fill="#6b6459">忘掉 clip 的回绕是事故（T05：5.0 → 1.48）；饱和 ＋ 分位数是设计好的牺牲</text></g></svg>