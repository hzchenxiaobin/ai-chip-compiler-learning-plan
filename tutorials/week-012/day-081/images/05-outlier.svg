oke-width="1.8"/><circle cx="880.0" cy="132.0" r="6" fill="#d96c5c" stroke="#3b3b3b" stroke-width="1.8"/><text x="880.0" y="160" text-anchor="middle" font-size="12" fill="#d96c5c">100.0</text><text x="250" y="170" text-anchor="start" font-size="12.5" fill="#6b6459">← 4096 个正常值全挤在这 2% 里（[-1, 1]）</text><path d="M 67.2,148.7 Q 78.1,208.0 90.9,267.7" fill="none" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><path d="M 87.6,150.2 Q 375.1,207.7 659.3,269.0" fill="none" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><text x="105" y="208" text-anchor="start" font-size="12.5" fill="#6b6459">同一段数轴放大 51 倍 → 下面的整把尺</text><text x="108" y="262" text-anchor="start" font-size="13.5" fill="#3b3b3b">策略 B 99.9% 双侧分位：范围 [-1.000, 0.998]，scale = 0.00783（A 的 1/51）</text><path d="M 89.8,271.0 Q 376.1,273.2 659.8,271.2 M 658.8,272.6 Q 660.7,284.6 660.5,295.6 M 659.4,296.2 Q 375.8,295.9 90.0,295.7 M 90.8,297.2 Q 89.4,285.2 90.8,271.8 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="94.0" cy="276.4" r="4" fill="#79b26a" stroke="#3b3b3b" stroke-width="1.8"/><circle cx="122.9" cy="280.4" r="4" fill="#79b26a" stroke="#3b3b3b" stroke-width="1.8"/><circle cx="153.1" cy="285.4" r="4" fill="#79b26a" stroke="#3b3b3b" stroke-width="1.8"/><circle cx="177.3" cy="288.6" r="4" fill="#79b26a" stroke="#3b3b3b" stroke-width="1.8"/><circle cx="199.6" cy="275.2" r="4" fill="#79b26a" stroke="#3b3b3b" stroke-width="1.8"/><circle cx="231.4" cy="279.7" r="4" fill="#79b26a" stroke="#3b3b3b" stroke-width="1.8"/><circle cx="256.9" cy="284.0" r="4" fill="#79b26a" stroke="#3b3b3b" stroke-width="1.8"/><circle cx="279.7" cy="289.0" r="4" fill="#79b26a" stroke="#3b3b3b" stroke-width="1.8"/><circle cx="305.9" cy="275.1" r="4" fill="#79b26a" stroke="#3b3b3b" stroke-width="1.8"/><circle cx="339.1" cy="280.0" r="4" fill="#79b26a" stroke="#3b3b