<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700"><rect x="3" y="3" width="1194" height="694" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="30" y="44" text-anchor="start" font-size="25" fill="#3b3b3b">P2 断链融合：坏 rewire 怎么把 %7 变成悬空引用</text><text x="30" y="72" text-anchor="start" font-size="14" fill="#6b6459">清理后的多使用者图（7 节点）→ 只迁移 relu 使用者的改写 → 终图 5 节点＋悬空的 %7（红项文本全部来自实测输出）</text><path d="M 31.3,84.9 Q 599.3,84.2 1170.0,82.8" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M 39.2,99.5 Q 298.0,99.8 554.1,99.2 M 555.7,99.0 Q 555.0,351.9 554.5,606.1 M 554.5,604.5 Q 297.6,605.3 40.5,605.6 M 41.1,603.9 Q 38.9,352.8 40.3,98.9 Z" fill="white" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="128" text-anchor="start" font-size="15.5" fill="#3b3b3b">① 清理后的多使用者图（11→7，该拒就拒）</text><path d="M 64.5,146.8 Q 124.1,146.9 186.7,146.2 M 186.9,145.8 Q 186.2,163.1 186.3,182.8 M 185.1,182.9 Q 125.6,182.0 64.6,182.6 M 64.2,182.8 Q 64.1,164.0 64.2,146.7 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="125.0" y="161.0" text-anchor="middle" font-size="14" fill="#3b3b3b">%x  arg</text><text x="125.0" y="179.0" text-anchor="middle" font-size="11.5" fill="#6b6459">(2,12)</text><path d="M 63.3,202.4 Q 139.1,202.2 213.8,201.6 M 214.2,202.0 Q 213.7,219.1 214.1,237.5 M 213.1,238.3 Q 138.2,238.8 63.2,237.4 M 63.4,238.0 Q 63.0,220.3 64.9,202.4 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="139.0" y="217.0" text-anchor="middle" font-size="14" fill="#3b3b3b">%13  reshape</text><text x="139.0" y="235.0" text-anchor="middle" font-size="11.5" fill="#6b6459">(4,6)</text><path d="M 299.5,149.5 Q 375.0,150.3 450.9,150.2 M 450.0,149.5 Q 449.