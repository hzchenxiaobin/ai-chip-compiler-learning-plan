" stroke-linecap="round" stroke-linejoin="round"/><path d="M 112.3,319.5 Q 108.8,314.4 106.3,308.0" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 112.4,319.9 Q 114.3,314.3 117.2,308.8" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 299.2,329.0 Q 232.3,334.1 161.2,337.3" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 161.6,335.5 Q 167.2,332.8 172.7,329.8" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 161.5,335.6 Q 168.5,338.1 173.8,340.9" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 111.7,356.9 Q 112.7,366.6 111.9,375.0" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 111.6,376.6 Q 108.5,370.2 105.7,363.8" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 111.5,375.7 Q 114.2,370.8 117.3,364.3" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 159.3,396.7 Q 219.8,395.8 279.1,396.4" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 278.0,395.7 Q 272.8,398.3 265.8,402.2" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 278.3,396.2 Q 271.9,392.6 266.5,390.7" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 204.0,279.0 Q 480.0,282.0 487.0,350.0" fill="none" stroke="#5f8fcb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 486.4,350.5 Q 483.2,344.8 480.5,339.0" fill="none" stroke="#5f8fcb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 487.0,350.6 Q 488.8,344.0 491.8,338.3" fill="none" stroke="#5f8fcb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="262" text-anchor="start" font-size="12" fill="#5f8fcb">第二个使用者：图输出②</text><text x="56" y="470" text-anchor="start" font-size="13" fill="#3b3b3b">matmul %7 的输出有两个使用者：%9 add 和图输出②</text><text x="56" y="494" text-anchor="start" font-size="13" fill="#3b3b3b">融合闸因此正确拒绝（Day 52 单使用者边界）——</text><text x="56" y="518" text-anchor="start" font-size="13" fill="#6b6459">「该拒就拒」也是 16/16 全绿：拒绝得对就是一种正确</text><path d="M 576.2,100.5 Q 726.0,99.9 875.4,99.6 M 875.8,101.3 Q 875.6,353.5 876.0,604.9 M 874.9,605.5 Q 724.8,605.8 574.9,605.5 M 575.8,604.1 Q 574.2,353.6 575.1,99.2 Z" fill="white" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="591" y="128" text-anchor="start" font-size="15.5" fill="#3b3b3b">② 探针 P2 的坏 rewire</text><text x="591" y="150" text-anchor="start" font-size="12.5" fill="#6b6459">忘了查单使用者，只迁移了 relu 的使用者</text><path d="M 599.5,170.2 Q 725.6,170.8 849.7,170.1 M 849.4,169.7 Q 849.3,199.1 849.4,227.2 M 849.8,228.1 Q 724.3,227.9 599.4,227.2 M 599.3,227.6 Q 601.0,198.6 600.3,169.0 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="725.0" y="196.0" text-anchor="middle" font-size="14" fill="#3b3b3b">%14  fused_matmul_bias_relu</text><text x="725.0" y="214.0" text-anchor="middle" font-size="11.5" fill="#6b6459">输入 %13、%12、%8（三个都接对了）</text><path d="M 599.4,262.8 Q 724.5,262.4 849.2,261.9 M 850.9,262.3 Q 849.3,280.4 850.9,298.6 M 849.9,297.7 Q 724.2,298.5 599.1,297.0 M 599.2,297.0 Q 599.9,280.6 600.1,261.8 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="725" y="285" text-anchor="middle" font-size="13" fill="#79b26a">输出① → %14 ✓（rewire 已迁移）</text><path d="M 599.9,317.3 Q 725.1,317.3 849.5,317.6 M 849.2,318.4 Q 849.1,336.8 850.2,354.5 M 849.5,353.8 Q 725.4,354.5 600.4,354.2 M 599.2,353.7 Q 599.3,337.0 599.8,318.9 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="725" y="341" text-anchor="middle" font-size="13" fill="#d96c5c">输出② → %7 ✗（没人迁移它）</text><path d="M 723.9,355.7 Q 725.1,375.3 725.2,393.0" fill="none" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><path d="M 724.8,393.7 Q 722.0,388.4 718.9,382.0" fill="none" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 724.5,394.5 Q 728.3,388.7 730.5,382.1" fill="none" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="742" y="380" text-anchor="start" font-size="13" fill="#d96c5c">悬空</text><path d="M 630.3,397.6 Q 725.6,397.0 819.7,397.3 M 819.1,397.2 Q 819.7,422.4 819.5,446.1 M 819.1,445.7 Q 724.4,446.9 629.5,445.8 M 630.5,446.1 Q 629.3,422.9 629.3,398.0 Z" fill="white" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><text x="725" y="420" text-anchor="middle" font-size="14" fill="#3b3b3b">%7  matmul</text><text x="725" y="440" text-anchor="middle" font-size="12" fill="#d96c5c">✗ 已被 remove</text><text x="591" y="480" text-anchor="start" font-size="12.5" fill="#3b3b3b">g.rewire(%10, %14)：只把 %10 的使用者</text><text x="591" y="502" text-anchor="start" font-size="12.5" fill="#3b3b3b">改指到 %14，就 remove %10、%9、%7；</text><text x="591" y="524" text-anchor="start" font-size="12.5" fill="#3b3b3b">但 returns = [%14, %7] 里的 %7 已经</text><text x="591" y="546" text-anchor="start" font-size="12.5" fill="#3b3b3b">不存在——引用悬空，终图 5 节点</text><path d="M 895.1,100.0 Q 1027.1,99.4 1158.9,101.1 M 1160.1,101.1 Q 1160.3,351.9 1159.7,603.8 M 1160.8,604.3 Q 1028.4,605.6 895.8,605.3 M 894.5,605.6 Q 896.3,351.4 894.7,98.8 Z" fill="white" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="911" y="128" text-anchor="start" font-size="15.5" fill="#3b3b3b">③ 红项串满四列（实测）</text><path d="M 911.8,151.0 Q 1026.5,149.7 1144.8,151.0 M 1144.1,150.4 Q 1144.7,192.0 1143.6,234.4 M 1144.0,233.4 Q 1027.3,233.3 911.8,234.8 M 911.0,233.2 Q 911.4,191.1 910.6,149.1 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="923" y="174" text-anchor="start" font-size="13.5" fill="#d96c5c">A1／A2 结构</text><text x="923" y="196" text-anchor="start" font-size="12.5" fill="#3b3b3b">返回值 %7 未定义；</text><text x="923" y="216" text-anchor="start" font-size="12.5" fill="#3b3b3b">被删节点仍被引用：['%7']</text><path d="M 911.8,246.2 Q 1027.9,245.1 1144.7,246.7 M 1144.6,246.2 Q 1143.7,287.7 1144.4,330.2 M 1144.6,329.4 Q 1027.4,329.9 911.7,329.4 M 911.0,330.7 Q 911.4,288.1 911.1,245.1 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="923" y="270" text-anchor="start" font-size="13.5" fill="#d96c5c">C1 资源</text><text x="923" y="292" text-anchor="start" font-size="12.5" fill="#3b3b3b">融合发生了，审计里没有</text><text x="923" y="312" text-anchor="start" font-size="12.5" fill="#3b3b3b">ΔB 账——先动手后算账</text><path d="M 910.2,341.0 Q 1028.1,342.6 1143.4,342.5 M 1144.5,342.7 Q 1144.9,383.5 1144.6,426.3 M 1144.1,425.8 Q 1026.9,425.2 910.6,425.5 M 910.8,426.9 Q 911.4,383.8 911.3,341.3 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="923" y="366" text-anchor="start" font-size="13.5" fill="#d96c5c">D1／D2 数值</text><text x="923" y="388" text-anchor="start" font-size="12.5" fill="#3b3b3b">优化图无法执行</text><text x="923" y="408" text-anchor="start" font-size="12.5" fill="#3b3b3b">（KeyError: '%7'）</text><path d="M 910.1,437.6 Q 1027.8,438.9 1143.8,438.8 M 1143.2,437.1 Q 1144.4,480.5 1144.8,522.4 M 1143.9,521.9 Q 1026.9,521.5 910.0,522.7 M 911.8,521.3 Q 910.6,479.8 911.7,438.2 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="923" y="462" text-anchor="start" font-size="13.5" fill="#d96c5c">E2 流程</text><text x="923" y="484" text-anchor="start" font-size="12.5" fill="#3b3b3b">改写 6 步，审计只有 5 行</text><text x="923" y="504" text-anchor="start" font-size="12.5" fill="#3b3b3b">——有动作没记账</text><text x="911" y="560" text-anchor="start" font-size="13" fill="#3b3b3b">结构坏了 → 跑不起来 → 无账可查</text><text x="911" y="584" text-anchor="start" font-size="12.3" fill="#6b6459">B 列全绿：布局没动，坏事与它无关</text><path d="M 40.6,629.6 Q 599.8,629.2 1160.9,631.0 M 1160.5,629.1 Q 1159.7,653.5 1159.4,677.2 M 1160.3,678.0 Q 600.4,677.3 40.4,678.1 M 40.3,678.9 Q 39.3,654.0 39.2,630.9 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="660" text-anchor="start" font-size="13.5" fill="#3b3b3b">读法：一个漏迁移的使用者让 A／C／D／E 四列同时亮红——D1/D2 连「数不对」都报不出来，只能报「无法执行」；这就是 A 列排在第一道闸的机制版</text></g></svg>