-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="990.0" y="344" text-anchor="middle" font-size="11.5" fill="#6b6459">12</text><path d="M 89.0,286.3 Q 239.9,285.9 388.9,286.0 M 388.9,284.7 Q 389.6,298.0 389.0,308.3 M 389.2,306.8 Q 240.1,308.3 89.4,308.7 M 91.0,308.0 Q 90.9,296.8 90.7,284.8 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="240.0" y="301" text-anchor="middle" font-size="12.5" fill="#79b26a" font-weight="bold">[0,4)</text><path d="M 389.9,287.1 Q 465.2,285.3 540.7,285.7 M 539.6,285.6 Q 540.6,297.6 539.6,307.0 M 539.9,308.6 Q 464.8,308.9 390.2,308.4 M 391.2,307.7 Q 390.7,298.2 391.2,286.3 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="465.0" y="301" text-anchor="middle" font-size="12.5" fill="#d96c5c" font-weight="bold">[4,8)</text><path d="M 541.1,286.8 Q 540.4,285.9 541.3,287.0 M 539.5,285.2 Q 538.7,295.7 539.9,306.8 M 539.8,309.0 Q 539.1,306.8 539.8,308.2 M 540.7,308.4 Q 540.4,298.1 540.9,286.8 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text x="540.0" y="301" text-anchor="middle" font-size="12" fill="#d96c5c" font-weight="bold">越界!</text><path d="M 539.7,273.2 Q 541.0,267.8 539.9,260.0" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 540.5,259.6 Q 543.5,265.2 545.9,271.0" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 540.3,260.2 Q 536.7,265.7 534.1,272.3" fill="none" stroke="#d96c5c" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="550.0" y="256" text-anchor="start" font-size="12" fill="#d96c5c">点循环 ub = k0+Tk = 8 &gt; K=6</text><text x="90" y="370.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">剩下 [4,6) 的『尾部』只有 2 格：点循环 ub = 4+4 = 8 会多算 k=6、k=7——要么越界（探针拦下），</text><text x="90" y="387.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">要么重复计算（语义直接错）。真实编译器的两个修法：上界夹 min(k0+Tk, K)（剩余循环）或掩掉越界趟（掩码）——都在 Day 95。</text><path d="M 59.2,430.6 Q 290.2,429.6 519.2,430.8 M 519.6,429.8 Q 519.2,524.6 519.4,619.3 M 520.9,621.0 Q 289.2,621.0 60.2,618.8 M 60.7,621.3 Q 61.0,525.8 60.7,429.8 Z" fill="#f9dfd9" stroke="#d96c5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="456" text-anchor="start" font-size="13" fill="#d96c5c" font-weight="bold">绕过配置层直接跑（§6 错误 1 的真实输出）：</text><text x="78" y="480.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">A(2,3)@B(3,2)，tile=2x2x2（Tk=2 ∤ K=3）：</text><text x="78" y="496.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">“memref.load %a(0, 3)：第 1 维下标 3 ∉ [0, 3)（shape (2, 3)）；线性”</text><text x="78" y="512.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">“地址 3 甚至仍在缓冲区（6 格）内——只查线性地址抓不住这类逻辑越界”</text><text x="78" y="560.0" text-anchor="start" font-size="12" fill="#3b3b3b">转换照常成功（31 op）——IR 生成不讲武德，</text><text x="78" y="576.5" text-anchor="start" font-size="12" fill="#3b3b3b">是 Day 88 的按维越界探针在执行期拦下的。</text><path d="M 559.3,429.0 Q 789.9,430.0 1019.0,429.6 M 1020.4,429.5 Q 1019.4,524.4 1020.6,619.9 M 1019.6,620.5 Q 788.9,620.1 560.3,618.9 M 559.0,619.3 Q 560.6,523.8 560.2,431.1 Z" fill="white" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="578" y="456" text-anchor="start" font-size="13" fill="#79b26a" font-weight="bold">从正门走：第④道消费门 fail-closed（TL6b 真实报错）：</text><text x="578" y="480.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">“tile=2x2x2 通过了校验（第①~③道门，warn 级），但：ti”</text><text x="578" y="496.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">“le_k=2 不整除 K=3：需要尾部处理（Day 95 的范围；Day”</text><text x="578" y="512.0" text-anchor="start" font-size="11.5" fill="#3b3b3b">“ 94 先保证整除场景）——今天只保证整除场景正确，拒绝运行（尾部处理是”</text><text x="578" y="560.0" text-anchor="start" font-size="12" fill="#3b3b3b">同一份配置，正门给的是「点名 Day 95 的拒绝」，</text><text x="578" y="576.5" text-anchor="start" font-size="12" fill="#3b3b3b">而不是生成一份越界的 IR——宁可拒绝运行，不可静默忽略。</text></g></svg>