<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" width="1080" height="660"><rect x="3" y="3" width="1074" height="654" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="30" y="44" text-anchor="start" font-size="25" fill="#3b3b3b">整除 vs 非整除：尾部（tail）为什么先欠着、明天还</text><text x="30" y="70" text-anchor="start" font-size="14.5" fill="#6b6459">今天的学习目标里有『尾部处理』——先看清问题在哪，实现留给 Day 95；今天对不整除 fail-closed 拒绝</text><path d="M 30.7,82.5 Q 539.5,81.9 1049.6,82.9" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><text x="90" y="124" text-anchor="start" font-size="14.5" fill="#3b3b3b" font-weight="bold">整除场景（今天管）：K=6，tile_k=3 → 两个完整块 [0,3) + [3,6)</text><path d="M 88.8,149.9 Q 540.1,150.4 991.2,149.3" fill="none" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 91.3,144.2 Q 89.9,150.1 90.0,155.7" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="90.0" y="174" text-anchor="middle" font-size="11.5" fill="#6b6459">0</text><path d="M 165.9,144.8 Q 165.2,151.2 163.9,156.0" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="165.0" y="174" text-anchor="middle" font-size="11.5" fill="#6b6459">1</text><path d="M 241.3,142.9 Q 239.6,150.7 239.4,155.1" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="240.0" y="174" text-anchor="middle" font-size="11.5" fill="#6b6459">2</text><path d="M 316.2,143.2 Q 314.8,149.6 315.6,156.2" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="315.0" y="174" text-anchor="middle" font-size="11.5" fill="#6b6459">3</text><path d="M 390.1,144.8 Q 389.6,149.8 389.8,154.8" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-l