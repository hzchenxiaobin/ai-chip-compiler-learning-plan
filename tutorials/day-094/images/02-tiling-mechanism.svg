inecap="round" stroke-linejoin="round"/><path d="M 197.8,271.4 Q 191.5,275.0 185.9,277.6" fill="none" stroke="#5f8fcb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 197.7,271.9 Q 192.4,269.7 186.2,265.8" fill="none" stroke="#5f8fcb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="128.0" y="296" text-anchor="middle" font-size="12.5" fill="#5f8fcb">块循环 i0：step = tile_m = 4（一圈跳一整行方块）</text><path d="M 202.7,124.9 Q 201.5,196.8 202.4,268.6" fill="none" stroke="#e8973f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 201.6,268.1 Q 198.9,262.1 196.1,256.4" fill="none" stroke="#e8973f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 201.8,267.5 Q 205.1,261.8 207.6,256.0" fill="none" stroke="#e8973f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="210" y="198.0" text-anchor="start" font-size="12.5" fill="#e8973f" transform="rotate(90 210 198.0)">块循环 j0：step = tile_n</text><text x="60" y="324.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">· k0 也被切：K=16 → 4 个 k-块（每个 (i0,j0) 要扫 4 轮）</text><text x="60" y="341.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">· A 面板 16 行→4 行、B 列面板 16 列→4 列：工作集从 3KB 缩到 192B</text><text x="60" y="358.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">→ 512B 缓存装得下 → B缺 4096→398（实测，图 4）</text><text x="520" y="116" text-anchor="start" font-size="14" fill="#3b3b3b" font-weight="bold">6 层骨架：块循环（蓝）套点循环（绿）——小例 A(2,3)@B(3,2)，tile=2x2x1</text><path d="M 520.6,131.0 Q 786.2,129.3 1050.9,129.6 M 1049.2,129.4 Q 1048.7,151.8 1050.1,172.2 M 1051.2,172.0 Q 785.3,172.2 518.8,171.9 M 520.0,171.3 Q 520.5,149.7 520.3,129.1 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="534" y="148" text-anchor="start" font-size="12.5" fill="#3b3b3b" font-weight="bold">scf.for %i0 = 0 to 2 step 2</text><text x="534" y="164" text-anchor="start" font-size="11.5" fill="#6b6459">块循环 i0：trip = M/Tm = 1</text><path d="M 533.2,182.3 Q 791.1,182.1 1051.2,182.9 M 1050.8,181.4 Q 1048.8,202.7 1049.6,225.0 M 1051.0,223.8 Q 791.6,225.2 533.6,224.9 M 532.8,224.3 Q 534.6,204.2 532.9,181.3 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="548" y="200" text-anchor="start" font-size="12.5" fill="#3b3b3b" font-weight="bold">scf.for %j0 = 0 to 2 step 2</text><text x="548" y="216" text-anchor="start" font-size="11.5" fill="#6b6459">块循环 j0：trip = N/Tn = 1</text><path d="M 548.8,233.4 Q 797.9,234.3 1050.1,234.0 M 1050.2,235.0 Q 1050.4,255.6 1050.0,277.0 M 1051.2,275.3 Q 799.6,276.4 547.6,275.1 M 549.2,276.8 Q 548.9,255.5 547.6,233.8 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="562" y="252" text-anchor="start" font-size="12.5" fill="#3b3b3b" font-weight="bold">scf.for %k0 = 0 to 3 step 1</text><text x="562" y="268" text-anchor="start" font-size="11.5" fill="#6b6459">块循环 k0：trip = K/Tk = 3（归约被切）</text><path d="M 560.7,286.0 Q 806.0,287.0 1049.7,284.8 M 1051.3,285.4 Q 1049.7,307.4 1049.6,328.6 M 1050.5,326.8 Q 807.0,327.5 560.7,327.6 M 562.9,327.9 Q 563.3,308.1 561.4,285.2 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="576" y="304" text-anchor="start" font-size="12.5" fill="#3b3b3b" font-weight="bold">scf.for %i = %i0 to %ub_i step 1</text><text x="576" y="320" text-anchor="start" font-size="11.5" fill="#6b6459">点循环 i：[%i0, %i0+2)——ub=addi(%i0,%cTm)</text><path d="M 575.3,338.7 Q 813.8,338.6 1049.2,338.8 M 1051.1,338.0 Q 1050.7,358.7 1049.4,379.4 M 1050.9,381.3 Q 814.0,379.1 575.5,380.5 M 575.7,379.5 Q 575.0,358.6 575.9,338.6 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="590" y="356" text-anchor="start" font-size="12.5" fill="#3b3b3b" font-weight="bold">scf.for %j = %j0 to %ub_j step 1</text><text x="590" y="372" text-anchor="start" font-size="11.5" fill="#6b6459">点循环 j：[%j0, %j0+2)</text><path d="M 590.1,390.0 Q 820.0,391.0 1050.1,390.2 M 1049.7,390.3 Q 1050.5,410.3 1050.2,432.1 M 1049.1,432.9 Q 820.7,431.4 589.4,433.2 M 589.5,432.8 Q 589.9,411.5 588.9,390.6 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="604" y="408" text-anchor="start" font-size="12.5" fill="#3b3b3b" font-weight="bold">scf.for %k = %k0 to %ub_k iter_args(%acc=%cv)</text><text x="604" y="424" text-anchor="start" font-size="11.5" fill="#6b6459">点循环 k：块内寄存器乘加（Day 87 的 %acc）</text><text x="520" y="450.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">· 块循环的 step 是块尺寸（跳整块）；点循环的 lb 是块起点（块内一格一格走）</text><text x="520" y="467.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">· 三个 %ub 都是 arith.addi 现算（真实 MLIR 的 Tiling 分解同款）</text><text x="520" y="484.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">· 载荷（load A/B、mulf、addf、yield）与 Day 89 逐字相同——只换了骨架</text><path d="M 31.2,580.7 Q 540.1,580.5 1051.2,579.0 M 1049.3,580.1 Q 1048.9,661.8 1050.4,744.2 M 1048.9,746.1 Q 540.3,745.3 29.4,743.7 M 31.0,744.5 Q 31.0,663.4 29.4,580.2 Z" fill="white" stroke="#3b3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="606" text-anchor="start" font-size="14" fill="#3b3b3b" font-weight="bold">跨块累加接力：k 被切成 3 块后的 C[i,j]（小例实测 C 流量 12L+12S+4清）</text><path d="M 59.6,624.9 Q 169.1,623.3 275.0,624.2 M 275.3,625.0 Q 276.3,655.6 275.7,686.1 M 276.7,685.6 Q 168.5,687.0 59.0,686.0 M 60.5,685.9 Q 58.8,656.3 60.8,623.8 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="168.0" y="644" text-anchor="middle" font-size="12.5" fill="#3b3b3b" font-weight="bold">清零 nest</text><text x="168.0" y="662" text-anchor="middle" font-size="11.5" fill="#6b6459">store 0</text><text x="168.0" y="679" text-anchor="middle" font-size="12" fill="#e8973f" font-weight="bold">4 次</text>