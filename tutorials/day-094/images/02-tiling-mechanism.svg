r="middle" font-size="12" fill="#5f8fcb" font-weight="bold">1L+1S</text><path d="M 795.6,655.9 Q 812.9,653.7 831.1,654.8" fill="none" stroke="#3b3b3b" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 830.8,655.6 Q 825.3,658.1 819.8,660.5" fill="none" stroke="#3b3b3b" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 830.3,654.6 Q 825.1,652.1 818.8,649.3" fill="none" stroke="#3b3b3b" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 832.8,624.9 Q 942.7,624.6 1049.8,623.5 M 1050.6,625.3 Q 1048.7,655.0 1050.1,685.1 M 1050.8,685.7 Q 941.7,686.4 832.9,686.2 M 835.0,684.9 Q 833.3,655.9 833.8,624.1 Z" fill="#dbe7f6" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="942.0" y="644" text-anchor="middle" font-size="12.5" fill="#3b3b3b" font-weight="bold">k-块 2（k0=2）</text><text x="942.0" y="662" text-anchor="middle" font-size="11.5" fill="#6b6459">load → 乘加 → store 终值</text><text x="942.0" y="679" text-anchor="middle" font-size="12" fill="#5f8fcb" font-weight="bold">1L+1S</text><text x="60" y="708.0" text-anchor="start" font-size="12" fill="#3b3b3b">块内：iter_args 寄存器累加（Tk 次乘加不碰内存）；跨块：部分和落 C（读-改-写）——Day 92『k 不在最内层 → 累加器住内存』</text><text x="60" y="724.5" text-anchor="start" font-size="12" fill="#3b3b3b">在 Tiling 世界的重现，所以清零 nest 必须在（第一个块的 load 读到的 0 就是它铺的）。位等价机制：k0 升序 × 块内 k 升序 = 全局升序。</text></g></svg>