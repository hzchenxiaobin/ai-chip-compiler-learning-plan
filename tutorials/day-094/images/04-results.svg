<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 740" width="1080" height="740"><rect x="3" y="3" width="1074" height="734" rx="7" fill="#fdf9f0"/><g font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Kaiti SC','KaiTi','STKaiti',cursive"><text x="30" y="44" text-anchor="start" font-size="25" fill="#3b3b3b">实测结果：Tk 一个数字改 C 流量；块循环让 512B 缺失掉到 1/4</text><text x="30" y="70" text-anchor="start" font-size="14.5" fill="#6b6459">数字全部来自真实回放（16³ 直接映射缓存，行 16B——Day 92 口径；小例为解释执行日志计数）</text><path d="M 29.3,81.3 Q 539.2,81.4 1049.8,82.5" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><text x="40" y="122" text-anchor="start" font-size="14" fill="#3b3b3b" font-weight="bold">① 同一形状，只换 Tk（小例 A(2,3)@B(3,2) 实测）</text><path d="M 41.0,135.5 Q 280.0,137.1 519.9,135.4 M 519.4,137.2 Q 519.4,151.9 519.1,166.8 M 519.6,166.8 Q 279.6,164.8 40.4,165.1 M 39.2,165.0 Q 39.3,151.9 39.5,136.7 Z" fill="#e9e4d8" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="156" text-anchor="start" font-size="12" fill="#6b6459" font-weight="bold">配置</text><text x="180" y="156" text-anchor="start" font-size="12" fill="#6b6459" font-weight="bold">k-块数</text><text x="280" y="156" text-anchor="start" font-size="12" fill="#6b6459" font-weight="bold">C 流量（实测）</text><text x="415" y="156" text-anchor="start" font-size="12" fill="#6b6459" font-weight="bold">跨块接力</text><path d="M 39.6,165.4 Q 279.3,165.8 519.2,166.9 M 521.1,165.2 Q 519.9,186.8 521.0,206.7 M 519.0,206.1 Q 279.4,206.9 41.2,205.2 M 39.8,205.2 Q 39.8,186.6 39.6,166.3 Z" fill="#dbe7f6" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="191" text-anchor="start" font-size="13" fill="#3b3b3b" font-weight="bold">tile=2x2x1</text><text x="180" y="191" text-anchor="start" font-size="13" fill="#5f8fcb" font-weight="bold">K/Tk = 3</text><text x="280" y="191" text-anchor="start" font-size="13" fill="#3b3b3b">12L+12S+4清</text><text x="415" y="191" text-anchor="start" font-size="12" fill="#6b6459">3 轮接力</text><path d="M 40.6,206.0 Q 280.2,206.9 521.1,205.2 M 521.2,204.8 Q 520.7,224.9 519.4,246.7 M 519.6,246.2 Q 280.3,245.3 39.7,246.2 M 39.4,246.9 Q 40.9,226.6 41.0,204.7 Z" fill="white" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="231" text-anchor="start" font-size="13" fill="#3b3b3b" font-weight="bold">tile=2x2x3</text><text x="180" y="231" text-anchor="start" font-size="13" fill="#5f8fcb" font-weight="bold">K/Tk = 1</text><text x="280" y="231" text-anchor="start" font-size="13" fill="#3b3b3b">4L+4S+4清</text><text x="415" y="231" text-anchor="start" font-size="12" fill="#6b6459">单块，无需接力</text><path d="M 39.1,249.2 Q 280.2,250.0 520.7,248.8 M 519.5,249.2 Q 521.1,287.9 520.6,326.1 M 518.8,324.7 Q 279.6,325.3 40.3,324.9 M 40.8,326.9 Q 41.2,288.0 40.9,249.0 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="274.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">公式（TL3 实测对齐）：C 读 = C 写 = M·N·K/Tk，清零 = M·N</text><text x="56" y="291.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">A/B 的 load 恒 2·M·N·K（12 次）——切块改『时机』不改『次数』；</text><text x="56" y="308.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">位等价两份都是 True：Tk 是性能旋钮，不是正确性旋钮</text><text x="40" y="372" text-anchor="start" font-size="14" fill="#3b3b3b" font-weight="bold">② 512B（32 行）缓存缺失对比（16³ 真实轨迹回放）</text><path d="M 39.8,395.4 Q 279.4,394.9 519.4,395.0 M 519.2,395.8 Q 520.8,520.8 520.4,645.2 M 519.9,646.6 Q 278.8,645.2 39.3,647.2 M 40.0,647.0 Q 39.4,521.5 39.0,396.6 Z" fill="white" stroke="#3b3b3b" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 79.4,421.2 Q 105.9,420.0 133.3,420.3 M 131.8,421.3 Q 131.9,506.3 131.5,590.0 M 130.9,590.7 Q 105.6,588.8 80.2,589.8 M 79.4,590.7 Q 79.0,504.0 80.2,419.8 Z" fill="white" stroke="#6b6459" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="412.0" text-anchor="middle" font-size="12.5" fill="#6b6459" font-weight="bold">4764</text><text x="106" y="608" text-anchor="middle" font-size="10.5" fill="#3b3b3b">untiled</text><text x="106" y="623" text-anchor="middle" font-size="10.5" fill="#3b3b3b">i-j-k</text><path d="M 165.1,499.0 Q 188.7,497.3 215.2,498.1 M 216.7,497.1 Q 216.0,544.9 215.8,588.8 M 215.3,590.9 Q 189.1,590.8 164.0,589.8 M 162.8,590.2 Q 163.9,543.9 163.0,498.5 Z" fill="white" stroke="#6b6459" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="190" y="489.9345088161209" text-anchor="middle" font-size="12.5" fill="#6b6459" font-weight="bold">2580</text><text x="190" y="608" text-anchor="middle" font-size="10.5" fill="#3b3b3b">untiled</text><text x="190" y="623" text-anchor="middle" font-size="10.5" fill="#3b3b3b">i-k-j</text><path d="M 248.6,509.5 Q 272.8,510.6 298.8,510.7 M 301.1,509.4 Q 300.3,551.3 300.8,590.4 M 299.8,590.7 Q 273.2,588.9 246.9,591.1 M 249.2,590.4 Q 247.5,548.9 249.3,508.9 Z" fill="white" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="274" y="502.2099076406381" text-anchor="middle" font-size="12.5" fill="#5f8fcb" font-weight="bold">2236</text><text x="274" y="608" text-anchor="middle" font-size="10.5" fill="#3b3b3b">tiled</text><text x="274" y="623" text-anchor="middle" font-size="10.5" fill="#3b3b3b">2x2x2</text><path d="M 331.4,550.8 Q 358.0,550.8 384.4,551.6 M 383.9,550.9 Q 384.4,570.5 384.0,591.2 M 384.6,591.1 Q 358.0,589.9 331.8,589.1 M 331.0,590.4 Q 332.9,571.5 331.3,550.2 Z" fill="#e5f1dc" stroke="#79b26a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="358" y="543.3895885810243" text-anchor="middle" font-size="12.5" fill="#79b26a" font-weight="bold">1082</text><text x="358" y="608" text-anchor="middle" font-size="10.5" fill="#3b3b3b">tiled</text><text x="358" y="623" text-anchor="middle" font-size="10.5" fill="#3b3b3b">4x4x4</text><path d="M 415.4,546.0 Q 441.9,545.0 468.3,545.9 M 467.6,546.8 Q 469.2,567.8 466.8,589.0 M 468.2,591.1 Q 441.9,590.9 415.5,589.4 M 415.1,589.1 Q 416.9,566.7 416.6,545.5 Z" fill="white" stroke="#5f8fcb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="442" y="537.8228379513014" text-anchor="middle" font-size="12.5" fill="#5f8fcb" font-weight="bold">1238</text><text x="442" y="608" text-anchor="middle" font-size="10.5" fill="#3b3b3b">tiled</text><text x="442" y="623" text-anchor="middle" font-size="10.5" fill="#3b3b3b">8x8x8</text><path d="M 60.1,591.1 Q 58.8,501.0 60.0,411.3" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 60.3,412.6 Q 62.5,418.5 65.2,423.0" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 60.1,412.6 Q 57.2,418.0 54.0,424.1" fill="none" stroke="#3b3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="410" text-anchor="start" font-size="11" fill="#6b6459">miss</text><text x="280.0" y="638" text-anchor="middle" font-size="12.5" fill="#79b26a" font-weight="bold">总缺失：4764 → 1082（tiled 4x4x4，↓77%）；B缺：4096 → 398（↓90%）</text><text x="560" y="122" text-anchor="start" font-size="14" fill="#3b3b3b" font-weight="bold">③ 两个容量档 ＋ 诚实的代价列</text><path d="M 559.4,135.8 Q 800.4,135.7 1040.0,135.1 M 1040.0,135.1 Q 1040.2,230.3 1039.9,325.1 M 1040.3,327.0 Q 800.0,326.9 559.6,326.1 M 559.0,325.2 Q 559.5,230.4 559.6,135.1 Z" fill="white" stroke="#3b3b3b" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="576" y="160" text-anchor="start" font-size="12" fill="#6b6459" font-weight="bold">配置</text><text x="750" y="160" text-anchor="end" font-size="12" fill="#6b6459" font-weight="bold">总访问</text><text x="850" y="160" text-anchor="end" font-size="12" fill="#6b6459" font-weight="bold">512B缺失</text><text x="960" y="160" text-anchor="end" font-size="12" fill="#6b6459" font-weight="bold">1KB缺失</text><text x="576" y="182" text-anchor="start" font-size="12.5" fill="#3b3b3b">untiled i-j-k</text><text x="750" y="182" text-anchor="end" font-size="12.5" fill="#3b3b3b">8448</text><text x="850" y="182" text-anchor="end" font-size="12.5" fill="#3b3b3b">4764</text><text x="960" y="182" text-anchor="end" font-size="12.5" fill="#3b3b3b">950</text><text x="576" y="208" text-anchor="start" font-size="12.5" fill="#3b3b3b">untiled i-k-j</text><text x="750" y="208" text-anchor="end" font-size="12.5" fill="#3b3b3b">16640</text><text x="850" y="208" text-anchor="end" font-size="12.5" fill="#3b3b3b">2580</text><text x="960" y="208" text-anchor="end" font-size="12.5" fill="#3b3b3b">1584</text><text x="576" y="234" text-anchor="start" font-size="12.5" fill="#3b3b3b">tiled 2x2x2</text><text x="750" y="234" text-anchor="end" font-size="12.5" fill="#3b3b3b">12544</text><text x="850" y="234" text-anchor="end" font-size="12.5" fill="#3b3b3b">2236</text><text x="960" y="234" text-anchor="end" font-size="12.5" fill="#3b3b3b">1294</text><path d="M 567.0,245.3 Q 800.7,245.2 1033.5,243.6 M 1035.3,244.6 Q 1034.8,256.8 1034.3,268.9 M 1035.0,268.4 Q 799.0,268.7 565.6,266.9 M 564.9,268.6 Q 565.0,257.2 566.0,244.6 Z" fill="#e5f1dc" stroke="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="576" y="260" text-anchor="start" font-size="12.5" fill="#79b26a" font-weight="bold">tiled 4x4x4</text><text x="750" y="260" text-anchor="end" font-size="12.5" fill="#3b3b3b">10496</text><text x="850" y="260" text-anchor="end" font-size="12.5" fill="#79b26a" font-weight="bold">1082</text><text x="960" y="260" text-anchor="end" font-size="12.5" fill="#3b3b3b">823</text><text x="576" y="286" text-anchor="start" font-size="12.5" fill="#3b3b3b">tiled 8x8x8</text><text x="750" y="286" text-anchor="end" font-size="12.5" fill="#3b3b3b">9472</text><text x="850" y="286" text-anchor="end" font-size="12.5" fill="#3b3b3b">1238</text><text x="960" y="286" text-anchor="end" font-size="12.5" fill="#3b3b3b">951</text><text x="576" y="316.0" text-anchor="start" font-size="12" fill="#3b3b3b">两个容量档 tiled 4x4x4 都占优（823 vs 950/1584 @1KB）——这不是碰运气：</text><text x="576" y="332.5" text-anchor="start" font-size="12" fill="#3b3b3b">每块工作集 A 16格+B 16格+C 16格 = 12 行，32 行的 512B 也装得下。</text><path d="M 560.7,344.0 Q 800.7,344.0 1040.4,345.0 M 1040.6,345.2 Q 1039.8,417.9 1039.0,493.2 M 1039.7,495.1 Q 798.9,494.0 558.8,494.4 M 559.7,493.2 Q 559.0,419.9 560.7,344.5 Z" fill="#fdead3" stroke="#e8973f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="576" y="370.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">代价（TL5d 实测）：总访问 8448 → 10496（+24%）</text><text x="576" y="387.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">多出来的 2048 次访问全是 C 的跨块读-改-写——但它们</text><text x="576" y="404.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">几乎全部命中（512B 命中率 43.6% → 89.7%）：用便宜的</text><text x="576" y="421.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">命中换昂贵的缺失，这笔账在 512B 下是划算的。</text><text x="576" y="512.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">注意：8x8x8（1238）没有 4x4x4（1082）好——块不是越大越好：</text><text x="576" y="529.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">8×8×8 的工作集 56 行 &gt; 32 行（512B），自己把自己挤出缓存。</text><text x="576" y="546.0" text-anchor="start" font-size="12.5" fill="#3b3b3b">『最优块尺寸取决于容量 vs 工作集』——Day 97 多配置实验的主菜。</text><path d="M 569.1,497.0 Q 799.8,497.0 1028.8,496.6" fill="none" stroke="#6b6459" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><path d="M 41.0,663.8 Q 539.6,663.7 1040.2,665.2 M 1040.9,665.0 Q 1039.8,690.2 1040.9,718.9 M 1038.9,718.7 Q 539.0,717.6 39.0,718.3 M 40.3,719.3 Q 41.0,690.1 39.1,664.6 Z" fill="white" stroke="#3b3b3b" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"/><text x="56" y="686.0" text-anchor="start" font-size="12" fill="#3b3b3b">口径：直接映射、无预取、无写缓冲（Day 92 模型）；数字只用于配置之间的对比。4KB 档 5 个配置全部 192 miss（=强制缺失）——</text><text x="56" y="702.5" text-anchor="start" font-size="12" fill="#3b3b3b">tiled 的收益全部来自『装不装得下』这一个变量；真实硬件的组相联/预取会改变绝对数，但不改变块循环的方向性优势。</text></g></svg>