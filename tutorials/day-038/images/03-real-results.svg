<text x="606" y="520" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.2" fill="#3b352d" text-anchor="start">error: 'mini.matmul' op operand #1 must be ranked f32</text>
<text x="622" y="536" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.2" fill="#3b352d" text-anchor="start">tensor with rank &gt;= 2 of 32-bit float values,</text>
<text x="622" y="552" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="10.2" fill="#3b352d" text-anchor="start">but got 'tensor&lt;f32&gt;'</text>
<text x="606" y="570" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="9.8" fill="#84796a" text-anchor="start">matmul 的“秩≥2”是 Day 37 定下的约束，一点情面都不讲。</text>
<text x="60" y="606" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11" fill="#3b352d" text-anchor="start">结论：SameOperandsAndResultType 是“横向”约束（同算子内比类型），RankedTensorOf 是“纵向”约束（对类型本身提要求）；两者叠加，才把今天的链路卡得严丝合缝。</text>
<text x="60" y="630" font-family="Comic Sans MS, Comic Neue, Segoe Print, Kaiti SC, KaiTi, 楷体, cursive" font-size="11" fill="#3b352d" text-anchor="start">回归：day-37 的 matmul_ok 在新 mini-opt 上原样通过（rc=0）——加算子不伤旧算子，是扩展 dialect 的底线。</text>
