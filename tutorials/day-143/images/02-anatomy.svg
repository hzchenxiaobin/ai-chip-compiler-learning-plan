<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="580" viewBox="0 0 1080 580"><rect x="4" y="4" width="1072" height="572" rx="14" fill="#FDFBF6" stroke="#E7DFCE" stroke-width="2"/><text x="540.0" y="34" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="16" fill="#3B3B3B" text-anchor="middle" font-weight="bold">生成器解剖：块循环的四层嵌套</text><path d="M 60.7,59.2 Q 342.0,62.1 620.7,61.2 Q 622.1,271.4 619.5,478.7 Q 341.1,479.5 60.7,479.3 Q 59.9,268.4 60.7,59.2  Z" stroke="#3B3B3B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="#FDFBF6" fill-opacity="0.95"/><text x="90" y="90" font-family="'Courier New',monospace" font-size="10.5" fill="#9CBF8E" text-anchor="start">scf.for %i0 = %c0 to %cM step %cTM {</text><text x="560" y="90" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">外层 tile 壳 M</text><text x="90" y="122" font-family="'Courier New',monospace" font-size="10.5" fill="#9CBF8E" text-anchor="start">  scf.for %j0 = %c0 to %cN step %cTN {</text><text x="560" y="122" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">tile 壳 N</text><text x="90" y="154" font-family="'Courier New',monospace" font-size="10.5" fill="#9CBF8E" text-anchor="start">    scf.for %k0 = %c0 to %cK step %cTK {</text><text x="560" y="154" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">tile 壳 K</text><text x="90" y="186" font-family="'Courier New',monospace" font-size="10.5" fill="#A9C4D4" text-anchor="start">      scf.for %i = %i0 to %cM step %c1 {</text><text x="560" y="186" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">点循环 i（块内起点）</text><text x="90" y="218" font-family="'Courier New',monospace" font-size="10.5" fill="#A9C4D4" text-anchor="start">        scf.for %j = %j0 to %cN step %c1 {</text><text x="560" y="218" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">点循环 j</text><text x="90" y="250" font-family="'Courier New',monospace" font-size="10.5" fill="#E8A87C" text-anchor="start">          %acc = scf.for %k = %k0 to %cK ...</text><text x="560" y="250" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">点循环 k（累加）</text><text x="90" y="282" font-family="'Courier New',monospace" font-size="10.5" fill="#A9C4D4" text-anchor="start">            %aij = load %a[%i, %k]</text><text x="90" y="314" font-family="'Courier New',monospace" font-size="10.5" fill="#A9C4D4" text-anchor="start">            %p = mulf %aij, %bkj</text><text x="90" y="346" font-family="'Courier New',monospace" font-size="10.5" fill="#A9C4D4" text-anchor="start">            %s = addf %acc, %p</text><text x="90" y="378" font-family="'Courier New',monospace" font-size="10.5" fill="#C97B7B" text-anchor="start">          memref.store %r, %c[%i, %j]</text><text x="560" y="378" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="9.5" fill="#6b6257" text-anchor="middle">写回</text><text x="90" y="410" font-family="'Courier New',monospace" font-size="10.5" fill="#3B3B3B" text-anchor="start">}}}}}}</text><path d="M 659.8,60.0 Q 840.5,61.3 1019.4,59.1 Q 1021.4,269.5 1019.5,479.8 Q 838.8,480.9 660.9,479.0 Q 661.0,269.4 659.8,60.0  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#B8A7CE" fill-opacity="0.28"/><text x="840" y="86" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="13" fill="#3B3B3B" text-anchor="middle" font-weight="bold">四层的语义</text><text x="840" y="112" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">外三层（壳）：以 tile 为步长扫过</text><text x="840" y="130" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">M/N/K——决定「块边界」</text><text x="840" y="156" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">内三层（点）：块内起点出发、</text><text x="840" y="174" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">全局边界结束——算每个点</text><text x="840" y="200" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">教学简化：点循环用全局边界</text><text x="840" y="218" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">（而非 min(i0+TM,M)）——</text><text x="840" y="244" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">正确性保证：每点恰好算一次</text><text x="840" y="262" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">（重复块写同值＝幂等）</text><text x="840" y="288" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">效率取舍：完整版应块内边界</text><text x="840" y="306" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10" fill="#3B3B3B" text-anchor="middle">（少算重复点）——D146 对照</text><path d="M 59.5,499.4 Q 538.5,499.5 1018.5,499.0 Q 1018.6,528.1 1019.2,559.6 Q 540.6,558.3 58.8,560.4 Q 60.6,530.6 59.5,499.4  Z" stroke="#3B3B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="#F5E9C8" fill-opacity="0.85"/><text x="540.0" y="524" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="11.5" fill="#3B3B3B" text-anchor="middle" font-weight="bold">教学取舍的诚实声明：块内边界（min 钳制）是完整版——今天先全局边界保正确，</text><text x="540.0" y="546" font-family="'Comic Sans MS','Kaiti SC','KaiTi','STKaiti',cursive" font-size="10.5" fill="#3B3B3B" text-anchor="middle">幂等写让任何 tile 组合都算对（重复计算写同值）；效率差异留 D146 的性能对照诚实呈现</text></svg>
