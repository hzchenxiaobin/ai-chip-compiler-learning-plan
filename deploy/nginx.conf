# Nginx 站点配置（设计文档 §9.1：Nginx 终止 HTTPS 并转发动态路由）。
#
# 用法：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/learning.conf
#   sudo ln -s /etc/nginx/sites-available/learning.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 证书路径按实际环境调整（建议 certbot 管理）。首次部署可先使用 80 端口 HTTP，
# 启用 HTTPS 前不要开启 SECURE_SSL_REDIRECT。

upstream learning_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name learn.example.com;    # 替换为实际域名

    # 安全响应头（设计文档 §10.3）。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 8m;          # 导入文件上限 5 MiB + 余量。

    # 静态文件（collectstatic 产物）。
    location /static/ {
        alias /home/chenb/code/github/ai-chip-compiler-learning-plan/var/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 公开内容资产（源码 ZIP、日课图片）由 Nginx 直出。
    location /assets/public/ {
        alias /home/chenb/code/github/ai-chip-compiler-learning-plan/var/public-assets/;
        expires 1d;
        try_files $uri =404;
    }

    # 动态路由全部转发 Gunicorn（含 /api/ 与私有资产签名下载）。
    location / {
        proxy_pass http://learning_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # 健康检查直通。
    location = /healthz {
        proxy_pass http://learning_app;
        access_log off;
    }
}

