name: Dynamic site CI

# 设计文档 §8.3/§10：CI 启动真实 MySQL/Redis 测试服务，覆盖内容导入、
# API 权限与并发、导入导出、搜索；生产部署由运维按 deploy/README.md 执行
# （不使用 GitHub Pages）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Django tests (MySQL + Redis)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: learning
          MYSQL_USER: learning
          MYSQL_PASSWORD: learningpw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: learning
      DB_PASSWORD: learningpw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Grant test database privileges
        run: |
          mysql -h 127.0.0.1 -u root -prootpw -e "
          GRANT ALL PRIVILEGES ON test_learning* TO 'learning'@'%';
          FLUSH PRIVILEGES;"

      - name: System check
        run: python manage.py check --settings=config.settings.dev

      - name: Run test suite
        run: |
          python manage.py test tests --settings=config.settings.test \
            --parallel 1

  import-validation:
    name: Content import validation
    runs-on: ubuntu-latest
    needs: test
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: learning
          MYSQL_USER: learning
          MYSQL_PASSWORD: learningpw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: learning
      DB_PASSWORD: learningpw
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrate and import 168 days from the pushed commit
        run: |
          python manage.py migrate --settings=config.settings.dev
          COMMIT=$(git rev-parse HEAD)
          python manage.py import_tutorial --commit "$COMMIT" \
            --settings=config.settings.dev

      - name: Verify active release
        run: |
          python manage.py shell --settings=config.settings.dev -c "
          from apps.content.models import SiteState
          r = SiteState.get_active_release()
          assert r is not None, '没有激活的内容版本'
          assert r.day_count == 168, f'日课数量异常: {r.day_count}'
          print('active release:', r.commit[:12], r.day_count, 'days')"

  browser-e2e:
    name: Browser E2E + accessibility (Playwright)
    runs-on: ubuntu-latest
    needs: import-validation
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: learning
          MYSQL_USER: learning
          MYSQL_PASSWORD: learningpw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: learning
      DB_PASSWORD: learningpw
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          npm install @playwright/test@1.65.1
          npx playwright install --with-deps chromium

      - name: Migrate and import content
        run: |
          python manage.py migrate --settings=config.settings.dev
          python manage.py import_tutorial --commit HEAD             --settings=config.settings.dev

      - name: Start dev server
        run: |
          nohup python manage.py runserver 127.0.0.1:8765 --noreload             --settings=config.settings.dev > server.log 2>&1 &
          sleep 8
          curl -sf http://127.0.0.1:8765/healthz | grep ok

      - name: Run E2E and accessibility suites
        run: npx playwright test -c playwright.config.js

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
