name: Deploy tutorials to GitHub Pages
# 注：push 触发带 paths 过滤，空提交不会触发本工作流；重试请在 Actions 页面 Re-run 或修改匹配路径文件。

on:
  push:
    branches: [main]
    paths:
      - 'AI芯片编译器学习计划.md'
      - 'tutorials/**'
      - 'tools/**'
      - 'static/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Build website
        run: python3 tools/build.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      # 规避 actions/deploy-pages#451：artifact finalize 后元数据索引有延迟，
      # 立即部署会报 "No artifacts named github-pages"。轮询 REST API 确认可见后再部署。
      - name: Wait for Pages artifact to become visible
        run: |
          set -eu
          for i in $(seq 1 60); do
            count=$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["total_count"])')
            if [ "$count" = "1" ]; then
              echo "github-pages artifact visible (waited ~$(( (i-1)*10 ))s)"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for github-pages artifact metadata"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
